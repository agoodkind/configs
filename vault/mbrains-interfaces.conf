# /etc/network/interfaces.d/mbrains
#
# Static bridge declaration only. All dynamic state (v4 DHCP, OOB v6 address,
# OOB routing table, policy rules) is owned by the host mwan-ifmgr oob role.
# DHCP is intentionally NOT configured here, because ifupdown DHCP blocks
# Proxmox boot indefinitely if the upstream is down.

auto mbrains
iface mbrains inet manual
    bridge-ports enp4s0
    bridge-stp off
    bridge-fd 0

iface mbrains inet6 manual
