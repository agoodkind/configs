# /etc/sysctl.d/60-mbrains.conf
# Persistent kernel settings for the mbrains bridge.
#
# accept_ra=2 is required because vault has forwarding=1; otherwise the
# kernel ignores RAs and never learns the Monkeybrains IPv6 default.
# The host mwan-ifmgr oob role also sets these at startup, but having them
# in sysctl.d keeps them correct between boot and the daemon starting.
net.ipv6.conf.mbrains.accept_ra = 2
net.ipv6.conf.mbrains.accept_ra_defrtr = 1
