---
# Ansible copies this file from tack/opensearch-roles.yml. The first start of
# a member reads it into the security index. The tack_search role grants
# only the operations the Tack search adapter sends. The proxy readiness
# request uses cluster:monitor/health with the same credential.
_meta:
  type: roles
  config_version: 2
tack_search:
  reserved: true
  description: Tack application and operator commands
  cluster_permissions:
    # GET / for the endpoint ping and the server version read.
    - cluster:monitor/main
    # Cluster health for the index green wait and the proxy readiness check.
    - cluster:monitor/health
    # The persistent action.auto_create_index setting that blocks automatic
    # creation of node-pages-* indices.
    - cluster:admin/settings/update
    # Request-level checks for bulk, multi-get, and alias actions. The index
    # permissions below cover each item.
    - indices:data/write/bulk
    - indices:data/read/mget
    - indices:admin/aliases
    # ML Commons calls for the pinned sparse model.
    - cluster:admin/opensearch/ml/models/search
    - cluster:admin/opensearch/ml/register_model
    - cluster:admin/opensearch/ml/deploy_model
    - cluster:admin/opensearch/ml/models/get
    - cluster:admin/opensearch/ml/tasks/get
    - cluster:admin/opensearch/ml/profile/nodes
    - cluster:admin/opensearch/ml/predict
  index_permissions:
    # node-pages is the public alias, and node-pages-* names each physical
    # index.
    - index_patterns:
        - node-pages
        - node-pages-*
      allowed_actions:
        - indices:admin/create
        - indices:admin/get
        - indices:admin/delete
        - indices:admin/mappings/get
        - indices:monitor/settings/get
        - indices:admin/settings/update
        - indices:admin/resize
        - indices:admin/refresh*
        - indices:admin/aliases
        - indices:admin/aliases/get
        - indices:monitor/stats
        - indices:data/write/bulk*
        - indices:data/write/index
        - indices:data/write/update
        - indices:data/read/mget*
        - indices:data/read/search*
        - indices:data/read/point_in_time/create
        - indices:data/read/point_in_time/delete
    # The alias lookup names only the alias, so OpenSearch evaluates it
    # against every index. This grant reads alias metadata and no documents.
    - index_patterns:
        - "*"
      allowed_actions:
        - indices:admin/aliases/get
