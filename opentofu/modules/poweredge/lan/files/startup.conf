unix {
  nodaemon
  cli-listen /run/vpp/cli.sock
  log /var/log/vpp/vpp.log
  exec /etc/vpp/nat64.cli
}
cpu {
  main-core 0
  corelist-workers 1
}
memory {
  main-heap-size 128M
  main-heap-page-size 4K
}
buffers {
  buffers-per-numa 8192
  page-size 4K
}
statseg {
  size 16M
  page-size 4K
}
plugins {
  plugin default { disable }
  plugin tap_plugin.so { enable }
  plugin nat64_plugin.so { enable }
}
