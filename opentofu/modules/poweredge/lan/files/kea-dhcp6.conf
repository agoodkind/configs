{
  "Dhcp6": {
    "control-socket": { "socket-type": "unix", "socket-name": "/run/kea/kea6-ctrl.sock" },
    "hooks-libraries": [{ "library": "/usr/lib/x86_64-linux-gnu/kea/hooks/libdhcp_lease_cmds.so" }],
    "dhcp-ddns": {
      "enable-updates": true,
      "server-ip": "::1",
      "server-port": 53001,
      "sender-ip": "::1"
    },
    "ddns-send-updates": true,
    "ddns-override-no-update": true,
    "ddns-override-client-update": true,
    "ddns-update-on-renew": true,
    "ddns-replace-client-name": "when-not-present",
    "ddns-generated-prefix": "host",
    "ddns-qualifying-suffix": "berylax.goodkind.io",
    "ddns-conflict-resolution-mode": "check-exists-with-dhcid",
    "hostname-char-set": "[^A-Za-z0-9.-]",
    "hostname-char-replacement": "-",
    "option-data": [{ "name": "domain-search", "data": "berylax.goodkind.io" }],
    "interfaces-config": { "interfaces": ["lan", "lan-out"] },
    "lease-database": { "type": "memfile", "persist": true },
    "preferred-lifetime": 2700,
    "valid-lifetime": 3600,
    "renew-timer": 1350,
    "rebind-timer": 2160,
    "subnet6": [{
      "id": 1,
      "subnet": "3d06:bad:b01:300::/64",
      "interface": "lan-out",
      "pools": [{ "pool": "3d06:bad:b01:300::100 - 3d06:bad:b01:300::ffff" }],
      "option-data": [{ "name": "dns-servers", "data": "3d06:bad:b01:300::1" }]
    }, {
      "id": 2,
      "subnet": "3d06:bad:b01:305::/64",
      "interface": "lan",
      "pools": [{ "pool": "3d06:bad:b01:305::100 - 3d06:bad:b01:305::ffff" }],
      "option-data": [{ "name": "dns-servers", "data": "3d06:bad:b01:305::1" }]
    }]
  }
}
