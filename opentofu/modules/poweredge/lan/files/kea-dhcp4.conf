{
  "Dhcp4": {
    "control-socket": { "socket-type": "unix", "socket-name": "/run/kea/kea4-ctrl.sock" },
    "hooks-libraries": [{ "library": "/usr/lib/x86_64-linux-gnu/kea/hooks/libdhcp_lease_cmds.so" }],
    "dhcp-ddns": {
      "enable-updates": true,
      "server-ip": "::1",
      "server-port": 53001,
      "sender-ip": "::1"
    },
    "ddns-send-updates": true,
    "ddns-override-no-update": true,
    "ddns-override-client-update": true,
    "ddns-update-on-renew": true,
    "ddns-replace-client-name": "when-not-present",
    "ddns-generated-prefix": "host",
    "ddns-qualifying-suffix": "berylax.goodkind.io",
    "ddns-conflict-resolution-mode": "check-exists-with-dhcid",
    "hostname-char-set": "[^A-Za-z0-9.-]",
    "hostname-char-replacement": "-",
    "option-data": [
      { "name": "domain-name", "data": "berylax.goodkind.io" },
      { "name": "domain-search", "data": "berylax.goodkind.io" }
    ],
    "authoritative": true,
    "interfaces-config": { "interfaces": ["lan"] },
    "lease-database": { "type": "memfile", "persist": true },
    "valid-lifetime": 3600,
    "renew-timer": 1800,
    "rebind-timer": 3150,
    "subnet4": [{
      "id": 1,
      "subnet": "10.230.0.0/24",
      "interface": "lan-out",
      "pools": [{ "pool": "10.230.0.100 - 10.230.0.200" }],
      "option-data": [
        { "name": "routers", "data": "10.230.0.2" },
        { "name": "domain-name-servers", "data": "10.230.0.2" }
      ]
    }, {
      "id": 2,
      "subnet": "10.230.5.0/24",
      "interface": "lan",
      "pools": [{ "pool": "10.230.5.100 - 10.230.5.200" }],
      "option-data": [
        { "name": "routers", "data": "10.230.5.1" },
        { "name": "domain-name-servers", "data": "10.230.5.1" }
      ]
    }]
  }
}
