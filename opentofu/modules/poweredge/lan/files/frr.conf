frr defaults traditional
hostname edge-router
log syslog informational
service integrated-vtysh-config
!
interface lan
 ipv6 nd ra-interval 600
 ipv6 nd ra-lifetime 2700
 ipv6 nd managed-config-flag
 ipv6 nd other-config-flag
 ipv6 nd prefix 3d06:bad:b01:305::/64 5400 2700
 ipv6 nd rdnss 3d06:bad:b01:305::1 5400
 no ipv6 nd suppress-ra
!
interface lan-out
 ipv6 nd ra-interval 600
 ipv6 nd ra-lifetime 2700
 ipv6 nd managed-config-flag
 ipv6 nd other-config-flag
 ipv6 nd prefix 3d06:bad:b01:300::/64 5400 2700
 ipv6 nd rdnss 3d06:bad:b01:300::1 5400
 no ipv6 nd suppress-ra
!
%{ for name, network in collingwood_networks ~}
interface ${name}
 ipv6 nd ra-interval 600
 ipv6 nd ra-lifetime 2700
 ipv6 nd managed-config-flag
 ipv6 nd other-config-flag
 ipv6 nd prefix ${network.subnet6} 5400 2700
 ipv6 nd rdnss ${network.gateway6} 5400
 ipv6 nd dnssl ${network.domain} 5400
 no ipv6 nd suppress-ra
!
%{ endfor ~}
route-map MWAN_PRIMARY_IN permit 10
 set local-preference 200
!
route-map MWAN_BACKUP_IN permit 10
 set local-preference 100
!
router bgp 4200000001
 bgp router-id 10.230.230.2
 no bgp default ipv4-unicast
 neighbor 10.230.230.1 remote-as 4200000001
 neighbor 10.230.230.3 remote-as 4200000001
 neighbor fd06:fab::1 remote-as 4200000001
 neighbor fd06:fab::3 remote-as 4200000001
 address-family ipv4 unicast
  neighbor 10.230.230.1 activate
  neighbor 10.230.230.1 route-map MWAN_PRIMARY_IN in
  neighbor 10.230.230.3 activate
  neighbor 10.230.230.3 route-map MWAN_BACKUP_IN in
  network 10.230.0.0/24
  network 10.230.5.0/24
  network 10.230.231.254/32
%{ for name, network in collingwood_networks ~}
  network ${network.subnet4}
%{ endfor ~}
 exit-address-family
 address-family ipv6 unicast
  neighbor fd06:fab::1 activate
  neighbor fd06:fab::1 route-map MWAN_PRIMARY_IN in
  neighbor fd06:fab::3 activate
  neighbor fd06:fab::3 route-map MWAN_BACKUP_IN in
  network 3d06:bad:b01:300::/64
  network 3d06:bad:b01:305::/64
%{ for name, network in collingwood_networks ~}
  network ${network.subnet6}
%{ endfor ~}
  aggregate-address 3d06:bad:b01:300::/56
 exit-address-family
!
