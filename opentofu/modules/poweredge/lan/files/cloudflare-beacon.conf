server {
    listen 10.230.255.253:443 ssl;
    server_name 10.230.255.253;
    ssl_certificate /etc/cloudflare-beacon/cert.pem;
    ssl_certificate_key /etc/cloudflare-beacon/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    access_log off;

    location / {
        default_type text/plain;
        return 200 "on-net\n";
    }
}
