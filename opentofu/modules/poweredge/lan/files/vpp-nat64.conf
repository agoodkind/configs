[Unit]
Requires=systemd-networkd.service
After=systemd-networkd.service

[Service]
ExecStartPre=
Restart=on-failure
RestartSec=2
ExecStartPost=/usr/lib/systemd/systemd-networkd-wait-online --interface=nat64-in:routable --ipv6 --timeout=30
ExecStartPost=/usr/lib/systemd/systemd-networkd-wait-online --interface=nat64-out:routable --ipv4 --timeout=30
ExecStartPost=/usr/sbin/ethtool -K nat64-in tx off
ExecStartPost=/usr/sbin/ethtool -K nat64-out tx off
