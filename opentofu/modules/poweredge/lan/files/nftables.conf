#!/usr/sbin/nft -f
flush ruleset
table inet edge_lan {
    counter blocked_input {
    }
    counter blocked_inbound {
    }
    counter blocked_inter_network {
    }
    chain input {
        type filter hook input priority filter; policy drop;
        iifname "lo" accept
        ct state established,related accept
        ct state invalid drop
        iifname { "lan", "lan-out" } accept
        iifname "privileged" accept
        iifname { "general", "guest" } udp dport { 53, 67, 547 } accept
        iifname { "general", "guest" } tcp dport 53 accept
        iifname "transit" ip saddr { 10.230.230.1, 10.230.230.3 } tcp dport 179 accept
        iifname "transit" ip6 saddr { fd06:fab::1, fd06:fab::3 } tcp dport 179 accept
        iifname "transit" icmp type echo-request accept
        ip6 saddr fe80::/10 icmpv6 type { 130, 131, 132, 143 } accept
        icmpv6 type {
            echo-request, echo-reply, destination-unreachable,
            packet-too-big, time-exceeded, parameter-problem,
            nd-router-solicit, nd-router-advert,
            nd-neighbor-solicit, nd-neighbor-advert
        } limit rate 1000/second accept
        meta l4proto tcp counter name blocked_input reject with tcp reset
        counter name blocked_input reject with icmpx type port-unreachable
    }
    chain forward {
        type filter hook forward priority filter; policy drop;
        ct state established,related accept
        ct state invalid drop
        iifname { "lan", "lan-out" } accept
        iifname "privileged" accept
        iifname { "general", "guest" } ip daddr 10.230.0.0/16 counter name blocked_inter_network drop
        iifname { "general", "guest" } ip6 daddr { 3d06:bad:b01:300::/56, fd06:fab::/64 } counter name blocked_inter_network drop
        iifname { "general", "guest" } oifname "transit" accept
        iifname { "nat64-out", "nat64-tayga" } oifname "transit" accept
        iifname "transit" oifname { "lan", "lan-out" } icmpv6 type {
            echo-request, echo-reply, destination-unreachable,
            packet-too-big, time-exceeded, parameter-problem
        } limit rate 1000/second accept
        iifname "transit" oifname { "lan", "lan-out", "privileged", "general", "guest" } counter name blocked_inbound drop
    }
    chain output {
        type filter hook output priority filter; policy accept;
    }
}
