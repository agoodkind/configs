include "/etc/bind/kea-ddns.key";

zone "berylax.goodkind.io" {
  type primary;
  file "/var/lib/bind/kea/forward.zone";
  update-policy { grant kea-ddns. zonesub A AAAA DHCID; };
};

zone "0.230.10.in-addr.arpa" {
  type primary;
  file "/var/lib/bind/kea/reverse4-lan.zone";
  update-policy { grant kea-ddns. zonesub PTR; };
};

zone "5.230.10.in-addr.arpa" {
  type primary;
  file "/var/lib/bind/kea/reverse4-dac.zone";
  update-policy { grant kea-ddns. zonesub PTR; };
};

zone "0.0.3.0.1.0.b.0.d.a.b.0.6.0.d.3.ip6.arpa" {
  type primary;
  file "/var/lib/bind/kea/reverse6-lan.zone";
  update-policy { grant kea-ddns. zonesub PTR; };
};

zone "5.0.3.0.1.0.b.0.d.a.b.0.6.0.d.3.ip6.arpa" {
  type primary;
  file "/var/lib/bind/kea/reverse6-dac.zone";
  update-policy { grant kea-ddns. zonesub PTR; };
};
