hostname = "mwan-poweredge"
mwan_vmid = "313"
guest_type = "lxc"

[network]
ping_target_ipv4 = "1.1.1.1"
ping_target_ipv6 = "2606:4700:4700::1111"
ping_targets = ["2606:4700:4700::1111", "2001:4860:4860::8888"]
curl_target = "https://ifconfig.co/ip"
last_deploy_path = "/var/lib/mwan/last-deploy"
last_change_path = "/var/run/mwan-last-change"

[agent]
vsock_port = 0
tcp_addr = "[::1]:50052"
deploy_file = "/var/lib/mwan/last-deploy"
deploy_expected = false
log_file = "/var/log/mwan-agent.log"
debug = false

[bgp]
enabled = true
use_wanconfig = true
asn = 4200000001
router_id = "10.230.230.2"
next_hop_v6 = "3d06:bad:b01:3f0::2"
keepalive_seconds = 10
hold_seconds = 30
listen_port = 179
learned_route_iface = "mwanbr"

[[bgp.neighbors]]
address = "10.230.230.1"

[[bgp.neighbors_v6]]
address = "3d06:bad:b01:3f0::1"

[bgp.announce]
ipv4 = ["0.0.0.0/0"]
ipv6 = ["::/0"]

[bgp.graceful_restart]
enabled = false
restart_time = 30
notification_enabled = true

[bgp.forwarding_readiness]
socket_path = "/run/mwan-forwarding-ready.sock"
poll_interval_milliseconds = 1000
read_timeout_milliseconds = 500

[wanconfig]
publish = true

[ifmgr]
reconcile_interval = "60s"
lease_directory = "/var/lib/mwan"
log_file = "/var/log/mwan-ifmgr.log"
json_log_file = "/var/log/mwan-ifmgr.jsonl"

[ifmgr.iface.wan]
name = "wan"
dhcp_v4 = false
ra_solicit = false
dhcp_initial_backoff = "5s"
dhcp_max_backoff = "5m"

[ifmgr.modules.links]
state_file = "/var/lib/mwan/owned-links.json"

[ifmgr.modules.autoconfiguration]
state_file = "/var/lib/mwan/owned-kernel.json"

[ifmgr.modules.addresses]
state_file = "/var/lib/mwan/owned-addresses.json"

[ifmgr.modules.resolver]
state_file = "/var/lib/mwan/owned-resolver.json"

[ifmgr.modules.wan.routes]
health_state_file = "/var/run/mwan-health.state"

[ifmgr.modules.health]
state_file = "/var/run/mwan-health.state"
