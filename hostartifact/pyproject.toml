[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hostartifact"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
    "jinja2>=3.1.6",
    "pydantic>=2.12",
]

[dependency-groups]
dev = [
    "basedpyright>=1.31",
    "mypy>=1.18",
    "pytest>=8.4",
    "ruff>=0.14",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hostartifact"]

[tool.ruff]
line-length = 90
target-version = "py315"

[tool.ruff.lint]
select = [
    "F", "E", "W", "I001", "I002", "N", "UP", "ANN", "B", "A", "C4", "RET", "SIM", "TC",
    "PYI", "PT", "RUF",
]
ignore = ["TC001", "TC003", "RET504", "SIM108", "N815"]

[tool.mypy]
python_version = "3.15"
strict = true
disallow_any_explicit = true
disallow_any_generics = true
disallow_subclassing_any = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "scripts"]

[tool.basedpyright]
pythonVersion = "3.15"
typeCheckingMode = "strict"
include = ["src", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
