name: Proxmox overlay drift

# Applies the patches in proxmox/overlays to the newest published Proxmox VE
# packages and loads the patched modules. A failure means a patch no longer
# fits a release.

on:
  push:
    branches: ['**']
    paths:
      - proxmox/overlays/**
      - .github/workflows/proxmox-overlay-drift.yml
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  drift:
    name: overlay drift (${{ matrix.component }})
    runs-on: ubuntu-latest
    container: debian:trixie
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        component: [pve-no-subscription, pve-test]
    env:
      DEBIAN_FRONTEND: noninteractive
      PVE_COMPONENT: ${{ matrix.component }}
      PVE_KEYRING: /usr/share/keyrings/proxmox-archive-keyring.gpg
    steps:
      - uses: actions/checkout@v7
      - name: Install the newest Proxmox VE packages
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends ca-certificates curl
          curl --fail --silent --show-error --location --output "$PVE_KEYRING" \
            https://enterprise.proxmox.com/debian/proxmox-archive-keyring-trixie.gpg
          echo "deb [signed-by=$PVE_KEYRING] http://download.proxmox.com/debian/pve trixie $PVE_COMPONENT" \
            > /etc/apt/sources.list.d/pve.list
          printf '#!/bin/sh\nexit 101\n' > /usr/sbin/policy-rc.d
          chmod 0755 /usr/sbin/policy-rc.d
          apt-get update
          apt-get install --yes --no-install-recommends pve-manager
      - name: Show the package versions
        run: dpkg-query --show pve-manager qemu-server pve-container libpve-access-control
      - name: Apply the patches to the packaged modules
        run: proxmox/overlays/pve-overlay apply --no-system
      - name: Load the patched modules in taint mode
        run: proxmox/overlays/pve-overlay compile
