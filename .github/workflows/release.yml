name: Release

# Releases the mwan artifacts every deploy installs. The deploy playbooks fetch
# a published archive by pinned version and checksum, so this workflow is the
# only place a shipped binary is built.
#
# cgo stays off at the workflow level on purpose. The release set declares the
# gateway variant with its own cgo=1 flag, so only that binary links libyang
# and libsysrepo; every other artifact stays pure Go and statically linked,
# which is what the scp-and-run deploy contract needs. The C libraries are
# still provisioned, because the release engine runs the cgo-deps hook for any
# consumer that declares GO_MK_CGO_DEPS regardless of this input.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release:
    uses: agoodkind/go-makefile/.github/workflows/_release.yml@main
    permissions:
      contents: write
      id-token: write
      attestations: write
    secrets: inherit
    with:
      working_directory: mwan/go
      submodules: "true"
      apt_packages: libpcre2-dev
      platforms: linux/amd64 freebsd/amd64
      # Both asset names are verified after publish, so a release that dropped
      # the gateway variant fails the run instead of shipping a partial set.
      binary: mwan mwan-wanconfig
