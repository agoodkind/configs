name: build Tack runner image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: github-runner
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/tack-actions-runner:2.336.0-1
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Report pinned image
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "ghcr.io/${{ github.repository_owner }}/tack-actions-runner@${IMAGE_DIGEST}" \
            >> "$GITHUB_STEP_SUMMARY"
