name: CI

on:
  push:
    branches: ['**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mwan-go:
    name: mwan/go
    uses: agoodkind/go-makefile/.github/workflows/_ci.yml@main
    permissions:
      contents: read
      id-token: write
      attestations: write
    secrets: inherit
    with:
      submodules: "true"
      apt_packages: libyang2-tools libpcre2-dev
      go_tool_packages: github.com/bufbuild/buf/cmd/buf@latest google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11 google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
      go_version_file: mwan/go/go.mod
      working_directory: mwan/go
      # Match release.yml. Adding a release workflow switches this job's build
      # gate into the compile matrix, which would otherwise dry-run platforms
      # this module never ships.
      release_platforms: linux/amd64

  # The deploy command runs this same gate over a playbook's files and refuses
  # to deploy on a banned default or presence check, which is where such a
  # finding used to surface: after merge, at deploy time. Running it here over
  # the whole tree fails the pull request instead. No bypass token is set in CI,
  # so every finding not in a committed baseline fails the job.
  configs-lint:
    name: configs lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The configsctl script holds the pinned version, so its hash keys the
      # module cache and a pin change starts a fresh cache.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache-dependency-path: configsctl
      # The gate hands Jinja forms its Go parser cannot read to a jinja2
      # subprocess and fails when jinja2 is missing, so it is a hard dependency.
      - name: Install jinja2
        run: sudo apt-get update && sudo apt-get install -y python3-jinja2
      - name: Lint Ansible inputs
        run: ./configsctl lint

  # These specs render the real inventory and tack group_vars through Ansible
  # and run the real package updater script, so a change to that data or script
  # fails the pull request. The runner image provides ansible-playbook.
  configs-data-tests:
    name: configs data tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Run data specs
        run: bundle exec rspec

  # The mwan/go job above never runs these. mwan/go/Makefile hangs the two
  # schema gates off `check`, and the go-makefile quality matrix runs a fixed
  # list of nine commands that does not include it, so until this job existed
  # nothing validated the model outside a developer's own machine. The gates
  # run here as their own named check, because a schema failure and a Go
  # failure are different problems and a red check should say which one broke.
  #
  # The deploy runs this same yanglint validation against the rendered network
  # configuration before it writes anything to the gateway, so a model or an
  # instance document that fails here would fail a deploy instead.
  configs-yang:
    name: configs yang gates
    runs-on: ubuntu-latest
    steps:
      # The IETF modules the gates validate against are pinned in the
      # third_party/yang submodule, which the other two configs jobs do not
      # need and do not check out.
      - uses: actions/checkout@v7
        with:
          submodules: "true"
      # The gates are make targets in mwan/go, and that Makefile resolves the
      # Go environment while make parses it, so Go is a hard dependency even
      # though this job compiles nothing.
      - uses: actions/setup-go@v7
        with:
          go-version-file: mwan/go/go.mod
          cache-dependency-path: mwan/go/go.sum
      # libyang2-tools provides yanglint, which both gates run.
      - name: Install yanglint
        run: sudo apt-get update && sudo apt-get install -y libyang2-tools
      # mwan/go/Makefile fetches go-makefile through gh while make parses it,
      # so the token keeps that fetch on the authenticated API path instead of
      # its anonymous raw fallback.
      - name: Validate the YANG model and its instance documents
        env:
          GH_TOKEN: ${{ github.token }}
        run: make yang-validate yang-validate-instances
        working-directory: mwan/go

  # This job exists because the netns-tagged tests create a private network
  # namespace and build links, routes and policy rules inside it, which needs
  # root. The mwan/go job above runs its tests as the unprivileged runner user,
  # so it builds without the tag and never runs them.
  mwan-netns-tests:
    name: mwan netns tests
    runs-on: ubuntu-latest
    steps:
      # The submodules match the mwan/go job's checkout, because the Makefile
      # this job runs is the same one.
      - uses: actions/checkout@v7
        with:
          submodules: "true"
      - uses: actions/setup-go@v7
        with:
          go-version-file: mwan/go/go.mod
          cache-dependency-path: mwan/go/go.sum
      # mwan/go/Makefile fetches go-makefile through gh while make parses it,
      # so the token keeps that fetch on the authenticated API path instead of
      # its anonymous raw fallback.
      - name: Run the network namespace tests as root
        env:
          GH_TOKEN: ${{ github.token }}
        run: make test-netns
        working-directory: mwan/go
