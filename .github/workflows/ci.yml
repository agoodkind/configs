name: CI

on:
  push:
    branches: ['**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scripts:
    name: scripts
    uses: agoodkind/go-makefile/.github/workflows/_ci.yml@main
    permissions:
      contents: read
      id-token: write
      attestations: write
    secrets: inherit
    with:
      go_version_file: scripts/go.mod
      working_directory: scripts

  mwan-go:
    name: mwan/go
    uses: agoodkind/go-makefile/.github/workflows/_ci.yml@main
    permissions:
      contents: read
      id-token: write
      attestations: write
    secrets: inherit
    with:
      submodules: "true"
      apt_packages: libyang2-tools libpcre2-dev
      # The static sysrepo compiles with SYSREPO_GROUP=sysrepo (upstream
      # access policy, MWAN-435), and sr_connect resolves that group at
      # runtime, so the selftest needs it on the runner.
      pre_make_commands: sudo groupadd --system sysrepo
      go_tool_packages: github.com/bufbuild/buf/cmd/buf@latest google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11 google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
      go_version_file: mwan/go/go.mod
      working_directory: mwan/go
      # Match release.yml. Adding a release workflow switches this job's build
      # gate into the compile matrix, which would otherwise dry-run platforms
      # this module never ships.
      release_platforms: linux/amd64 freebsd/amd64
