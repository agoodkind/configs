name: CI

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

env:
  TOFU_VERSION: 1.13.2

jobs:
  configs-lint:
    name: configs lint
    runs-on: ubuntu-latest
    # The group includes the event name. A manual dispatch runs this job in a
    # different group from a push to the same branch and does not cancel the lint
    # job of that push.
    concurrency:
      group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      # The wrapper uses `go run` and requires a Go toolchain.
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache-dependency-path: configsctl
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false
      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.66.0
      - name: Validate native configuration inputs
        run: ./configsctl lint
      - name: Install jinja2
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-jinja2
      - name: Lint host artifact templates
        run: ./configsctl lint mwan/config/*.j2 opnsense/*.j2 proxmox/services/*.j2

  host-artifact-check:
    name: host artifact check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false
      - name: Test the host artifact policy module
        run: |
          set -euo pipefail
          tofu -chdir=opentofu/modules/overlay/host-artifacts init -backend=false -input=false
          tofu -chdir=opentofu/modules/overlay/host-artifacts test
