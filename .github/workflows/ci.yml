name: CI

on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      workspace:
        description: Exact workspace selector of the host artifact target, such as suburban/mwan
        required: true
        type: string
      revision:
        description: Full commit SHA to build, which must equal the commit of the dispatched main branch
        required: true
        type: string

permissions:
  contents: read

env:
  TOFU_VERSION: 1.13.2
  RENDER_ROOT: opentofu/render/host-artifact
  TARGETS_MODULE: opentofu/modules/host-artifact-targets

jobs:
  # The deploy command runs this same gate over a playbook's files and refuses
  # to deploy on a banned default or presence check, which is where such a
  # finding used to surface: after merge, at deploy time. Running it here over
  # the whole tree fails the pull request instead. No bypass token is set in CI,
  # so every finding not in a committed baseline fails the job.
  configs-lint:
    name: configs lint
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      # The configsctl script runs the tool with `go run`, so the job needs a
      # Go toolchain. .go-version is the only Go version this repository
      # declares now that it holds no Go module. The configsctl script holds
      # the pinned tool version, so its hash keys the module cache and a pin
      # change starts a fresh cache.
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache-dependency-path: configsctl
      # The gate hands Jinja forms its Go parser cannot read to a jinja2
      # subprocess and fails when jinja2 is missing, so it is a hard dependency.
      - name: Install jinja2
        run: sudo apt-get update && sudo apt-get install -y python3-jinja2
      - name: Lint Ansible inputs
        run: ./configsctl lint

  # On every push, this job runs python -m hostartifact affected with the paths
  # that changed since the previous push, or since the merge base with main for
  # a new branch. It builds only the targets that depend on a changed path.
  # It builds without vault values and runs the helper with a PATH that contains
  # only the uv environment and the OpenTofu directory. It compares each copied
  # application file with the file at the verified application commit. It fails
  # for a target only when the target build fails, or when the push changes the
  # pin file of that target and the pinned manifest differs from the new build.
  host-artifact-check:
    name: host artifact check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Install the host artifact helper
        run: uv sync --frozen --project hostartifact
      - name: Check the host artifact helper
        run: make -C hostartifact check
      - name: Build and compare every cataloged host artifact
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/hostartifact"
          mkdir -p "$work"
          venv_bin="$GITHUB_WORKSPACE/hostartifact/.venv/bin"
          tofu_dir="$(dirname "$(command -v tofu)")"
          helper_path="$venv_bin:$tofu_dir"
          for directory in "$venv_bin" "$tofu_dir"; do
            for program in ansible ansible-playbook ansible-vault ansible-inventory ansible-console; do
              if [ -e "$directory/$program" ]; then
                echo "::error::the helper PATH contains an Ansible program: $directory/$program"
                exit 1
              fi
            done
          done

          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE^{commit}"; then
            base="$(git merge-base origin/main "$GITHUB_SHA")"
          else
            base="$BEFORE"
          fi
          echo "The target selection and the pin check compare changes with commit $base"

          declare -A asset_roots

          verify_application() {
            local projection="$1" repository="$2" destination="$3"
            local prefix asset checksum signer tag digest
            prefix="$(jq -er --arg repository "$repository" '[.vars | to_entries[] | select((.key | endswith("_release_repo")) and .value == $repository) | .key | rtrimstr("_release_repo")] | if length == 1 then .[0] else error("the projection must pin exactly one release for \($repository)") end' "$projection")"
            tag="$(jq -er --arg key "${prefix}_release_tag" '.vars[$key]' "$projection")"
            asset="${prefix}_linux_amd64.tar.gz"
            checksum="$(jq -er --arg key "${prefix}_release_assets" --arg asset "$asset" '.vars[$key][] | select(.name == $asset) | .checksum' "$projection")"
            signer="$(jq -er '.vars.release_signer_repo' "$projection")"
            mkdir -p "$destination"
            gh release download "$tag" --repo "$repository" --pattern "$asset" --dir "$destination"
            echo "${checksum#sha256:}  $destination/$asset" | sha256sum --check --strict
            digest="$(gh attestation verify "$destination/$asset" --repo "$repository" --signer-repo "$signer" --format json --jq '.[0].verificationResult.signature.certificate.sourceRepositoryDigest')"
            if [[ ! "$digest" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::the attestation did not return a source commit for $repository $tag"
              exit 1
            fi
            echo "Verified release source: $repository $tag $digest"
            git init --quiet "$destination/source"
            git -C "$destination/source" fetch --quiet --depth 1 "https://github.com/$repository" "$digest"
            git -C "$destination/source" checkout --quiet --detach "$digest"
            asset_roots["$repository"]="$destination/source"
          }

          tofu -chdir="$TARGETS_MODULE" console -var "repository_root=$GITHUB_WORKSPACE" -var workspace= <<< 'jsonencode(local.workspaces)' > "$work/catalog.json"
          jq --raw-output0 'fromjson | .[]' "$work/catalog.json" > "$work/workspaces.bin"
          mapfile -d '' -t workspaces < "$work/workspaces.bin"
          if [ "${#workspaces[@]}" -eq 0 ]; then
            echo "::error::the repository does not contain any host artifact target descriptor"
            exit 1
          fi
          workspace_arguments=()
          for workspace in "${workspaces[@]}"; do
            workspace_arguments+=(--workspace "$workspace")
          done
          git diff -z --name-only "$base" "$GITHUB_SHA" > "$work/changed.bin"
          env -i PATH="$helper_path" python -I -m hostartifact affected \
            --repository-root "$GITHUB_WORKSPACE" \
            --changed-files "$work/changed.bin" \
            "${workspace_arguments[@]}" > "$work/affected.json"
          jq --raw-output0 '.[]' "$work/affected.json" > "$work/affected.bin"
          mapfile -d '' -t affected < "$work/affected.bin"
          if [ "${#affected[@]}" -eq 0 ]; then
            echo "This push does not change an input of any host artifact target."
            exit 0
          fi
          echo "Host artifact targets with changed inputs: $(jq -c . "$work/affected.json")"
          tofu -chdir="$RENDER_ROOT" init -backend=false -input=false

          index=0
          for workspace in "${affected[@]}"; do
            echo "::group::$workspace"
            index=$((index + 1))
            target="$work/target-$index"
            mkdir -p "$target"
            tofu -chdir="$RENDER_ROOT" plan -refresh=false -lock=false -input=false -out="$target/projection.tfplan" -var "workspace=$workspace" > "$target/plan.log"
            tofu -chdir="$RENDER_ROOT" show -json "$target/projection.tfplan" > "$target/show.json"
            jq -e .planned_values.outputs.projection.value "$target/show.json" > "$target/projection.json"

            asset_roots=()
            jq -r '.files[].source | select(startswith("asset:")) | ltrimstr("asset:") | split(":")[0]' "$target/projection.json" > "$target/asset-repositories.txt"
            sort -u "$target/asset-repositories.txt" > "$target/applications.txt"
            while read -r repository; do
              if [ "$repository" != "$GITHUB_REPOSITORY" ]; then
                verify_application "$target/projection.json" "$repository" "$target/applications/${repository//\//_}"
              fi
            done < "$target/applications.txt"
            root_arguments=()
            for repository in "${!asset_roots[@]}"; do
              root_arguments+=(--asset-root "$repository=${asset_roots[$repository]}")
            done

            env -i PATH="$helper_path" python -I -m hostartifact build \
              --projection "$target/projection.json" \
              --repository-root "$GITHUB_WORKSPACE" \
              --source-revision "$GITHUB_SHA" \
              "${root_arguments[@]}" \
              --output-dir "$target/output" > "$target/result.json"
            jq . "$target/result.json"

            archive="$(jq -er .archive "$target/result.json")"
            mkdir -p "$target/extracted"
            tar -tvzf "$archive"
            tar -xzf "$archive" -C "$target/extracted"
            jq . "$target/extracted/manifest.json"
            jq -r '.files[] | "\(.sha256)  \(.member)"' "$target/extracted/manifest.json" > "$target/members.sha256"
            (cd "$target/extracted" && sha256sum --check --strict "$target/members.sha256")
            asset_roots["$GITHUB_REPOSITORY"]="$GITHUB_WORKSPACE"
            jq -r '.files[] | select(.source | startswith("asset:")) | (.source | ltrimstr("asset:") | split(":")) as $source | [.destination, $source[0], ($source[1:] | join(":"))] | @tsv' "$target/projection.json" > "$target/assets.tsv"
            while IFS=$'\t' read -r destination repository path; do
              cmp "$target/extracted/files$destination" "${asset_roots[$repository]}/$path"
              echo "Archive member matches the checkout file: $destination $repository $path"
            done < "$target/assets.tsv"

            pin="opentofu/$workspace/host-artifact.auto.tfvars.json"
            git diff --name-only "$base" "$GITHUB_SHA" -- "$pin" > "$target/pin-change.txt"
            if [ -s "$target/pin-change.txt" ] && [ -f "$pin" ]; then
              pinned_tag="$(jq -er .host_artifact.release_tag "$pin")"
              pinned_asset="$(jq -er .host_artifact.asset "$pin")"
              pinned_sha256="$(jq -er .host_artifact.sha256 "$pin")"
              gh release download "$pinned_tag" --repo "$GITHUB_REPOSITORY" --pattern "$pinned_asset" --dir "$target/pinned"
              echo "$pinned_sha256  $target/pinned/$pinned_asset" | sha256sum --check --strict
              tar -xzf "$target/pinned/$pinned_asset" -O manifest.json > "$target/pinned-manifest.json"
              jq -S 'del(.source_revision)' "$target/pinned-manifest.json" > "$target/pinned-compare.json"
              jq -S 'del(.source_revision)' "$target/extracted/manifest.json" > "$target/rendered-compare.json"
              if ! diff -u "$target/pinned-compare.json" "$target/rendered-compare.json"; then
                echo "::error::the pinned manifest differs from the new build: $pin"
                exit 1
              fi
              echo "The pinned manifest matches the new build: $pin"
            else
              echo "This push does not change the pin file: $pin"
            fi
            echo "::endgroup::"
          done

  # This job runs only for a manual dispatch on main. It builds the selected
  # workspace, attests the archive, publishes the archive and the attestation
  # bundle as the only assets of a new release, and writes the pin JSON to the
  # job summary.
  host-artifact:
    name: host artifact
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    concurrency:
      group: host-artifact-${{ inputs.workspace }}
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    env:
      WORKSPACE: ${{ inputs.workspace }}
      REVISION: ${{ inputs.revision }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require the requested revision
        run: |
          set -euo pipefail
          if [ "$REVISION" != "$GITHUB_SHA" ]; then
            echo "::error::the requested revision differs from the workflow commit: $REVISION $GITHUB_SHA"
            exit 1
          fi
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Install the host artifact helper
        run: uv sync --frozen --project hostartifact
      - name: Project the host artifact inputs
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/hostartifact"
          mkdir -p "$work"
          tofu -chdir="$RENDER_ROOT" init -backend=false -input=false
          tofu -chdir="$RENDER_ROOT" plan -refresh=false -lock=false -input=false -out=projection.tfplan -var "workspace=$WORKSPACE" > "$work/plan.log"
          tofu -chdir="$RENDER_ROOT" show -json projection.tfplan > "$work/show.json"
          jq -e .planned_values.outputs.projection.value "$work/show.json" > "$work/projection.json"
      - name: Verify the pinned application releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/hostartifact"
          projection="$work/projection.json"
          : > "$work/asset-roots.txt"
          jq -r '.files[].source | select(startswith("asset:")) | ltrimstr("asset:") | split(":")[0]' "$projection" > "$work/asset-repositories.txt"
          sort -u "$work/asset-repositories.txt" > "$work/applications.txt"
          while read -r repository; do
            if [ "$repository" = "$GITHUB_REPOSITORY" ]; then
              continue
            fi
            destination="$work/applications/${repository//\//_}"
            prefix="$(jq -er --arg repository "$repository" '[.vars | to_entries[] | select((.key | endswith("_release_repo")) and .value == $repository) | .key | rtrimstr("_release_repo")] | if length == 1 then .[0] else error("the projection must pin exactly one release for \($repository)") end' "$projection")"
            tag="$(jq -er --arg key "${prefix}_release_tag" '.vars[$key]' "$projection")"
            asset="${prefix}_linux_amd64.tar.gz"
            checksum="$(jq -er --arg key "${prefix}_release_assets" --arg asset "$asset" '.vars[$key][] | select(.name == $asset) | .checksum' "$projection")"
            signer="$(jq -er '.vars.release_signer_repo' "$projection")"
            mkdir -p "$destination"
            gh release download "$tag" --repo "$repository" --pattern "$asset" --dir "$destination"
            echo "${checksum#sha256:}  $destination/$asset" | sha256sum --check --strict
            digest="$(gh attestation verify "$destination/$asset" --repo "$repository" --signer-repo "$signer" --format json --jq '.[0].verificationResult.signature.certificate.sourceRepositoryDigest')"
            if [[ ! "$digest" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::the attestation did not return a source commit for $repository $tag"
              exit 1
            fi
            echo "Verified release source: $repository $tag $digest"
            git init --quiet "$destination/source"
            git -C "$destination/source" fetch --quiet --depth 1 "https://github.com/$repository" "$digest"
            git -C "$destination/source" checkout --quiet --detach "$digest"
            echo "$repository=$destination/source" >> "$work/asset-roots.txt"
          done < "$work/applications.txt"
      - name: Build the host artifact
        id: build
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/hostartifact"
          helper_path="$GITHUB_WORKSPACE/hostartifact/.venv/bin:$(dirname "$(command -v tofu)")"
          root_arguments=()
          while read -r root; do
            root_arguments+=(--asset-root "$root")
          done < "$work/asset-roots.txt"
          env -i PATH="$helper_path" python -I -m hostartifact build \
            --projection "$work/projection.json" \
            --repository-root "$GITHUB_WORKSPACE" \
            --source-revision "$GITHUB_SHA" \
            "${root_arguments[@]}" \
            --output-dir "$work/output" > "$work/result.json"
          jq . "$work/result.json"
          {
            echo "archive=$(jq -er .archive "$work/result.json")"
            echo "asset=$(jq -er .asset "$work/result.json")"
            echo "sha256=$(jq -er .sha256 "$work/result.json")"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/attest@v4.2.2
        id: attest
        with:
          subject-path: ${{ steps.build.outputs.archive }}
      - name: Publish the host artifact release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ steps.build.outputs.archive }}
          ASSET: ${{ steps.build.outputs.asset }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          bundle="$(dirname "$ARCHIVE")/$ASSET.sigstore.json"
          cp "$BUNDLE_PATH" "$bundle"
          identifier="${ASSET#hostconfig_}"
          identifier="${identifier%.tar.gz}"
          tag="hostconfig-$identifier-$(date -u +%Y%m%d%H%M)-$GITHUB_RUN_NUMBER-${GITHUB_SHA:0:7}"
          gh release create "$tag" --target "$GITHUB_SHA" --latest=false "$ARCHIVE" "$bundle"
          {
            echo "tag=$tag"
            echo "bundle_asset=$(basename "$bundle")"
            echo "bundle_sha256=$(sha256sum "$bundle" | cut -d ' ' -f 1)"
          } >> "$GITHUB_OUTPUT"
      - name: Write the host artifact pin
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          ASSET: ${{ steps.build.outputs.asset }}
          SHA256: ${{ steps.build.outputs.sha256 }}
          BUNDLE_ASSET: ${{ steps.release.outputs.bundle_asset }}
          BUNDLE_SHA256: ${{ steps.release.outputs.bundle_sha256 }}
        run: |
          set -euo pipefail
          jq -n \
            --arg release_tag "$RELEASE_TAG" \
            --arg asset "$ASSET" \
            --arg sha256 "$SHA256" \
            --arg bundle_asset "$BUNDLE_ASSET" \
            --arg bundle_sha256 "$BUNDLE_SHA256" \
            --arg source_revision "$GITHUB_SHA" \
            '{release_tag: $release_tag, asset: $asset, sha256: $sha256, bundle_asset: $bundle_asset, bundle_sha256: $bundle_sha256, source_revision: $source_revision}' > "$RUNNER_TEMP/pin.json"
          {
            echo '```json'
            cat "$RUNNER_TEMP/pin.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
