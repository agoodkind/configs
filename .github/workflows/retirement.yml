name: Retirement

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, edited]

permissions: {}

concurrency:
  group: retirement-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Read retirement state
    if: github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    environment: retirement-state
    permissions:
      contents: read
      pull-requests: read
    outputs:
      verdict: ${{ steps.verify.outcome }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache: false
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.13.2
          tofu_wrapper: false
      - name: Install the reviewed verifier
        run: go install goodkind.io/configsctl/cmd/configsctl@v0.0.0-20261117072044-ba92f44e3c31
      - name: Prepare retirement verification
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: configsctl ci retirement prepare
      - name: Verify retirement against trusted base state
        id: verify
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.RETIREMENT_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.RETIREMENT_R2_SECRET_ACCESS_KEY }}
          TF_VAR_vault_tofu_state_passphrase: ${{ secrets.RETIREMENT_STATE_PASSPHRASE }}
          AWS_EC2_METADATA_DISABLED: 'true'
        run: configsctl ci retirement verify

  publish:
    name: Publish retirement verdict
    if: always() && github.event.pull_request.base.ref == 'main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache: false
      - name: Install the reviewed verifier
        run: go install goodkind.io/configsctl/cmd/configsctl@v0.0.0-20261117072044-ba92f44e3c31
      - name: Publish retirement verdict
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERDICT: ${{ needs.verify.outputs.verdict }}
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: configsctl ci retirement publish
