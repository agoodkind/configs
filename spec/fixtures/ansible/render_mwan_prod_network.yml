---
- name: Render the real production network document
  hosts: localhost
  gather_facts: false
  connection: local
  become: false
  vars:
    # The deploy discovers net0 and net1 from qm config 113 on vault.
    vm_mgmt_mac: "BC:24:11:25:62:39"
    mwan_net1_mac: "BC:24:11:72:00:C1"
  vars_files:
    - "{{ repository_root }}/ansible/inventory/group_vars/all/vars.yml"
    - "{{ repository_root }}/ansible/inventory/group_vars/all/service_mapping.yml"
    - "{{ repository_root }}/ansible/inventory/group_vars/mwan_servers.yml"
  tasks:
    - name: Render the MWAN network configuration
      ansible.builtin.template:
        src: "{{ repository_root }}/mwan/config/network.json.j2"
        dest: "{{ network_output }}"
        mode: "0600"
