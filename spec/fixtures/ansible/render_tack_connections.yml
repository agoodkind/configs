---
- name: Render the production connection file generator
  hosts: localhost
  gather_facts: false
  connection: local
  become: false
  vars_files:
    - "{{ group_vars_file }}"
  tasks:
    - name: Render the connection file generator
      ansible.builtin.template:
        src: "{{ repository_root }}/tack/render-secret-files.sh.j2"
        dest: "{{ output_directory }}/render-connections.sh"
        mode: "0700"
