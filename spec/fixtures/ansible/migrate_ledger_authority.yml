---
- name: Exercise the production ledger authority tasks
  hosts: localhost
  gather_facts: false
  connection: local
  vars:
    tack_ledger_certs_dir: /material/runtime
    tack_ledger_authority_dir: /material/authority
    tack_ledger_ca_cert_path: /material/runtime/ca.crt
    tack_ledger_ca_host: localhost
    tack_ledger_cert_days: 1
    tack_domain: synthetic.invalid
    tack_ledger_certificate_subjects:
      yb1: "2001:db8::1"
    tack_ledger_node_name: ""
    tack_provision_owner: false
  tasks:
    - name: Run the production authority migration and issuance
      ansible.builtin.include_tasks: /repo/ansible/playbooks/tasks/tack-ledger-tls.yml
