- name: Stage the real network document
  ansible.builtin.copy:
    src: "{{ role_test_current_network }}"
    dest: /etc/mwan/network.json
    mode: "0600"
  notify: Restart mwan-ifmgr@wan

- name: Stage the actual first-install daemon configuration
  ansible.builtin.copy:
    dest: /etc/mwan/config.toml
    mode: "0600"
    src: "{{ repository_root }}/spec/fixtures/ansible/mwan_role_runtime.toml"
  when: mwan_role_first_install | bool
  notify: Restart mwan-ifmgr@wan

- name: Install the released binary's actual first-install inputs
  ansible.builtin.command:
    argv: [/usr/local/bin/mwan, install, --role, wan, --apply]
  changed_when: true
  when: mwan_role_first_install | bool

- name: Write a deliberately invalid document for the failed-staging control
  ansible.builtin.copy:
    dest: /run/mwan-role-invalid.json
    content: '{'
    mode: "0600"
  when: role_test_phase in ['stage_failure', 'recovery_failure']

- name: Remove a real captured input for the failed-recovery control
  ansible.builtin.file:
    path: "{{ mwan_role_backup.path }}/config.toml"
    state: absent
  when: role_test_phase == 'recovery_failure'

- name: Reject the deliberately invalid input through the released loader
  ansible.builtin.command:
    argv:
      - /usr/local/bin/mwan
      - deploy-gate
      - check-network
      - /run/mwan-role-invalid.json
      - /usr/local/share/wanconfig/yang
  changed_when: false
  when: role_test_phase in ['stage_failure', 'recovery_failure']

- name: Corrupt a real generated unit for the verifier control
  ansible.builtin.lineinfile:
    path: "/etc/systemd/network/20-{{ mwan_mgmt_iface }}.network"
    regexp: '^DNS='
    line: DNS=198.51.100.53
  when: role_test_corrupt_unit
