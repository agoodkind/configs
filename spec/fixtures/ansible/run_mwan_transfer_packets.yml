---
- name: Exercise the production packet task against the actual operational publisher
  hosts: role_tests
  gather_facts: false
  become: false
  vars:
    ansible_connection: community.docker.docker
    ansible_python_interpreter: /usr/bin/python3
    mwan_transfer_packet_phase: selected
  tasks:
    - name: Validate the actual packet manifest
      ansible.builtin.include_tasks: >-
        {{ repository_root }}/ansible/playbooks/tasks/validate-mwan-transfer-packet-edges.yml

    - name: Execute the actual packet task
      ansible.builtin.include_tasks: >-
        {{ repository_root }}/ansible/playbooks/tasks/run-mwan-transfer-packets.yml
