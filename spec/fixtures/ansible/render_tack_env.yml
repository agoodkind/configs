---
# Renders the real tack environment file against the real tack group_vars.
- name: Render the tack environment file
  hosts: localhost
  gather_facts: false
  connection: local
  become: false
  vars_files:
    - "{{ group_vars_file }}"
  tasks:
    - name: Render the environment file
      ansible.builtin.template:
        src: "{{ template_file }}"
        dest: "{{ output_file }}"
        mode: "0600"
