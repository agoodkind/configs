# Host-side forwarding for MWAN testbed
# Required for LXC failover (veth peers need forwarding enabled)
# Deploy to: /etc/sysctl.d/99-mwan-testbed.conf on suburban
net.ipv6.conf.all.forwarding=1
net.ipv6.conf.default.forwarding=1
net.ipv4.ip_forward=1

# Safe defaults for interfaces that appear after early boot. The suburban
# host's per-bridge RA policy is reconciled continuously by mwan-ifmgr.
net.ipv6.conf.default.accept_ra=0
net.ipv6.conf.default.autoconf=0
net.ipv6.conf.default.accept_ra_defrtr=0

# Conntrack must not validate checksums on this host. Container (veth)
# ICMPv6 reaches the pve-firewall bridge hooks with an offloaded checksum
# the validator rejects, so every container neighbor solicitation to the
# host died as ctstate INVALID in PVEFW-HOST-IN before the NDP accept
# rules, breaking cold resolution of the host bridge address (MWAN-286).
# Virtio tap frames skip validation, which is why VMs resolved and
# containers did not.
net.netfilter.nf_conntrack_checksum=0
