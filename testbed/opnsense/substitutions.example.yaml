# Example substitution table for `mwan opnsense config import`.

# The concrete suburban testbed table lives in `substitutions.yaml`. This file
# documents the same shape with minimal comments.

# XPath support is the subset beevik/etree accepts. A predicate may compare a
# direct child, as in rule[interface='opt9'], but a nested path such as
# rule[source/network='opt9'] is rejected.

device_names:
  - name: "MANAGEMENT and four VLAN parents: iavf0 to vtnet0"
    from: "iavf0"
    to:   "vtnet0"

xpath_sets:
  - name: "hostname"
    xpath: "//opnsense/system/hostname"
    new_value: "router-test"
  - name: "WAN ipv4"
    xpath: "//opnsense/interfaces/wan/ipaddr"
    new_value: "10.240.240.2"
  - name: "WAN ipv6"
    xpath: "//opnsense/interfaces/wan/ipaddrv6"
    new_value: "3d06:bad:b01:201::2"
  - name: "VMNET v4"
    xpath: "//opnsense/interfaces/opt6/ipaddr"
    new_value: "10.240.4.1"
  - name: "VMNET v6"
    xpath: "//opnsense/interfaces/opt6/ipaddrv6"
    new_value: "3d06:bad:b01:210::1"
  - name: "PRIVILEGED LAN ipv6"
    xpath: "//opnsense/interfaces/lan/ipaddrv6"
    new_value: "3d06:bad:b01:211::1"
  - name: "GENERAL ipv6"
    xpath: "//opnsense/interfaces/opt4/ipaddrv6"
    new_value: "3d06:bad:b01:212::1"
  - name: "IPv6OnlyVLAN ipv6"
    xpath: "//opnsense/interfaces/opt8/ipaddrv6"
    new_value: "3d06:bad:b01:264::1"
  - name: "NAT64 / Tayga prefix"
    xpath: "//opnsense/OPNsense/tayga/general/v6prefix"
    new_value: "3d06:bad:b01:2664::/96"
  - name: "Captive portal hostname"
    xpath: "//opnsense/captiveportal/hostname"
    new_value: "captive"

remove_elements:
  - name: "MANAGEMENT interface declaration"
    xpath: "//opnsense/interfaces/opt9"
  - name: "MANAGEMENT firewall rules"
    xpath: "//opnsense/filter/rule[interface='opt9']"
  - name: "UniFi rules sourced from the MANAGEMENT network"
    xpath: "//opnsense/filter/rule[descr='TEMP Allow Unifi Access from Mgmt']"
  - name: "UniFi to proxy firewall rule sourced from MANAGEMENT"
    xpath: "//opnsense/filter/rule[descr='Unifi->Proxy Container Traffic 443 HTTPS']"
  - name: "UniFi to proxy NAT rule sourced from MANAGEMENT"
    xpath: "//opnsense/nat/rule[descr='Unifi->Proxy Container Traffic 443 HTTPS']"
  - name: "MANAGEMENT gateway link-local virtual IP"
    xpath: "//opnsense/virtualip/vip[interface='opt9']"
  - name: "MANAGEMENT router advertisements"
    xpath: "//opnsense/OPNsense/radvd/entries[interface='opt9']"
  - name: "MANAGEMENT DHCP ranges"
    xpath: "//opnsense/dnsmasq/dhcp_ranges[interface='opt9']"
  - name: "MANAGEMENT DHCPv6 placeholder"
    xpath: "//opnsense/dhcpdv6/opt9"
  - name: "WireGuard client peers"
    xpath: "//opnsense/OPNsense/wireguard/client/clients/client"
  - name: "WireGuard server peers"
    xpath: "//opnsense/OPNsense/wireguard/server/servers/server"
  - name: "Inline certs"
    xpath: "//opnsense/cert"

text_literals:
  - name: "PRIVILEGED v4 prefix shift"
    from: "10.250.1."
    to:   "10.240.1."
  - name: "GENERAL v4 prefix shift"
    from: "10.250.2."
    to:   "10.240.2."
  - name: "CAPTIVE v4 prefix shift"
    from: "10.250.3."
    to:   "10.240.3."
  - name: "VMNET v4 prefix shift"
    from: "10.250.0."
    to:   "10.240.4."

  - name: "v6 NAT64 prefix shift"
    from: "3d06:bad:b01:6464::"
    to:   "3d06:bad:b01:2664::"
  - name: "v6 PRIVILEGED prefix shift"
    from: "3d06:bad:b01:1::"
    to:   "3d06:bad:b01:211::"
  - name: "v6 GENERAL prefix shift"
    from: "3d06:bad:b01:2::"
    to:   "3d06:bad:b01:212::"
  - name: "v6 CAPTIVE prefix shift"
    from: "3d06:bad:b01:3::"
    to:   "3d06:bad:b01:213::"
  - name: "v6 IPv6OnlyVLAN prefix shift"
    from: "3d06:bad:b01:64::"
    to:   "3d06:bad:b01:264::"
  - name: "v6 WAN prefix shift"
    from: "3d06:bad:b01:fe::"
    to:   "3d06:bad:b01:201::"
  - name: "v6 VMNET prefix shift"
    from: "3d06:bad:b01::"
    to:   "3d06:bad:b01:210::"

  - name: "INTERNAL group membership without MANAGEMENT"
    from: "lan,lo0,opt1,opt4,opt5,opt6,opt7,opt8,opt9"
    to:   "lan,lo0,opt1,opt4,opt5,opt6,opt7,opt8"

  - name: "domain literal"
    from: "home.goodkind.io"
    to:   "test.home.goodkind.io"
  - name: "captive portal FQDN"
    from: "captive.chaotic.dog"
    to:   "captive.test.home.goodkind.io"
  - name: "chaotic.dog domain literal"
    from: "chaotic.dog"
    to:   "test.home.goodkind.io"
  - name: "v6 DNS forwarder"
    from: "3d06:bad:b01:210::53"
    to:   "2606:4700:4700::1111"
