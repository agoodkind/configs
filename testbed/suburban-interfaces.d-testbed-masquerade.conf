# Suburban testbed: masquerade rules for the testbed bridges
# Deploy to: /etc/network/interfaces.d/testbed-masquerade.conf
#
# Bridge definitions and addresses live in the PVE-managed interfaces file.
# This file adds only iptables masquerade hooks that PVE does not manage.

# IPv4: VM subnet to Comcast
iface vmbr1 inet manual
	post-up iptables -w -t nat -C POSTROUTING -s 10.240.200.0/24 -o vmbr0 -j MASQUERADE 2>/dev/null || iptables -w -t nat -A POSTROUTING -s 10.240.200.0/24 -o vmbr0 -j MASQUERADE
	post-down iptables -w -t nat -D POSTROUTING -s 10.240.200.0/24 -o vmbr0 -j MASQUERADE || true

# IPv6: testbed subnet out Comcast, and out the WireGuard tunnel to production.
iface vmbr1 inet6 manual
	post-up ip6tables -w -t nat -C POSTROUTING -s 3d06:bad:b01:200::/56 -o vmbr0 -j MASQUERADE 2>/dev/null || ip6tables -w -t nat -A POSTROUTING -s 3d06:bad:b01:200::/56 -o vmbr0 -j MASQUERADE
	post-up ip6tables -w -t nat -C POSTROUTING -s 3d06:bad:b01:200::/56 -o wg0 -j MASQUERADE 2>/dev/null || ip6tables -w -t nat -A POSTROUTING -s 3d06:bad:b01:200::/56 -o wg0 -j MASQUERADE
	post-down ip6tables -w -t nat -D POSTROUTING -s 3d06:bad:b01:200::/56 -o vmbr0 -j MASQUERADE || true
	post-down ip6tables -w -t nat -D POSTROUTING -s 3d06:bad:b01:200::/56 -o wg0 -j MASQUERADE || true

# IPv6 controller return path. Traffic from the production side arrives over wg0
# and gets rewritten to suburban's own on-link address, so a testbed guest
# answers its neighbour instead of routing the reply to its default gateway,
# which forwards anything outside 3d06:bad:b01:210::/60 out a simulated WAN.
#
# The guest segment is vmbrtrunk, not vmbr1, since the guests moved to
# 3d06:bad:b01:210::/64. The source is the whole production /56 because that is
# what suburban's wg0 already admits as AllowedIPs; it covers both WireGuard
# client ranges, a:: and 10::, and the production VMNET ::/64 that the Ansible
# controller LXC sits on. Matching only 10::/64 missed every peer that carries
# an a:: address alone.
iface vmbrtrunk inet6 manual
	post-up ip6tables -w -t nat -C POSTROUTING -s 3d06:bad:b01::/56 -o vmbrtrunk -j MASQUERADE 2>/dev/null || ip6tables -w -t nat -A POSTROUTING -s 3d06:bad:b01::/56 -o vmbrtrunk -j MASQUERADE
	post-down ip6tables -w -t nat -D POSTROUTING -s 3d06:bad:b01::/56 -o vmbrtrunk -j MASQUERADE || true
