---
- name: Pull the pinned MWAN binary onto the controller
  hosts: mwan_servers:mwan_suburban_servers
  gather_facts: false
  become: false
  pre_tasks:
    - name: Require a merged controller checkout
      ansible.builtin.import_tasks: tasks/require-merged-checkout.yml
  tasks:
    - name: Pull the pinned MWAN binary archive
      ansible.builtin.import_tasks: tasks/github-release.yml
      vars:
        release_repo: "{{ mwan_release_repo }}"
        release_tag: "{{ mwan_release_tag }}"
        release_assets: >-
          {{ mwan_release_assets
             | selectattr('name', 'equalto', 'mwan_linux_amd64.tar.gz')
             | list }}
        release_required_assets:
          - mwan_linux_amd64.tar.gz
        release_var_prefix: mwan

- name: Replace the MWAN executable
  hosts: mwan_servers:mwan_suburban_servers
  gather_facts: false
  become: false
  tasks:
    - name: Save the prior executable and install the pinned binary
      ansible.builtin.copy:
        src: "{{ mwan_release_dir }}/linux_amd64/mwan"
        dest: /usr/local/bin/mwan
        mode: "0755"
        backup: true
        unsafe_writes: false
      register: mwan_binary_copy

    - name: Report the saved executable
      ansible.builtin.debug:
        var: mwan_binary_copy.backup_file
      when: mwan_binary_copy.backup_file is defined

    - name: Verify the installed MWAN release
      ansible.builtin.import_tasks: tasks/verify-mwan-release.yml
      vars:
        mwan_installed_binary: /usr/local/bin/mwan
