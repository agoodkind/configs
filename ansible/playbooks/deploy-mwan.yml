---
# ============================================================================
# MWAN Multi-WAN Load Balancer Deployment
# ============================================================================
# Deploys mwan VM for multi-WAN load balancing with PCI passthrough
#   - X710 VF (trust mode) for AT&T 802.1X authentication
#   - I226-V NIC for Webpass (full passthrough to avoid MAC issues)
#   - Virtio for management and OPNsense link
#
# Required: VF must be created on Proxmox host first (x710-vf-setup.service)
# ============================================================================

# MWAN VM membership in mwan_servers and mwan_suburban_servers is provided by
# service_mapping.yml, so no localhost add_host bootstrap is needed here. The
# MWAN failover LXC lives in mwan_failover_servers or mwan_failover_suburban_servers
# and is configured by deploy-mwan-failover.yml.

# The release this playbook installs is pinned in the environment's group_vars.
# This play pulls it onto the controller before any host is touched, so a bad
# pin fails first. It opens no connection.
- name: Pull the pinned mwan release onto the controller
  hosts: mwan_servers:mwan_suburban_servers
  gather_facts: false
  become: false
  pre_tasks:
    - name: Require a merged controller checkout
      ansible.builtin.import_tasks: tasks/require-merged-checkout.yml
  tasks:
    - name: Pull the pinned mwan release
      ansible.builtin.import_tasks: tasks/github-release.yml
      vars:
        release_repo: "{{ mwan_release_repo }}"
        release_tag: "{{ mwan_release_tag }}"
        release_assets: "{{ mwan_release_assets }}"
        release_required_assets:
          - mwan_linux_amd64.tar.gz
          - wanconfig-stack_linux_amd64.tar.gz
        release_var_prefix: mwan

- name: Prepare MWAN VM (base packages, SSH keys, etc.)
  ansible.builtin.import_playbook: prep-guests.yml
  vars:
    target_hosts: mwan_servers:mwan_suburban_servers

- name: Configure MWAN VM
  hosts: mwan_servers:mwan_suburban_servers
  become: false
  environment:
    DEBIAN_FRONTEND: noninteractive
  vars:
    mwan_config_dir: /etc/mwan
    mwan_role_job_timeout_seconds: 120
    repo_root: "{{ playbook_dir | dirname | dirname }}"
    # The controller renders one network document per host. The released loader
    # validates these exact bytes before the deploy installs the MWAN management stack.
    mwan_network_json_local: "{{ repo_root }}/.cache/network-{{ inventory_hostname }}.json"

  tasks:
    - name: Generate deploy trace ID (early)
      ansible.builtin.set_fact:
        mwan_deploy_trace_id: "{{ lookup('pipe', 'date +%Y%m%d-%H%M%S') }}-deploy-{{ 999999 | random }}"

    - name: Ensure MWAN trace state directory exists
      ansible.builtin.file:
        path: /var/lib/mwan
        state: directory
        mode: "0755"
      changed_when: false
      failed_when: false

    - name: Write deploy trace ID file (run)
      ansible.builtin.copy:
        dest: /run/mwan-trace-id
        content: "{{ mwan_deploy_trace_id }}\n"
        mode: "0644"
      changed_when: false
      failed_when: false

    - name: Write deploy trace ID file (persistent)
      ansible.builtin.copy:
        dest: /var/lib/mwan/trace-id
        content: "{{ mwan_deploy_trace_id }}\n"
        mode: "0644"
      changed_when: false
      failed_when: false

    - name: Verify Debian
      ansible.builtin.assert:
        that:
          - ansible_os_family == "Debian"
        fail_msg: >-
          This playbook requires Debian.
          Found: {{ ansible_os_family | default('unknown') }}
        success_msg: >-
          ✓ {{ ansible_distribution }}
          {{ ansible_distribution_version }}

    # The lookup runs under check mode too, because `qm list` only reads and
    # every later task that names the guest reads its id from this result.
    - name: Get actual VMID from Proxmox
      delegate_to: "{{ mwan_proxmox_delegate }}"
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          qm list | awk '$2 == "{{ inventory_hostname }}" {print $1}'
        executable: /bin/bash
      register: vmid_lookup
      changed_when: false
      failed_when: vmid_lookup.stdout | length == 0
      check_mode: false

    - name: Set actual VMID
      ansible.builtin.set_fact:
        actual_vmid: "{{ vmid_lookup.stdout | trim }}"
        mwan_vmid: "{{ vmid_lookup.stdout | trim }}" # Override group_vars

    - name: Discover MWAN VM runtime network (MACs)
      ansible.builtin.include_tasks: tasks/mwan-vm/discover-runtime-network.yml

    # ============================================================================
    # PRE-DEPLOY: Auto-rollback setup
    # ============================================================================

    # The deploy gates use the pinned mwan release on the Proxmox delegate. Check
    # mode also copies this binary so validation never uses an older helper. The
    # dedicated filename leaves the watchdog binary unchanged. The first play
    # downloaded and verified the release under mwan_release_dir.
    - name: Push the deploy-gate binary to the Proxmox delegate
      delegate_to: "{{ mwan_proxmox_delegate }}"
      ansible.builtin.copy:
        src: "{{ mwan_release_dir }}/linux_amd64/mwan"
        dest: /usr/local/sbin/mwan-deploy-gate
        mode: "0755"
      check_mode: false

    - name: Verify the deploy-gate binary is the released commit
      delegate_to: "{{ mwan_proxmox_delegate }}"
      ansible.builtin.import_tasks: tasks/verify-mwan-release.yml
      vars:
        mwan_installed_binary: /usr/local/sbin/mwan-deploy-gate

    - name: Ensure the hypervisor deploy-gate directory exists
      delegate_to: "{{ mwan_proxmox_delegate }}"
      ansible.builtin.file:
        path: /run/mwan-deploy-gate
        state: directory
        mode: "0700"
      check_mode: false

    - name: Render the OPNsense egress probe JSON for deploy gate
      delegate_to: "{{ mwan_proxmox_delegate }}"
      ansible.builtin.template:
        src: "{{ repo_root }}/mwan/config/deploy-gate-probe.json.j2"
        dest: "/run/mwan-deploy-gate/{{ mwan_deploy_trace_id }}-probe.json"
        mode: "0600"
      check_mode: false

    - name: Verify internet connectivity before deploy
      delegate_to: "{{ mwan_proxmox_delegate }}"
      ansible.builtin.command:
        argv:
          - /usr/local/sbin/mwan-deploy-gate
          - deploy-gate
          - check-egress
          - "{{ mwan_deploy_gate_families }}"
          - "/run/mwan-deploy-gate/{{ mwan_deploy_trace_id }}-probe.json"
      register: pre_deploy_connectivity
      changed_when: false
      failed_when: false

    - name: Stop production deploy when the rollback baseline is unhealthy
      ansible.builtin.fail:
        msg: >-
          Production egress failed before the deploy. The playbook requires
          healthy egress to create a rollback snapshot. Restore egress and
          rerun the deploy.
      when:
        - mwan_environment == "prod"
        - pre_deploy_connectivity.rc != 0

    - name: Set pre-deploy snapshot name for this run
      ansible.builtin.set_fact:
        mwan_pre_deploy_snapshot_name: >-
          pre-deploy-{{ ansible_date_time.iso8601_basic_short }}
      when: pre_deploy_connectivity.rc == 0

    - name: Create pre-deploy snapshot on Proxmox
      delegate_to: "{{ mwan_proxmox_delegate }}"
      ansible.builtin.command:
        cmd: >-
          qm snapshot {{ actual_vmid }}
          {{ mwan_pre_deploy_snapshot_name }}
          --description "Pre-deploy snapshot for auto-rollback"
      register: snapshot_result
      changed_when: snapshot_result.rc == 0
      when: pre_deploy_connectivity.rc == 0

    - name: Prune old pre-deploy snapshots (keep last 1)
      delegate_to: "{{ mwan_proxmox_delegate }}"
      ansible.builtin.shell:
        cmd: |
          {% raw %}
          set -euo pipefail
          VMID="${MWAN_VMID}"
          mapfile -t snaps < <(
            qm listsnapshot "$VMID" | grep -oE 'pre-deploy-[^[:space:]]+' | sort -u
          )
          count=0
          for _ in "${snaps[@]}"; do
            count=$((count + 1))
          done
          if [ "$count" -le 1 ]; then
            exit 0
          fi
          to_delete=$((count - 1))
          for ((i=0; i<to_delete; i++)); do
            qm delsnapshot "$VMID" "${snaps[$i]}" --force
          done
          {% endraw %}
        executable: /bin/bash
      environment:
        MWAN_VMID: "{{ actual_vmid }}"
      when: pre_deploy_connectivity.rc == 0
      changed_when: false

    - name: Warn if skipping snapshot due to broken connectivity
      ansible.builtin.debug:
        msg: "⚠️  Skipping pre-deploy snapshot - connectivity already broken!"
      when: pre_deploy_connectivity.rc != 0

    - name: Ensure persistent mwan state directory exists
      ansible.builtin.file:
        path: /var/lib/mwan
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Write deploy timestamp to MWAN VM
      ansible.builtin.copy:
        content: "{{ ansible_date_time.epoch }}"
        dest: /var/lib/mwan/last-deploy
        owner: root
        group: root
        mode: "0644"

    # ============================================================================
    # WATCHDOG: Proxmox-host watchdog config + binary deploy live in
    # deploy-proxmox.yml / tasks/proxmox-host.yml. The mwan binary was pulled
    # from the pinned release by the first play and pushed to the Proxmox
    # delegate in the pre-deploy section above, before the first deploy gate.
    # ============================================================================

    # ============================================================================
    # DEPLOY: MWAN configuration on the MWAN VM
    # ============================================================================

    - name: Install and configure cloudflared
      ansible.builtin.include_tasks: tasks/install-cloudflared.yml
      vars:
        cloudflared_token: "{{ vault_mwan_cloudflared_token }}"

    - name: Wait for the controller connection after cloudflared starts
      ansible.builtin.include_tasks: tasks/wait-for-connection.yml

    - name: Install required packages
      ansible.builtin.apt:
        name:
          - wpasupplicant
          - nftables
          - iproute2
          - iptables
          - bash
          - curl
          - jq
          - vlan
          - bridge-utils
          - networkd-dispatcher
          - telnet
          - sipcalc
          - ipcalc-ng
          - ipcalc
          - ipv6calc
          - fping
          - conntrack
        state: present

    - name: Wait for the controller connection after network packages install
      ansible.builtin.include_tasks: tasks/wait-for-connection.yml

    - name: Declare gateway firewall modules for boot
      ansible.builtin.copy:
        src: "{{ repo_root }}/mwan/config/modules-load.conf"
        dest: /etc/modules-load.d/mwan-firewall.conf
        mode: "0644"

    - name: Load gateway firewall modules before the daemon starts
      ansible.builtin.command:
        argv:
          - modprobe
          - "{{ item }}"
      loop: "{{ lookup('file', repo_root ~ '/mwan/config/modules-load.conf').splitlines() }}"
      changed_when: false

    - name: Create MWAN runtime config directory
      ansible.builtin.file:
        path: /etc/mwan
        state: directory
        mode: "0755"

    # The controller renders the network document before any gateway write. The
    # released loader validates the document on the Proxmox delegate. Validation
    # runs in check mode because the check must reject an invalid deployment too.
    - name: Ensure the controller render directory exists
      delegate_to: localhost
      become: false
      ansible.builtin.file:
        path: "{{ repo_root }}/.cache"
        state: directory
        mode: "0755"
      when: mwan_ifmgr_wan_enabled | bool
      check_mode: false

    - name: Render the MWAN network configuration on the controller
      delegate_to: localhost
      become: false
      ansible.builtin.template:
        src: "{{ repo_root }}/mwan/config/network.json.j2"
        dest: "{{ mwan_network_json_local }}"
        mode: "0600"
      when: mwan_ifmgr_wan_enabled | bool
      check_mode: false

    # The pinned binary prints its embedded schema and validates the rendered
    # document in one temporary directory. The loader performs schema validation
    # before it checks group-wide and provider-specific rules. Cleanup runs after
    # both successful and rejected documents.
    - name: Validate the rendered network configuration with the released loader
      block:
        - name: Create a schema directory on the Proxmox delegate
          delegate_to: "{{ mwan_proxmox_delegate }}"
          ansible.builtin.tempfile:
            state: directory
            suffix: -mwan-schema
          register: mwan_schema_remote
          check_mode: false

        - name: Print the released schema on the Proxmox delegate
          delegate_to: "{{ mwan_proxmox_delegate }}"
          ansible.builtin.command:
            argv:
              - /usr/local/sbin/mwan-deploy-gate
              - install
              - --print-schema
              - "{{ mwan_schema_remote.path }}"
          changed_when: false
          check_mode: false

        - name: Copy the rendered network configuration to the Proxmox delegate
          delegate_to: "{{ mwan_proxmox_delegate }}"
          ansible.builtin.copy:
            src: "{{ mwan_network_json_local }}"
            dest: "{{ mwan_schema_remote.path }}/network.json"
            mode: "0600"
          check_mode: false

        - name: Run the released loader against the rendered network configuration
          delegate_to: "{{ mwan_proxmox_delegate }}"
          ansible.builtin.command:
            argv:
              - /usr/local/sbin/mwan-deploy-gate
              - deploy-gate
              - check-network
              - "{{ mwan_schema_remote.path }}/network.json"
              - "{{ mwan_schema_remote.path }}"
          changed_when: false
          check_mode: false

        - name: Check the rendered firewall in a private network namespace
          delegate_to: "{{ mwan_proxmox_delegate }}"
          ansible.builtin.command:
            argv:
              - /usr/local/sbin/mwan-deploy-gate
              - deploy-gate
              - check-firewall
              - "{{ mwan_schema_remote.path }}/network.json"
              - "{{ mwan_schema_remote.path }}"
          changed_when: false
          check_mode: false
      always:
        - name: Remove the schema directory on the Proxmox delegate
          delegate_to: "{{ mwan_proxmox_delegate }}"
          ansible.builtin.file:
            path: "{{ mwan_schema_remote.path }}"
            state: absent
          when:
            - mwan_schema_remote is defined
            - mwan_schema_remote.path is defined
          check_mode: false
      when: mwan_ifmgr_wan_enabled | bool

    # The management stack installs after the released loader accepts the
    # document. A rejected document stops the play before this installation.
    # The first play unpacked this bundle beside the binary.
    - name: Install the wanconfig management stack
      ansible.builtin.import_tasks: tasks/mwan-vm/wanconfig-stack.yml
      become: true
      vars:
        wanconfig_deb_dir: "/var/lib/mwan-wanconfig/debs/{{ mwan_release_tag }}"
        # The rousette package ships the models its RESTCONF contract needs.
        wanconfig_rousette_yang_dir: /opt/mwan-wanconfig/share/yang/modules/rousette

    - name: Deploy MWAN runtime environment file
      ansible.builtin.template:
        src: "{{ repo_root }}/mwan/config/mwan.env.j2"
        dest: /etc/mwan/mwan.env
        mode: "0644"

    # The mwan-agent and mwan-ifmgr units load this file via EnvironmentFile=.
    # SMTP2GO_API_KEY is read by internal/config/config.go and overrides the
    # smtp2go_api_key field in /etc/mwan/config.toml when set.
    - name: Deploy MWAN secrets environment file
      ansible.builtin.copy:
        dest: /etc/mwan/secrets.env
        content: |
          SMTP2GO_API_KEY={{ vault_smtp2go_api_key }}
        owner: root
        group: root
        mode: "0640"
      no_log: true
      notify: Restart mwan-ifmgr@wan

    - name: Current testbed OPNsense web certificate is available for hairpin CA trust
      delegate_to: "{{ mwan_proxmox_delegate }}"
      ansible.builtin.command:
        argv:
          - qm
          - guest
          - exec
          - "{{ service_mapping.opnsense_suburban.vmid }}"
          - --
          - openssl
          - x509
          - -in
          - /usr/local/etc/lighttpd_webgui/cert.pem
          - -outform
          - PEM
      register: mwan_nptv6_hairpin_certificate
      changed_when: false
      check_mode: false
      when: mwan_environment == 'testbed'

    - name: Verify the testbed OPNsense web certificate read
      vars:
        certificate_result: "{{ mwan_nptv6_hairpin_certificate.stdout | from_json }}"
      ansible.builtin.assert:
        that:
          - certificate_result.exited == 1
          - certificate_result.exitcode == 0
          - certificate_result['out-truncated'] == 0
          - certificate_result['out-data'].startswith('-----BEGIN CERTIFICATE-----')
          - certificate_result['out-data'].strip().endswith('-----END CERTIFICATE-----')
      when: mwan_environment == 'testbed'

    - name: Trust the testbed OPNsense API certificate for hairpin alias updates
      ansible.builtin.copy:
        content: "{{ (mwan_nptv6_hairpin_certificate.stdout | from_json)['out-data'] }}"
        dest: /etc/mwan/opnsense-testbed.pem
        owner: root
        group: root
        mode: "0644"
      when: mwan_environment == 'testbed'
      notify: Restart mwan-ifmgr@wan

    - name: Stage and activate MWAN role configuration
      ansible.builtin.include_tasks: tasks/stage-and-activate-mwan-roles.yml
      vars:
        mwan_role_staging_task_file: "{{ playbook_dir }}/tasks/stage-mwan-role-inputs.yml"

    - name: Transfer firewall ownership from nftables to mwan-ifmgr
      when:
        - mwan_ifmgr_wan_enabled | bool
        - not ansible_check_mode
      block:
        - name: Read the retired nftables service state
          ansible.builtin.command:
            argv:
              - systemctl
              - is-enabled
              - nftables.service
          register: mwan_nftables_enabled
          changed_when: false
          failed_when: false

        - name: Create nftables handoff drop-in directory
          ansible.builtin.file:
            path: /etc/systemd/system/nftables.service.d
            state: directory
            mode: "0755"
          when: mwan_nftables_enabled.stdout | trim != 'masked'

        - name: Preserve installed rules when stopping the retired nftables service
          ansible.builtin.copy:
            dest: /etc/systemd/system/nftables.service.d/99-mwan-handoff.conf
            mode: "0644"
            content: |
              [Service]
              ExecStop=
          when: mwan_nftables_enabled.stdout | trim != 'masked'

        - name: Load the nftables handoff drop-in
          ansible.builtin.systemd:
            daemon_reload: true
          when: mwan_nftables_enabled.stdout | trim != 'masked'

        - name: Read the nftables stop action before handoff
          ansible.builtin.command:
            argv:
              - systemctl
              - show
              - --property=ExecStop
              - --value
              - nftables.service
          register: mwan_nftables_stop_action
          changed_when: false
          when: mwan_nftables_enabled.stdout | trim != 'masked'

        - name: Require an empty nftables stop action before handoff
          ansible.builtin.assert:
            that:
              - mwan_nftables_stop_action.stdout | trim == ''
            fail_msg: nftables still has an ExecStop action that could clear gateway rules
          when: mwan_nftables_enabled.stdout | trim != 'masked'

        - name: Stop and disable the retired nftables service without deleting rules
          ansible.builtin.systemd:
            name: nftables
            state: stopped
            enabled: false
          when: mwan_nftables_enabled.stdout | trim != 'masked'

        - name: Read the retired nftables service activity
          ansible.builtin.command:
            argv:
              - systemctl
              - show
              - --property=ActiveState
              - --value
              - nftables.service
          register: mwan_nftables_activity
          changed_when: false

        - name: Require the retired nftables service to be inactive
          ansible.builtin.assert:
            that:
              - mwan_nftables_activity.stdout | trim == 'inactive'
            fail_msg: nftables remains active after the firewall handoff

        - name: Confirm gateway readiness after the nftables service stops
          ansible.builtin.systemd:
            name: mwan-ifmgr@wan
            state: started

        - name: Inspect the active gateway firewall after nftables stops
          ansible.builtin.command:
            argv:
              - /usr/local/bin/mwan
              - deploy-gate
              - inspect-firewall
              - /etc/mwan/network.json
              - /usr/local/share/wanconfig/yang
          register: mwan_firewall_inspect
          until: mwan_firewall_inspect.rc == 0
          retries: 30
          delay: 2
          changed_when: false

        - name: Mask the retired nftables service
          ansible.builtin.systemd:
            name: nftables
            masked: true

        - name: Remove the temporary nftables handoff drop-in
          ansible.builtin.file:
            path: /etc/systemd/system/nftables.service.d/99-mwan-handoff.conf
            state: absent

        - name: Remove the retired nftables service override
          ansible.builtin.file:
            path: /etc/systemd/system/nftables.service.d/override.conf
            state: absent

        - name: Remove the retired gateway ruleset file
          ansible.builtin.file:
            path: /etc/nftables.conf
            state: absent

        - name: Reload systemd after the nftables handoff
          ansible.builtin.systemd:
            daemon_reload: true

    # ============================================================================
    # POST-DEPLOY: Reboot for clean state
    # ============================================================================
    # All services are enabled and will start on boot.
    # Watchdog monitors post-reboot and auto-rolls back if connectivity fails.

    # A check run stops here, because every task below reboots the VM or reads
    # the verdict of a reboot, and a check run performs neither.
    - name: End a check run before the reboot
      ansible.builtin.meta: end_host
      when: ansible_check_mode

    - name: Deploy complete - scheduling reboot
      ansible.builtin.debug:
        msg: >-
          ✓ All configs deployed (traceId={{ mwan_deploy_trace_id }})
          ✓ Scheduling reboot in 5 seconds to apply changes cleanly
          ✓ Timestamp preserved: /var/lib/mwan/last-deploy
          ✓ Watchdog will monitor post-reboot and auto-rollback if needed

    # The gate proves the reboot by a boot_id change, so the pre-reboot value
    # must be captured while the guest still runs the old kernel.
    - name: Capture the pre-reboot boot id
      ansible.builtin.command:
        cmd: cat /proc/sys/kernel/random/boot_id
      register: mwan_pre_reboot_boot_id
      changed_when: false

    # Start observation before the reboot because the controller's route to
    # production rides the rebooting VM. Delegation reopens SSH per task, and
    # Ansible never retries UNREACHABLE.
    - name: Start hypervisor-local MWAN deploy gate before reboot
      delegate_to: "{{ mwan_proxmox_delegate }}"
      ansible.builtin.command:
        argv:
          - systemd-run
          - --unit
          - "mwan-deploy-gate-{{ mwan_deploy_trace_id }}"
          - --collect
          - /usr/local/sbin/mwan-deploy-gate
          - deploy-gate
          - wait-deploy
          - "{{ actual_vmid }}"
          - "{{ mwan_pre_reboot_boot_id.stdout | trim }}"
          - "180"
          - "180"
          - "{{ mwan_deploy_trace_id }}"
          - "/run/mwan-deploy-gate/{{ mwan_deploy_trace_id }}.json"
          - "{{ mwan_deploy_gate_families }}"
          - "{{ mwan_deploy_gate_consecutive_rounds }}"
          - "/run/mwan-deploy-gate/{{ mwan_deploy_trace_id }}-probe.json"
      changed_when: true

    # systemd owns the reboot timer, so the trigger survives the SSH session
    # teardown. The previous nohup-under-async form was reaped by the async
    # wrapper and never rebooted the VM.
    - name: Schedule reboot to apply all changes
      ansible.builtin.command:
        cmd: systemd-run --on-active=5 /usr/sbin/reboot
      changed_when: true

    # The controller collects the hypervisor-local verdict over raw SSH. No
    # connection to the delegate or VM occurs between reboot scheduling and
    # this task, so the outage cannot abort observation through Ansible.
    - name: Collect MWAN deploy verdict over raw SSH
      delegate_to: localhost
      become: false
      vars:
        mwan_gate_verdict_path: "/run/mwan-deploy-gate/{{ mwan_deploy_trace_id }}.json"
        mwan_gate_unit_name: "mwan-deploy-gate-{{ mwan_deploy_trace_id }}"
        mwan_gate_old_boot_id: "{{ mwan_pre_reboot_boot_id.stdout | trim }}"
        mwan_gate_argv: >-
          {{
            [
              playbook_dir ~ '/files/collect-deploy-verdict.sh',
              mwan_gate_verdict_path,
              mwan_gate_unit_name,
              mwan_deploy_trace_id,
              mwan_gate_old_boot_id,
              '480'
            ] + mwan_gate_collect_addresses
          }}
      ansible.builtin.command:
        argv: "{{ mwan_gate_argv }}"
      register: mwan_gate_collect
      failed_when: false
      changed_when: false

    - name: Parse collected MWAN deploy verdict
      ansible.builtin.set_fact:
        mwan_gate_verdict: "{{ mwan_gate_collect.stdout | from_json }}"
      when: mwan_gate_collect.rc == 0

    # A missing verdict means the controller cannot prove what happened. The
    # collector stderr identifies gate death, timeout, or invalid JSON. Do not
    # roll back a VM that may already run this deploy's configuration.
    - name: Fail when the MWAN deploy verdict could not be collected
      ansible.builtin.fail:
        msg: >-
          The MWAN deploy verdict could not be collected. Collector diagnostics:
          {{ mwan_gate_collect.stderr | trim }} {{ mwan_gate_collect.stdout | trim }}
          The VM still runs the config this deploy wrote, so no rollback was
          performed. The vault watchdog owns recovery.
      when: mwan_gate_collect.rc != 0

    # A VM that never rebooted still runs the config this deploy wrote, so
    # rolling it back would revert a healthy deploy. Fail without rollback.
    - name: Fail playbook when the scheduled reboot never fired
      ansible.builtin.fail:
        msg: >-
          The boot id of VM {{ actual_vmid }} never changed within 180s,
          observed from {{ mwan_proxmox_delegate }}, and the guest was still
          answering with the old boot id, so the scheduled reboot never
          fired. The VM still runs the config this deploy wrote, so no
          rollback was performed.
      when: mwan_gate_verdict.reboot_rc == 1

    # Delegated rollback tasks open fresh SSH connections because the ControlPersist
    # master died with the tunnel. A delegate reachable only out-of-band makes these
    # tasks abort UNREACHABLE, which is the loud-failure path; the vault watchdog owns
    # recovery.
    - name: Stop MWAN VM for rollback after failed health gate
      delegate_to: "{{ mwan_proxmox_delegate }}"
      ansible.builtin.command:
        cmd: qm stop {{ actual_vmid }}
      when:
        - mwan_gate_verdict.egress_rc != 0
        - mwan_gate_verdict.egress_rc != -1
        - mwan_pre_deploy_snapshot_name is defined
      changed_when: true

    - name: Rollback MWAN VM to pre-deploy snapshot
      delegate_to: "{{ mwan_proxmox_delegate }}"
      ansible.builtin.command:
        cmd: >-
          qm rollback {{ actual_vmid }} {{ mwan_pre_deploy_snapshot_name }}
      when:
        - mwan_gate_verdict.egress_rc != 0
        - mwan_gate_verdict.egress_rc != -1
        - mwan_pre_deploy_snapshot_name is defined
      changed_when: true

    - name: Start MWAN VM after rollback
      delegate_to: "{{ mwan_proxmox_delegate }}"
      ansible.builtin.command:
        cmd: qm start {{ actual_vmid }}
      when:
        - mwan_gate_verdict.egress_rc != 0
        - mwan_gate_verdict.egress_rc != -1
        - mwan_pre_deploy_snapshot_name is defined
      changed_when: true

    - name: Fail playbook after rollback
      ansible.builtin.fail:
        msg: >-
          Address-family egress checks ({{ mwan_deploy_gate_families }}) failed to pass
          {{ mwan_deploy_gate_consecutive_rounds }} consecutive rounds within
          180 seconds after reboot. {{ mwan_proxmox_delegate }} ran the probes
          and restored the VM from {{ mwan_pre_deploy_snapshot_name }}.
      when:
        - mwan_gate_verdict.egress_rc != 0
        - mwan_gate_verdict.egress_rc != -1
        - mwan_pre_deploy_snapshot_name is defined

    - name: Fail when health gate failed without rollback snapshot
      ansible.builtin.fail:
        msg: >-
          The egress gate did not record {{ mwan_deploy_gate_consecutive_rounds }}
          consecutive successful rounds for address families
          {{ mwan_deploy_gate_families }} within 180 seconds after reboot.
          No pre-deploy snapshot exists because connectivity was already broken
          before deployment. Restore the VM manually.
      when:
        - mwan_gate_verdict.egress_rc != 0
        - mwan_gate_verdict.egress_rc != -1
        - mwan_pre_deploy_snapshot_name is not defined

    # The gate checks owned addresses only after egress passed, inside the
    # guest through its agent. A gateway that forwards traffic but does not
    # hold an on-link mapped address has lost inbound reachability for that
    # address, not egress, and rollback is reserved for lost egress, so the
    # play fails and leaves the VM running this deploy's configuration. The
    # gate itself emails the alert from the hypervisor through the notify
    # settings that host's configuration carries, and its unit log records
    # whether the send went out.
    - name: Fail when a provider link does not hold its mapped addresses
      ansible.builtin.fail:
        msg: >-
          Egress returned, but within 60s a provider link in VM
          {{ actual_vmid }} still did not hold every mapped address inside its
          connected subnet. The VM still runs the config this deploy wrote,
          and no rollback was performed. The deploy gate on
          {{ mwan_proxmox_delegate }} emailed an alert. Run
          `mwan deploy-gate check-owned-addresses` on the gateway to list the
          missing addresses.
      when:
        - mwan_gate_verdict.egress_rc == 0
        - mwan_gate_verdict.owned_rc != 0

    - name: Playbook complete
      ansible.builtin.debug:
        msg: >-
          Deploy playbook complete. The MWAN VM reboot verdict completed, the
          egress verdict passed, and every provider link holds its on-link
          mapped addresses. The verdict file was collected over raw SSH.
          Monitor watchdog logs on {{ mwan_proxmox_delegate }}.
      when:
        - mwan_gate_verdict.reboot_rc in [0, 2]
        - mwan_gate_verdict.egress_rc == 0
        - mwan_gate_verdict.owned_rc == 0

  handlers:
    - name: Reload networkd
      ansible.builtin.include_tasks: tasks/reload-mwan-networkd.yml

    - name: Restart wpa_supplicant
      ansible.builtin.systemd:
        name: wpa_supplicant-mwan
        state: restarted
        daemon_reload: true

    - name: Restart cloudflared
      ansible.builtin.systemd:
        name: cloudflared
        state: restarted
        daemon_reload: true

    # Handlers run in definition order, so the management services the
    # daemon publishes into restart before the daemon does.
    - name: Restart rousette
      ansible.builtin.systemd:
        name: rousette
        state: restarted
        daemon_reload: true

    - name: Restart nghttpx-wanconfig
      ansible.builtin.systemd:
        name: nghttpx-wanconfig
        state: restarted
        daemon_reload: true

    - name: Restart mwan-ifmgr@wan
      ansible.builtin.include_tasks: tasks/restart-mwan-ifmgr.yml
      vars:
        mwan_ifmgr_restart_timeout_seconds: 120
      when: mwan_ifmgr_wan_enabled | bool

# The MWAN failover LXC is configured by deploy-mwan-failover.yml,
# targeting mwan_failover_servers (prod) or mwan_failover_suburban_servers
# (testbed).
#
# Suburban-specific host work (MWAN VM args, ISP LXCs, OPNsense host bridge)
# lives in deploy-testbed.yml.
