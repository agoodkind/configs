---
# ============================================================================
# MWAN Multi-WAN Load Balancer Deployment
# ============================================================================
# Deploys mwan VM for multi-WAN load balancing with PCI passthrough
#   - X710 VF (trust mode) for AT&T 802.1X authentication
#   - I226-V NIC for Webpass (full passthrough to avoid MAC issues)
#   - Virtio for management and OPNsense link
#
# Required: VF must be created on Proxmox host first (x710-vf-setup.service)
# ============================================================================

# MWAN VM membership in mwan_servers and mwan_suburban_servers is provided by
# service_mapping.yml, so no localhost add_host bootstrap is needed here. The
# MWAN failover LXC lives in mwan_failover_servers or mwan_failover_suburban_servers
# and is configured by deploy-mwan-failover.yml.

# The release this playbook installs is pinned in the environment's group_vars.
# This play pulls it onto the controller before any host is touched, so a bad
# pin fails first. It opens no connection.
- name: Pull the pinned mwan release onto the controller
  hosts: mwan_servers:mwan_suburban_servers
  gather_facts: false
  become: false
  pre_tasks:
    - name: Require a merged controller checkout
      ansible.builtin.import_tasks: tasks/require-merged-checkout.yml
  tasks:
    - name: Pull the pinned mwan release
      ansible.builtin.import_tasks: tasks/github-release.yml
      vars:
        release_repo: "{{ mwan_release_repo }}"
        release_tag: "{{ mwan_release_tag }}"
        release_assets: "{{ mwan_release_assets }}"
        release_required_assets:
          - mwan_linux_amd64.tar.gz
          - wanconfig-stack_linux_amd64.tar.gz
        release_var_prefix: mwan

- name: Verify MWAN guest preparation
  ansible.builtin.import_playbook: require-prepared-guests.yml
  vars:
    target_hosts: mwan_servers:mwan_suburban_servers

- name: Configure MWAN VM
  hosts: mwan_servers:mwan_suburban_servers
  become: false
  environment:
    DEBIAN_FRONTEND: noninteractive
    NEEDRESTART_MODE: l
  vars:
    mwan_config_dir: /etc/mwan
    mwan_role_job_timeout_seconds: 120
    mwan_core_runtime_activated: false
    repo_root: "{{ playbook_dir | dirname | dirname }}"
    # The controller renders one network document per host. The released loader
    # validates these exact bytes before the deploy installs the MWAN management stack.
    mwan_network_json_local: "{{ mwan_controller_artifact_root }}/network-{{ inventory_hostname }}.json"

  tasks:
    - name: Generate deploy trace ID (early)
      ansible.builtin.set_fact:
        mwan_deploy_trace_id: "{{ lookup('pipe', 'date +%Y%m%d-%H%M%S') }}-deploy-{{ 999999 | random }}"

    - name: Ensure MWAN trace state directory exists
      ansible.builtin.file:
        path: /var/lib/mwan
        state: directory
        mode: "0755"
      changed_when: false
      failed_when: false

    - name: Write deploy trace ID file (run)
      ansible.builtin.copy:
        dest: /run/mwan-trace-id
        content: "{{ mwan_deploy_trace_id }}\n"
        mode: "0644"
      changed_when: false
      failed_when: false

    - name: Write deploy trace ID file (persistent)
      ansible.builtin.copy:
        dest: /var/lib/mwan/trace-id
        content: "{{ mwan_deploy_trace_id }}\n"
        mode: "0644"
      changed_when: false
      failed_when: false

    - name: Verify Debian
      ansible.builtin.assert:
        that:
          - ansible_os_family == "Debian"
        fail_msg: >-
          This playbook requires Debian.
          Found: {{ ansible_os_family | default('unknown') }}
        success_msg: >-
          ✓ {{ ansible_distribution }}
          {{ ansible_distribution_version }}

    # The lookup runs under check mode too, because `qm list` only reads and
    # every later task that names the guest reads its id from this result.
    - name: Get actual VMID from Proxmox
      delegate_to: "{{ mwan_proxmox_delegate }}"
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          qm list | awk '$2 == "{{ inventory_hostname }}" {print $1}'
        executable: /bin/bash
      register: vmid_lookup
      changed_when: false
      failed_when: vmid_lookup.stdout | length == 0
      check_mode: false

    - name: Set actual VMID
      ansible.builtin.set_fact:
        actual_vmid: "{{ vmid_lookup.stdout | trim }}"
        mwan_vmid: "{{ vmid_lookup.stdout | trim }}" # Override group_vars

    - name: Discover MWAN VM runtime network (MACs)
      ansible.builtin.include_tasks: tasks/mwan-vm/discover-runtime-network.yml

    # ============================================================================
    # PRE-DEPLOY: Auto-rollback setup
    # ============================================================================

    # The deploy gates use the pinned mwan release on the Proxmox delegate. Check
    # mode also copies this binary so validation never uses an older helper. The
    # dedicated filename leaves the watchdog binary unchanged. The first play
    # downloaded and verified the release under mwan_release_dir.
    - name: Push the deploy-gate binary to the Proxmox delegate
      delegate_to: "{{ mwan_proxmox_delegate }}"
      ansible.builtin.copy:
        src: "{{ mwan_release_dir }}/linux_amd64/mwan"
        dest: /usr/local/sbin/mwan-deploy-gate
        mode: "0755"
      check_mode: false

    - name: Verify the deploy-gate binary is the released commit
      delegate_to: "{{ mwan_proxmox_delegate }}"
      ansible.builtin.import_tasks: tasks/verify-mwan-release.yml
      vars:
        mwan_installed_binary: /usr/local/sbin/mwan-deploy-gate

    - name: Ensure the hypervisor deploy-gate directory exists
      delegate_to: "{{ mwan_proxmox_delegate }}"
      ansible.builtin.file:
        path: /run/mwan-deploy-gate
        state: directory
        mode: "0700"
      check_mode: false

    - name: Ensure persistent mwan state directory exists
      ansible.builtin.file:
        path: /var/lib/mwan
        state: directory
        owner: root
        group: root
        mode: "0755"

    # ============================================================================
    # WATCHDOG: Proxmox-host watchdog config + binary deploy live in
    # deploy-proxmox.yml / tasks/proxmox-host.yml. The mwan binary was pulled
    # from the pinned release by the first play and pushed to the Proxmox
    # delegate in the pre-deploy section above, before the first deploy gate.
    # ============================================================================

    # ============================================================================
    # DEPLOY: MWAN configuration on the MWAN VM
    # ============================================================================

    # The controller renders the network document before any gateway write. The
    # released loader validates the document on the Proxmox delegate. Validation
    # runs in check mode because the check must reject an invalid deployment too.
    - name: Ensure the controller render directory exists
      delegate_to: localhost
      become: false
      ansible.builtin.file:
        path: "{{ mwan_controller_artifact_root }}"
        state: directory
        mode: "0755"
      when: mwan_ifmgr_wan_enabled | bool
      check_mode: false

    - name: Render the MWAN network configuration on the controller
      delegate_to: localhost
      become: false
      ansible.builtin.template:
        src: "{{ repo_root }}/mwan/config/network.json.j2"
        dest: "{{ mwan_network_json_local }}"
        mode: "0600"
      when: mwan_ifmgr_wan_enabled | bool
      check_mode: false

    # The pinned binary prints its embedded schema and validates the rendered
    # document in one temporary directory. The loader performs schema validation
    # before it checks group-wide and provider-specific rules. Cleanup runs after
    # both successful and rejected documents.
    - name: Validate the rendered network configuration with the released loader
      block:
        - name: Create a schema directory on the Proxmox delegate
          delegate_to: "{{ mwan_proxmox_delegate }}"
          ansible.builtin.tempfile:
            state: directory
            suffix: -mwan-schema
          register: mwan_schema_remote
          check_mode: false

        - name: Print the released schema on the Proxmox delegate
          delegate_to: "{{ mwan_proxmox_delegate }}"
          ansible.builtin.command:
            argv:
              - /usr/local/sbin/mwan-deploy-gate
              - install
              - --print-schema
              - "{{ mwan_schema_remote.path }}"
          changed_when: false
          check_mode: false

        - name: Copy the rendered network configuration to the Proxmox delegate
          delegate_to: "{{ mwan_proxmox_delegate }}"
          ansible.builtin.copy:
            src: "{{ mwan_network_json_local }}"
            dest: "{{ mwan_schema_remote.path }}/network.json"
            mode: "0600"
          check_mode: false

        - name: Run the released loader against the rendered network configuration
          delegate_to: "{{ mwan_proxmox_delegate }}"
          ansible.builtin.command:
            argv:
              - /usr/local/sbin/mwan-deploy-gate
              - deploy-gate
              - check-network
              - "{{ mwan_schema_remote.path }}/network.json"
              - "{{ mwan_schema_remote.path }}"
          changed_when: false
          check_mode: false

        - name: Check the rendered firewall in a private network namespace
          delegate_to: "{{ mwan_proxmox_delegate }}"
          ansible.builtin.command:
            argv:
              - /usr/local/sbin/mwan-deploy-gate
              - deploy-gate
              - check-firewall
              - "{{ mwan_schema_remote.path }}/network.json"
              - "{{ mwan_schema_remote.path }}"
          changed_when: false
          check_mode: false
      always:
        - name: Remove the schema directory on the Proxmox delegate
          delegate_to: "{{ mwan_proxmox_delegate }}"
          ansible.builtin.file:
            path: "{{ mwan_schema_remote.path }}"
            state: absent
          when:
            - mwan_schema_remote is defined
            - mwan_schema_remote.path is defined
          check_mode: false
      when: mwan_ifmgr_wan_enabled | bool

    - name: Prepare the exact connection transfer before operation rendering
      ansible.builtin.include_tasks: tasks/prepare-mwan-connection-transfer.yml
      when:
        - mwan_ifmgr_wan_enabled | bool
        - not mwan_bootstrap_guest | bool
        - not ansible_check_mode

    - name: Install the matching autonomous hypervisor watchdog
      delegate_to: "{{ mwan_proxmox_delegate }}"
      ansible.builtin.copy:
        src: "{{ mwan_release_dir }}/linux_amd64/mwan"
        dest: /usr/local/bin/mwan
        mode: "0755"
      register: mwan_operation_watchdog_binary
      check_mode: false

    - name: Verify the autonomous hypervisor watchdog release
      delegate_to: "{{ mwan_proxmox_delegate }}"
      ansible.builtin.import_tasks: tasks/verify-mwan-release.yml
      vars:
        mwan_installed_binary: /usr/local/bin/mwan

    - name: Start the matching hypervisor watchdog before arming preparation
      delegate_to: "{{ mwan_proxmox_delegate }}"
      ansible.builtin.systemd:
        name: "{{ mwan_watchdog_service_name }}"
        state: "{{ 'restarted' if mwan_operation_watchdog_binary is changed else 'started' }}"
      when: not ansible_check_mode

    - name: Define the exact pre-deployment snapshot
      ansible.builtin.set_fact:
        mwan_pre_deploy_snapshot_name: "pre-deploy-{{ mwan_deploy_trace_id }}"

    - name: Create the exact snapshot before gateway preparation
      delegate_to: "{{ mwan_proxmox_delegate }}"
      ansible.builtin.command:
        argv:
          - qm
          - snapshot
          - "{{ actual_vmid }}"
          - "{{ mwan_pre_deploy_snapshot_name }}"
          - --description
          - "MWAN deployment {{ mwan_deploy_trace_id }}"
      changed_when: true
      when:
        - not mwan_bootstrap_guest | bool
        - not ansible_check_mode

    - name: Arm preparation and activation observation before gateway writes
      ansible.builtin.include_tasks: tasks/arm-mwan-operation.yml
      when: not mwan_bootstrap_guest | bool

    - name: Apply the protected gateway upgrade
      block:
        - name: Authorize the deployment timestamp write
          ansible.builtin.include_tasks: tasks/mwan-operation-checkpoint.yml
          vars:
            mwan_operation_phase: gateway-preparation

        - name: Write deploy timestamp to MWAN VM
          timeout: "{{ mwan_operation_task_timeout_seconds }}"
          ansible.builtin.copy:
            content: "{{ ansible_date_time.epoch }}"
            dest: /var/lib/mwan/last-deploy
            owner: root
            group: root
            mode: "0644"

        - name: Install and configure cloudflared
          ansible.builtin.include_tasks: tasks/install-cloudflared.yml
          vars:
            cloudflared_token: "{{ vault_mwan_cloudflared_token }}"
            deployment_prewrite_checkpoint_task: "{{ playbook_dir }}/tasks/mwan-operation-checkpoint.yml"
            deployment_mutation_timeout_seconds: "{{ mwan_operation_task_timeout_seconds }}"
            mwan_operation_phase: cloudflared-configuration

        - name: Wait for the controller connection after cloudflared starts
          ansible.builtin.include_tasks: tasks/wait-for-connection.yml

        - name: Authorize the next gateway mutation
          ansible.builtin.include_tasks: tasks/mwan-operation-checkpoint.yml
          vars:
            mwan_operation_phase: gateway-preparation

        - name: Install required packages
          timeout: "{{ mwan_operation_task_timeout_seconds }}"
          async: "{{ mwan_operation_task_timeout_seconds }}"
          poll: 5
          ansible.builtin.apt:
            name:
              - wpasupplicant
              - nftables
              - iproute2
              - iptables
              - bash
              - curl
              - jq
              - vlan
              - bridge-utils
              - networkd-dispatcher
              - telnet
              - sipcalc
              - ipcalc-ng
              - ipcalc
              - ipv6calc
              - fping
              - conntrack
            state: present

        - name: Wait for the controller connection after network packages install
          ansible.builtin.include_tasks: tasks/wait-for-connection.yml

        - name: Authorize the next gateway mutation
          ansible.builtin.include_tasks: tasks/mwan-operation-checkpoint.yml
          vars:
            mwan_operation_phase: gateway-preparation

        - name: Declare gateway firewall modules for boot
          timeout: "{{ mwan_operation_task_timeout_seconds }}"
          ansible.builtin.copy:
            src: "{{ repo_root }}/mwan/config/modules-load.conf"
            dest: /etc/modules-load.d/mwan-firewall.conf
            mode: "0644"

        - name: Load gateway firewall modules before the daemon starts
          ansible.builtin.command:
            argv:
              - modprobe
              - "{{ item }}"
          loop: "{{ lookup('file', repo_root ~ '/mwan/config/modules-load.conf').splitlines() }}"
          changed_when: false

        - name: Authorize the next gateway mutation
          ansible.builtin.include_tasks: tasks/mwan-operation-checkpoint.yml
          vars:
            mwan_operation_phase: gateway-preparation

        - name: Create MWAN runtime config directory
          timeout: "{{ mwan_operation_task_timeout_seconds }}"
          ansible.builtin.file:
            path: /etc/mwan
            state: directory
            mode: "0755"

        - name: Capture and adopt the original producer before input replacement
          ansible.builtin.include_tasks: tasks/adopt-mwan-legacy-npt.yml
          when:
            - not mwan_bootstrap_guest | bool
            - not ansible_check_mode
            - mwan_legacy_npt_adoption_needed | bool

        # The management stack installs after the released loader accepts the
        # document. A rejected document stops the play before this installation.
        # The first play unpacked this bundle beside the binary.
        - name: Install the wanconfig management stack
          when: ansible_check_mode or mwan_bootstrap_guest | bool
            or not mwan_legacy_npt_adoption_needed | bool
          ansible.builtin.import_tasks: tasks/mwan-vm/wanconfig-stack.yml
          become: true
          vars:
            mwan_install_operation_phase: gateway-preparation
            mwan_install_reuse_lease: false
            wanconfig_deb_dir: "/var/lib/mwan-wanconfig/debs/{{ mwan_release_tag }}"
            # The rousette package ships the models its RESTCONF contract needs.
            wanconfig_rousette_yang_dir: /opt/mwan-wanconfig/share/yang/modules/rousette

        - name: Install RESTCONF schemas after normal WAN activation
          ansible.builtin.include_tasks: tasks/mwan-vm/wanconfig-models.yml
          vars:
            mwan_install_operation_phase: gateway-preparation
            mwan_install_reuse_lease: false
            wanconfig_rousette_yang_dir: /opt/mwan-wanconfig/share/yang/modules/rousette
          when:
            - not ansible_check_mode
            - not mwan_bootstrap_guest | bool
            - mwan_legacy_npt_adoption_needed | bool

        - name: Install the normal daemon runtime environment
          ansible.builtin.include_tasks: tasks/install-mwan-runtime-environment.yml
          vars:
            mwan_install_operation_phase: gateway-preparation
            mwan_install_reuse_lease: false
            mwan_install_notify_wan: true
          when: ansible_check_mode or mwan_bootstrap_guest | bool
            or not mwan_legacy_npt_adoption_needed | bool

        - name: Stage and activate MWAN role configuration
          ansible.builtin.include_tasks: tasks/stage-and-activate-mwan-roles.yml
          vars:
            mwan_role_staging_task_file: "{{ playbook_dir }}/tasks/stage-mwan-role-inputs.yml"

        - name: Transfer firewall ownership from nftables to mwan-ifmgr
          when:
            - mwan_ifmgr_wan_enabled | bool
            - not ansible_check_mode
          block:
            - name: Read the retired nftables service state
              ansible.builtin.command:
                argv:
                  - systemctl
                  - is-enabled
                  - nftables.service
              register: mwan_nftables_enabled
              changed_when: false
              failed_when: false

            - name: Authorize the next gateway mutation
              ansible.builtin.include_tasks: tasks/mwan-operation-checkpoint.yml
              vars:
                mwan_operation_phase: gateway-preparation

            - name: Create nftables handoff drop-in directory
              timeout: "{{ mwan_operation_task_timeout_seconds }}"
              ansible.builtin.file:
                path: /etc/systemd/system/nftables.service.d
                state: directory
                mode: "0755"
              when: mwan_nftables_enabled.stdout | trim != 'masked'

            - name: Authorize the next gateway mutation
              ansible.builtin.include_tasks: tasks/mwan-operation-checkpoint.yml
              vars:
                mwan_operation_phase: gateway-preparation

            - name: Preserve installed rules when stopping the retired nftables service
              timeout: "{{ mwan_operation_task_timeout_seconds }}"
              ansible.builtin.copy:
                dest: /etc/systemd/system/nftables.service.d/99-mwan-handoff.conf
                mode: "0644"
                content: |
                  [Service]
                  ExecStop=
              when: mwan_nftables_enabled.stdout | trim != 'masked'

            - name: Authorize the next gateway mutation
              ansible.builtin.include_tasks: tasks/mwan-operation-checkpoint.yml
              vars:
                mwan_operation_phase: gateway-preparation

            - name: Load the nftables handoff drop-in
              timeout: "{{ mwan_operation_task_timeout_seconds }}"
              async: "{{ mwan_operation_task_timeout_seconds }}"
              poll: 5
              ansible.builtin.systemd:
                daemon_reload: true
              when: mwan_nftables_enabled.stdout | trim != 'masked'

            - name: Read the nftables stop action before handoff
              ansible.builtin.command:
                argv:
                  - systemctl
                  - show
                  - --property=ExecStop
                  - --value
                  - nftables.service
              register: mwan_nftables_stop_action
              changed_when: false
              when: mwan_nftables_enabled.stdout | trim != 'masked'

            - name: Require an empty nftables stop action before handoff
              ansible.builtin.assert:
                that:
                  - mwan_nftables_stop_action.stdout | trim == ''
                fail_msg: nftables still has an ExecStop action that could clear gateway rules
              when: mwan_nftables_enabled.stdout | trim != 'masked'

            - name: Authorize the next gateway mutation
              ansible.builtin.include_tasks: tasks/mwan-operation-checkpoint.yml
              vars:
                mwan_operation_phase: gateway-preparation

            - name: Stop and disable the retired nftables service without deleting rules
              timeout: "{{ mwan_operation_task_timeout_seconds }}"
              async: "{{ mwan_operation_task_timeout_seconds }}"
              poll: 5
              ansible.builtin.systemd:
                name: nftables
                state: stopped
                enabled: false
              when: mwan_nftables_enabled.stdout | trim != 'masked'

            - name: Read the retired nftables service activity
              ansible.builtin.command:
                argv:
                  - systemctl
                  - show
                  - --property=ActiveState
                  - --value
                  - nftables.service
              register: mwan_nftables_activity
              changed_when: false

            - name: Require the retired nftables service to be inactive
              ansible.builtin.assert:
                that:
                  - mwan_nftables_activity.stdout | trim == 'inactive'
                fail_msg: nftables remains active after the firewall handoff

            - name: Authorize the next gateway mutation
              ansible.builtin.include_tasks: tasks/mwan-operation-checkpoint.yml
              vars:
                mwan_operation_phase: gateway-preparation

            - name: Confirm gateway readiness after the nftables service stops
              timeout: "{{ mwan_operation_task_timeout_seconds }}"
              async: "{{ mwan_operation_task_timeout_seconds }}"
              poll: 5
              ansible.builtin.systemd:
                name: mwan-ifmgr@wan
                state: started

            - name: Inspect the active gateway firewall after nftables stops
              ansible.builtin.command:
                argv:
                  - /usr/local/bin/mwan
                  - deploy-gate
                  - inspect-firewall
                  - /etc/mwan/network.json
                  - /usr/local/share/wanconfig/yang
              register: mwan_firewall_inspect
              until: mwan_firewall_inspect.rc == 0
              retries: 30
              delay: 2
              changed_when: false

            - name: Authorize the next gateway mutation
              ansible.builtin.include_tasks: tasks/mwan-operation-checkpoint.yml
              vars:
                mwan_operation_phase: gateway-preparation

            - name: Mask the retired nftables service
              timeout: "{{ mwan_operation_task_timeout_seconds }}"
              async: "{{ mwan_operation_task_timeout_seconds }}"
              poll: 5
              ansible.builtin.systemd:
                name: nftables
                masked: true

            - name: Authorize the next gateway mutation
              ansible.builtin.include_tasks: tasks/mwan-operation-checkpoint.yml
              vars:
                mwan_operation_phase: gateway-preparation

            - name: Remove the temporary nftables handoff drop-in
              timeout: "{{ mwan_operation_task_timeout_seconds }}"
              ansible.builtin.file:
                path: /etc/systemd/system/nftables.service.d/99-mwan-handoff.conf
                state: absent

            - name: Authorize the next gateway mutation
              ansible.builtin.include_tasks: tasks/mwan-operation-checkpoint.yml
              vars:
                mwan_operation_phase: gateway-preparation

            - name: Remove the retired nftables service override
              timeout: "{{ mwan_operation_task_timeout_seconds }}"
              ansible.builtin.file:
                path: /etc/systemd/system/nftables.service.d/override.conf
                state: absent

            - name: Authorize the next gateway mutation
              ansible.builtin.include_tasks: tasks/mwan-operation-checkpoint.yml
              vars:
                mwan_operation_phase: gateway-preparation

            - name: Remove the retired gateway ruleset file
              timeout: "{{ mwan_operation_task_timeout_seconds }}"
              ansible.builtin.file:
                path: /etc/nftables.conf
                state: absent

            - name: Authorize the next gateway mutation
              ansible.builtin.include_tasks: tasks/mwan-operation-checkpoint.yml
              vars:
                mwan_operation_phase: gateway-preparation

            - name: Reload systemd after the nftables handoff
              timeout: "{{ mwan_operation_task_timeout_seconds }}"
              async: "{{ mwan_operation_task_timeout_seconds }}"
              poll: 5
              ansible.builtin.systemd:
                daemon_reload: true

        # ============================================================================
        # POST-DEPLOY: Reboot for clean state
        # ============================================================================
        # All services are enabled and will start on boot.
        # Watchdog monitors post-reboot and auto-rolls back if connectivity fails.

        # A check run stops here, because every task below reboots the VM or reads
        # the verdict of a reboot, and a check run performs neither.
        - name: End a check run before the reboot
          ansible.builtin.meta: end_host
          when: ansible_check_mode

        - name: Release the final preparation mutation lease
          ansible.builtin.include_tasks: tasks/mwan-operation-checkpoint.yml
          vars:
            mwan_operation_acquire: false
            mwan_operation_phase: preparation-complete

        - name: Capture the pre-reboot boot identity
          ansible.builtin.command:
            argv: [cat, /proc/sys/kernel/random/boot_id]
          register: mwan_pre_reboot_boot_id
          changed_when: false

        - name: Acquire the bounded reboot mutation lease
          ansible.builtin.include_tasks: tasks/mwan-operation-checkpoint.yml
          vars:
            mwan_operation_phase: reboot
            mwan_operation_budget_seconds: "{{ mwan_operation_task_timeout_seconds | int * 2 + 375 + 30 }}"

        - name: Schedule the reboot independently of the SSH connection
          ansible.builtin.command:
            argv: [systemd-run, --on-active=5, /usr/sbin/reboot]
          timeout: "{{ mwan_operation_task_timeout_seconds }}"
          changed_when: true

        - name: Reconnect after the scheduled reboot
          vars:
            ansible_pipelining: true
          ansible.builtin.wait_for_connection:
            connect_timeout: 5
            delay: 15
            sleep: 5
            timeout: 360

        - name: Read the post-reboot boot identity
          timeout: "{{ mwan_operation_task_timeout_seconds }}"
          ansible.builtin.command:
            argv: [cat, /proc/sys/kernel/random/boot_id]
          register: mwan_post_reboot_boot_id
          changed_when: false

        - name: Require an actual gateway reboot
          ansible.builtin.assert:
            that:
              - mwan_post_reboot_boot_id.stdout | trim != mwan_pre_reboot_boot_id.stdout | trim
            fail_msg: The gateway boot identity did not change after scheduling its reboot.

        - name: Release the reboot lease without authorizing another mutation
          ansible.builtin.include_tasks: tasks/mwan-operation-checkpoint.yml
          vars:
            mwan_operation_acquire: false
            mwan_operation_phase: reboot-complete

        - name: Commit only the measured target identity and application replies
          delegate_to: "{{ mwan_proxmox_delegate }}"
          ansible.builtin.command:
            argv:
              - /usr/local/bin/mwan
              - deploy-gate
              - commit
              - "{{ mwan_deploy_trace_id }}"
              - "{{ mwan_operation_generation }}"
              - --config
              - /etc/mwan/config.toml
          changed_when: true
          when: mwan_operation_armed | bool

        - name: Record deployment commitment
          ansible.builtin.set_fact:
            mwan_operation_armed: false

      rescue:
        - name: Recover through the exact hypervisor deployment operation
          delegate_to: "{{ mwan_proxmox_delegate }}"
          ansible.builtin.command:
            argv:
              - /usr/local/bin/mwan
              - deploy-gate
              - recover
              - "{{ mwan_deploy_trace_id }}"
              - "{{ mwan_operation_generation }}"
              - --config
              - /etc/mwan/config.toml
          timeout: "{{ mwan_operation_recovery_timeout_seconds + mwan_operation_lease_seconds }}"
          changed_when: true
          when: mwan_operation_armed | bool

        - name: Reject the failed deployment after coordinated recovery
          ansible.builtin.fail:
            msg: >-
              Deployment failed at {{ ansible_failed_task.name }}.
              The hypervisor deployment operation owns snapshot recovery.


  handlers:
    - name: Reload networkd
      ansible.builtin.include_tasks: tasks/reload-mwan-networkd.yml

    - name: Restart wpa_supplicant
      ansible.builtin.include_tasks: tasks/restart-mwan-deployment-unit.yml
      vars:
        mwan_deployment_restart_unit: wpa_supplicant-mwan

    - name: Restart cloudflared
      ansible.builtin.include_tasks: tasks/restart-mwan-deployment-unit.yml
      vars:
        mwan_deployment_restart_unit: cloudflared

    # Handlers run in definition order, so the management services the
    # daemon publishes into restart before the daemon does.
    - name: Restart rousette
      ansible.builtin.include_tasks: tasks/restart-mwan-deployment-unit.yml
      vars:
        mwan_deployment_restart_unit: rousette

    - name: Restart nghttpx-wanconfig
      ansible.builtin.include_tasks: tasks/restart-mwan-deployment-unit.yml
      vars:
        mwan_deployment_restart_unit: nghttpx-wanconfig

    - name: Restart mwan-ifmgr@wan
      ansible.builtin.include_tasks: tasks/restart-mwan-ifmgr.yml
      vars:
        mwan_ifmgr_restart_timeout_seconds: 120
      when: mwan_ifmgr_wan_enabled | bool

# The MWAN failover LXC is configured by deploy-mwan-failover.yml,
# targeting mwan_failover_servers (prod) or mwan_failover_suburban_servers
# (testbed).
#
# Suburban-specific host work (MWAN VM args, ISP LXCs, OPNsense host bridge)
# lives in deploy-testbed.yml.
