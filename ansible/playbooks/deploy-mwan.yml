---
# ============================================================================
# MWAN Multi-WAN Load Balancer Deployment
# ============================================================================
# Deploys mwan VM for multi-WAN load balancing with PCI passthrough
#   - X710 VF (trust mode) for AT&T 802.1X authentication
#   - I226-V NIC for Webpass (full passthrough to avoid MAC issues)
#   - Virtio for management and OPNsense link
#
# Required: VF must be created on Proxmox host first (x710-vf-setup.service)
# ============================================================================

# MWAN VM membership in mwan_servers and mwan_suburban_servers is provided by
# service_mapping.yml, so no localhost add_host bootstrap is needed here. The
# MWAN failover LXC lives in mwan_failover_servers or mwan_failover_suburban_servers
# and is configured by deploy-mwan-failover.yml.

- name: Prepare MWAN VM (base packages, SSH keys, etc.)
  ansible.builtin.import_playbook: prep-guests.yml
  vars:
    target_hosts: mwan_servers:mwan_suburban_servers

- name: Configure MWAN VM
  hosts: mwan_servers:mwan_suburban_servers
  become: false
  environment:
    DEBIAN_FRONTEND: noninteractive
  vars:
    mwan_config_dir: /etc/mwan
    repo_root: "{{ playbook_dir | dirname | dirname }}"
    # The network configuration is rendered here first so the schema check runs
    # on the exact bytes the gateway receives. One file per host, because a play
    # against both gateways renders two different trees.
    mwan_network_json_local: "{{ repo_root }}/.cache/network-{{ inventory_hostname }}.json"
    # The model file carries its revision in its name and the directory holds
    # exactly one, so a revision bump keeps one home.
    mwan_steering_model: >-
      {{ query('fileglob', repo_root ~ '/mwan/yang/goodkind-mwan-steering@*.yang') | first }}

  tasks:
    - name: Generate deploy trace ID (early)
      ansible.builtin.set_fact:
        mwan_deploy_trace_id: "{{ lookup('pipe', 'date +%Y%m%d-%H%M%S') }}-deploy-{{ 999999 | random }}"

    - name: Ensure MWAN trace state directory exists
      ansible.builtin.file:
        path: /var/lib/mwan
        state: directory
        mode: "0755"
      changed_when: false
      failed_when: false

    - name: Write deploy trace ID file (run)
      ansible.builtin.copy:
        dest: /run/mwan-trace-id
        content: "{{ mwan_deploy_trace_id }}\n"
        mode: "0644"
      changed_when: false
      failed_when: false

    - name: Write deploy trace ID file (persistent)
      ansible.builtin.copy:
        dest: /var/lib/mwan/trace-id
        content: "{{ mwan_deploy_trace_id }}\n"
        mode: "0644"
      changed_when: false
      failed_when: false

    - name: Verify Debian
      ansible.builtin.assert:
        that:
          - ansible_os_family == "Debian"
        fail_msg: >-
          This playbook requires Debian.
          Found: {{ ansible_os_family | default('unknown') }}
        success_msg: >-
          ✓ {{ ansible_distribution }}
          {{ ansible_distribution_version }}

    - name: Get actual VMID from Proxmox
      delegate_to: "{{ mwan_proxmox_delegate }}"
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          qm list | awk '$2 == "{{ inventory_hostname }}" {print $1}'
        executable: /bin/bash
      register: vmid_lookup
      changed_when: false
      failed_when: vmid_lookup.stdout | length == 0

    - name: Set actual VMID
      ansible.builtin.set_fact:
        actual_vmid: "{{ vmid_lookup.stdout | trim }}"
        mwan_vmid: "{{ vmid_lookup.stdout | trim }}" # Override group_vars

    # ============================================================================
    # PRE-DEPLOY: Auto-rollback setup
    # ============================================================================

    # The deploy gates run through the mwan binary on the Proxmox delegate, so
    # the released binary is pushed there before the first gate call. The
    # dedicated filename keeps the watchdog's own /usr/local/bin/mwan
    # untouched; deploy-proxmox.yml owns that copy. The binary comes from the
    # release the operator named with `configs deploy --release <tag>`, which
    # staged it under mwan_release_dir after verifying its attestation.
    - name: Push the deploy-gate binary to the Proxmox delegate
      delegate_to: "{{ mwan_proxmox_delegate }}"
      ansible.builtin.copy:
        src: "{{ mwan_release_dir }}/linux_amd64/mwan"
        dest: /usr/local/sbin/mwan-deploy-gate
        mode: "0755"

    - name: Verify the deploy-gate binary is the released commit
      delegate_to: "{{ mwan_proxmox_delegate }}"
      ansible.builtin.import_tasks: tasks/verify-mwan-release.yml
      vars:
        mwan_installed_binary: /usr/local/sbin/mwan-deploy-gate

    - name: Verify internet connectivity before deploy
      delegate_to: "{{ mwan_proxmox_delegate }}"
      ansible.builtin.command:
        cmd: /usr/local/sbin/mwan-deploy-gate deploy-gate check-egress
      register: pre_deploy_connectivity
      changed_when: false
      failed_when: false

    - name: Set pre-deploy snapshot name for this run
      ansible.builtin.set_fact:
        mwan_pre_deploy_snapshot_name: >-
          pre-deploy-{{ ansible_date_time.iso8601_basic_short }}
      when: pre_deploy_connectivity.rc == 0

    - name: Create pre-deploy snapshot on Proxmox
      delegate_to: "{{ mwan_proxmox_delegate }}"
      ansible.builtin.command:
        cmd: >-
          qm snapshot {{ actual_vmid }}
          {{ mwan_pre_deploy_snapshot_name }}
          --description "Pre-deploy snapshot for auto-rollback"
      register: snapshot_result
      changed_when: snapshot_result.rc == 0
      when: pre_deploy_connectivity.rc == 0

    - name: Prune old pre-deploy snapshots (keep last 3)
      delegate_to: "{{ mwan_proxmox_delegate }}"
      ansible.builtin.shell:
        cmd: |
          {% raw %}
          set -euo pipefail
          VMID="${MWAN_VMID}"
          mapfile -t snaps < <(
            qm listsnapshot "$VMID" | grep -oE 'pre-deploy-[^[:space:]]+' | sort -u
          )
          count=0
          for _ in "${snaps[@]}"; do
            count=$((count + 1))
          done
          if [ "$count" -le 3 ]; then
            exit 0
          fi
          to_delete=$((count - 3))
          for ((i=0; i<to_delete; i++)); do
            qm delsnapshot "$VMID" "${snaps[$i]}" --force
          done
          {% endraw %}
        executable: /bin/bash
      environment:
        MWAN_VMID: "{{ actual_vmid }}"
      when: pre_deploy_connectivity.rc == 0
      changed_when: false

    - name: Warn if skipping snapshot due to broken connectivity
      ansible.builtin.debug:
        msg: "⚠️  Skipping pre-deploy snapshot - connectivity already broken!"
      when: pre_deploy_connectivity.rc != 0

    - name: Ensure persistent mwan state directory exists
      ansible.builtin.file:
        path: /var/lib/mwan
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Write deploy timestamp to MWAN VM
      ansible.builtin.copy:
        content: "{{ ansible_date_time.epoch }}"
        dest: /var/lib/mwan/last-deploy
        owner: root
        group: root
        mode: "0644"

    # ============================================================================
    # WATCHDOG: Proxmox-host watchdog config + binary deploy live in
    # deploy-proxmox.yml / tasks/proxmox-host.yml. The mwan binary was built
    # in the pre-deploy section above, before the first deploy gate.
    # ============================================================================

    # ============================================================================
    # DEPLOY: MWAN configuration on the MWAN VM
    # ============================================================================

    - name: Install and configure cloudflared
      ansible.builtin.include_tasks: tasks/install-cloudflared.yml
      vars:
        cloudflared_token: "{{ vault_mwan_cloudflared_token }}"

    - name: Install required packages
      ansible.builtin.apt:
        name:
          - wpasupplicant
          - nftables
          - iproute2
          - iptables
          - bash
          - curl
          - jq
          - vlan
          - bridge-utils
          - networkd-dispatcher
          - telnet
          - sipcalc
          - ipcalc-ng
          - ipcalc
          - ipv6calc
          - fping
          - conntrack
        state: present

    - name: Create MWAN runtime config directory
      ansible.builtin.file:
        path: /etc/mwan
        state: directory
        mode: "0755"

    # The network configuration is rendered and schema-checked on the controller
    # before any file reaches the gateway, so a rejected render stops the play
    # while the gateway still holds a consistent set of files: config.toml no
    # longer carries the network tree, and writing it without a validated
    # network.json beside it would leave a gateway that cannot start its wan
    # role on the next restart.
    - name: Ensure the controller render directory exists
      delegate_to: localhost
      become: false
      ansible.builtin.file:
        path: "{{ repo_root }}/.cache"
        state: directory
        mode: "0755"
      when: mwan_ifmgr_wan_enabled | bool

    - name: Render the MWAN network configuration on the controller
      delegate_to: localhost
      become: false
      ansible.builtin.template:
        src: "{{ repo_root }}/mwan/config/network.json.j2"
        dest: "{{ mwan_network_json_local }}"
        mode: "0600"
      when: mwan_ifmgr_wan_enabled | bool

    # The same model files this repository copies onto the gateway, checked with
    # yanglint the way the daemon checks the file with libyang at startup. This
    # is the pre-flight validation that replaces the ruleset parse the firewall
    # work removes.
    - name: Validate the rendered network configuration against the schema
      delegate_to: localhost
      become: false
      ansible.builtin.command:
        argv:
          - yanglint
          - -t
          - config
          - "{{ repo_root }}/third_party/yang/standard/ietf/RFC/ietf-yang-types@2025-12-22.yang"
          - "{{ repo_root }}/third_party/yang/standard/ietf/RFC/ietf-inet-types@2025-12-22.yang"
          - "{{ repo_root }}/third_party/yang/standard/ietf/RFC/iana-if-type@2014-05-08.yang"
          - "{{ repo_root }}/third_party/yang/standard/ietf/RFC/ietf-interfaces@2018-02-20.yang"
          - "{{ repo_root }}/third_party/yang/standard/ietf/RFC/ietf-ip@2018-02-22.yang"
          - "{{ repo_root }}/third_party/yang/standard/ietf/RFC/ietf-routing@2018-03-13.yang"
          - "{{ repo_root }}/third_party/yang/standard/ietf/RFC/ietf-nat@2019-01-10.yang"
          - "{{ mwan_steering_model }}"
          - "{{ mwan_network_json_local }}"
      register: mwan_network_json_validate
      changed_when: false
      failed_when: mwan_network_json_validate.rc != 0
      when: mwan_ifmgr_wan_enabled | bool

    - name: Deploy MWAN runtime environment file
      ansible.builtin.template:
        src: "{{ repo_root }}/mwan/config/mwan.env.j2"
        dest: /etc/mwan/mwan.env
        mode: "0644"

    # The mwan-agent and mwan-ifmgr units load this file via EnvironmentFile=.
    # SMTP2GO_API_KEY is read by internal/config/config.go and overrides the
    # smtp2go_api_key field in /etc/mwan/config.toml when set.
    - name: Deploy MWAN secrets environment file
      ansible.builtin.copy:
        dest: /etc/mwan/secrets.env
        content: |
          SMTP2GO_API_KEY={{ vault_smtp2go_api_key }}
        owner: root
        group: root
        mode: "0640"
      no_log: true
      notify: Restart mwan-ifmgr@wan

    - name: Deploy MWAN runtime config
      ansible.builtin.template:
        src: "{{ repo_root }}/mwan/config/config-vm.toml.j2"
        dest: /etc/mwan/config.toml
        mode: "0600"
      notify: Restart mwan-ifmgr@wan

    # The gateway's network tree in the model's own JSON encoding, rendered and
    # validated on the controller before the first gateway write above. Rendered
    # only where the wan role runs, because it carries that role's sections and
    # no other. The mode matches config.toml beside it; the file carries no
    # secret. These are the validated bytes, not a second render.
    - name: Deploy MWAN network configuration
      ansible.builtin.copy:
        src: "{{ mwan_network_json_local }}"
        dest: /etc/mwan/network.json
        mode: "0600"
      when: mwan_ifmgr_wan_enabled | bool
      notify: Restart mwan-ifmgr@wan

    - name: Discover MWAN VM runtime network (MACs + NIC presence)
      ansible.builtin.include_tasks: tasks/mwan-vm/discover-runtime-network.yml

    - name: Create configuration directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ mwan_config_dir }}"
        - /etc/sysctl.d
        - /etc/iproute2
        - /usr/local/bin
        - /etc/wpa_supplicant
        - /etc/dhcp
        - /etc/systemd/network
        - /etc/networkd-dispatcher/routable.d

    - name: Deploy mwan unified binary to MWAN VM
      ansible.builtin.copy:
        src: "{{ mwan_release_dir }}/linux_amd64/mwan"
        dest: /usr/local/bin/mwan
        mode: "0755"
      notify: Restart mwan-ifmgr@wan

    - name: Verify the MWAN VM binary is the released commit
      ansible.builtin.import_tasks: tasks/verify-mwan-release.yml
      vars:
        mwan_installed_binary: /usr/local/bin/mwan

    - name: Deploy mwan agent systemd unit on MWAN VM
      ansible.builtin.copy:
        src: "{{ repo_root }}/mwan/go/cmd/mwan/mwan-agent.service"
        dest: /etc/systemd/system/mwan-agent.service
        mode: "0644"

    # The ifmgr unit joins group sysrepo (upstream sysrepo access policy,
    # MWAN-435), and a unit naming an absent group fails to start, so the
    # group exists on every gateway. Where the packaged stack installs,
    # libsysrepo7's postinst creates the same group first and this is a
    # no-op.
    - name: Create the sysrepo access group
      ansible.builtin.group:
        name: sysrepo
        system: true

    - name: Deploy mwan ifmgr instanced systemd unit on MWAN VM
      ansible.builtin.copy:
        src: "{{ repo_root }}/mwan/go/cmd/mwan/mwan-ifmgr@.service"
        dest: /etc/systemd/system/mwan-ifmgr@.service
        mode: "0644"
      notify: Restart mwan-ifmgr@wan
      when: mwan_ifmgr_wan_enabled | bool

    - name: Enable mwan-agent service
      ansible.builtin.systemd:
        name: mwan-agent
        enabled: true
        daemon_reload: true
        state: started

    - name: Enable mwan-ifmgr@wan service
      ansible.builtin.systemd:
        name: mwan-ifmgr@wan
        enabled: true
        daemon_reload: true
        state: started
      when: mwan_ifmgr_wan_enabled | bool

    # Baseline / pre-cutover teardown. Gating the deploy+enable above is not
    # enough: a prior dual-write deploy leaves mwan-ifmgr@wan running and
    # enabled, so flipping mwan_ifmgr_wan_enabled back to false must actively
    # stop, disable, and remove the instanced unit to return the host to a
    # never-cut-over baseline.
    - name: Check for instanced ifmgr unit (teardown path)
      ansible.builtin.stat:
        path: /etc/systemd/system/mwan-ifmgr@.service
      register: ifmgr_instanced_unit
      when: not (mwan_ifmgr_wan_enabled | bool)

    - name: Stop and disable mwan-ifmgr@wan when WAN module disabled
      ansible.builtin.systemd:
        name: mwan-ifmgr@wan
        state: stopped
        enabled: false
      when:
        - not (mwan_ifmgr_wan_enabled | bool)
        - ifmgr_instanced_unit.stat.exists

    - name: Remove instanced ifmgr unit when WAN module disabled
      ansible.builtin.file:
        path: /etc/systemd/system/mwan-ifmgr@.service
        state: absent
      register: ifmgr_unit_removed
      when:
        - not (mwan_ifmgr_wan_enabled | bool)
        - ifmgr_instanced_unit.stat.exists

    - name: Reload systemd after removing instanced ifmgr unit
      ansible.builtin.systemd:
        daemon_reload: true
      when:
        - not (mwan_ifmgr_wan_enabled | bool)
        - ifmgr_unit_removed is changed

    - name: Configure AT&T 802.1X, ONT, and VLAN bringup (prod WAN only)
      ansible.builtin.include_tasks: tasks/mwan-vm/att-8021x.yml
      when: mwan_att_8021x_enabled | bool

    - name: Empty systemd-networkd directory
      ansible.builtin.file:
        path: /etc/systemd/network
        state: absent

    - name: Ensure systemd-networkd directory exists
      ansible.builtin.file:
        path: /etc/systemd/network
        state: directory
        mode: "0755"

    - name: Set variables for management interface templates
      ansible.builtin.set_fact:
        vm_mgmt_iface: "{{ mwan_mgmt_iface }}"
        vm_mgmt_ipv6_prefix: "64"
        vm_mgmt_dns_servers: "{{ mwan_dns_servers }}"
        vm_mgmt_dns_domain: "{{ mwan_dns_domain }}"
        vm_mgmt_ipv6: "{{ mwan_config_mgmt_addr }}"
        hostname: "{{ service_hostname }}"

    - name: Deploy management interface networkd configuration
      ansible.builtin.template:
        src: "{{ repo_root }}/ansible/templates/vm/{{ item }}.j2"
        dest: /etc/systemd/network/{{ item }}
        mode: "0644"
      loop:
        - 10-mgmt.link
        - 10-mgmt.network

    - name: Deploy systemd-networkd configuration files
      # Reloaded by handler: networkctl reload applies changed .network files
      # without bouncing an interface, so an address change converges on the
      # deploy that renders it rather than on the next manual intervention.
      ansible.builtin.template:
        src: "{{ repo_root }}/mwan/networkd/{{ item }}.j2"
        dest: /etc/systemd/network/{{ item | basename }}
        mode: "0644"
      loop: "{{ mwan_networkd_files }}"
      notify:
        - Reload networkd

    - name: Reload udev rules
      ansible.builtin.command: udevadm control --reload
      changed_when: false
      failed_when: false

    - name: Trigger net udev events
      ansible.builtin.command: udevadm trigger --action=add --subsystem-match=net
      changed_when: false
      failed_when: false

    # The ifmgr modules own reconvergence after network events: wan.routes
    # through its iface monitors and npt through its nft watcher, so no
    # networkd-dispatcher hooks exist. The dispatcher itself stays enabled for
    # the wpa action units that hook it.
    - name: Enable networkd-dispatcher
      ansible.builtin.systemd:
        name: networkd-dispatcher
        enabled: true
        daemon_reload: true

    - name: Deploy sysctl config
      ansible.builtin.template:
        src: "{{ repo_root }}/mwan/config/sysctl-mwan.conf.j2"
        dest: /etc/sysctl.d/99-mwan.conf
        mode: "0644"

    - name: Deploy quiet console sysctl config to prevent nftables logging noise
      ansible.builtin.copy:
        src: "{{ repo_root }}/mwan/config/99-quiet-console.conf"
        dest: /etc/sysctl.d/99-quiet-console.conf
        mode: "0644"

    - name: Deploy routing tables
      ansible.builtin.template:
        src: "{{ repo_root }}/mwan/config/rt_tables.j2"
        dest: /etc/iproute2/rt_tables
        mode: "0644"

    - name: Deploy nftables config
      # Reloaded by handler: without it the file lands on disk and the kernel
      # keeps the previous ruleset, so a renumber renders correctly and never
      # takes effect. The ifmgr npt module reprograms its own ip6 nat rules on
      # its next reconcile after the flush.
      ansible.builtin.template:
        src: "{{ repo_root }}/mwan/config/nftables.conf.j2"
        dest: /etc/nftables.conf
        mode: "0644"
        backup: true
        validate: /usr/sbin/nft -c -f %s
      notify:
        - Reload nftables
      vars:
        actual_mgmt_iface: "{{ mwan_mgmt_iface }}"
        actual_att_iface: "{{ mwan_att_iface }}"
        actual_webpass_iface: "{{ mwan_webpass_iface }}"
        actual_internal_iface: "{{ mwan_internal_iface }}"

    # Converge the network layer here rather than at the end of the play, so
    # the services deployed below start against the addresses and rules this
    # run rendered, and a reload failure stops the deploy at its cause.
    - name: Apply pending network reloads
      ansible.builtin.meta: flush_handlers

    - name: Create systemd override for nftables
      ansible.builtin.file:
        path: /etc/systemd/system/nftables.service.d
        state: directory
        mode: "0755"

    - name: Deploy nftables systemd override
      ansible.builtin.copy:
        src: "{{ repo_root }}/mwan/overrides/nftables.service.d-override.conf"
        dest: /etc/systemd/system/nftables.service.d/override.conf
        mode: "0644"

    - name: Create systemd override for systemd-networkd
      ansible.builtin.file:
        path: /etc/systemd/system/systemd-networkd.service.d
        state: directory
        mode: "0755"

    - name: Deploy systemd-networkd debug override
      ansible.builtin.copy:
        src: "{{ repo_root }}/mwan/overrides/systemd-networkd.service.d-override.conf"
        dest: /etc/systemd/system/systemd-networkd.service.d/override.conf
        mode: "0644"

    - name: Create systemd override for getty@tty1 (physical console auto-login)
      ansible.builtin.file:
        path: /etc/systemd/system/getty@tty1.service.d
        state: directory
        mode: "0755"

    - name: Deploy getty@tty1 systemd override (physical console auto-login)
      ansible.builtin.copy:
        src: "{{ repo_root }}/mwan/overrides/getty@tty1.service.d-override.conf"
        dest: /etc/systemd/system/getty@tty1.service.d/override.conf
        mode: "0644"

    - name: Create systemd override for serial-getty@ttyS0 (serial console auto-login)
      ansible.builtin.file:
        path: /etc/systemd/system/serial-getty@ttyS0.service.d
        state: directory
        mode: "0755"

    - name: Deploy serial-getty@ttyS0 systemd override (serial console auto-login)
      ansible.builtin.copy:
        src: "{{ repo_root }}/mwan/overrides/serial-getty@ttyS0.service.d-override.conf"
        dest: /etc/systemd/system/serial-getty@ttyS0.service.d/override.conf
        mode: "0644"

    - name: Deploy templated helper scripts
      ansible.builtin.template:
        src: "{{ repo_root }}/mwan/{{ item }}.j2"
        dest: /usr/local/bin/{{ item | basename }}
        mode: "0755"
      loop: []

    - name: Deploy static helper scripts
      ansible.builtin.copy:
        src: "{{ repo_root }}/mwan/{{ item }}"
        dest: /usr/local/bin/{{ item | basename }}
        mode: "0755"
      loop:
        - scripts/wpa-wait-att-iface.sh

    - name: Deploy pinned destination refresher (nft set)
      ansible.builtin.copy:
        src: "{{ repo_root }}/mwan/scripts/update-att-pinned-dests.sh"
        dest: /usr/local/bin/update-att-pinned-dests.sh
        mode: "0755"

    - name: Deploy pinned destination updater service
      ansible.builtin.copy:
        src: "{{ repo_root }}/mwan/services/mwan-update-att-pinned-dests.service"
        dest: /etc/systemd/system/mwan-update-att-pinned-dests.service
        mode: "0644"

    - name: Deploy pinned destination updater timer
      ansible.builtin.copy:
        src: "{{ repo_root }}/mwan/timers/mwan-update-att-pinned-dests.timer"
        dest: /etc/systemd/system/mwan-update-att-pinned-dests.timer
        mode: "0644"

    - name: Deploy mwan boot trace service
      ansible.builtin.copy:
        src: "{{ repo_root }}/mwan/services/mwan-trace-boot.service"
        dest: /etc/systemd/system/mwan-trace-boot.service
        mode: "0644"

    - name: Ensure local build cache directory exists
      delegate_to: localhost
      ansible.builtin.file:
        path: "{{ repo_root }}/.cache"
        state: directory
        mode: "0755"

    - name: Stat scripts-updater unit
      ansible.builtin.stat:
        path: /etc/systemd/system/scripts-updater.service
      register: scripts_updater_svc

    - name: Ensure scripts-updater drop-in directory exists
      ansible.builtin.file:
        path: /etc/systemd/system/scripts-updater.service.d
        state: directory
        mode: "0755"
      when: scripts_updater_svc.stat.exists

    - name: Touch mwan-last-change after scripts-updater runs
      ansible.builtin.copy:
        dest: >-
          /etc/systemd/system/scripts-updater.service.d/mwan-last-change.conf
        mode: "0644"
        content: |
          [Service]
          ExecStartPost=/bin/sh -c 'date +%s > /var/run/mwan-last-change'
      when: scripts_updater_svc.stat.exists

    - name: Enable services
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: true
        daemon_reload: true
      loop: "{{ mwan_enabled_services }}"

    # ============================================================================
    # POST-DEPLOY: Reboot for clean state
    # ============================================================================
    # All services are enabled and will start on boot.
    # Watchdog monitors post-reboot and auto-rolls back if connectivity fails.

    - name: Deploy complete - scheduling reboot
      ansible.builtin.debug:
        msg: >-
          ✓ All configs deployed (traceId={{ mwan_deploy_trace_id }})
          ✓ Scheduling reboot in 5 seconds to apply changes cleanly
          ✓ Timestamp preserved: /var/lib/mwan/last-deploy
          ✓ Watchdog will monitor post-reboot and auto-rollback if needed

    # The gate proves the reboot by a boot_id change, so the pre-reboot value
    # must be captured while the guest still runs the old kernel.
    - name: Capture the pre-reboot boot id
      ansible.builtin.command:
        cmd: cat /proc/sys/kernel/random/boot_id
      register: mwan_pre_reboot_boot_id
      changed_when: false

    # Start observation before the reboot because the controller's route to
    # production rides the rebooting VM. Delegation reopens SSH per task, and
    # Ansible never retries UNREACHABLE.
    - name: Start hypervisor-local MWAN deploy gate before reboot
      delegate_to: "{{ mwan_proxmox_delegate }}"
      ansible.builtin.command:
        argv:
          - systemd-run
          - --unit
          - "mwan-deploy-gate-{{ mwan_deploy_trace_id }}"
          - --collect
          - /usr/local/sbin/mwan-deploy-gate
          - deploy-gate
          - wait-deploy
          - "{{ actual_vmid }}"
          - "{{ mwan_pre_reboot_boot_id.stdout | trim }}"
          - "180"
          - "180"
          - "{{ mwan_deploy_trace_id }}"
          - "/run/mwan-deploy-gate/{{ mwan_deploy_trace_id }}.json"
      changed_when: true

    # systemd owns the reboot timer, so the trigger survives the SSH session
    # teardown. The previous nohup-under-async form was reaped by the async
    # wrapper and never rebooted the VM.
    - name: Schedule reboot to apply all changes
      ansible.builtin.command:
        cmd: systemd-run --on-active=5 /usr/sbin/reboot
      changed_when: true

    # The controller collects the hypervisor-local verdict over raw SSH. No
    # connection to the delegate or VM occurs between reboot scheduling and
    # this task, so the outage cannot abort observation through Ansible.
    - name: Collect MWAN deploy verdict over raw SSH
      delegate_to: localhost
      become: false
      vars:
        mwan_gate_verdict_path: "/run/mwan-deploy-gate/{{ mwan_deploy_trace_id }}.json"
        mwan_gate_unit_name: "mwan-deploy-gate-{{ mwan_deploy_trace_id }}"
        mwan_gate_old_boot_id: "{{ mwan_pre_reboot_boot_id.stdout | trim }}"
        mwan_gate_argv: >-
          {{
            [
              playbook_dir ~ '/files/collect-deploy-verdict.sh',
              mwan_gate_verdict_path,
              mwan_gate_unit_name,
              mwan_deploy_trace_id,
              mwan_gate_old_boot_id,
              '480'
            ] + mwan_gate_collect_addresses
          }}
      ansible.builtin.command:
        argv: "{{ mwan_gate_argv }}"
      register: mwan_gate_collect
      failed_when: false
      changed_when: false

    - name: Parse collected MWAN deploy verdict
      ansible.builtin.set_fact:
        mwan_gate_verdict: "{{ mwan_gate_collect.stdout | from_json }}"
      when: mwan_gate_collect.rc == 0

    # A missing verdict means the controller cannot prove what happened. The
    # collector stderr identifies gate death, timeout, or invalid JSON. Do not
    # roll back a VM that may already run this deploy's configuration.
    - name: Fail when the MWAN deploy verdict could not be collected
      ansible.builtin.fail:
        msg: >-
          The MWAN deploy verdict could not be collected. Collector diagnostics:
          {{ mwan_gate_collect.stderr | trim }} {{ mwan_gate_collect.stdout | trim }}
          The VM still runs the config this deploy wrote, so no rollback was
          performed. The vault watchdog owns recovery.
      when: mwan_gate_collect.rc != 0

    # A VM that never rebooted still runs the config this deploy wrote, so
    # rolling it back would revert a healthy deploy. Fail without rollback.
    - name: Fail playbook when the scheduled reboot never fired
      ansible.builtin.fail:
        msg: >-
          The boot id of VM {{ actual_vmid }} never changed within 180s,
          observed from {{ mwan_proxmox_delegate }}, and the guest was still
          answering with the old boot id, so the scheduled reboot never
          fired. The VM still runs the config this deploy wrote, so no
          rollback was performed.
      when: mwan_gate_verdict.reboot_rc == 1

    # Delegated rollback tasks open fresh SSH connections because the ControlPersist
    # master died with the tunnel. A delegate reachable only out-of-band makes these
    # tasks abort UNREACHABLE, which is the loud-failure path; the vault watchdog owns
    # recovery.
    - name: Stop MWAN VM for rollback after failed health gate
      delegate_to: "{{ mwan_proxmox_delegate }}"
      ansible.builtin.command:
        cmd: qm stop {{ actual_vmid }}
      when:
        - mwan_gate_verdict.egress_rc != 0
        - mwan_gate_verdict.egress_rc != -1
        - mwan_pre_deploy_snapshot_name is defined
      changed_when: true

    - name: Rollback MWAN VM to pre-deploy snapshot
      delegate_to: "{{ mwan_proxmox_delegate }}"
      ansible.builtin.command:
        cmd: >-
          qm rollback {{ actual_vmid }} {{ mwan_pre_deploy_snapshot_name }}
      when:
        - mwan_gate_verdict.egress_rc != 0
        - mwan_gate_verdict.egress_rc != -1
        - mwan_pre_deploy_snapshot_name is defined
      changed_when: true

    - name: Start MWAN VM after rollback
      delegate_to: "{{ mwan_proxmox_delegate }}"
      ansible.builtin.command:
        cmd: qm start {{ actual_vmid }}
      when:
        - mwan_gate_verdict.egress_rc != 0
        - mwan_gate_verdict.egress_rc != -1
        - mwan_pre_deploy_snapshot_name is defined
      changed_when: true

    - name: Fail playbook after rollback
      ansible.builtin.fail:
        msg: >-
          IPv6 egress never returned within 180s of the reboot, probed from
          {{ mwan_proxmox_delegate }}. Rolled back to
          {{ mwan_pre_deploy_snapshot_name }}.
      when:
        - mwan_gate_verdict.egress_rc != 0
        - mwan_gate_verdict.egress_rc != -1
        - mwan_pre_deploy_snapshot_name is defined

    - name: Fail when health gate failed without rollback snapshot
      ansible.builtin.fail:
        msg: >-
          IPv6 egress never returned within 180s of the reboot and no
          pre-deploy snapshot exists, because connectivity was already broken
          before the deploy. Restore the VM manually.
      when:
        - mwan_gate_verdict.egress_rc != 0
        - mwan_gate_verdict.egress_rc != -1
        - mwan_pre_deploy_snapshot_name is not defined

    - name: Playbook complete
      ansible.builtin.debug:
        msg: >-
          Deploy playbook complete. The MWAN VM reboot verdict completed and
          the egress verdict passed. The verdict file was collected over raw
          SSH. Monitor watchdog logs on {{ mwan_proxmox_delegate }}.
      when:
        - mwan_gate_verdict.reboot_rc in [0, 2]
        - mwan_gate_verdict.egress_rc == 0

  handlers:
    - name: Reload networkd
      ansible.builtin.command: networkctl reload
      changed_when: true

    - name: Reload nftables
      ansible.builtin.systemd:
        name: nftables
        state: reloaded

    - name: Restart wpa_supplicant
      ansible.builtin.systemd:
        name: wpa_supplicant-mwan
        state: restarted
        daemon_reload: true

    - name: Restart cloudflared
      ansible.builtin.systemd:
        name: cloudflared
        state: restarted
        daemon_reload: true

    - name: Restart mwan-ifmgr@wan
      ansible.builtin.systemd:
        name: mwan-ifmgr@wan
        state: restarted
        daemon_reload: true
      when: mwan_ifmgr_wan_enabled | bool

# The MWAN failover LXC is configured by deploy-mwan-failover.yml,
# targeting mwan_failover_servers (prod) or mwan_failover_suburban_servers
# (testbed).
#
# Suburban-specific host work (MWAN VM args, ISP LXCs, OPNsense host bridge)
# lives in deploy-testbed.yml.
