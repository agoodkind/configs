- name: Record the activation failure before recovery
  ansible.builtin.set_fact:
    mwan_role_activation_failure: "{{ ansible_failed_task.name }}: {{ ansible_failed_result.msg }}"

- name: Check the newly installed writer unit before first-install recovery
  ansible.builtin.stat:
    path: /etc/systemd/system/mwan-ifmgr@.service
  register: mwan_role_new_writer_unit
  when: mwan_role_first_install | bool

- name: Stop and disable the newly installed writer during first-install recovery
  ansible.builtin.systemd:
    name: mwan-ifmgr@wan
    state: stopped
    enabled: false
  when:
    - mwan_role_first_install | bool
    - mwan_role_new_writer_unit.stat.exists

- name: Restore prior role inputs within the guest
  ansible.builtin.copy:
    remote_src: true
    src: "{{ mwan_role_backup.path }}/{{ item.item | basename }}"
    dest: "{{ item.item }}"
    mode: "{{ item.stat.mode }}"
    owner: "{{ item.stat.uid }}"
    group: "{{ item.stat.gid }}"
  loop: "{{ mwan_role_prior_inputs.results }}"
  when: item.stat.exists
  no_log: true

- name: Remove role inputs absent before staging
  ansible.builtin.file:
    path: "{{ item.item }}"
    state: absent
  loop: "{{ mwan_role_prior_inputs.results }}"
  when: not item.stat.exists

- name: Restart the writer with restored role inputs
  ansible.builtin.include_tasks: restart-mwan-ifmgr.yml
  vars:
    mwan_ifmgr_restart_timeout_seconds: "{{ mwan_role_job_timeout_seconds }}"
  when: not (mwan_role_first_install | bool)

- name: Reload the restored role units
  ansible.builtin.include_tasks: reload-mwan-networkd.yml

- name: Read restored management and transit state
  ansible.builtin.command:
    argv: [networkctl, status, "{{ item }}", --json=short]
  loop: ["{{ mwan_mgmt_iface }}", "{{ mwan_internal_iface }}"]
  register: mwan_role_restored_state
  changed_when: false

- name: Verify prior role selection and static addressing
  vars:
    before: "{{ mwan_role_prior_state.results[item].stdout | from_json }}"
    after: "{{ mwan_role_restored_state.results[item].stdout | from_json }}"
  ansible.builtin.assert:
    that:
      - after.NetworkFile == before.NetworkFile
      - >-
        (after.Addresses | selectattr('ConfigSource', 'equalto', 'static') | list) ==
        (before.Addresses | selectattr('ConfigSource', 'equalto', 'static') | list)
      - >-
        (after | dict2items | selectattr('key', 'in', ['DNS', 'SearchDomains']) | list) ==
        (before | dict2items | selectattr('key', 'in', ['DNS', 'SearchDomains']) | list)
  loop: [0, 1]

- name: Read restored transit forwarding settings
  ansible.builtin.command:
    argv: [cat, "/proc/sys/net/{{ item }}/conf/{{ mwan_internal_iface }}/forwarding"]
  loop: [ipv4, ipv6]
  register: mwan_role_restored_forwarding
  changed_when: false

- name: Verify prior forwarding and return routes
  vars:
    before: "{{ mwan_role_prior_state.results[1].stdout | from_json }}"
    after: "{{ mwan_role_restored_state.results[1].stdout | from_json }}"
  ansible.builtin.assert:
    that:
      - >-
        (after.Routes | selectattr('ConfigSource', 'equalto', 'static') | list) ==
        (before.Routes | selectattr('ConfigSource', 'equalto', 'static') | list)
      - >-
        (mwan_role_restored_forwarding.results | map(attribute='stdout') | list) ==
        (mwan_role_prior_forwarding.results | map(attribute='stdout') | list)

- name: Remove the recovered role input backup
  ansible.builtin.file:
    path: "{{ mwan_role_backup.path }}"
    state: absent

- name: Fail after restoring the prior role configuration
  ansible.builtin.fail:
    msg: >-
      Role activation failed: {{ mwan_role_activation_failure }}.
      The prior role inputs and applied state passed recovery verification.
