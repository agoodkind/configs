- name: Check the newly installed writer unit before first-install recovery
  ansible.builtin.stat:
    path: /etc/systemd/system/mwan-ifmgr@.service
  register: mwan_role_new_writer_unit
  when: mwan_role_first_install | bool

- name: Stop and disable the newly installed writer during first-install recovery
  ansible.builtin.systemd:
    name: mwan-ifmgr@wan
    state: stopped
    enabled: false
  when:
    - mwan_role_first_install | bool
    - mwan_role_new_writer_unit.stat.exists

- name: Restore prior role inputs within the guest
  ansible.builtin.copy:
    remote_src: true
    src: >-
      {{ mwan_role_backup.path ~ '/' ~
         ('transfer-source.json' if mwan_transfer_recovery_excluded | bool
          and item.item == '/etc/mwan/network.json' else item.item | basename) }}
    dest: "{{ item.item }}"
    mode: "{{ item.stat.mode }}"
    owner: "{{ item.stat.uid }}"
    group: "{{ item.stat.gid }}"
  loop: "{{ mwan_role_prior_inputs.results }}"
  when: item.stat.exists
  no_log: true

- name: Remove role inputs absent before staging
  ansible.builtin.file:
    path: "{{ item.item }}"
    state: absent
  loop: "{{ mwan_role_prior_inputs.results }}"
  when:
    - not item.stat.exists
    - >-
      not (mwan_transfer_recovery_excluded | bool) or
      mwan_transfer_previous['goodkind-mwan-steering:owner'] == 'networkd' or
      item.item != '/etc/systemd/network/00-mwan-release-' ~ mwan_transfer_connection_id ~ '.network'

- name: Restart the writer with restored role inputs
  ansible.builtin.include_tasks: restart-mwan-ifmgr.yml
  vars:
    mwan_ifmgr_restart_timeout_seconds: "{{ mwan_role_job_timeout_seconds }}"
  when: not (mwan_role_first_install | bool)

- name: Reload the restored role units
  ansible.builtin.include_tasks: reload-mwan-networkd.yml

- name: Read restored role state through the owning services and kernel
  ansible.builtin.include_tasks: read-mwan-role-state.yml

- name: Read restored role ownership
  ansible.builtin.slurp:
    src: /etc/mwan/network.json
  register: mwan_role_restored_document
  no_log: true
  when: not (mwan_role_first_install | bool)

- name: Verify restored ownership after an existing installation
  when: not (mwan_role_first_install | bool)
  block:
    - name: Require restored MWAN role acquisition
      vars:
        restored_connections: >-
          {{ (mwan_role_restored_document.content | b64decode | from_json)
             ['ietf-interfaces:interfaces']['interface'] }}
        mwan_transfer_acquisition_connection: "{{ item }}"
        mwan_transfer_connection_id: "{{ item['goodkind-mwan-steering:connection-id'] }}"
      ansible.builtin.include_tasks: verify-mwan-transfer-acquisition.yml
      loop: "{{ restored_connections | selectattr('name', 'in', [mwan_mgmt_iface, mwan_internal_iface]) | list }}"
      when: item['goodkind-mwan-steering:owner'] == 'mwan'

- name: Verify prior role selection and static addressing
  vars:
    before: "{{ mwan_role_prior_state.results[item.index].stdout | from_json }}"
    after: "{{ mwan_role_observed_networkd.results[item.index].stdout | from_json }}"
    owner: "{{ (mwan_role_prior_owners_json | from_json)[item.name] }}"
  ansible.builtin.assert:
    that:
      - >-
        (owner == 'networkd' and 'NetworkFile' in after and after.NetworkFile == before.NetworkFile) or
        (owner == 'mwan' and after.AdministrativeState == 'unmanaged')
      - >-
        owner != 'networkd' or
        (after.Addresses | selectattr('ConfigSource', 'equalto', 'static') | list) ==
        (before.Addresses | selectattr('ConfigSource', 'equalto', 'static') | list)
      - >-
        owner != 'networkd' or
        (after | dict2items | selectattr('key', 'in', ['DNS', 'SearchDomains']) | list) ==
        (before | dict2items | selectattr('key', 'in', ['DNS', 'SearchDomains']) | list)
  loop:
    - {index: 0, name: "{{ mwan_mgmt_iface }}"}
    - {index: 1, name: "{{ mwan_internal_iface }}"}

- name: Verify prior forwarding and return routes
  vars:
    before: "{{ mwan_role_prior_state.results[1].stdout | from_json }}"
    after: "{{ mwan_role_observed_networkd.results[1].stdout | from_json }}"
    owner: "{{ (mwan_role_prior_owners_json | from_json)[mwan_internal_iface] }}"
  ansible.builtin.assert:
    that:
      - >-
        owner != 'networkd' or
        (after.Routes | selectattr('ConfigSource', 'equalto', 'static') | list) ==
        (before.Routes | selectattr('ConfigSource', 'equalto', 'static') | list)
      - >-
        (mwan_role_observed_forwarding.results | map(attribute='stdout') | list) ==
        (mwan_role_prior_forwarding.results | map(attribute='stdout') | list)

- name: Verify restored role kernel address identities
  ansible.builtin.assert:
    that: >-
      (mwan_role_prior_address_identities_json | from_json)[item]['all'] ==
      (mwan_role_address_identities_json | from_json)[item]['usable']
  loop: [0, 1]

- name: Verify restored resolver tuples and kernel return routes
  ansible.builtin.assert:
    that:
      - >-
        (mwan_role_observed_resolver.results[0].stdout | from_json).data ==
        (mwan_role_prior_resolver.results[0].stdout | from_json).data
      - >-
        (mwan_role_observed_resolver.results[1].stdout | from_json).data ==
        (mwan_role_prior_resolver.results[1].stdout | from_json).data
      - >-
        mwan_role_route_identities_json | from_json ==
        mwan_role_prior_route_identities_json | from_json

- name: Remove the recovered role input backup
  ansible.builtin.file:
    path: "{{ mwan_role_backup.path }}"
    state: absent
  when: not (mwan_transfer_recovery_excluded | bool)
