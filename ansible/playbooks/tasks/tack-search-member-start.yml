---
# The notified "Restart the OpenSearch member" handler must finish before "Start the OpenSearch member" runs.
- name: Run notified handlers before starting the OpenSearch member
  ansible.builtin.meta: flush_handlers

- name: Start the OpenSearch member
  ansible.builtin.command:
    cmd: docker compose up -d opensearch
    chdir: "{{ tack_install_dir }}"
  changed_when: true
