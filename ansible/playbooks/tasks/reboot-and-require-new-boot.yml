---
- name: Capture the pre-reboot boot identity
  ansible.builtin.command:
    argv: [cat, /proc/sys/kernel/random/boot_id]
  register: mwan_pre_reboot_boot_id
  changed_when: false

# The extension must succeed while the gateway still answers SSH.
- name: Extend the gateway deploy lock before scheduling the reboot
  delegate_to: localhost
  become: false
  ansible.builtin.command:
    argv:
      - ./configsctl
      - lock
      - extend
      - --host
      - "{{ inventory_hostname }}"
      - --seconds
      - "{{ mwan_reboot_lock_extend_seconds }}"
    chdir: "{{ repo_root }}"
  changed_when: false
  when: not ansible_check_mode

- name: Schedule the reboot independently of the SSH connection
  ansible.builtin.command:
    argv: [systemd-run, --on-active=5, /usr/sbin/reboot]
  changed_when: true

- name: Reconnect after the scheduled reboot
  vars:
    # wait_for_connection runs Ansible's built-in Python ping module
    # on the guest to verify SSH and remote execution. MWAN supplies
    # no Python code for this check. Pipelining uses SSH stdin instead
    # of uploading the module into a cached directory that may be deleted.
    ansible_pipelining: true
  ansible.builtin.wait_for_connection:
    connect_timeout: 5
    delay: 15
    sleep: 5
    timeout: 360

- name: Read the post-reboot boot identity
  vars:
    ansible_ssh_retries: 17
  ansible.builtin.command:
    argv: [cat, /proc/sys/kernel/random/boot_id]
  register: mwan_post_reboot_boot_id
  changed_when: false
  until:
    - mwan_post_reboot_boot_id.rc == 0
    - mwan_post_reboot_boot_id.stdout | trim != mwan_pre_reboot_boot_id.stdout | trim
  retries: 72
  delay: 5
  ignore_unreachable: true

- name: Require an actual gateway reboot
  ansible.builtin.assert:
    that:
      - mwan_post_reboot_boot_id is reachable
      - mwan_post_reboot_boot_id is success
      - mwan_post_reboot_boot_id.stdout | trim != mwan_pre_reboot_boot_id.stdout | trim
    fail_msg: The gateway boot identity did not change after scheduling its reboot.
