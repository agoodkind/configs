- name: Read applied role state through the owning services and kernel
  ansible.builtin.include_tasks: read-mwan-role-state.yml

- name: Read the installed role ownership document
  ansible.builtin.slurp:
    src: /etc/mwan/network.json
  register: mwan_role_applied_document
  no_log: true

- name: Verify applied MWAN role acquisition
  vars:
    installed_connections: >-
      {{ (mwan_role_applied_document.content | b64decode | from_json)
         ['ietf-interfaces:interfaces']['interface'] }}
    mwan_transfer_acquisition_connection: "{{ item }}"
    mwan_transfer_connection_id: "{{ item['goodkind-mwan-steering:connection-id'] }}"
  ansible.builtin.include_tasks: verify-mwan-transfer-acquisition.yml
  loop: "{{ installed_connections | selectattr('name', 'in', [mwan_mgmt_iface, mwan_internal_iface]) | list }}"
  when: item['goodkind-mwan-steering:owner'] == 'mwan'

- name: Verify the configured role ownership boundary
  vars:
    observed: "{{ mwan_role_observed_networkd.results[item.index].stdout | from_json }}"
    intent: "{{ (mwan_non_provider_connections | selectattr('name', 'equalto', item.name) | list)[0] }}"
  ansible.builtin.assert:
    that:
      - intent.owner in ['networkd', 'mwan']
      - >-
        (intent.owner == 'networkd' and 'NetworkFile' in observed and
         observed.NetworkFile == '/etc/systemd/network/20-' ~ item.name ~ '.network') or
        (intent.owner == 'mwan' and observed.AdministrativeState == 'unmanaged')
    fail_msg: The role's active networkd state does not match its configured owner.
  loop:
    - {index: 0, name: "{{ mwan_mgmt_iface }}"}
    - {index: 1, name: "{{ mwan_internal_iface }}"}

- name: Verify applied management DNS and transit forwarding
  vars:
    actual_dns: >-
      {% set numbers = [] %}
      {% for server in (mwan_role_observed_resolver.results[0].stdout | from_json).data %}
      {% set value = namespace(number=0) %}
      {% for byte in server[1] %}
      {% set value.number = value.number * 256 + byte %}
      {% endfor %}
      {% set _ = numbers.append(value.number) %}
      {% endfor %}
      {{ numbers }}
    expected_dns: >-
      {{ mwan_dns_servers.split() | map('ansible.utils.ipaddr', 'int') | map('int') | list }}
    actual_domains: "{{ (mwan_role_observed_resolver.results[1].stdout | from_json).data }}"
  ansible.builtin.assert:
    that:
      - actual_dns | from_json | sort == expected_dns | sort
      - "[mwan_dns_domain, false] in actual_domains"
      - mwan_role_observed_forwarding.results[0].stdout | trim == '1'
      - mwan_role_observed_forwarding.results[1].stdout | trim == '1'
    fail_msg: The configured management DNS or transit forwarding did not apply.

- name: Verify configured role address prefixes
  vars:
    management_intent: >-
      {{ (mwan_non_provider_connections | selectattr('name', 'equalto', mwan_mgmt_iface) | list)[0] }}
    transit_intent: >-
      {{ (mwan_non_provider_connections | selectattr('name', 'equalto', mwan_internal_iface) | list)[0] }}
    actual_addresses: >-
      {{ (mwan_role_observed_addresses.results[item.index].stdout | from_json)[0].addr_info }}
  ansible.builtin.assert:
    that:
      - >-
        (item.cidr.split('/')[0] | ansible.utils.ipaddr('int') | int) in
        (actual_addresses | rejectattr('tentative', 'defined') | rejectattr('dadfailed', 'defined')
         | selectattr('prefixlen', 'equalto', item.cidr.split('/')[1] | int)
         | map(attribute='local') | map('ansible.utils.ipaddr', 'int') | map('int') | list)
    fail_msg: The configured role address and prefix did not apply.
  loop:
    - {index: 0, cidr: "{{ management_intent.ipv6.address }}"}
    - {index: 1, cidr: "{{ transit_intent.ipv4.address }}"}
    - {index: 1, cidr: "{{ transit_intent.ipv6.address }}"}

- name: Verify configured return routes in the kernel for either owner
  vars:
    transit_intent: >-
      {{ (mwan_non_provider_connections | selectattr('name', 'equalto', mwan_internal_iface) | list)[0] }}
    effective_metric: "{{ 1024 if item.metric | int == 0 else item.metric | int }}"
    actual_routes: >-
      {% set matches = [] %}
      {% for route in mwan_role_observed_routes.stdout | from_json %}
      {% if 'dst' in route and 'gateway' in route and 'metric' in route %}
      {% set _ = matches.append(
         route.dst | ansible.utils.ipaddr('network') | ansible.utils.ipaddr('int') | int ==
         item.destination | ansible.utils.ipaddr('network') | ansible.utils.ipaddr('int') | int
         and route.dst.split('/')[1] | int == item.destination.split('/')[1] | int
         and route.gateway | ansible.utils.ipaddr('int') | int == item.gateway | ansible.utils.ipaddr('int') | int
         and route.dev == mwan_internal_iface and route.metric | int == effective_metric | int) %}
      {% endif %}
      {% endfor %}
      {{ matches | to_json }}
  ansible.builtin.assert:
    that:
      - item.table_id | int == 254
      - true in (actual_routes | from_json)
    fail_msg: The configured transit return route is absent from the kernel.
  loop: "{{ transit_intent.ipv6.routes }}"
