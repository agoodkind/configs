---
- name: Find the primary speaker lease records
  delegate_to: "{{ tertiary_speaker.host }}"
  ansible.builtin.find:
    paths: /var/lib/mwan/wan
    patterns: '*.json'
    file_type: file
  register: tertiary_lease_files

- name: Read the primary speaker lease records
  delegate_to: "{{ tertiary_speaker.host }}"
  ansible.builtin.slurp:
    src: "{{ item.path }}"
  loop: "{{ tertiary_lease_files.files }}"
  register: tertiary_lease_contents

- name: Initialize the primary lease evidence
  ansible.builtin.set_fact:
    tertiary_dhcpv4_records: []
    tertiary_dhcpv6_records: []

- name: Select the primary tertiary DHCPv4 lease
  ansible.builtin.set_fact:
    tertiary_dhcpv4_records: "{{ tertiary_dhcpv4_records + [tertiary_lease] }}"
  loop: "{{ tertiary_lease_contents.results }}"
  vars:
    tertiary_lease: "{{ item.content | b64decode | from_json }}"
  when:
    - tertiary_lease.connection_id == 'tertiary'
    - tertiary_lease.protocol == 'dhcpv4'

- name: Select the primary tertiary DHCPv6 lease
  ansible.builtin.set_fact:
    tertiary_dhcpv6_records: "{{ tertiary_dhcpv6_records + [tertiary_lease] }}"
  loop: "{{ tertiary_lease_contents.results }}"
  vars:
    tertiary_lease: "{{ item.content | b64decode | from_json }}"
  when:
    - tertiary_lease.connection_id == 'tertiary'
    - tertiary_lease.protocol == 'dhcpv6'

- name: Require the primary DHCPv4 lease to match the acquired source
  ansible.builtin.assert:
    that:
      - tertiary_dhcpv4_records | length == 1
      - tertiary_dhcpv4_records[0].record.payload.ip == tertiary_source_ipv4
      - tertiary_dhcpv4_records[0].record.interface_name == tertiary_speaker.iface
    fail_msg: >-
      The primary speaker lacks a tertiary DHCPv4 lease matching
      {{ tertiary_source_ipv4 }} on {{ tertiary_speaker.iface }}.

- name: Require the primary address-only DHCPv6 lease
  ansible.builtin.assert:
    that:
      - tertiary_dhcpv6_records | length == 1
      - tertiary_dhcpv6_records[0].record.payload.request_address
      - not tertiary_dhcpv6_records[0].record.payload.request_prefix
      - tertiary_dhcpv6_records[0].record.payload.addresses != []
      - tertiary_dhcpv6_records[0].record.payload.prefixes == []
      - >-
        tertiary_dhcpv6_records[0].record.payload.addresses | map(attribute='address')
        | intersect(tertiary_global_ipv6 | map(attribute='local') | list) != []
    fail_msg: The primary speaker lacks an installed address-only DHCPv6 lease.
  when: tertiary_phase != 'slaac'

- name: Require SLAAC without a current DHCPv6 lease
  ansible.builtin.assert:
    that:
      - tertiary_dhcpv6_records == []
    fail_msg: The SLAAC-only phase still has a tertiary DHCPv6 lease record.
  when: tertiary_phase == 'slaac'
