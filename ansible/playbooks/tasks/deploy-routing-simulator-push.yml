---
- name: Create the networkd configuration directory
  ansible.builtin.command:
    argv: [pct, exec, "{{ rsim.vmid }}", --, mkdir, -p, /etc/systemd/networkd.conf.d]
  changed_when: false

- name: Push each file with a changed checksum
  ansible.builtin.command:
    argv:
      - pct
      - push
      - "{{ rsim.vmid }}"
      - "{{ rsim_temp_dir }}/{{ item.0 }}"
      - "{{ item.1 }}"
      - --perms
      - "{{ item.2 }}"
  loop: "{{ rsim_files }}"
  loop_control:
    label: "{{ item.1 }}"
  when: item.1 in rsim_changed_files
  register: rsim_push
  changed_when: true
