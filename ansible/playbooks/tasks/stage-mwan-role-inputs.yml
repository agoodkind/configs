- name: Render the runtime configuration for an explicit first installation
  ansible.builtin.template:
    src: "{{ repo_root }}/mwan/config/config-vm.toml.j2"
    dest: /etc/mwan/config.toml
    mode: "0600"
  when: mwan_bootstrap_guest | bool

- name: Deploy the exact runtime bytes approved by the operation
  ansible.builtin.copy:
    src: "{{ mwan_controller_artifact_root }}/runtime-{{ inventory_hostname }}.toml"
    dest: /etc/mwan/config.toml
    mode: "0600"
  when: not mwan_bootstrap_guest | bool

# Copy the controller-validated bytes without rendering the document again.
- name: Deploy MWAN network configuration
  ansible.builtin.copy:
    src: "{{ mwan_network_json_local }}"
    dest: /etc/mwan/network.json
    mode: "0600"
  when: mwan_ifmgr_wan_enabled | bool

- name: Create configuration directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ mwan_config_dir }}"
    - /etc/sysctl.d
    - /etc/iproute2
    - /usr/local/bin
    - /etc/wpa_supplicant
    - /etc/dhcp
    - /etc/systemd/network
    - /etc/networkd-dispatcher/routable.d

- name: Install the shared daemon runtime
  ansible.builtin.include_tasks: install-mwan-core-runtime.yml

# The installer enables the WAN instance even when inventory disables WAN.
- name: Check for instanced ifmgr unit (teardown path)
  ansible.builtin.stat:
    path: /etc/systemd/system/mwan-ifmgr@.service
  register: ifmgr_instanced_unit
  when: not (mwan_ifmgr_wan_enabled | bool)

- name: Disable mwan-ifmgr@wan when WAN module disabled
  ansible.builtin.systemd:
    name: mwan-ifmgr@wan
    enabled: false
  when:
    - not (mwan_ifmgr_wan_enabled | bool)
    - ifmgr_instanced_unit.stat.exists

- name: Remove instanced ifmgr unit when WAN module disabled
  ansible.builtin.file:
    path: /etc/systemd/system/mwan-ifmgr@.service
    state: absent
  when:
    - not (mwan_ifmgr_wan_enabled | bool)
    - ifmgr_instanced_unit.stat.exists

- name: Configure AT&T 802.1X, ONT, and VLAN bringup (prod WAN only)
  ansible.builtin.include_tasks: mwan-vm/att-8021x.yml
  when: mwan_att_8021x_enabled | bool

- name: Set variables for management interface templates
  ansible.builtin.set_fact:
    vm_mgmt_iface: "{{ mwan_mgmt_iface }}"
    vm_mgmt_ipv6_prefix: "64"
    vm_mgmt_dns_servers: "{{ mwan_dns_servers }}"
    vm_mgmt_dns_domain: "{{ mwan_dns_domain }}"
    vm_mgmt_ipv6: "{{ mwan_config_mgmt_addr }}"
    hostname: "{{ service_hostname }}"
    # No 10-mgmt.link when mwan owns the management link. mwan refuses to
    # start beside it.
    mwan_mgmt_networkd_files: >-
      {{ (['10-mgmt.link']
          if not (mwan_ifmgr_wan_enabled | bool)
             or 'mwan' not in (mwan_non_provider_connections
                               | selectattr('name', 'equalto', mwan_mgmt_iface)
                               | map(attribute='owner') | list)
          else [])
         + (['10-mgmt.network'] if not (mwan_ifmgr_wan_enabled | bool) else []) }}

- name: Deploy management interface networkd configuration
  ansible.builtin.template:
    src: "{{ repo_root }}/ansible/templates/vm/{{ item }}.j2"
    dest: /etc/systemd/network/{{ item }}
    mode: "0644"
  loop: "{{ mwan_mgmt_networkd_files }}"

- name: Deploy systemd-networkd configuration files
  ansible.builtin.template:
    src: "{{ repo_root }}/mwan/networkd/{{ item }}.j2"
    dest: /etc/systemd/network/{{ item | basename }}
    mode: "0644"
  loop: "{{ mwan_networkd_files }}"
  when: (item | basename) != '40-mwanbr.network' or not (mwan_ifmgr_wan_enabled | bool)

# AT&T WPA action units still require networkd-dispatcher.
- name: Enable networkd-dispatcher
  ansible.builtin.systemd:
    name: networkd-dispatcher
    enabled: true
    daemon_reload: true

- name: Deploy sysctl config
  ansible.builtin.template:
    src: "{{ repo_root }}/mwan/config/sysctl-mwan.conf.j2"
    dest: /etc/sysctl.d/99-mwan.conf
    mode: "0644"

- name: Deploy routing tables
  ansible.builtin.template:
    src: "{{ repo_root }}/mwan/config/rt_tables.j2"
    dest: /etc/iproute2/rt_tables
    mode: "0644"

- name: Create systemd override for getty@tty1 (physical console auto-login)
  ansible.builtin.file:
    path: /etc/systemd/system/getty@tty1.service.d
    state: directory
    mode: "0755"

- name: Deploy getty@tty1 systemd override (physical console auto-login)
  ansible.builtin.copy:
    src: "{{ repo_root }}/mwan/overrides/getty@tty1.service.d-override.conf"
    dest: /etc/systemd/system/getty@tty1.service.d/override.conf
    mode: "0644"

- name: Create systemd override for serial-getty@ttyS0 (serial console auto-login)
  ansible.builtin.file:
    path: /etc/systemd/system/serial-getty@ttyS0.service.d
    state: directory
    mode: "0755"

- name: Deploy serial-getty@ttyS0 systemd override (serial console auto-login)
  ansible.builtin.copy:
    src: "{{ repo_root }}/mwan/overrides/serial-getty@ttyS0.service.d-override.conf"
    dest: /etc/systemd/system/serial-getty@ttyS0.service.d/override.conf
    mode: "0644"

- name: Deploy static helper scripts
  ansible.builtin.copy:
    src: "{{ repo_root }}/mwan/{{ item }}"
    dest: /usr/local/bin/{{ item | basename }}
    mode: "0755"
  loop:
    - scripts/wpa-wait-att-iface.sh

- name: Deploy pinned destination refresher (nft set)
  ansible.builtin.copy:
    src: "{{ repo_root }}/mwan/scripts/update-att-pinned-dests.sh"
    dest: /usr/local/bin/update-att-pinned-dests.sh
    mode: "0755"

- name: Deploy pinned destination updater service
  ansible.builtin.copy:
    src: "{{ repo_root }}/mwan/services/mwan-update-att-pinned-dests.service"
    dest: /etc/systemd/system/mwan-update-att-pinned-dests.service
    mode: "0644"

- name: Deploy pinned destination updater timer
  ansible.builtin.copy:
    src: "{{ repo_root }}/mwan/timers/mwan-update-att-pinned-dests.timer"
    dest: /etc/systemd/system/mwan-update-att-pinned-dests.timer
    mode: "0644"

- name: Stat scripts-updater unit
  ansible.builtin.stat:
    path: /etc/systemd/system/scripts-updater.service
  register: scripts_updater_svc

- name: Ensure scripts-updater drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/scripts-updater.service.d
    state: directory
    mode: "0755"
  when: scripts_updater_svc.stat.exists

- name: Write mwan-last-change after scripts-updater runs
  ansible.builtin.copy:
    dest: >-
      /etc/systemd/system/scripts-updater.service.d/mwan-last-change.conf
    mode: "0644"
    content: |
      [Service]
      ExecStartPost=/bin/sh -c 'date +%s > /var/run/mwan-last-change'
  when: scripts_updater_svc.stat.exists

- name: Enable services
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    daemon_reload: true
  loop: "{{ mwan_enabled_services }}"
