- name: Initialize inactive connection transfer state
  ansible.builtin.set_fact:
    mwan_transfer_active: false
    mwan_transfer_snapshot_ready: false
    mwan_transfer_controller_created: false
    mwan_transfer_capture_paths: []
    mwan_transfer_recovery_excluded: false
    mwan_role_install_network: "{{ mwan_network_json_local }}"
  when: not mwan_transfer_prepared | bool

- name: Establish the initial role configuration when needed
  ansible.builtin.include_tasks: prepare-mwan-role-inputs.yml
  when:
    - mwan_ifmgr_wan_enabled | bool
    - not ansible_check_mode

- name: Stage and activate management and transit inputs
  block:
    - name: Read the prior deployment's exact managed networkd inputs
      ansible.builtin.include_tasks: read-mwan-networkd-inventory.yml

    - name: Prepare exclusive connection ownership changes
      ansible.builtin.include_tasks: prepare-mwan-connection-transfer.yml
      when:
        - mwan_ifmgr_wan_enabled | bool
        - not ansible_check_mode
        - not mwan_transfer_prepared | bool

    - name: Preserve prior role inputs before staging
      ansible.builtin.include_tasks: capture-mwan-role-inputs.yml
      when:
        - mwan_ifmgr_wan_enabled | bool
        - not ansible_check_mode

    - name: Install all MWAN runtime inputs
      ansible.builtin.include_tasks: "{{ mwan_role_staging_task_file }}"

    - name: Apply ordinary runtime handlers before the connection transfer
      ansible.builtin.meta: flush_handlers
      when: mwan_transfer_active | bool

    - name: Transfer the selected complete connection
      ansible.builtin.include_tasks: transfer-mwan-connection.yml
      when:
        - mwan_transfer_active | bool
        - not ansible_check_mode

    - name: Activate verified management and transit units
      ansible.builtin.include_tasks: activate-mwan-role-units.yml
      when:
        - mwan_ifmgr_wan_enabled | bool
        - not ansible_check_mode

    - name: Retire the prior deployment's exact managed networkd inputs
      ansible.builtin.include_tasks: prune-mwan-networkd-inputs.yml

    - name: Apply pending reloads after managed input retirement
      ansible.builtin.meta: flush_handlers

    - name: Verify role state after managed input retirement
      ansible.builtin.include_tasks: verify-mwan-role-state.yml
      when:
        - mwan_ifmgr_wan_enabled | bool
        - not ansible_check_mode

    - name: Remove the accepted role input backup
      ansible.builtin.file:
        path: "{{ mwan_role_backup.path }}"
        state: absent
      when:
        - mwan_ifmgr_wan_enabled | bool
        - not ansible_check_mode

  rescue:
    - name: Record the rejected configuration stage
      ansible.builtin.set_fact:
        mwan_role_activation_failure: "{{ ansible_failed_task.name }}: {{ ansible_failed_result.msg }}"

    - name: Recover the captured role inputs
      when:
        - mwan_ifmgr_wan_enabled | bool
        - not ansible_check_mode
        - mwan_role_snapshot_ready | bool
        - not mwan_operation_armed | bool
      block:
        - name: Restore the captured role inputs after staging or activation fails
          ansible.builtin.include_tasks: recover-mwan-role-inputs.yml
          when: not (mwan_transfer_snapshot_ready | bool)

        - name: Reverse the selected connection through verified external ownership
          ansible.builtin.include_tasks: recover-mwan-connection.yml
          when: mwan_transfer_snapshot_ready | bool
      rescue:
        - name: Fail with the configuration and recovery errors
          ansible.builtin.fail:
            msg: >-
              Role activation failed: {{ mwan_role_activation_failure }}.
              Recovery failed: {{ ansible_failed_task.name }}: {{ ansible_failed_result.msg }}.
              The role input backup remains at {{ mwan_role_backup.path }}.

    - name: Fail after restoring the prior role configuration
      ansible.builtin.fail:
        msg: >-
          Role activation failed: {{ mwan_role_activation_failure }}.
          The prior role inputs and applied state passed recovery verification.
      when:
        - mwan_ifmgr_wan_enabled | bool
        - not ansible_check_mode
        - mwan_role_snapshot_ready | bool
        - not mwan_operation_armed | bool

    - name: Fail the rejected configuration stage
      ansible.builtin.fail:
        msg: "{{ mwan_role_activation_failure }}"

  always:
    - name: Remove temporary controller transfer documents
      ansible.builtin.file:
        path: "{{ mwan_transfer_controller_directory.path }}"
        state: absent
      delegate_to: localhost
      become: false
      vars:
        ansible_connection: local
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
      when: mwan_transfer_controller_created | bool
