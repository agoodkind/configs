---
# Pull one pinned GitHub release onto the controller and verify it, so a deploy
# installs the release its own inventory names: no --release flag and no
# staging step outside the play. Each deploy play that installs a released
# binary imports this file at its top, once per release it reads, with:
#
#   release_repo        the GitHub repository the release is published from
#   release_tag         the release tag
#   release_assets      a list of {name, checksum}; checksum is sha256:<hex> as
#                       the release's checksums.txt lists the archive
#   release_var_prefix  mwan or opnsensectl; names the facts set at the end
#
# release_stage_root, the controller directory the releases unpack under, and
# release_signer_repo, the repository whose reusable workflow signs every
# release, are declared once in group_vars/all. The controller needs gh logged
# in, because the attestation check and the tag lookup go through it.
#
# Every task runs on the controller, and it runs for each host of the play one
# at a time rather than once: deploy-proxmox with no --limit spans both
# hypervisors, whose environments pin different releases, and a run_once task
# would stage one release for both. A second run downloads and unpacks
# nothing: get_url skips an archive already on disk with the pinned checksum,
# and unarchive is skipped once the marker its unpack writes exists. The
# marker carries the archive's checksum in its name, and an unpack directory
# without the pinned archive's marker is emptied before the unpack, so a pin
# that moves to a different checksum under the same tag unpacks again into a
# directory that holds nothing of the earlier archive. The controller tasks
# also run in check mode, so a --check deploy stages the release without
# touching a host.
#
# Layout under <release_stage_root>/<release_var_prefix>/<release_tag>/:
#   <name>_<goos>_<goarch>.tar.gz   each archive as published
#   <goos>_<goarch>/                the binary archive, whose name is the
#                                   binary (<binary>_<goos>_<goarch>.tar.gz),
#                                   named by its platform so the plays'
#                                   linux_amd64/mwan and
#                                   freebsd_amd64/opnsensectl paths hold
#   <name>/                         any other archive, so the wanconfig stack
#                                   lands in wanconfig-stack/
#
# Facts set for the play: <prefix>_release_tag, <prefix>_release_commit (the
# full commit the tag points at), <prefix>_release_dir (the tag directory
# above) and, for mwan, wanconfig_stack_dir. release_tag_dir,
# release_unpack_plan, and release_commit_lookup are this file's scratch.

- name: Start the unpack plan of {{ release_var_prefix }}
  ansible.builtin.set_fact:
    release_tag_dir: "{{ release_stage_root }}/{{ release_var_prefix }}/{{ release_tag }}"
    release_unpack_plan: []

# <name>_<goos>_<goarch>.tar.gz splits at its last two underscores into the
# name and the platform. regex_findall returns the capture group itself, so no
# backreference escape passes through Jinja string parsing.
- name: Derive the unpack directory of each archive of {{ release_var_prefix }}
  vars:
    release_asset_name: "{{ item.name | regex_replace('_[^_]+_[^_]+\\.tar\\.gz$', '') }}"
    release_asset_platform: "{{ item.name | regex_findall('_([^_]+_[^_]+)\\.tar\\.gz$') | first }}"
    release_asset_folder: >-
      {{ release_asset_platform if release_asset_name == release_var_prefix else release_asset_name }}
    release_asset_dir: "{{ release_tag_dir }}/{{ release_asset_folder }}"
    # The hex after the algorithm, so the marker names the exact archive.
    release_asset_digest: "{{ item.checksum.split(':') | last }}"
  ansible.builtin.set_fact:
    release_unpack_plan: >-
      {{ release_unpack_plan + [{
           'name': item.name,
           'checksum': item.checksum,
           'archive': release_tag_dir ~ '/' ~ item.name,
           'dir': release_asset_dir,
           'marker': release_asset_dir ~ '/.unpacked-' ~ release_asset_digest
         }] }}
  loop: "{{ release_assets }}"
  loop_control:
    label: "{{ item.name }}"

# The pin is inventory data, so a pin that leaves out the binary archive, or
# gives an archive a checksum that is not sha256:<hex>, is a group_vars
# mistake. It fails here, on the controller, before the play reaches a host:
# without this check an empty pin plans nothing, the facts below are still
# set, and the deploy fails at its first copy after earlier plays have already
# changed the host. An archive named without its platform suffix, or pinned
# without a checksum, already fails in the plan above.
- name: Refuse a plan of {{ release_var_prefix }} without its binary archive
  ansible.builtin.assert:
    that:
      - "release_unpack_plan | map(attribute='name') | select('match', '^' ~ release_var_prefix ~ '_[^_]+_[^_]+[.]tar[.]gz$') | list | length > 0"
      - "release_unpack_plan | map(attribute='checksum') | reject('match', '^sha256:[0-9a-f]{64}$') | list | length == 0"
    fail_msg: >-
      {{ release_var_prefix }}_release_assets must list the {{ release_var_prefix }}
      binary archive ({{ release_var_prefix }}_<goos>_<goarch>.tar.gz) and give
      each archive its sha256:<hex> checksum; got {{ release_assets | to_json }}

- name: Look for the unpack marker of each archive of {{ release_var_prefix }}
  delegate_to: localhost
  become: false
  check_mode: false
  ansible.builtin.stat:
    path: "{{ item.marker }}"
  loop: "{{ release_unpack_plan }}"
  loop_control:
    label: "{{ item.name }}"
  register: release_unpack_markers

# An unpack directory holds the members of exactly one archive. Without the
# pinned archive's marker it is removed before the unpack below, so a member
# of an earlier archive at the same tag cannot linger beside the new ones and
# reach a host through a whole-directory copy.
- name: Remove the unpack directory of each archive not yet unpacked of {{ release_var_prefix }}
  delegate_to: localhost
  become: false
  throttle: 1
  check_mode: false
  ansible.builtin.file:
    path: "{{ item.item.dir }}"
    state: absent
  loop: "{{ release_unpack_markers.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: not item.stat.exists

- name: Create the stage directories of {{ release_var_prefix }}
  delegate_to: localhost
  become: false
  throttle: 1
  check_mode: false
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop: "{{ [release_tag_dir] + (release_unpack_plan | map(attribute='dir') | list) }}"

- name: Download the release archives of {{ release_var_prefix }}
  delegate_to: localhost
  become: false
  throttle: 1
  check_mode: false
  ansible.builtin.get_url:
    url: "https://github.com/{{ release_repo }}/releases/download/{{ release_tag }}/{{ item.name }}"
    dest: "{{ item.archive }}"
    checksum: "{{ item.checksum }}"
    mode: "0644"
  loop: "{{ release_unpack_plan }}"
  loop_control:
    label: "{{ item.name }}"

# The attestation ties the archive to the workflow run that built it, so an
# archive replaced after publication fails here even when its checksum was
# copied from the same replaced release. The check is scoped to the release
# repository, so an attested artifact of another repository under the same
# owner fails too; because the release workflow is reusable and lives in
# another repository, that signer is named as well, or gh rejects the
# repository match.
- name: Verify the GitHub attestation of each archive of {{ release_var_prefix }}
  delegate_to: localhost
  become: false
  throttle: 1
  check_mode: false
  ansible.builtin.command:
    argv:
      - gh
      - attestation
      - verify
      - "{{ item.archive }}"
      - --repo
      - "{{ release_repo }}"
      - --signer-repo
      - "{{ release_signer_repo }}"
  loop: "{{ release_unpack_plan }}"
  loop_control:
    label: "{{ item.name }}"
  changed_when: false

- name: Unpack each archive of {{ release_var_prefix }}
  delegate_to: localhost
  become: false
  throttle: 1
  check_mode: false
  ansible.builtin.unarchive:
    src: "{{ item.archive }}"
    dest: "{{ item.dir }}"
    remote_src: true
    creates: "{{ item.marker }}"
  loop: "{{ release_unpack_plan }}"
  loop_control:
    label: "{{ item.name }}"

# The marker the unpack above checks. It is written only after a whole archive
# unpacked into a directory emptied for it, and its name carries that
# archive's checksum, so a directory that holds it holds the members of
# exactly that archive and nothing else.
- name: Mark each unpacked archive of {{ release_var_prefix }}
  delegate_to: localhost
  become: false
  throttle: 1
  check_mode: false
  ansible.builtin.copy:
    content: "{{ item.checksum }}\n"
    dest: "{{ item.marker }}"
    mode: "0644"
  loop: "{{ release_unpack_plan }}"
  loop_control:
    label: "{{ item.name }}"

- name: Resolve the release tag of {{ release_var_prefix }} to its commit
  delegate_to: localhost
  become: false
  check_mode: false
  ansible.builtin.command:
    argv:
      - gh
      - api
      - "repos/{{ release_repo }}/commits/{{ release_tag }}"
      - --jq
      - .sha
  register: release_commit_lookup
  changed_when: false

- name: Name the release for the play as {{ release_var_prefix }}
  ansible.builtin.set_fact:
    "{{ release_var_prefix }}_release_tag": "{{ release_tag }}"
    "{{ release_var_prefix }}_release_commit": "{{ release_commit_lookup.stdout | trim }}"
    "{{ release_var_prefix }}_release_dir": "{{ release_tag_dir }}"

- name: Name the wanconfig stack directory for the play
  ansible.builtin.set_fact:
    wanconfig_stack_dir: "{{ release_tag_dir }}/wanconfig-stack"
  when: release_var_prefix == 'mwan'
