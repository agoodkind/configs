---
- name: Start the bounded packet captures
  ansible.builtin.command:
    argv:
      - pct
      - exec
      - "{{ item.2 }}"
      - --
      - timeout
      - "{{ testbed_routing_checks.capture_timeout_seconds }}"
      - tcpdump
      - -n
      - -i
      - "{{ item.3 }}"
      - -c
      - "1"
      - "{{ item.4 }}"
  loop: "{{ routing_captures }}"
  loop_control:
    label: "{{ item.0 }} {{ item.1 }}"
  async: "{{ testbed_routing_checks.capture_timeout_seconds * 2 }}"
  poll: 0
  register: routing_capture_jobs
  changed_when: false

- name: Wait for the captures to open their interfaces
  ansible.builtin.pause:
    seconds: "{{ testbed_routing_checks.ping_timeout_seconds }}"

- name: Ping the remote client on the downstream client
  ansible.builtin.command:
    argv:
      - pct
      - exec
      - "{{ routing_check.downstream.vmid }}"
      - --
      - ping
      - "-6"
      - -c
      - "{{ testbed_routing_checks.ping_count }}"
      - -W
      - "{{ testbed_routing_checks.ping_timeout_seconds }}"
      - -I
      - "{{ routing_check.downstream.ipv6 }}"
      - "{{ routing_check.remote_client_address }}"
  changed_when: false

- name: Ping the downstream client on the remote client
  ansible.builtin.command:
    argv:
      - pct
      - exec
      - "{{ routing_node_vmids[routing_check.remote_client_node] }}"
      - --
      - ping
      - "-6"
      - -c
      - "{{ testbed_routing_checks.ping_count }}"
      - -W
      - "{{ testbed_routing_checks.ping_timeout_seconds }}"
      - -I
      - "{{ routing_check.remote_client_address }}"
      - "{{ routing_check.downstream.ipv6 }}"
  changed_when: false

- name: Record the ICMP check
  ansible.builtin.set_fact:
    routing_check_results: "{{ routing_check_results + ['connection ' ~ routing_connection.id ~ ' icmp both directions'] }}"

- name: Wait for each packet capture
  ansible.builtin.async_status:
    jid: "{{ item.ansible_job_id }}"
  loop: "{{ routing_capture_jobs.results }}"
  loop_control:
    label: "{{ item.item.0 }} {{ item.item.1 }}"
  register: routing_capture_results
  until: routing_capture_results.finished
  retries: "{{ testbed_routing_checks.capture_timeout_seconds }}"
  delay: 2
  failed_when: false

- name: Require every outbound capture and one return capture on the connection
  ansible.builtin.assert:
    that:
      - routing_capture_outbound_failures == []
      - >-
        routing_connection.tunnels == []
        or (routing_capture_returns != [] and (routing_capture_returns | selectattr('rc', 'equalto', 0) | list) != [])
    fail_msg: >-
      Routing scenario {{ routing_check.name }} connection {{ routing_connection.id }}
      with DSCP {{ routing_connection.dscp }}: the captures do not show the
      expected packets. Failed captures: {{ routing_capture_failures }}
  vars:
    routing_capture_return_phase: return through provider
    routing_capture_failures: >-
      {{ routing_capture_results.results | rejectattr('rc', 'equalto', 0)
      | map(attribute='item.item') | map('join', ' ') | list }}
    routing_capture_returns: >-
      {{ routing_capture_results.results | selectattr('item.item.0', 'equalto', routing_capture_return_phase) | list }}
    routing_capture_outbound_failures: >-
      {{ routing_capture_results.results | rejectattr('item.item.0', 'equalto', routing_capture_return_phase)
      | rejectattr('rc', 'equalto', 0) | list }}

- name: Record the packet captures
  ansible.builtin.set_fact:
    routing_check_results: "{{ routing_check_results + ['connection ' ~ routing_connection.id ~ ' packet captures'] }}"
