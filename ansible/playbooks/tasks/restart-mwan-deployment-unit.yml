- name: Authorize the next gateway mutation
  ansible.builtin.include_tasks: mwan-operation-checkpoint.yml
  vars:
    mwan_operation_phase: "restart-{{ mwan_deployment_restart_unit }}"
    mwan_operation_budget_seconds: "{{ mwan_role_job_timeout_seconds | int * 2 + 300 + 120 + 30 }}"

- name: Restart the deployment unit without waiting on SSH
  ansible.builtin.systemd:
    name: "{{ mwan_deployment_restart_unit }}"
    state: restarted
    daemon_reload: true
  async: "{{ mwan_role_job_timeout_seconds }}"
  poll: 0
  register: mwan_deployment_restart_job
  when: not ansible_check_mode

- name: Reconnect after the bounded deployment unit restart
  ansible.builtin.wait_for_connection:
    connect_timeout: 5
    delay: "{{ mwan_role_job_timeout_seconds }}"
    sleep: 5
    timeout: 300
  when: not ansible_check_mode

- name: Verify the bounded deployment unit restart completed
  ansible.builtin.async_status:
    jid: "{{ mwan_deployment_restart_job.ansible_job_id }}"
  register: mwan_deployment_restart_result
  until: mwan_deployment_restart_result is finished
  retries: 24
  delay: 5
  when: not ansible_check_mode
