- name: Read the running daemon's selected connection ownership
  timeout: "{{ mwan_operation_checkpoint_timeout_seconds }}"
  vars:
    selected: >-
      {{ (mwan_transfer_operational.stdout | from_json)['ietf-interfaces:interfaces']['interface']
         | selectattr('goodkind-mwan-steering:ownership-state.connection-id',
                      'equalto', mwan_transfer_connection_id) | list }}
  ansible.builtin.command:
    argv:
      - /usr/bin/sysrepocfg
      - --export
      - --datastore
      - operational
      - --format
      - json
      - --xpath
      - /ietf-interfaces:interfaces
  register: mwan_transfer_operational
  until: >-
    (selected | map(attribute='goodkind-mwan-steering:ownership-state.configured-owner') | list) ==
    [mwan_transfer_expected_owner]
  retries: 30
  delay: 1
  changed_when: false

- name: Verify the running daemon excludes the selected provider
  vars:
    selected: >-
      {{ ((mwan_transfer_operational.stdout | from_json)['ietf-interfaces:interfaces']['interface']
          | selectattr('goodkind-mwan-steering:ownership-state.connection-id',
                       'equalto', mwan_transfer_connection_id) | list)[0] }}
  ansible.builtin.assert:
    that: not selected['goodkind-mwan-steering:steering'].state.carrying
    fail_msg: The running daemon still selects the connection for new traffic.
  when:
    - mwan_transfer_excluded | bool
    - "'goodkind-mwan-steering:wan' in mwan_transfer_previous"
