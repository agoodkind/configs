- name: Verify the phase's downstream packet results
  ansible.builtin.include_tasks: run-mwan-transfer-packet.yml
  loop: "{{ mwan_transfer_packet_checks | selectattr('phase', 'equalto', mwan_transfer_packet_phase) | list }}"
  loop_control:
    loop_var: mwan_transfer_packet_check
    label: "{{ mwan_transfer_packet_check.description }}"
