---
# tasks/proxmox-host.yml imports this file when tack_search_proxy_enabled is
# true. These tasks install the environment's HTTPS search endpoint on the
# hypervisor that runs its OpenSearch guests. Traefik terminates the
# application's TLS with a certificate the search authority signed, admits
# only the environment's application guests, and opens a new TLS connection
# to a ready member. Traefik verifies that member against the same authority.

- name: Create the Tack search proxy directory
  ansible.builtin.file:
    path: "{{ tack_search_proxy_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Create the Tack search proxy release directory
  ansible.builtin.file:
    path: "{{ tack_search_proxy_release_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# get_url fails the download when the archive digest does not match the
# digest in the release checksum file.
- name: Download the pinned Traefik release for the Tack search proxy
  ansible.builtin.get_url:
    url: >-
      https://github.com/traefik/traefik/releases/download/v{{ tack_search_proxy_traefik_version
      }}/traefik_v{{ tack_search_proxy_traefik_version }}_linux_amd64.tar.gz
    checksum: >-
      sha256:https://github.com/traefik/traefik/releases/download/v{{ tack_search_proxy_traefik_version
      }}/traefik_v{{ tack_search_proxy_traefik_version }}_checksums.txt
    dest: "{{ tack_search_proxy_release_dir }}/traefik.tar.gz"
    owner: root
    group: root
    mode: "0644"

# A new Traefik version unpacks into its own directory because
# tack_search_proxy_release_dir includes the version, and the `creates` check
# finds no binary there. The service unit starts the binary from that
# directory, and the changed unit notifies the proxy restart handler.
- name: Unpack the pinned Traefik release for the Tack search proxy
  ansible.builtin.unarchive:
    src: "{{ tack_search_proxy_release_dir }}/traefik.tar.gz"
    dest: "{{ tack_search_proxy_release_dir }}"
    remote_src: true
    creates: "{{ tack_search_proxy_release_dir }}/traefik"
  notify: Restart tack-search-proxy

- name: Install the search certificate authority for the Tack search proxy
  ansible.builtin.copy:
    content: "{{ tack_search_proxy_ca }}\n"
    dest: "{{ tack_search_proxy_dir }}/ca.crt"
    owner: root
    group: root
    mode: "0644"
  notify: Restart tack-search-proxy

- name: Install the Tack search proxy certificate
  ansible.builtin.copy:
    content: "{{ tack_search_proxy_certificate }}\n"
    dest: "{{ tack_search_proxy_dir }}/server.crt"
    owner: root
    group: root
    mode: "0644"
  notify: Restart tack-search-proxy

- name: Install the Tack search proxy private key
  ansible.builtin.copy:
    content: "{{ tack_search_proxy_private_key }}\n"
    dest: "{{ tack_search_proxy_dir }}/server.key"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart tack-search-proxy

# The rendered file contains the readiness request credentials.
- name: Render the Tack search proxy configuration
  ansible.builtin.template:
    src: "{{ repo_root }}/proxmox/config/tack-search-proxy.yml.j2"
    dest: "{{ tack_search_proxy_dir }}/traefik.yml"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart tack-search-proxy

- name: Render the Tack search proxy service
  ansible.builtin.template:
    src: "{{ repo_root }}/proxmox/services/tack-search-proxy.service.j2"
    dest: /etc/systemd/system/tack-search-proxy.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart tack-search-proxy

- name: Enable the Tack search proxy
  ansible.builtin.systemd:
    name: tack-search-proxy
    enabled: true
    state: started
    daemon_reload: true
