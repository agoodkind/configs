- name: Create a private guest directory for prior role inputs
  ansible.builtin.tempfile:
    state: directory
    path: /var/lib/mwan
    prefix: role-inputs-
  register: mwan_role_backup

- name: Restrict prior role inputs to root
  ansible.builtin.file:
    path: "{{ mwan_role_backup.path }}"
    owner: root
    group: root
    mode: "0700"

- name: Record prior role input presence
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /etc/mwan/config.toml
    - /etc/mwan/network.json
    - /etc/systemd/network/10-mgmt.network
    - /etc/systemd/network/40-mwanbr.network
    - "/etc/systemd/network/20-{{ mwan_mgmt_iface }}.network"
    - "/etc/systemd/network/20-{{ mwan_internal_iface }}.network"
  register: mwan_role_prior_inputs

- name: Copy prior role inputs within the guest
  ansible.builtin.copy:
    remote_src: true
    src: "{{ item.item }}"
    dest: "{{ mwan_role_backup.path }}/{{ item.item | basename }}"
    mode: "0600"
  loop: "{{ mwan_role_prior_inputs.results }}"
  when: item.stat.exists
  no_log: true

- name: Read prior management and transit state
  ansible.builtin.command:
    argv: [networkctl, status, "{{ item }}", --json=short]
  loop: ["{{ mwan_mgmt_iface }}", "{{ mwan_internal_iface }}"]
  register: mwan_role_prior_state
  changed_when: false

- name: Require selected role units before staging
  ansible.builtin.assert:
    that:
      - >-
        (mwan_role_prior_state.results[0].stdout | from_json).NetworkFile in
        ['/etc/systemd/network/10-mgmt.network',
         '/etc/systemd/network/20-' ~ mwan_mgmt_iface ~ '.network']
      - >-
        (mwan_role_prior_state.results[1].stdout | from_json).NetworkFile in
        ['/etc/systemd/network/40-mwanbr.network',
         '/etc/systemd/network/20-' ~ mwan_internal_iface ~ '.network']
    fail_msg: The selected management or transit unit is outside the role preparation boundary.

- name: Read prior transit forwarding settings
  ansible.builtin.command:
    argv: [cat, "/proc/sys/net/{{ item }}/conf/{{ mwan_internal_iface }}/forwarding"]
  loop: [ipv4, ipv6]
  register: mwan_role_prior_forwarding
  changed_when: false

- name: Mark the role recovery snapshot complete
  ansible.builtin.set_fact:
    mwan_role_snapshot_ready: true
