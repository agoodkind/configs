- name: Create a private guest directory for prior role inputs
  ansible.builtin.tempfile:
    state: directory
    path: /var/lib/mwan
    prefix: role-inputs-
  register: mwan_role_backup

- name: Restrict prior role inputs to root
  ansible.builtin.file:
    path: "{{ mwan_role_backup.path }}"
    owner: root
    group: root
    mode: "0700"

- name: Record prior role input presence
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: >-
    {{ (['/etc/mwan/config.toml', '/etc/mwan/network.json', '/var/lib/mwan/networkd-inputs.json',
         '/etc/systemd/network/10-mgmt.network', '/etc/systemd/network/40-mwanbr.network',
         '/etc/systemd/network/20-' ~ mwan_mgmt_iface ~ '.network',
         '/etc/systemd/network/20-' ~ mwan_internal_iface ~ '.network']
        + mwan_transfer_capture_paths
        + (mwan_networkd_previous_inputs | map('regex_replace', '^', '/etc/systemd/network/') | list))
       | unique | list }}
  register: mwan_role_prior_inputs

- name: Copy prior role inputs within the guest
  ansible.builtin.copy:
    remote_src: true
    src: "{{ item.item }}"
    dest: "{{ mwan_role_backup.path }}/{{ item.item | basename }}"
    mode: "0600"
  loop: "{{ mwan_role_prior_inputs.results }}"
  when: item.stat.exists
  no_log: true

- name: Read prior role state through the owning services and kernel
  ansible.builtin.include_tasks: read-mwan-role-state.yml

- name: Capture prior role kernel and resolver state
  ansible.builtin.set_fact:
    mwan_role_prior_state: "{{ mwan_role_observed_networkd }}"
    mwan_role_prior_addresses: "{{ mwan_role_observed_addresses }}"
    mwan_role_prior_routes: "{{ mwan_role_observed_routes }}"
    mwan_role_prior_forwarding: "{{ mwan_role_observed_forwarding }}"
    mwan_role_prior_resolver: "{{ mwan_role_observed_resolver }}"
    mwan_role_prior_owners_json: >-
      {% set owners = {} %}
      {% for name in [mwan_mgmt_iface, mwan_internal_iface] %}
      {% if mwan_role_first_install | bool %}
      {% set _ = owners.update({name: 'networkd'}) %}
      {% else %}
      {% for connection in mwan_transfer_prior_document['ietf-interfaces:interfaces']['interface'] %}
      {% if connection.name == name %}
      {% set _ = owners.update({name: connection['goodkind-mwan-steering:owner']}) %}
      {% endif %}
      {% endfor %}
      {% endif %}
      {% endfor %}
      {{ owners | to_json }}

- name: Require selected role units before staging
  vars:
    observed: "{{ mwan_role_prior_state.results[item.index].stdout | from_json }}"
    owner: "{{ (mwan_role_prior_owners_json | from_json)[item.name] }}"
  ansible.builtin.assert:
    that:
      - >-
        (owner == 'networkd' and 'NetworkFile' in observed and observed.NetworkFile in
         [item.legacy, '/etc/systemd/network/20-' ~ item.name ~ '.network']) or
        (owner == 'mwan' and observed.AdministrativeState == 'unmanaged')
    fail_msg: The selected management or transit unit is outside the role preparation boundary.
  loop:
    - {index: 0, name: "{{ mwan_mgmt_iface }}", legacy: /etc/systemd/network/10-mgmt.network}
    - {index: 1, name: "{{ mwan_internal_iface }}", legacy: /etc/systemd/network/40-mwanbr.network}

- name: Mark the role recovery snapshot complete
  ansible.builtin.set_fact:
    mwan_role_snapshot_ready: true
