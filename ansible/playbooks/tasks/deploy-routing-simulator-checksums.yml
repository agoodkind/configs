---
- name: Read the checksum of each staged file
  ansible.builtin.stat:
    path: "{{ rsim_temp_dir }}/{{ item.0 }}"
    checksum_algorithm: sha256
  loop: "{{ rsim_files }}"
  loop_control:
    label: "{{ item.0 }}"
  register: rsim_staged

# sha256sum exits with status 1 when the guest has no file at the path.
- name: Read the checksum of each file in the guest
  ansible.builtin.command:
    argv: "{{ rsim.guest_command + ['sha256sum', item.1] }}"
  loop: "{{ rsim_files }}"
  loop_control:
    label: "{{ item.1 }}"
  register: rsim_installed
  changed_when: false
  failed_when: rsim_installed.rc not in [0, 1]
  check_mode: false

# A missing staged file has no stat.checksum and fails this task.
- name: Collect the files with a changed checksum
  ansible.builtin.set_fact:
    rsim_changed_files: >-
      {%- set changed = [] -%}
      {%- for file, staged, installed in rsim_files | zip(rsim_staged.results, rsim_installed.results) -%}
      {%- if not installed.stdout.startswith(staged.stat.checksum) -%}
      {%- set _ = changed.append(file[1]) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ changed }}

- name: Report each file that a deploy pushes
  ansible.builtin.debug:
    msg: "Check mode skips the push of {{ item }}, which differs from the staged file"
  loop: "{{ rsim_changed_files }}"
  when: ansible_check_mode
