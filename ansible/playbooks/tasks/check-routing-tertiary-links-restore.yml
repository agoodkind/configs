---
- name: Restore each tier 0 simulator link
  ansible.builtin.command:
    argv:
      - pct
      - exec
      - "{{ item.vmid }}"
      - --
      - ip
      - link
      - set
      - dev
      - eth0
      - "{{ item.up | ternary('up', 'down') }}"
  loop: "{{ tertiary_initial_links }}"
  register: tertiary_link_restoration
  changed_when: true
  failed_when: false

- name: Require restoration of every tier 0 simulator link
  ansible.builtin.assert:
    that:
      - tertiary_link_restoration.results | rejectattr('rc', 'equalto', 0) | list == []
    fail_msg: "Tier 0 link restoration failed: {{ tertiary_link_restoration.results }}"
