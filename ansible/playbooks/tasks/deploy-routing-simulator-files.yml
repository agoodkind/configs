---
- name: Collect the simulator files
  ansible.builtin.set_fact:
    rsim_files: "{{ rsim_file_lines.split(';') | map('split', '|') | list }}"
  vars:
    rsim_file_lines: >-
      {%- set lines = ['nftables.conf|/etc/nftables.conf.candidate|0644|nftables',
      'sysctl.conf|/etc/sysctl.d/90-routing-simulator.conf|0644|sysctl',
      'networkd.conf|/etc/systemd/networkd.conf.d/routing-simulator.conf|0644|network'] -%}
      {%- for interface in rsim.interfaces -%}
      {%- set _ = lines.append(interface.name ~ '.network|/etc/systemd/network/50-rsim-' ~ interface.name
      ~ '.network|0644|network') -%}
      {%- endfor -%}
      {%- for tunnel in rsim.tunnels -%}
      {%- for kind in ['netdev', 'network'] -%}
      {%- set _ = lines.append(tunnel.remote.interface ~ '.' ~ kind ~ '|/etc/systemd/network/40-rsim-'
      ~ tunnel.remote.interface ~ '.' ~ kind ~ '|0644|network') -%}
      {%- endfor -%}
      {%- endfor -%}
      {%- if rsim.bgp -%}
      {%- set _ = lines.append('frr.conf|/etc/frr/frr.conf.candidate|0640|frr') -%}
      {%- set _ = lines.append('daemons|/etc/frr/daemons|0640|frr') -%}
      {%- endif -%}
      {%- for route in rsim.tracked_routes -%}
      {%- if loop.first -%}
      {%- set _ = lines.append('home-route-tracker.sh|/usr/local/sbin/routing-home-route-tracker|0755|tracker') -%}
      {%- endif -%}
      {%- set _ = lines.append('routing-home-route-' ~ loop.index0 ~ '.service|/etc/systemd/system/routing-home-route-'
      ~ loop.index0 ~ '.service|0644|tracker') -%}
      {%- endfor -%}
      {{ lines | join(';') }}

- name: Stage the simulator files and push each changed file
  vars:
    rsim_temp_dir: "/tmp/routing-simulator-{{ rsim.vmid }}"
    rsim_template_dir: "{{ repo_root }}/testbed/routing-simulators"
  block:
    - name: Create the simulator temp directory
      ansible.builtin.file:
        path: "{{ rsim_temp_dir }}"
        state: directory
        mode: "0700"
      changed_when: false

    - name: Stage the simulator files
      ansible.builtin.import_tasks: deploy-routing-simulator-stage.yml

    - name: Push each changed simulator file
      ansible.builtin.import_tasks: deploy-routing-simulator-push.yml
  always:
    - name: Remove the simulator temp directory
      ansible.builtin.file:
        path: "{{ rsim_temp_dir }}"
        state: absent
      changed_when: false

- name: Read the simulator network units in the guest
  ansible.builtin.command:
    argv:
      - pct
      - exec
      - "{{ rsim.vmid }}"
      - --
      - find
      - /etc/systemd/network
      - -name
      - "*-rsim-*"
      - -printf
      - "%f\n"
  register: rsim_installed_units
  changed_when: false

- name: Remove each network unit that the inventory no longer declares
  ansible.builtin.command:
    argv: [pct, exec, "{{ rsim.vmid }}", --, rm, "/etc/systemd/network/{{ item }}"]
  loop: >-
    {{ rsim_installed_units.stdout_lines
    | difference(rsim_files | map(attribute=1) | map('basename') | list) }}
  register: rsim_removed_units
  changed_when: true

- name: Record the service groups with a changed file
  ansible.builtin.set_fact:
    rsim_changed_groups: >-
      {{ (rsim_push.results | selectattr('changed') | map(attribute='item.0.3') | list
      + (['network'] if rsim_removed_units.changed else [])) | unique }}
