---
- name: Save the original primary WAN configuration
  delegate_to: "{{ tertiary_primary_host }}"
  ansible.builtin.slurp:
    src: /etc/mwan/network.json
  register: tertiary_original_network

- name: Read the DHCPv6 simulator state
  ansible.builtin.command:
    argv:
      - pct
      - exec
      - "{{ service_mapping.isp_mbrains_suburban.vmid }}"
      - --
      - systemctl
      - show
      - kea-dhcp6-server.service
      - --property=ActiveState
      - --value
  register: tertiary_original_kea
  changed_when: false

- name: Read the primary interface manager state
  delegate_to: "{{ tertiary_primary_host }}"
  ansible.builtin.command:
    argv: [systemctl, show, mwan-ifmgr@wan.service, --property=ActiveState, --value]
  register: tertiary_original_ifmgr
  changed_when: false

- name: Read the failover network manager state
  delegate_to: "{{ tertiary_failover_host }}"
  ansible.builtin.command:
    argv: [systemctl, show, systemd-networkd.service, --property=ActiveState, --value]
  register: tertiary_original_networkd
  changed_when: false

- name: Require active acquisition services before the fault
  ansible.builtin.assert:
    that:
      - tertiary_original_kea.stdout == 'active'
      - tertiary_original_ifmgr.stdout == 'active'
      - tertiary_original_networkd.stdout == 'active'
    fail_msg: The SLAAC check requires active Kea, primary ifmgr, and failover networkd.

- name: Collect the temporary client identity
  ansible.builtin.set_fact:
    tertiary_test_duid_bytes: >-
      {{ tertiary_test_uuid.stdout | replace('-', '') | regex_findall('..') | join(':') }}
    tertiary_network_document: "{{ tertiary_original_network.content | b64decode | from_json }}"
    tertiary_test_interfaces: []
    tertiary_test_dropin: >-
      /etc/systemd/network/10-uplink.network.d/90-tertiary-{{ tertiary_test_uuid.stdout }}.conf

- name: Require exactly one configured tertiary interface
  ansible.builtin.assert:
    that:
      - >-
        tertiary_network_document['ietf-interfaces:interfaces']['interface']
        | selectattr('name', 'equalto', tertiary_primary_iface)
        | list | length == 1
    fail_msg: The primary WAN configuration must contain exactly one tertiary connection.

- name: Define the temporary DHCPv6 identity change
  ansible.builtin.set_fact:
    tertiary_identity_change:
      ietf-ip:ipv6:
        goodkind-mwan-steering:dhcpv6-client:
          duid: "00:04:{{ tertiary_test_duid_bytes }}"

- name: Change only the tertiary client identity in the temporary document
  ansible.builtin.set_fact:
    tertiary_test_interfaces: >-
      {{ tertiary_test_interfaces + [
      (item.name == tertiary_primary_iface)
      | ternary(item | combine(tertiary_identity_change, recursive=true), item)] }}
  loop: "{{ tertiary_network_document['ietf-interfaces:interfaces']['interface'] }}"
  loop_control:
    label: "{{ item.name }}"

- name: Build the temporary WAN document
  ansible.builtin.set_fact:
    tertiary_test_network: >-
      {{ tertiary_network_document | combine({'ietf-interfaces:interfaces':
      tertiary_network_document['ietf-interfaces:interfaces']
      | combine({'interface': tertiary_test_interfaces})}) }}

- name: Find the primary recovery records before the fault
  delegate_to: "{{ tertiary_primary_host }}"
  ansible.builtin.find:
    paths: /var/lib/mwan/wan
    patterns: '*.json'
    file_type: file
  register: tertiary_original_lease_files

- name: Read the primary recovery record identities
  delegate_to: "{{ tertiary_primary_host }}"
  ansible.builtin.slurp:
    src: "{{ item.path }}"
  loop: "{{ tertiary_original_lease_files.files }}"
  register: tertiary_original_lease_reads

- name: Initialize the original tertiary DHCPv6 record list
  ansible.builtin.set_fact:
    tertiary_original_dhcpv6_files: []

- name: Select the original tertiary DHCPv6 recovery record
  ansible.builtin.set_fact:
    tertiary_original_dhcpv6_files: "{{ tertiary_original_dhcpv6_files + [item.item.path] }}"
  loop: "{{ tertiary_original_lease_reads.results }}"
  vars:
    tertiary_record: "{{ item.content | b64decode | from_json }}"
  when:
    - tertiary_record.connection_id == 'tertiary'
    - tertiary_record.protocol == 'dhcpv6'

- name: Require the lease from the preceding DHCP phase
  ansible.builtin.assert:
    that:
      - tertiary_original_dhcpv6_files | length == 1
    fail_msg: The DHCP phase must establish the tertiary lease before the SLAAC fault.

- name: Save the complete atomically written DHCPv6 recovery record
  delegate_to: "{{ tertiary_primary_host }}"
  ansible.builtin.slurp:
    src: "{{ tertiary_original_dhcpv6_files[0] }}"
  register: tertiary_original_dhcpv6_record

- name: Inspect the networkd drop-in directory
  delegate_to: "{{ tertiary_failover_host }}"
  ansible.builtin.stat:
    path: /etc/systemd/network/10-uplink.network.d
  register: tertiary_dropin_directory_before

- name: Inspect the unique networkd test drop-in
  delegate_to: "{{ tertiary_failover_host }}"
  ansible.builtin.stat:
    path: "{{ tertiary_test_dropin }}"
  register: tertiary_dropin_before

- name: Require a fresh test drop-in path
  ansible.builtin.assert:
    that:
      - not tertiary_dropin_before.stat.exists
    fail_msg: "The unique test path already exists: {{ tertiary_test_dropin }}"

- name: Create a private validation directory
  delegate_to: "{{ tertiary_primary_host }}"
  ansible.builtin.tempfile:
    state: directory
    suffix: -tertiary-schema
  register: tertiary_validation_directory

- name: Validate the fresh identity before changing the active configuration
  block:
    - name: Print the installed schema
      delegate_to: "{{ tertiary_primary_host }}"
      ansible.builtin.command:
        argv: [mwan, install, --print-schema, "{{ tertiary_validation_directory.path }}"]
      changed_when: false

    - name: Write the temporary document for validation
      delegate_to: "{{ tertiary_primary_host }}"
      ansible.builtin.copy:
        content: "{{ tertiary_test_network | to_nice_json }}\n"
        dest: "{{ tertiary_validation_directory.path }}/network.json"
        mode: "0600"

    - name: Validate the temporary document with the installed loader
      delegate_to: "{{ tertiary_primary_host }}"
      ansible.builtin.command:
        argv:
          - mwan
          - deploy-gate
          - check-network
          - "{{ tertiary_validation_directory.path }}/network.json"
          - "{{ tertiary_validation_directory.path }}"
      changed_when: false
  always:
    - name: Remove the temporary validation directory
      delegate_to: "{{ tertiary_primary_host }}"
      ansible.builtin.file:
        path: "{{ tertiary_validation_directory.path }}"
        state: absent

- name: Stop the primary manager before saving its recovery record
  delegate_to: "{{ tertiary_primary_host }}"
  ansible.builtin.systemd:
    name: mwan-ifmgr@wan
    state: stopped

- name: Preserve and test acquisition without DHCPv6
  block:
    - name: Read the quiescent primary DHCPv6 recovery record
      delegate_to: "{{ tertiary_primary_host }}"
      ansible.builtin.slurp:
        src: "{{ tertiary_original_dhcpv6_files[0] }}"
      register: tertiary_quiescent_dhcpv6_record

    - name: Use the quiescent record for restoration
      ansible.builtin.set_fact:
        tertiary_original_dhcpv6_record: "{{ tertiary_quiescent_dhcpv6_record }}"

    - name: Stop DHCPv6 address service on the tertiary simulator
      ansible.builtin.command:
        argv:
          - pct
          - exec
          - "{{ service_mapping.isp_mbrains_suburban.vmid }}"
          - --
          - systemctl
          - stop
          - kea-dhcp6-server.service
      changed_when: true

    - name: Install the temporary primary DHCPv6 identity
      delegate_to: "{{ tertiary_primary_host }}"
      ansible.builtin.copy:
        content: "{{ tertiary_test_network | to_nice_json }}\n"
        dest: /etc/mwan/network.json
        mode: "0600"

    - name: Create the networkd drop-in directory
      delegate_to: "{{ tertiary_failover_host }}"
      ansible.builtin.file:
        path: /etc/systemd/network/10-uplink.network.d
        state: directory
        mode: "0755"

    - name: Install the temporary failover DHCPv6 identity
      delegate_to: "{{ tertiary_failover_host }}"
      ansible.builtin.copy:
        content: |
          [DHCPv6]
          DUIDType=uuid
          DUIDRawData={{ tertiary_test_duid_bytes }}
        dest: "{{ tertiary_test_dropin }}"
        mode: "0644"

    - name: Start the primary with the fresh DHCPv6 identity
      delegate_to: "{{ tertiary_primary_host }}"
      ansible.builtin.systemd:
        name: mwan-ifmgr@wan
        state: started

    - name: Restart networkd with the fresh DHCPv6 identity
      delegate_to: "{{ tertiary_failover_host }}"
      ansible.builtin.systemd:
        name: systemd-networkd
        state: restarted

    - name: Require both speakers to forward and restart without DHCPv6
      ansible.builtin.include_tasks: check-routing-tertiary-paths.yml
      vars:
        tertiary_phase: slaac
  always:
    - name: Stop the primary before restoring configuration and lease bytes
      delegate_to: "{{ tertiary_primary_host }}"
      ansible.builtin.systemd:
        name: mwan-ifmgr@wan
        state: stopped
      register: tertiary_restore_stop
      ignore_errors: true
      ignore_unreachable: true

    - name: Restore the original primary WAN configuration
      delegate_to: "{{ tertiary_primary_host }}"
      ansible.builtin.copy:
        content: "{{ tertiary_original_network.content | b64decode }}"
        dest: /etc/mwan/network.json
        mode: "0600"
      register: tertiary_restore_config
      ignore_errors: true
      ignore_unreachable: true

    - name: Restore the original primary DHCPv6 recovery record
      delegate_to: "{{ tertiary_primary_host }}"
      ansible.builtin.copy:
        content: "{{ tertiary_original_dhcpv6_record.content | b64decode }}"
        dest: "{{ tertiary_original_dhcpv6_files[0] }}"
        mode: "0600"
      register: tertiary_restore_lease
      ignore_errors: true
      ignore_unreachable: true
      when:
        - tertiary_restore_stop is succeeded
        - tertiary_restore_stop is not unreachable

    - name: Remove only this test's networkd drop-in
      delegate_to: "{{ tertiary_failover_host }}"
      ansible.builtin.file:
        path: "{{ tertiary_test_dropin }}"
        state: absent
      register: tertiary_restore_dropin
      ignore_errors: true
      ignore_unreachable: true

    - name: Restore the DHCPv6 simulator service
      ansible.builtin.command:
        argv:
          - pct
          - exec
          - "{{ service_mapping.isp_mbrains_suburban.vmid }}"
          - --
          - systemctl
          - start
          - kea-dhcp6-server.service
      changed_when: true
      register: tertiary_restore_kea
      ignore_errors: true
      ignore_unreachable: true

    - name: Restart the original failover acquisition
      delegate_to: "{{ tertiary_failover_host }}"
      ansible.builtin.systemd:
        name: systemd-networkd
        state: restarted
      register: tertiary_restore_networkd
      ignore_errors: true
      ignore_unreachable: true

    - name: Start the original primary acquisition
      delegate_to: "{{ tertiary_primary_host }}"
      ansible.builtin.systemd:
        name: mwan-ifmgr@wan
        state: started
      register: tertiary_restore_ifmgr
      ignore_errors: true
      ignore_unreachable: true

    - name: Require every independent restoration to succeed
      ansible.builtin.assert:
        that:
          - item is succeeded
          - item is not unreachable
          - item is not skipped
        fail_msg: "SLAAC fault restoration failed: {{ item }}"
      loop:
        - "{{ tertiary_restore_stop }}"
        - "{{ tertiary_restore_config }}"
        - "{{ tertiary_restore_lease }}"
        - "{{ tertiary_restore_dropin }}"
        - "{{ tertiary_restore_kea }}"
        - "{{ tertiary_restore_networkd }}"
        - "{{ tertiary_restore_ifmgr }}"

    - name: Remove the empty drop-in directory created by this test
      delegate_to: "{{ tertiary_failover_host }}"
      ansible.builtin.command:
        argv: [rmdir, /etc/systemd/network/10-uplink.network.d]
      changed_when: true
      when: not tertiary_dropin_directory_before.stat.exists

    - name: Verify the restored primary configuration bytes
      delegate_to: "{{ tertiary_primary_host }}"
      ansible.builtin.slurp:
        src: /etc/mwan/network.json
      register: tertiary_restored_network

    - name: Require byte-exact restoration of the primary configuration
      ansible.builtin.assert:
        that:
          - tertiary_restored_network.content == tertiary_original_network.content
        fail_msg: The primary WAN configuration differs after fault restoration.
