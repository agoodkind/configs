- name: Verify the live lease before the next legacy mutation
  ansible.builtin.include_tasks: mwan-operation-checkpoint.yml
  vars:
    mwan_operation_phase: gateway-preparation
    mwan_operation_reuse_lease: false

- name: Create the one-shot transition directory
  ansible.builtin.file:
    path: "/var/lib/mwan/deploy-{{ mwan_deploy_trace_id }}"
    state: directory
    mode: "0700"
  timeout: "{{ mwan_operation_task_timeout_seconds }}"

- name: Verify the live lease before the next legacy mutation
  ansible.builtin.include_tasks: mwan-operation-checkpoint.yml
  vars:
    mwan_operation_phase: gateway-preparation
    mwan_operation_reuse_lease: false

- name: Stage the candidate without replacing the running executable
  ansible.builtin.copy:
    src: "{{ mwan_release_dir }}/linux_amd64/mwan"
    dest: "/var/lib/mwan/deploy-{{ mwan_deploy_trace_id }}/mwan"
    mode: "0755"
  timeout: "{{ mwan_operation_task_timeout_seconds }}"

- name: Verify the live lease before the next legacy mutation
  ansible.builtin.include_tasks: mwan-operation-checkpoint.yml
  vars:
    mwan_operation_phase: gateway-preparation
    mwan_operation_reuse_lease: false

- name: Stage the transition runtime with the unchanged installed network intent
  ansible.builtin.copy:
    src: "{{ mwan_controller_artifact_root }}/runtime-{{ inventory_hostname }}.toml"
    dest: "/var/lib/mwan/deploy-{{ mwan_deploy_trace_id }}/config.toml"
    mode: "0600"
  no_log: true
  timeout: "{{ mwan_operation_task_timeout_seconds }}"

- name: Read the exact original WAN producer PID
  timeout: "{{ mwan_operation_task_timeout_seconds }}"
  ansible.builtin.command:
    argv: [systemctl, show, mwan-ifmgr@wan, --property=MainPID, --value]
  register: mwan_legacy_producer_pid
  changed_when: false

- name: Read the original active schema before prerequisites
  ansible.builtin.command:
    argv: [/usr/bin/sysrepoctl, --list]
  register: mwan_legacy_schema_before
  changed_when: false
  timeout: "{{ mwan_operation_task_timeout_seconds }}"

- name: Verify the live lease before the next legacy mutation
  ansible.builtin.include_tasks: mwan-operation-checkpoint.yml
  vars:
    mwan_operation_phase: gateway-preparation
    mwan_operation_reuse_lease: false

- name: Install prerequisites without restarting the original writer
  ansible.builtin.include_tasks: mwan-vm/wanconfig-packages.yml
  vars:
    mwan_install_operation_phase: gateway-preparation
    mwan_install_reuse_lease: false
    wanconfig_deb_dir: "/var/lib/mwan-wanconfig/debs/{{ mwan_release_tag }}"

- name: Read the original writer after prerequisite installation
  ansible.builtin.command:
    argv: [systemctl, show, mwan-ifmgr@wan, --property=MainPID, --value]
  register: mwan_legacy_producer_after_prerequisites
  changed_when: false
  timeout: "{{ mwan_operation_task_timeout_seconds }}"

- name: Hash the original executable and runtime pair after prerequisites
  ansible.builtin.stat:
    path: "{{ item }}"
    checksum_algorithm: sha256
    follow: true
  loop:
    - "/proc/{{ mwan_legacy_producer_pid.stdout | trim }}/exe"
    - /usr/local/bin/mwan
    - /etc/mwan/network.json
    - /etc/mwan/config.toml
  register: mwan_legacy_inputs_after_prerequisites
  timeout: "{{ mwan_operation_task_timeout_seconds }}"

- name: Read the active schema after prerequisites
  ansible.builtin.command:
    argv: [/usr/bin/sysrepoctl, --list]
  register: mwan_legacy_schema_after
  changed_when: false
  timeout: "{{ mwan_operation_task_timeout_seconds }}"

- name: Require the original writer and unchanged active inputs
  ansible.builtin.assert:
    that:
      - mwan_legacy_producer_after_prerequisites.stdout | trim == mwan_legacy_producer_pid.stdout | trim
      - >-
        mwan_legacy_inputs_after_prerequisites.results[0].stat.checksum
        == mwan_operation_baseline_files.results[0].stat.checksum
      - >-
        mwan_legacy_inputs_after_prerequisites.results[1].stat.checksum
        == mwan_operation_baseline_files.results[0].stat.checksum
      - >-
        mwan_legacy_inputs_after_prerequisites.results[2].stat.checksum
        == mwan_operation_baseline_files.results[1].stat.checksum
      - >-
        mwan_legacy_inputs_after_prerequisites.results[3].stat.checksum
        == mwan_operation_baseline_files.results[2].stat.checksum
      - mwan_legacy_schema_after.stdout == mwan_legacy_schema_before.stdout

- name: Read certificate prerequisites before the adoption lease
  ansible.builtin.include_tasks: read-mwan-testbed-certificate.yml

- name: Reserve one bounded lease for legacy capture and adoption
  ansible.builtin.include_tasks: mwan-operation-checkpoint.yml
  vars:
    mwan_operation_phase: legacy-npt-adoption
    mwan_operation_budget_seconds: "{{ mwan_operation_legacy_activation_budget_seconds }}"

- name: Initialize remote mutation completion
  ansible.builtin.set_fact:
    mwan_legacy_mutation_pending: false

- name: Complete normal WAN activation under the original adoption lease
  block:
    - name: Verify the exact lease before legacy capture
      ansible.builtin.include_tasks: mwan-operation-checkpoint.yml
      vars:
        mwan_operation_phase: legacy-npt-adoption
        mwan_operation_reuse_lease: true

    - name: Record a potentially outstanding remote mutation
      ansible.builtin.set_fact:
        mwan_legacy_mutation_pending: true

    - name: Capture legacy NPT state before replacing any runtime input
      ansible.builtin.command:
        argv:
          - "/var/lib/mwan/deploy-{{ mwan_deploy_trace_id }}/mwan"
          - ifmgr
          - --role
          - wan
          - --config
          - "/var/lib/mwan/deploy-{{ mwan_deploy_trace_id }}/config.toml"
          - --capture-legacy-npt
          - "/var/lib/mwan/deploy-{{ mwan_deploy_trace_id }}/legacy-npt.json"
          - --producer-pid
          - "{{ mwan_legacy_producer_pid.stdout | trim }}"
          - --producer-sha256
          - "{{ mwan_operation_baseline_files.results[0].stat.checksum }}"
      timeout: "{{ mwan_operation_native_timeout_seconds }}"
      async: "{{ mwan_operation_native_timeout_seconds }}"
      poll: 5
      changed_when: true

    - name: Record verified remote mutation completion
      ansible.builtin.set_fact:
        mwan_legacy_mutation_pending: false

    - name: Install the runtime environment after verified capture
      ansible.builtin.include_tasks: install-mwan-runtime-environment.yml
      vars:
        mwan_install_operation_phase: legacy-npt-adoption
        mwan_install_reuse_lease: true
        mwan_install_notify_wan: false

    - name: Verify the live lease before the next legacy mutation
      ansible.builtin.include_tasks: mwan-operation-checkpoint.yml
      vars:
        mwan_operation_phase: legacy-npt-adoption
        mwan_operation_reuse_lease: true
        mwan_operation_budget_seconds: >-
          {{ mwan_operation_metadata_timeout_seconds | int * 2
             + mwan_operation_reconnect_timeout_seconds | int + 5
             + mwan_legacy_poll_budget_seconds | int
             + mwan_operation_checkpoint_timeout_seconds | int * 8 }}

    - name: Record a potentially outstanding remote mutation
      ansible.builtin.set_fact:
        mwan_legacy_mutation_pending: true

    - name: Stop the exact legacy WAN writer without waiting on SSH
      timeout: "{{ mwan_operation_metadata_timeout_seconds }}"
      ansible.builtin.systemd:
        name: mwan-ifmgr@wan
        state: stopped
      async: "{{ mwan_operation_task_timeout_seconds }}"
      poll: 0
      register: mwan_legacy_stop_job

    - name: Reconnect after the bounded legacy stop
      timeout: "{{ mwan_operation_reconnect_timeout_seconds | int + 5 }}"
      ansible.builtin.wait_for_connection:
        connect_timeout: 5
        sleep: 5
        timeout: "{{ mwan_operation_reconnect_timeout_seconds }}"

    - name: Verify the exact live operation before reading the stopped producer
      ansible.builtin.include_tasks: mwan-operation-checkpoint.yml
      vars:
        mwan_operation_phase: legacy-npt-adoption
        mwan_operation_acquire: false
        mwan_operation_completion_only: true
        mwan_operation_reuse_lease: true
        mwan_operation_budget_seconds: "{{ mwan_legacy_poll_budget_seconds }}"

    - name: Verify the legacy stop completed
      timeout: "{{ mwan_legacy_status_timeout_seconds }}"
      ansible.builtin.async_status:
        jid: "{{ mwan_legacy_stop_job.ansible_job_id }}"
      register: mwan_legacy_stop_result
      until: mwan_legacy_stop_result is finished
      retries: "{{ mwan_legacy_status_retries }}"
      delay: 5

    - name: Record verified remote mutation completion
      ansible.builtin.set_fact:
        mwan_legacy_mutation_pending: false

    - name: Verify the live lease before reading the stopped process
      ansible.builtin.include_tasks: mwan-operation-checkpoint.yml
      vars:
        mwan_operation_phase: legacy-npt-adoption
        mwan_operation_reuse_lease: true

    - name: Require the captured legacy process to be absent
      timeout: "{{ mwan_operation_metadata_timeout_seconds }}"
      ansible.builtin.stat:
        path: "/proc/{{ mwan_legacy_producer_pid.stdout | trim }}"
      register: mwan_legacy_producer_after_stop
      failed_when: mwan_legacy_producer_after_stop.stat.exists

    - name: Verify the live lease before the next legacy mutation
      ansible.builtin.include_tasks: mwan-operation-checkpoint.yml
      vars:
        mwan_operation_phase: legacy-npt-adoption
        mwan_operation_reuse_lease: true

    - name: Record a potentially outstanding remote mutation
      ansible.builtin.set_fact:
        mwan_legacy_mutation_pending: true

    - name: Adopt the captured legacy NPT receipts before normal activation
      ansible.builtin.command:
        argv:
          - "/var/lib/mwan/deploy-{{ mwan_deploy_trace_id }}/mwan"
          - ifmgr
          - --role
          - wan
          - --config
          - "/var/lib/mwan/deploy-{{ mwan_deploy_trace_id }}/config.toml"
          - --adopt-legacy-npt
          - "/var/lib/mwan/deploy-{{ mwan_deploy_trace_id }}/legacy-npt.json"
      timeout: "{{ mwan_operation_native_timeout_seconds }}"
      async: "{{ mwan_operation_native_timeout_seconds }}"
      poll: 5
      changed_when: true

    - name: Record verified remote mutation completion
      ansible.builtin.set_fact:
        mwan_legacy_mutation_pending: false

    - name: Verify the exact lease before replacing the runtime
      ansible.builtin.include_tasks: mwan-operation-checkpoint.yml
      vars:
        mwan_operation_phase: legacy-npt-adoption
        mwan_operation_reuse_lease: true

    - name: Record a potentially outstanding remote mutation
      ansible.builtin.set_fact:
        mwan_legacy_mutation_pending: true

    - name: Install the approved normal runtime without an adoption flag
      ansible.builtin.copy:
        src: "{{ mwan_controller_artifact_root }}/runtime-{{ inventory_hostname }}.toml"
        dest: /etc/mwan/config.toml
        mode: "0600"
      timeout: "{{ mwan_operation_metadata_timeout_seconds }}"
      no_log: true

    - name: Record verified remote mutation completion
      ansible.builtin.set_fact:
        mwan_legacy_mutation_pending: false

    - name: Install the verified normal daemon and embedded units
      ansible.builtin.include_tasks: install-mwan-core-runtime.yml
      vars:
        mwan_install_operation_phase: legacy-npt-adoption
        mwan_install_reuse_lease: true
        mwan_install_notify_wan: false

    - name: Verify the exact lease before normal WAN activation
      ansible.builtin.include_tasks: mwan-operation-checkpoint.yml
      vars:
        mwan_operation_phase: legacy-npt-adoption
        mwan_operation_reuse_lease: true
        mwan_operation_budget_seconds: >-
          {{ mwan_operation_metadata_timeout_seconds | int
             + mwan_operation_reconnect_timeout_seconds | int + 5
             + mwan_legacy_start_poll_budget_seconds | int
             + mwan_operation_observation_timeout_seconds | int
             + mwan_legacy_health_budget_seconds | int
             + mwan_operation_checkpoint_timeout_seconds | int * 10 }}

    - name: Record a potentially outstanding remote mutation
      ansible.builtin.set_fact:
        mwan_legacy_mutation_pending: true

    - name: Start the candidate WAN writer under the adoption lease
      ansible.builtin.systemd:
        name: mwan-ifmgr@wan
        state: started
        daemon_reload: true
      timeout: "{{ mwan_operation_metadata_timeout_seconds }}"
      async: "{{ mwan_operation_metadata_timeout_seconds }}"
      poll: 0
      register: mwan_legacy_start_job

    - name: Reconnect after normal WAN activation
      ansible.builtin.wait_for_connection:
        connect_timeout: 5
        sleep: 5
        timeout: "{{ mwan_operation_reconnect_timeout_seconds }}"
      timeout: "{{ mwan_operation_reconnect_timeout_seconds | int + 5 }}"

    - name: Verify the exact operation before reading startup completion
      ansible.builtin.include_tasks: mwan-operation-checkpoint.yml
      vars:
        mwan_operation_phase: legacy-npt-adoption
        mwan_operation_acquire: false
        mwan_operation_completion_only: true
        mwan_operation_reuse_lease: true
        mwan_operation_budget_seconds: >-
          {{ mwan_legacy_start_poll_budget_seconds | int + mwan_operation_observation_timeout_seconds | int
             + mwan_legacy_health_budget_seconds | int }}

    - name: Require the normal WAN writer startup to complete
      ansible.builtin.async_status:
        jid: "{{ mwan_legacy_start_job.ansible_job_id }}"
      register: mwan_legacy_start_result
      until: mwan_legacy_start_result is finished
      retries: "{{ mwan_legacy_start_status_retries }}"
      delay: 5
      timeout: "{{ mwan_legacy_status_timeout_seconds }}"

    - name: Record verified remote mutation completion
      ansible.builtin.set_fact:
        mwan_legacy_mutation_pending: false

    - name: Verify the exact lease before fresh application observations
      ansible.builtin.include_tasks: mwan-operation-checkpoint.yml
      vars:
        mwan_operation_phase: legacy-npt-adoption
        mwan_operation_reuse_lease: true
        mwan_operation_budget_seconds: >-
          {{ mwan_operation_observation_timeout_seconds | int + mwan_legacy_health_budget_seconds | int }}

    - name: Record the post-start health boundary on the hypervisor clock
      delegate_to: "{{ mwan_proxmox_delegate }}"
      ansible.builtin.command:
        argv: [date, --utc, '+%Y-%m-%dT%H:%M:%S.%6NZ']
      register: mwan_legacy_activation_time
      changed_when: false
      timeout: "{{ mwan_operation_observation_timeout_seconds }}"

    - name: Initialize the bounded post-start application verdict
      ansible.builtin.set_fact:
        mwan_legacy_health_ready: false
        mwan_legacy_health_candidate: false

    - name: Read fresh application results within the declared health budget
      ansible.builtin.include_tasks: verify-mwan-legacy-health.yml
      loop: "{{ range(0, mwan_legacy_health_retries | int + 1) | list }}"
      loop_control:
        loop_var: mwan_legacy_health_attempt
      when: not mwan_legacy_health_ready | bool

    - name: Require the actual post-start application verdict
      ansible.builtin.assert:
        that: [mwan_legacy_health_ready | bool]

    - name: Record the completed normal activation for shared staging
      ansible.builtin.set_fact:
        mwan_core_runtime_activated: true
  always:
    - name: Release the lease after every issued mutation completed
      ansible.builtin.include_tasks: mwan-operation-checkpoint.yml
      vars:
        mwan_operation_phase: legacy-npt-adoption
        mwan_operation_acquire: false
        mwan_operation_reuse_lease: false
      when: not mwan_legacy_mutation_pending | bool
