---
# routing_stamp_family is the nftables family, ip or ip6, of the packets the
# downstream client sends to routing_stamp_destinations.
- name: Collect the client stamp
  ansible.builtin.set_fact:
    routing_stamp:
      vmid: "{{ service_mapping[testbed_routing_checks.downstream_client].vmid }}"
      script: >-
        nft add table {{ routing_stamp_family }} {{ testbed_routing_stamp_table }}
        && nft flush table {{ routing_stamp_family }} {{ testbed_routing_stamp_table }}
        && nft add chain {{ routing_stamp_family }} {{ testbed_routing_stamp_table }} output
        '{ type filter hook output priority mangle; }'
        && nft add rule {{ routing_stamp_family }} {{ testbed_routing_stamp_table }} output
        {{ routing_stamp_family }} daddr '{ {{ routing_stamp_destinations | join(', ') }} }'
        {{ routing_stamp_family }} dscp set {{ testbed_routing_forced_dscp[routing_stamp_connection] }}

- name: Stamp the downstream client's {{ routing_stamp_family }} packets for {{ routing_stamp_connection }}
  ansible.builtin.command:
    argv: [pct, exec, "{{ routing_stamp.vmid }}", --, sh, -c, "{{ routing_stamp.script }}"]
  changed_when: true
