---
- name: Check upstream loss and recovery
  when: routing_recovery.upstream_nodes != []
  block:
    - name: Read the clock before the upstream loss
      ansible.builtin.command:
        argv: [date, +%s]
      register: routing_upstream_loss_start
      changed_when: false

    - name: Stop FRR on each upstream router
      ansible.builtin.command:
        argv: [pct, exec, "{{ routing_node_vmids[item] }}", --, systemctl, stop, frr.service]
      loop: "{{ routing_recovery.upstream_nodes }}"
      changed_when: true

    - name: Wait until packets routed by the scenario fail
      ansible.builtin.command:
        argv: "{{ routing_recovery_probe }}"
      register: routing_upstream_loss_probe
      changed_when: false
      failed_when: false
      until: routing_upstream_loss_probe.rc != 0
      retries: "{{ routing_recovery.wait_retries }}"
      delay: "{{ testbed_routing_checks.retry_delay_seconds }}"

    - name: Require failed packets after the upstream loss
      ansible.builtin.assert:
        that:
          - routing_upstream_loss_probe.rc != 0
        fail_msg: "Routing scenario {{ routing_recovery.name }}: packets still pass after the upstream loss"
  always:
    - name: Start FRR on each upstream router
      ansible.builtin.command:
        argv: [pct, exec, "{{ routing_node_vmids[item] }}", --, systemctl, start, frr.service]
      loop: "{{ routing_recovery.upstream_nodes }}"
      register: routing_upstream_start
      changed_when: true
      until: routing_upstream_start.rc == 0
      retries: "{{ testbed_routing_checks.restore_retries }}"
      delay: "{{ testbed_routing_checks.retry_delay_seconds }}"
      ignore_errors: true

    - name: Read the FRR state on each upstream router
      ansible.builtin.command:
        argv: [pct, exec, "{{ routing_node_vmids[item] }}", --, systemctl, is-active, frr.service]
      loop: "{{ routing_recovery.upstream_nodes }}"
      register: routing_upstream_state
      changed_when: false
      failed_when: false

    - name: Require active FRR on each upstream router
      ansible.builtin.assert:
        that:
          - routing_upstream_inactive == []
        fail_msg: >-
          Routing scenario {{ routing_recovery.name }}: FRR is not active on
          {{ routing_upstream_inactive }}
      vars:
        routing_upstream_inactive: >-
          {{ routing_upstream_state.results | rejectattr('rc', 'equalto', 0) | map(attribute='item') | list }}

    - name: Wait until packets routed by the scenario pass again
      ansible.builtin.command:
        argv: "{{ routing_recovery_probe }}"
      register: routing_upstream_recovery_probe
      changed_when: false
      until: routing_upstream_recovery_probe.rc == 0
      retries: "{{ routing_recovery.wait_retries }}"
      delay: "{{ testbed_routing_checks.retry_delay_seconds }}"

    - name: Read the clock after the upstream recovery
      ansible.builtin.command:
        argv: [date, +%s]
      register: routing_upstream_loss_end
      changed_when: false

- name: Record the upstream loss check
  ansible.builtin.set_fact:
    routing_recovery_results: >-
      {{ routing_recovery_results + [{
        'fault': 'upstream loss',
        'seconds_from_fault_to_recovery':
          routing_upstream_loss_end.stdout | int - routing_upstream_loss_start.stdout | int
      }] }}
  when: routing_recovery.upstream_nodes != []
