---
- name: Provision the environment credential source
  ansible.builtin.include_tasks: tack-service-secret-source.yml

- name: Read the generated service credential files
  ansible.builtin.slurp:
    src: "{{ tack_secrets_dir }}/{{ item }}"
  delegate_to: "{{ tack_service_secret_source }}"
  loop: "{{ tack_service_credential_files }}"
  register: tack_service_credentials
  no_log: true

- name: Create the service credential directory
  ansible.builtin.file:
    path: "{{ tack_secrets_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Deliver the generated service credential files
  ansible.builtin.copy:
    content: "{{ item.content | b64decode }}"
    dest: "{{ tack_secrets_dir }}/{{ item.item }}"
    owner: root
    group: root
    mode: "0600"
  loop: "{{ tack_service_credentials.results }}"
  no_log: true

- name: Install the service connection file renderer
  ansible.builtin.template:
    src: "{{ repo_root }}/tack/render-secret-files.sh.j2"
    dest: "{{ tack_secrets_dir }}/render-connections.sh"
    owner: root
    group: root
    mode: "0700"
  when: tack_cluster_role != 'search'

- name: Render the service connection files
  ansible.builtin.command:
    argv: [/bin/bash, "{{ tack_secrets_dir }}/render-connections.sh"]
  changed_when: false
  no_log: true
  when: tack_cluster_role != 'search'

- name: Deliver the externally managed object store credentials
  ansible.builtin.copy:
    content: "{{ item.value }}\n"
    dest: "{{ tack_secrets_dir }}/{{ item.name }}"
    owner: root
    group: root
    mode: "0600"
  loop:
    - {name: TACK_BACKUP_S3_ACCESS_KEY_ID, value: "{{ tack_backup_s3_access_key }}"}
    - {name: TACK_BACKUP_S3_SECRET_ACCESS_KEY, value: "{{ tack_backup_s3_secret_key }}"}
  when:
    - tack_backup_enabled | bool
    - not tack_app_guest | bool
    - tack_cluster_role != 'search'
  no_log: true

- name: Read the generated OpenSearch password hashes
  ansible.builtin.set_fact:
    tack_search_password_hashes: >-
      {{ dict(tack_service_credentials.results | map(attribute='item')
              | zip(tack_service_credentials.results | map(attribute='content')
                    | map('b64decode') | map('trim') | map('regex_replace', '^[^:]*:', ''))) }}
  no_log: true
  when: tack_cluster_role == 'search'

- name: Refuse an OpenSearch password hash that is not a bcrypt hash
  ansible.builtin.assert:
    that:
      - tack_search_password_hashes.values() | reject('match', '\$2y\$12\$[./A-Za-z0-9]{53}\Z') | list == []
    fail_msg: >-
      Each OpenSearch hash file in {{ tack_secrets_dir }} on
      {{ tack_service_secret_source }} must contain one name:hash line
      with a 60-character $2y$ bcrypt hash of cost 12.
    quiet: true
  when: tack_cluster_role == 'search'

- name: Record the generated OpenSearch password hashes
  ansible.builtin.set_fact:
    tack_search_runtime_password_hash: "{{ tack_search_password_hashes['OPENSEARCH_PASSWORD.hash'] }}"
    tack_search_maintenance_password_hash: "{{ tack_search_password_hashes['OPENSEARCH_MAINTENANCE_PASSWORD.hash'] }}"
    tack_search_health_password_hash: "{{ tack_search_password_hashes['OPENSEARCH_HEALTH_PASSWORD.hash'] }}"
  no_log: true
  when: tack_cluster_role == 'search'

- name: Read the bounded operator credential for search guest verification
  ansible.builtin.slurp:
    src: "{{ tack_secrets_dir }}/TACK_OPS_AUDIT_OPERATOR_DSN"
  delegate_to: "{{ tack_service_secret_source }}"
  register: tack_search_operator_dsn
  when: tack_cluster_role == 'search'
  no_log: true

- name: Deliver only the verification operator connection to search guests
  ansible.builtin.copy:
    content: "{{ tack_search_operator_dsn.content | b64decode }}"
    dest: "{{ tack_secrets_dir }}/TACK_OPS_AUDIT_OPERATOR_DSN"
    owner: root
    group: root
    mode: "0600"
  when: tack_cluster_role == 'search'
  no_log: true
