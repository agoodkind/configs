- name: Authorize the next gateway mutation
  ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/mwan-operation-checkpoint.yml"
  vars:
    mwan_operation_phase: gateway-preparation

- name: Reload udev rules
  timeout: "{{ mwan_operation_task_timeout_seconds }}"
  async: "{{ mwan_operation_task_timeout_seconds }}"
  poll: 5
  ansible.builtin.command:
    argv: [udevadm, control, --reload]
  changed_when: false

- name: Authorize the next gateway mutation
  ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/mwan-operation-checkpoint.yml"
  vars:
    mwan_operation_phase: gateway-preparation
    mwan_operation_budget_seconds: "{{ mwan_role_job_timeout_seconds | int * 2 + 300 + 120 + 30 }}"

- name: Trigger net udev events without waiting on SSH
  timeout: "{{ mwan_operation_task_timeout_seconds }}"
  ansible.builtin.command:
    argv: [udevadm, trigger, --action=add, --subsystem-match=net]
  async: "{{ mwan_role_job_timeout_seconds }}"
  poll: 0
  register: mwan_udev_trigger_job
  changed_when: true

- name: Reconnect after the net udev trigger deadline
  ansible.builtin.wait_for_connection:
    connect_timeout: 5
    delay: "{{ mwan_role_job_timeout_seconds }}"
    sleep: 5
    timeout: 300

- name: Verify the net udev trigger completed
  ansible.builtin.async_status:
    jid: "{{ mwan_udev_trigger_job.ansible_job_id }}"
  register: mwan_udev_trigger_result
  until: mwan_udev_trigger_result is finished
  retries: 24
  delay: 5
