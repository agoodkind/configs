---
# The node integrity dry run uses LOG_DISABLE_STDOUT=true and no_log.
# The playbook writes stdout to tack_node_integrity_output on the operator
# machine as 0600, including in check mode, and hides arguments and diff.
# The playbook prints only the written file's byte count and SHA-256 digest.
- name: Write the node integrity dry run stdout to the operator output file
  ansible.builtin.copy:
    content: "{{ tack_ops_dry_run.stdout }}"
    dest: "{{ tack_node_integrity_output }}"
    mode: "0600"
  delegate_to: localhost
  become: false
  check_mode: false
  diff: false
  no_log: true

- name: Read the output file size and SHA-256 digest
  ansible.builtin.stat:
    path: "{{ tack_node_integrity_output }}"
    checksum_algorithm: sha256
  delegate_to: localhost
  become: false
  register: tack_node_integrity_capture

- name: Show the output file size and SHA-256 digest
  ansible.builtin.debug:
    msg: >-
      The output file {{ tack_node_integrity_output }} contains
      {{ tack_node_integrity_capture.stat.size }} bytes with SHA-256
      {{ tack_node_integrity_capture.stat.checksum }}.
