---
# Reclaim deleted tack guest blocks (TACK-498): the thin pool's discard mode and
# the weekly guest trim that frees what the guests deleted. Imported by
# proxmox-host.yml and gated by tack_guest_fstrim_enabled, which only the
# hypervisor that runs the tack guests sets.

- name: Read the thin pool's discard mode
  ansible.builtin.command:
    argv: [lvs, --noheadings, -o, discards, "{{ tack_thin_pool }}"]
  register: tack_thin_pool_discards_now
  changed_when: false

# The pool frees and reuses the chunks either way. passdown also sends one
# discard per freed run to the NVMe, which charges about 16 ms per command and
# stalls the ledger's own writes behind them, so a trim of a few hundred
# gigabytes is minutes of degraded IO for a drive that reclaims on its own.
- name: Process discards in the thin pool without passing them to the drive
  ansible.builtin.command:
    argv: [lvchange, --discards, "{{ tack_thin_pool_discards }}", "{{ tack_thin_pool }}"]
  when: tack_thin_pool_discards not in tack_thin_pool_discards_now.stdout
  changed_when: true

# The per-delete path, ext4 discarding blocks as it frees them, is the guest's
# root filesystem mount option, which OpenTofu owns with the rest of the guest
# shape (opentofu/*/tack*.tf). The weekly trim below is the fallback for what
# that path misses.
- name: Deploy tack-guest-fstrim service
  ansible.builtin.template:
    src: "{{ repo_root }}/common/services/tack-guest-fstrim.service.j2"
    dest: /etc/systemd/system/tack-guest-fstrim.service
    owner: root
    group: root
    mode: "0644"
  register: tack_guest_fstrim_service

- name: Deploy tack-guest-fstrim timer
  ansible.builtin.template:
    src: "{{ repo_root }}/common/timers/tack-guest-fstrim.timer.j2"
    dest: /etc/systemd/system/tack-guest-fstrim.timer
    owner: root
    group: root
    mode: "0644"
  register: tack_guest_fstrim_timer

- name: Enable tack-guest-fstrim timer
  ansible.builtin.systemd:
    name: tack-guest-fstrim.timer
    enabled: true
    state: started
    daemon_reload: >-
      {{
        tack_guest_fstrim_service.changed
        or tack_guest_fstrim_timer.changed
      }}
