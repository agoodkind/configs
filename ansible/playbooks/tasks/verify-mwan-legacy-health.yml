- name: Wait between bounded legacy application observations
  ansible.builtin.pause:
    seconds: "{{ mwan_operation_poll_seconds }}"
  when: mwan_legacy_health_attempt | int > 0

- name: Read the exact operation after candidate startup
  delegate_to: "{{ mwan_proxmox_delegate }}"
  ansible.builtin.command:
    argv:
      - /usr/local/bin/mwan
      - deploy-gate
      - status
      - "{{ mwan_deploy_trace_id }}"
      - "{{ mwan_operation_generation }}"
      - --config
      - /etc/mwan/config.toml
  register: mwan_legacy_health_status
  vars:
    operation: "{{ mwan_legacy_health_status.stdout | from_json }}"
  changed_when: false
  failed_when: >-
    operation.operation_id != mwan_deploy_trace_id
    or operation.generation != mwan_operation_generation
    or operation.status != 'armed'
    or operation.lease.id != mwan_operation_lease_id
    or operation.lease.phase != 'legacy-npt-adoption'
  timeout: "{{ mwan_operation_observation_timeout_seconds }}"

- name: Read the actual hypervisor clock after the observation record
  delegate_to: "{{ mwan_proxmox_delegate }}"
  ansible.builtin.command:
    argv: [date, --utc, '+%Y-%m-%dT%H:%M:%S.%6NZ']
  register: mwan_legacy_health_now
  changed_when: false
  timeout: "{{ mwan_operation_observation_timeout_seconds }}"

- name: Require the lease to remain live during application verification
  vars:
    operation: "{{ mwan_legacy_health_status.stdout | from_json }}"
    expires: >-
      {{ operation.lease.expires_at
         | regex_replace('(?<=[.][0-9]{6})[0-9]+', '')
         | regex_replace('(?<=:[0-9]{2})(?=Z$|[+-][0-9]{2}:[0-9]{2}$)', '.000000') }}
  ansible.builtin.assert:
    that:
      - >-
        expires | to_datetime('%Y-%m-%dT%H:%M:%S.%f%z')
        > (mwan_legacy_health_now.stdout | trim | to_datetime('%Y-%m-%dT%H:%M:%S.%f%z'))

- name: Require the complete nonempty application check set
  vars:
    operation: "{{ mwan_legacy_health_status.stdout | from_json }}"
  ansible.builtin.set_fact:
    mwan_legacy_health_candidate: >-
      {{ operation.required_checks != []
         and operation.results != []
         and (operation.results | map(attribute='check_id') | sort)
             == (operation.required_checks | map(attribute='id') | sort) }}

- name: Verify every required application result against its declared identity and freshness
  vars:
    operation: "{{ mwan_legacy_health_status.stdout | from_json }}"
    result: "{{ (operation.results | selectattr('check_id', 'equalto', item.id) | list)[0] }}"
    observed: >-
      {{ result.observed_at
         | regex_replace('(?<=[.][0-9]{6})[0-9]+', '')
         | regex_replace('(?<=:[0-9]{2})(?=Z$|[+-][0-9]{2}:[0-9]{2}$)', '.000000') }}
    now: "{{ mwan_legacy_health_now.stdout | trim | to_datetime('%Y-%m-%dT%H:%M:%S.%f%z') }}"
    boundary: "{{ mwan_legacy_activation_time.stdout | trim | to_datetime('%Y-%m-%dT%H:%M:%S.%f%z') }}"
  ansible.builtin.set_fact:
    mwan_legacy_health_candidate: >-
      {{ mwan_legacy_health_candidate | bool
         and result.availability == 'complete' and result.outcome == 'pass'
         and result.dimension == item.dimension and result.operation == item.operation
         and result.target == item.target and result.family == item.family
         and result.observer == item.observer
         and (observed | to_datetime('%Y-%m-%dT%H:%M:%S.%f%z')) >= boundary
         and (observed | to_datetime('%Y-%m-%dT%H:%M:%S.%f%z')) <= now
         and (now - (observed | to_datetime('%Y-%m-%dT%H:%M:%S.%f%z'))).total_seconds()
             <= item.max_age_seconds | int }}
  loop: "{{ (mwan_legacy_health_status.stdout | from_json).required_checks }}"
  when: mwan_legacy_health_candidate | bool

- name: Record the actual complete application verdict
  ansible.builtin.set_fact:
    mwan_legacy_health_ready: "{{ mwan_legacy_health_candidate }}"
