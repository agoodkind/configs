- name: Release the last possible writer before restoring prior inputs
  ansible.builtin.include_tasks: release-mwan-connection.yml

- name: Keep prior source selection excluded during recovery
  ansible.builtin.set_fact:
    mwan_transfer_recovery_excluded: true

- name: Restore the compatible prior runtime pair and captured networkd inputs
  ansible.builtin.include_tasks: recover-mwan-role-inputs.yml

- name: Verify the restored source daemon before restoring selection
  ansible.builtin.include_tasks: read-mwan-transfer-state.yml
  vars:
    mwan_transfer_expected_owner: "{{ mwan_transfer_previous['goodkind-mwan-steering:owner'] }}"
    mwan_transfer_excluded: true

- name: Verify recovered assignments and downstream packets
  ansible.builtin.include_tasks: verify-mwan-transfer-acquisition.yml
  vars:
    mwan_transfer_acquisition_connection: "{{ mwan_transfer_previous }}"

- name: Verify downstream replies through the recovered excluded source
  ansible.builtin.include_tasks: run-mwan-transfer-packets.yml
  vars:
    mwan_transfer_packet_phase: recovered

- name: Restore the captured source selection policy
  ansible.builtin.copy:
    remote_src: true
    src: "{{ mwan_role_backup.path }}/network.json"
    dest: /etc/mwan/network.json
    mode: "0600"

- name: Restart with the recovered source selection policy
  ansible.builtin.include_tasks: restart-mwan-ifmgr.yml
  vars:
    mwan_ifmgr_restart_timeout_seconds: "{{ mwan_role_job_timeout_seconds }}"

- name: Verify the recovered source configuration is loaded
  ansible.builtin.include_tasks: read-mwan-transfer-state.yml
  vars:
    mwan_transfer_expected_owner: "{{ mwan_transfer_previous['goodkind-mwan-steering:owner'] }}"
    mwan_transfer_excluded: false

- name: Verify recovered downstream packets after restoring selection
  ansible.builtin.include_tasks: run-mwan-transfer-packets.yml
  vars:
    mwan_transfer_packet_phase: recovered

- name: Remove the verified recovered connection backup
  ansible.builtin.file:
    path: "{{ mwan_role_backup.path }}"
    state: absent
