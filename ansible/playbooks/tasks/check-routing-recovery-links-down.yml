---
# Each routing_fault_links entry is a simulator node and an interface name.
- name: Set each fault link down
  ansible.builtin.command:
    argv: [pct, exec, "{{ routing_node_vmids[item.0] }}", --, ip, link, set, dev, "{{ item.1 }}", down]
  loop: "{{ routing_fault_links }}"
  changed_when: true
