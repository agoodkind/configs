---
- name: Report each declared connection that the scenario does not check
  ansible.builtin.debug:
    msg: >-
      Routing scenario {{ routing_check.name }} does not check connection
      {{ item.id }}: {{ item.reason }}
  loop: "{{ routing_check.unchecked_connections }}"
  loop_control:
    label: "{{ item.id }}"

- name: Check each connection of the scenario with its forced DSCP
  ansible.builtin.include_tasks:
    file: check-routing-mwan-connection.yml
  loop: "{{ routing_check.checked_connections }}"
  loop_control:
    loop_var: routing_connection_id
    label: "{{ routing_connection_id }} dscp {{ testbed_routing_forced_dscp[routing_connection_id] }}"
