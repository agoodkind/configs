---
# These tasks run one OpenSearch member on a search guest (TACK-539). The
# guest runs only this service from the Tack compose file. The audited ops
# commands deploy the model, provision the index, and check the cluster.

# OpenSearch refuses to start below the memory-map limit when it binds a
# routable address. deploy-proxmox sets that limit on the hypervisor. The
# guest checks the value before it starts OpenSearch.
- name: Read the memory-map limit the hypervisor sets
  ansible.builtin.slurp:
    src: /proc/sys/vm/max_map_count
  register: tack_search_memory_map_count_read

- name: Refuse to start OpenSearch below its memory-map limit
  ansible.builtin.assert:
    that:
      - (tack_search_memory_map_count_read.content | b64decode | trim | int) >= tack_search_memory_map_count
    fail_msg: >-
      {{ inventory_hostname }} reads vm.max_map_count
      {{ tack_search_memory_map_count_read.content | b64decode | trim }},
      and OpenSearch requires at least {{ tack_search_memory_map_count }}. Run
      deploy-proxmox on this guest's hypervisor, then deploy again.

- name: Create the OpenSearch node directory
  ansible.builtin.file:
    path: "{{ tack_search_node_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the OpenSearch node certificate
  ansible.builtin.copy:
    content: "{{ tack_search_node_certificate }}\n"
    dest: "{{ tack_search_node_dir }}/node.crt"
    owner: root
    group: root
    mode: "0644"
  notify: Restart the OpenSearch member

- name: Install the OpenSearch node private key
  ansible.builtin.copy:
    content: "{{ tack_search_node_private_key }}\n"
    dest: "{{ tack_search_node_dir }}/node.key"
    owner: "{{ tack_search_container_uid }}"
    group: "{{ tack_search_container_uid }}"
    mode: "0600"
  no_log: true
  notify: Restart the OpenSearch member

# The member accepts the admin certificate on its HTTP port only. The HTTP
# trust file lists the search authority, which signs the proxy and member
# certificates, and the self-signed admin certificate.
- name: Install the OpenSearch HTTP trust file
  ansible.builtin.copy:
    content: "{{ tack_search_ca }}\n{{ tack_search_admin_certificate }}\n"
    dest: "{{ tack_search_node_dir }}/http-ca.crt"
    owner: root
    group: root
    mode: "0644"
  notify: Restart the OpenSearch member

# The admin private key exists only in the vault and, during a deploy, in a
# temporary file on the deploy host. The guest keeps no admin certificate or
# key file.
- name: Remove the OpenSearch admin certificate and key from the guest
  ansible.builtin.file:
    path: "{{ tack_search_node_dir }}/{{ item }}"
    state: absent
  loop:
    - admin.crt
    - admin.key

# OpenSearch reads the user, role, and role mapping files into the security
# index on the first start, when the security index does not exist yet.
# tasks/tack-search-security.yml writes changed files into the index of a
# running member.
- name: Install the OpenSearch user file
  ansible.builtin.template:
    src: "{{ repo_root }}/tack/opensearch-internal-users.yml.j2"
    dest: "{{ tack_search_node_dir }}/internal_users.yml"
    owner: "{{ tack_search_container_uid }}"
    group: "{{ tack_search_container_uid }}"
    mode: "0600"
  register: tack_search_users_file
  no_log: true

- name: Install the OpenSearch role file
  ansible.builtin.copy:
    src: "{{ repo_root }}/tack/opensearch-roles.yml"
    dest: "{{ tack_search_node_dir }}/roles.yml"
    owner: "{{ tack_search_container_uid }}"
    group: "{{ tack_search_container_uid }}"
    mode: "0600"
  register: tack_search_roles_file

- name: Install the OpenSearch role mapping file
  ansible.builtin.template:
    src: "{{ repo_root }}/tack/opensearch-roles-mapping.yml.j2"
    dest: "{{ tack_search_node_dir }}/roles_mapping.yml"
    owner: "{{ tack_search_container_uid }}"
    group: "{{ tack_search_container_uid }}"
    mode: "0600"
  register: tack_search_roles_mapping_file

- name: Create Tack install directory (search guest)
  ansible.builtin.file:
    path: "{{ tack_install_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

# The compose file requires the environment variables on every guest,
# including a guest that runs one service from it.
- name: Deploy Tack environment file (search guest)
  ansible.builtin.template:
    src: "{{ repo_root }}/tack/tack.env.j2"
    dest: "{{ tack_install_dir }}/.env"
    owner: root
    group: root
    mode: "0600"
  notify: Restart the OpenSearch member

- name: Deploy Tack compose override (search member)
  ansible.builtin.template:
    src: "{{ repo_root }}/tack/docker-compose.override.yml.j2"
    dest: "{{ tack_install_dir }}/docker-compose.override.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart the OpenSearch member

- name: Fetch docker-compose.yml from the tack repo SOT (search guest)
  ansible.builtin.get_url:
    url: "https://api.github.com/repos/agoodkind/tack/contents/docker-compose.yml?ref={{ tack_commit }}"
    dest: "{{ tack_install_dir }}/docker-compose.yml"
    headers:
      Authorization: "Bearer {{ tack_repo_read_token }}"
      Accept: "application/vnd.github.raw"
    owner: root
    group: root
    mode: "0644"
    force: true
  no_log: true
  notify: Restart the OpenSearch member

# The notified "Restart the OpenSearch member" handler must finish before "Start the OpenSearch member" runs.
- name: Run notified handlers before starting the OpenSearch member
  ansible.builtin.meta: flush_handlers

- name: Start the OpenSearch member
  ansible.builtin.command:
    cmd: docker compose up -d opensearch
    chdir: "{{ tack_install_dir }}"
  changed_when: true

- name: Apply the OpenSearch security files to the running member
  ansible.builtin.import_tasks: tack-search-security.yml
