---
# Render and push config files to a single ISP LXC.
# Called from deploy-testbed.yml with a merged isp variable.
#
# isp fields: id, name, ipv6_enabled, routed_ipv6_enabled, routed_ipv6_prefix,
#   routed_ipv4_prefix, routed_ipv4_route_to, v4_subnet, dynamic_v4,
#   static_v4_block, static_v4_route_to, v4_reservations.
# DHCPv6/RA uses pd_prefix, pd_len, ia_na, slaac_prefix, and optional ia_na_pool.
# The return-route service installs delegated IPv6 and configured family routes.
# DHCPv4 uses v4_gateway, v4_pool, and v4_dns.
#   repo_root is set in the parent play.

- name: Validate optional ISP protocol timings
  ansible.builtin.assert:
    that:
      - isp.dhcp4_renew_seconds == 'omit' or isp.dhcp4_renew_seconds > 0
      - isp.dhcp4_rebind_seconds == 'omit' or isp.dhcp4_rebind_seconds > 0
      - isp.dhcp6_renew_seconds == 'omit' or isp.dhcp6_renew_seconds > 0
      - isp.dhcp6_rebind_seconds == 'omit' or isp.dhcp6_rebind_seconds > 0
      - isp.dhcp6_dns_servers | type_debug == 'list'
      - isp.dhcp4_socket_max_retries >= 0
      - isp.dhcp4_socket_retry_wait_ms > 0
      - isp.dhcp6_socket_max_retries >= 0
      - isp.dhcp6_socket_retry_wait_ms > 0
      - isp.ra_dns_servers | type_debug == 'list'
      - isp.ra_dns_servers == [] or isp.ra_dns_lifetime_seconds != 'omit'
      - isp.ra_dns_lifetime_seconds == 'omit' or isp.ra_dns_lifetime_seconds > 0
      - isp.ra_prefix_preferred_lifetime_seconds == 'omit' or isp.ra_prefix_preferred_lifetime_seconds >= 0
      - isp.ra_prefix_valid_lifetime_seconds == 'omit' or isp.ra_prefix_valid_lifetime_seconds >= 0
      - >-
        (isp.ra_prefix_preferred_lifetime_seconds == 'omit') ==
        (isp.ra_prefix_valid_lifetime_seconds == 'omit')
      - >-
        isp.ra_prefix_valid_lifetime_seconds == 'omit' or
        isp.ra_prefix_preferred_lifetime_seconds <= isp.ra_prefix_valid_lifetime_seconds

- name: Render ISP DHCPv6 template to suburban /tmp
  ansible.builtin.template:
    src: "{{ repo_root }}/testbed/isp-lxc/{{ item.src }}"
    dest: "/tmp/isp-{{ isp.id }}-{{ item.name }}"
    mode: "0644"
  loop:
    - { src: kea-dhcp6.conf.j2, name: kea-dhcp6.conf }
  when: isp.ipv6_enabled | bool

- name: Render ISP kea-dhcp4 config (dynamic-v4 ISPs only)
  ansible.builtin.template:
    src: "{{ repo_root }}/testbed/isp-lxc/kea-dhcp4.conf.j2"
    dest: "/tmp/isp-{{ isp.id }}-kea-dhcp4.conf"
    mode: "0644"
  when: isp.dynamic_v4 | bool

- name: Copy ISP kea-rebind helpers to suburban /tmp
  ansible.builtin.copy:
    src: "{{ repo_root }}/testbed/isp-lxc/{{ item }}"
    dest: "/tmp/isp-{{ isp.id }}-{{ item }}"
    mode: "0644"
  loop:
    - kea-rebind.sh
    - kea-rebind.service

- name: Push ISP configs into LXC
  ansible.builtin.command:
    cmd: >-
      pct push {{ isp.id }}
      /tmp/isp-{{ isp.id }}-{{ item.tmp }}
      {{ item.dest }}
  loop:
    - { tmp: kea-rebind.service, dest: /etc/systemd/system/kea-rebind.service }
  changed_when: true

- name: Push ISP DHCPv6 config into LXC
  ansible.builtin.command:
    cmd: >-
      pct push {{ isp.id }}
      /tmp/isp-{{ isp.id }}-{{ item.tmp }}
      {{ item.dest }}
  loop:
    - { tmp: kea-dhcp6.conf, dest: /etc/kea/kea-dhcp6.conf }
  when: isp.ipv6_enabled | bool
  changed_when: true

- name: Push ISP kea-rebind watcher into LXC
  ansible.builtin.command:
    cmd: >-
      pct push {{ isp.id }}
      /tmp/isp-{{ isp.id }}-kea-rebind.sh
      /usr/local/sbin/kea-rebind
      --perms 0755
  changed_when: true

- name: Push ISP kea-dhcp4 config into LXC (dynamic-v4 ISPs only)
  ansible.builtin.command:
    cmd: >-
      pct push {{ isp.id }}
      /tmp/isp-{{ isp.id }}-kea-dhcp4.conf
      /etc/kea/kea-dhcp4.conf
  changed_when: true
  when: isp.dynamic_v4 | bool

- name: Clean up ISP temp files
  ansible.builtin.file:
    path: "/tmp/isp-{{ isp.id }}-{{ item }}"
    state: absent
  loop:
    - kea-dhcp6.conf
    - kea-dhcp4.conf
    - kea-rebind.sh
    - kea-rebind.service

- name: Reload and enable ISP services
  ansible.builtin.command:
    cmd: >-
      pct exec {{ isp.id }} -- sh -c
      'systemctl daemon-reload
      && systemctl enable --now kea-rebind
      && systemctl restart kea-rebind'
  changed_when: true

# The simulator OpenTofu root installs the Kea packages. Apply the root of a rebuilt
# simulator before deploy-testbed runs, because the Kea services below do not exist until
# OpenTofu installs those packages.
- name: Enable and restart ISP DHCPv6 service
  ansible.builtin.command:
    cmd: >-
      pct exec {{ isp.id }} -- sh -c
      'systemctl enable --now kea-dhcp6-server
      && systemctl restart kea-dhcp6-server'
  when: isp.ipv6_enabled | bool
  changed_when: true

- name: Read DHCPv6 and RA service states
  ansible.builtin.command:
    argv:
      - pct
      - exec
      - "{{ isp.id }}"
      - --
      - systemctl
      - show
      - "{{ item }}"
      - --property=LoadState,ActiveState,UnitFileState
      - --no-pager
  loop:
    - kea-dhcp6-server.service
    - radvd.service
  register: isp_ipv6_service_states
  changed_when: false

- name: Stop and disable DHCPv6 and RA services
  ansible.builtin.command:
    argv:
      - pct
      - exec
      - "{{ isp.id }}"
      - --
      - systemctl
      - disable
      - --now
      - "{{ item.item }}"
  loop: >-
    {{ isp_ipv6_service_states.results
       | selectattr('stdout', 'search', 'LoadState=loaded') | list }}
  when: not isp.ipv6_enabled | bool
  changed_when: "'ActiveState=active' in item.stdout or 'UnitFileState=enabled' in item.stdout"

- name: Enable and restart kea-dhcp4 (dynamic-v4 ISPs only)
  ansible.builtin.command:
    cmd: >-
      pct exec {{ isp.id }} -- sh -c
      'systemctl enable --now kea-dhcp4-server
      && systemctl restart kea-dhcp4-server'
  changed_when: true
  when: isp.dynamic_v4 | bool

# The ISP sims serve DHCP with Kea. Some LXC base images still carry an enabled
# dnsmasq unit that binds the same DHCP socket, so it fails "address already in
# use" on every boot and leaves the sim in systemd `degraded`. It is a leftover,
# not part of this deploy, so stop, disable, and mask it. The `|| true` keeps the
# task idempotent on images that never had dnsmasq.
- name: Mask leftover dnsmasq on ISP LXC (Kea owns DHCP)
  ansible.builtin.command:
    cmd: >-
      pct exec {{ isp.id }} -- sh -c
      'systemctl disable --now dnsmasq 2>/dev/null || true;
      systemctl mask dnsmasq 2>/dev/null || true;
      systemctl reset-failed dnsmasq 2>/dev/null || true'
  changed_when: true
