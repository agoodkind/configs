---
# Render and push config files to a single ISP LXC.
# Called from deploy-testbed.yml with loop_var: isp
#
# isp fields: id, name, ipv6_enabled, routed_ipv6_enabled, routed_ipv6_prefix,
#   v4_subnet, dynamic_v4, static_v4_block, static_v4_route_to, v4_reservations.
# DHCPv6/RA uses pd_prefix, pd_len, ia_na, slaac_prefix, and optional ia_na_pool.
# Both delegated and configured IPv6 routes use mwan_vm_ll as their next hop.
# DHCPv4 uses v4_gateway, v4_pool, and v4_dns.
#   repo_root is set in the parent play.

- name: Render ISP nftables config to suburban /tmp
  ansible.builtin.template:
    src: "{{ repo_root }}/testbed/isp-lxc/nftables.conf.j2"
    dest: "/tmp/isp-{{ isp.id }}-nftables.conf"
    mode: "0644"

- name: Render ISP DHCPv6 and RA templates to suburban /tmp
  ansible.builtin.template:
    src: "{{ repo_root }}/testbed/isp-lxc/{{ item.src }}"
    dest: "/tmp/isp-{{ isp.id }}-{{ item.name }}"
    mode: "0644"
  loop:
    - { src: kea-dhcp6.conf.j2, name: kea-dhcp6.conf }
    - { src: radvd.conf.j2, name: radvd.conf }
  when: isp.ipv6_enabled | bool

- name: Render ISP return routes to suburban /tmp
  ansible.builtin.template:
    src: "{{ repo_root }}/testbed/isp-lxc/pd-route.service.j2"
    dest: "/tmp/isp-{{ isp.id }}-pd-route.service"
    mode: "0644"
  when: isp.ipv6_enabled | bool or isp.routed_ipv6_enabled | bool

- name: Render ISP kea-dhcp4 config (dynamic-v4 ISPs only)
  ansible.builtin.template:
    src: "{{ repo_root }}/testbed/isp-lxc/kea-dhcp4.conf.j2"
    dest: "/tmp/isp-{{ isp.id }}-kea-dhcp4.conf"
    mode: "0644"
  when: isp.dynamic_v4 | bool

- name: Copy ISP sysctl to suburban /tmp
  ansible.builtin.copy:
    src: "{{ repo_root }}/testbed/isp-lxc/sysctl-isp.conf"
    dest: "/tmp/isp-{{ isp.id }}-sysctl-isp.conf"
    mode: "0644"

- name: Copy ISP kea-rebind helpers to suburban /tmp
  ansible.builtin.copy:
    src: "{{ repo_root }}/testbed/isp-lxc/{{ item }}"
    dest: "/tmp/isp-{{ isp.id }}-{{ item }}"
    mode: "0644"
  loop:
    - kea-rebind.sh
    - kea-rebind.service

- name: Push ISP configs into LXC
  ansible.builtin.command:
    cmd: >-
      pct push {{ isp.id }}
      /tmp/isp-{{ isp.id }}-{{ item.tmp }}
      {{ item.dest }}
  loop:
    - { tmp: nftables.conf, dest: /etc/nftables.conf }
    - { tmp: kea-rebind.service, dest: /etc/systemd/system/kea-rebind.service }
    - { tmp: sysctl-isp.conf, dest: /etc/sysctl.d/99-isp.conf }
  changed_when: true

- name: Push ISP DHCPv6 and RA configs into LXC
  ansible.builtin.command:
    cmd: >-
      pct push {{ isp.id }}
      /tmp/isp-{{ isp.id }}-{{ item.tmp }}
      {{ item.dest }}
  loop:
    - { tmp: kea-dhcp6.conf, dest: /etc/kea/kea-dhcp6.conf }
    - { tmp: radvd.conf, dest: /etc/radvd.conf }
  when: isp.ipv6_enabled | bool
  changed_when: true

- name: Push ISP return routes into LXC
  ansible.builtin.command:
    argv:
      - pct
      - push
      - "{{ isp.id }}"
      - "/tmp/isp-{{ isp.id }}-pd-route.service"
      - /etc/systemd/system/pd-route.service
  when: isp.ipv6_enabled | bool or isp.routed_ipv6_enabled | bool
  changed_when: true

- name: Push ISP kea-rebind watcher into LXC
  ansible.builtin.command:
    cmd: >-
      pct push {{ isp.id }}
      /tmp/isp-{{ isp.id }}-kea-rebind.sh
      /usr/local/sbin/kea-rebind
      --perms 0755
  changed_when: true

- name: Push ISP kea-dhcp4 config into LXC (dynamic-v4 ISPs only)
  ansible.builtin.command:
    cmd: >-
      pct push {{ isp.id }}
      /tmp/isp-{{ isp.id }}-kea-dhcp4.conf
      /etc/kea/kea-dhcp4.conf
  changed_when: true
  when: isp.dynamic_v4 | bool

- name: Clean up ISP temp files
  ansible.builtin.file:
    path: "/tmp/isp-{{ isp.id }}-{{ item }}"
    state: absent
  loop:
    - kea-dhcp6.conf
    - kea-dhcp4.conf
    - radvd.conf
    - nftables.conf
    - pd-route.service
    - kea-rebind.sh
    - kea-rebind.service
    - sysctl-isp.conf

- name: Apply ISP sysctl
  ansible.builtin.command:
    cmd: pct exec {{ isp.id }} -- sysctl --system
  changed_when: false
  failed_when: false

- name: Reload and enable ISP services
  ansible.builtin.command:
    cmd: >-
      pct exec {{ isp.id }} -- sh -c
      'systemctl daemon-reload
      && systemctl enable --now nftables kea-rebind
      && systemctl restart nftables kea-rebind'
  changed_when: true

- name: Enable and restart ISP DHCPv6 and RA services
  ansible.builtin.command:
    cmd: >-
      pct exec {{ isp.id }} -- sh -c
      'systemctl enable --now kea-dhcp6-server radvd
      && systemctl restart kea-dhcp6-server radvd'
  when: isp.ipv6_enabled | bool
  changed_when: true

- name: Enable and restart ISP return routes
  ansible.builtin.command:
    cmd: >-
      pct exec {{ isp.id }} -- sh -c
      'systemctl enable --now pd-route
      && systemctl restart pd-route'
  when: isp.ipv6_enabled | bool or isp.routed_ipv6_enabled | bool
  changed_when: true

- name: Enable and restart kea-dhcp4 (dynamic-v4 ISPs only)
  ansible.builtin.command:
    cmd: >-
      pct exec {{ isp.id }} -- sh -c
      'systemctl enable --now kea-dhcp4-server
      && systemctl restart kea-dhcp4-server'
  changed_when: true
  when: isp.dynamic_v4 | bool

# The ISP sims serve DHCP with Kea. Some LXC base images still carry an enabled
# dnsmasq unit that binds the same DHCP socket, so it fails "address already in
# use" on every boot and leaves the sim in systemd `degraded`. It is a leftover,
# not part of this deploy, so stop, disable, and mask it. The `|| true` keeps the
# task idempotent on images that never had dnsmasq.
- name: Mask leftover dnsmasq on ISP LXC (Kea owns DHCP)
  ansible.builtin.command:
    cmd: >-
      pct exec {{ isp.id }} -- sh -c
      'systemctl disable --now dnsmasq 2>/dev/null || true;
      systemctl mask dnsmasq 2>/dev/null || true;
      systemctl reset-failed dnsmasq 2>/dev/null || true'
  changed_when: true
