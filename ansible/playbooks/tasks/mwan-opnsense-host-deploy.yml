---
# Linux-side deploy of the opnsensectl host bridge and chardev drainer.
#
# Target: a Proxmox host that runs an OPNsense VM, reached as root.
# Pairs with mwan-opnsense-deploy.yml which installs the daemon inside the
# OPNsense guest.
#
# A chardev drainer (opnsensectl host drain) sits in front of the bridge: it
# holds the qemu chardev open and re-exposes it on a relay socket, so a bridge
# restart never disconnects the chardev and strands a guest write in the kernel.
# The bridge dials the relay instead of the chardev. See docs/ops/opnsense/wedge.md.
#
# Required vars:
#   opnsensectl_host_binary_local        controller path of the pulled released linux opnsensectl binary
#   opnsensectl_release_tag              release tag the environment pins
#   opnsensectl_release_commit           commit that tag points at
#   mwan_opnsense_drain_listen           relay socket path the drainer serves
#
# Both units start their service with --config /etc/opnsensectl/config.toml and
# read nothing else, so the first tasks below render every key they need.

- name: Ensure the OPNsense tooling config directory exists
  ansible.builtin.file:
    path: /etc/opnsensectl
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Install the OPNsense tooling config
  ansible.builtin.template:
    src: >-
      {{ playbook_dir }}/../../opnsense/config.toml.j2
    dest: /etc/opnsensectl/config.toml
    owner: root
    group: root
    mode: "0600"
  become: true
  notify:
    - Restart mwan-opnsense-drain
    - Restart mwan-opnsense-host

# The release lands beside the live binary and is verified there, so a bad
# release never replaces the binary the running units execute.
- name: Copy the opnsensectl release beside the installed binary
  ansible.builtin.copy:
    src: "{{ opnsensectl_host_binary_local }}"
    dest: /usr/local/bin/opnsensectl.incoming
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Verify the incoming opnsensectl is the released commit
  ansible.builtin.import_tasks: verify-opnsensectl-release.yml
  vars:
    opnsensectl_installed_binary: /usr/local/bin/opnsensectl.incoming

- name: Read the checksums of the installed and incoming opnsensectl
  ansible.builtin.stat:
    path: "{{ item }}"
    checksum_algorithm: sha256
  loop:
    - /usr/local/bin/opnsensectl
    - /usr/local/bin/opnsensectl.incoming
  register: opnsensectl_host_binaries
  become: true

# A service that restarts between the rename and the install below starts the
# new binary from the old unit, which fails without --config and retries until
# the restart at the end of this block. No other task runs in that window.
- name: Move the hypervisor onto the incoming opnsensectl
  when: not ansible_check_mode
  become: true
  block:
    - name: Rename the incoming opnsensectl over the installed binary
      ansible.builtin.command:
        argv:
          - mv
          - -f
          - /usr/local/bin/opnsensectl.incoming
          - /usr/local/bin/opnsensectl
      register: opnsensectl_host_rename
      changed_when: >-
        (opnsensectl_host_binaries.results[0].stat.checksum | default(''))
        != opnsensectl_host_binaries.results[1].stat.checksum

    # The install verb writes the drain and bridge units, stops, disables, and
    # deletes a leftover mwan-opnsense-drain.socket, enables both units, and
    # reloads systemd. It starts and restarts nothing. It prints one line per
    # change and ends with "install: no change" when it changed nothing. The
    # drainer binds [opnsense.drain].listen itself, so no socket unit replaces
    # the deleted one.
    - name: Install and enable the drain and bridge units with opnsensectl
      ansible.builtin.command:
        argv:
          - /usr/local/bin/opnsensectl
          - install
      register: opnsensectl_host_install
      changed_when: "'install: no change' not in opnsensectl_host_install.stdout_lines"

    # A restart, unlike a stop and start, hands the stored chardev fd to the new
    # drainer. The drainer restarts on a new binary, a rewritten unit, or a
    # deleted socket unit whose listener it still holds; the bridge restarts on
    # a new binary or a rewritten unit.
    - name: Restart the drainer onto the installed binary and unit
      ansible.builtin.systemd:
        name: mwan-opnsense-drain.service
        state: restarted
      when: >-
        opnsensectl_host_rename is changed
        or 'wrote /etc/systemd/system/mwan-opnsense-drain.service' in opnsensectl_host_install.stdout_lines
        or 'removed /etc/systemd/system/mwan-opnsense-drain.socket' in opnsensectl_host_install.stdout_lines

    - name: Restart the bridge onto the installed binary and unit
      ansible.builtin.systemd:
        name: mwan-opnsense-host.service
        state: restarted
      when: >-
        opnsensectl_host_rename is changed
        or 'wrote /etc/systemd/system/mwan-opnsense-host.service' in opnsensectl_host_install.stdout_lines

- name: Start mwan-opnsense-drain service
  ansible.builtin.systemd:
    name: mwan-opnsense-drain.service
    state: started
  become: true

- name: Start mwan-opnsense-host
  ansible.builtin.systemd:
    name: mwan-opnsense-host
    state: started
  become: true
