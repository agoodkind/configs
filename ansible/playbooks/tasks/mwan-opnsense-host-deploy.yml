---
# Linux-side deploy of the opnsensectl host bridge and chardev drainer.
#
# Target: a Proxmox host that runs an OPNsense VM, reached as root.
# Pairs with mwan-opnsense-deploy.yml which installs the daemon inside the
# OPNsense guest.
#
# A chardev drainer (opnsensectl host drain) sits in front of the bridge: it
# holds the qemu chardev open and re-exposes it on a relay socket, so a bridge
# restart never disconnects the chardev and strands a guest write in the kernel.
# The bridge dials the relay instead of the chardev. See docs/ops/opnsense/wedge.md.
#
# Required vars:
#   opnsensectl_host_binary_local        controller path of the pulled released linux opnsensectl binary
#   opnsensectl_release_tag              release tag the environment pins
#   opnsensectl_release_commit           commit that tag points at
#   mwan_opnsense_drain_listen           relay socket path the drainer serves
#
# Both units read their runtime inputs from /etc/opnsensectl/config.toml, which
# the first tasks below render. A binary that reads the [opnsense.*] tables from
# /etc/mwan/config.toml instead finds them there, and a binary that reads the new
# file falls back to that path while the new file is absent.

- name: Ensure the OPNsense tooling config directory exists
  ansible.builtin.file:
    path: /etc/opnsensectl
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Install the OPNsense tooling config
  ansible.builtin.template:
    src: >-
      {{ playbook_dir }}/../../opnsense/config.toml.j2
    dest: /etc/opnsensectl/config.toml
    owner: root
    group: root
    mode: "0600"
  become: true
  notify:
    - Restart mwan-opnsense-drain
    - Restart mwan-opnsense-host

- name: Install the opnsensectl binary
  ansible.builtin.copy:
    src: "{{ opnsensectl_host_binary_local }}"
    dest: /usr/local/bin/opnsensectl
    owner: root
    group: root
    mode: "0755"
  become: true
  notify:
    - Restart mwan-opnsense-drain
    - Restart mwan-opnsense-host

- name: Verify the hypervisor opnsensectl is the released commit
  ansible.builtin.import_tasks: verify-opnsensectl-release.yml
  vars:
    opnsensectl_installed_binary: /usr/local/bin/opnsensectl

# The install verb writes the drain and bridge units, stops, disables, and
# deletes a leftover mwan-opnsense-drain.socket, enables both units, and reloads
# systemd. It starts and restarts nothing. It prints one line per change and
# ends with "install: no change" when it changed nothing. The drainer binds
# [opnsense.drain].listen itself, so no socket unit replaces the deleted one.
- name: Install and enable the drain and bridge units with opnsensectl
  ansible.builtin.command:
    argv:
      - /usr/local/bin/opnsensectl
      - install
  register: opnsensectl_host_install
  changed_when: "'install: no change' not in opnsensectl_host_install.stdout_lines"
  become: true

# A rewritten drain unit, or a deleted socket unit whose listener the running
# drainer still holds, needs a drainer restart; a rewritten bridge unit needs a
# bridge restart. An enable alone needs neither.
- name: Restart the drainer when install changed its units
  ansible.builtin.debug:
    msg: "{{ opnsensectl_host_install.stdout_lines }}"
  changed_when: >-
    'wrote /etc/systemd/system/mwan-opnsense-drain.service' in opnsensectl_host_install.stdout_lines
    or 'removed /etc/systemd/system/mwan-opnsense-drain.socket' in opnsensectl_host_install.stdout_lines
  when: not ansible_check_mode
  notify: Restart mwan-opnsense-drain

- name: Restart the bridge when install changed its unit
  ansible.builtin.debug:
    msg: "{{ opnsensectl_host_install.stdout_lines }}"
  changed_when: >-
    'wrote /etc/systemd/system/mwan-opnsense-host.service' in opnsensectl_host_install.stdout_lines
  when: not ansible_check_mode
  notify: Restart mwan-opnsense-host

- name: Start mwan-opnsense-drain service
  ansible.builtin.systemd:
    name: mwan-opnsense-drain.service
    state: started
  become: true

- name: Start mwan-opnsense-host
  ansible.builtin.systemd:
    name: mwan-opnsense-host
    state: started
  become: true
