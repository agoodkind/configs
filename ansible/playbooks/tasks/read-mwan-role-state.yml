- name: Read management and transit networkd state
  ansible.builtin.command:
    argv: [networkctl, status, "{{ item }}", --json=short]
  loop: ["{{ mwan_mgmt_iface }}", "{{ mwan_internal_iface }}"]
  register: mwan_role_observed_networkd
  changed_when: false

- name: Read management and transit kernel addresses
  ansible.builtin.command:
    argv: [ip, -json, address, show, dev, "{{ item }}"]
  loop: ["{{ mwan_mgmt_iface }}", "{{ mwan_internal_iface }}"]
  register: mwan_role_observed_addresses
  changed_when: false

- name: Normalize role kernel address identities
  ansible.builtin.set_fact:
    mwan_role_address_identities_json: >-
      {% set links = [] %}
      {% for result in mwan_role_observed_addresses.results %}
      {% set identities = [] %}
      {% set usable = [] %}
      {% for address in (result.stdout | from_json)[0].addr_info %}
      {% if address.scope == 'global' %}
      {% set identity = [address.family, address.local | ansible.utils.ipaddr('int') | int,
                         address.prefixlen] %}
      {% set _ = identities.append(identity) %}
      {% if 'tentative' not in address and 'dadfailed' not in address %}
      {% set _ = usable.append(identity) %}
      {% endif %}
      {% endif %}
      {% endfor %}
      {% set _ = links.append({'all': identities | sort, 'usable': usable | sort}) %}
      {% endfor %}
      {{ links | to_json }}

- name: Read transit kernel return routes
  ansible.builtin.command:
    argv: [ip, "{{ item }}", -json, route, show, table, main]
  loop: ["-4", "-6"]
  register: mwan_role_observed_route_table
  changed_when: false

- name: Select the actual transit route interface
  ansible.builtin.set_fact:
    mwan_role_observed_routes:
      stdout: >-
        {{ mwan_role_observed_route_table.results | map(attribute='stdout') | map('from_json')
           | flatten | selectattr('dev', 'defined')
           | selectattr('dev', 'equalto', mwan_internal_iface) | list | to_json }}

- name: Normalize transit route snapshots
  ansible.builtin.set_fact:
    mwan_role_route_identities_json: >-
      {% set routes = [] %}
      {% for route in mwan_role_observed_routes.stdout | from_json %}
      {% set _ = routes.append(route | dict2items | rejectattr('key', 'in', ['expires', 'cache'])
                               | items2dict) %}
      {% endfor %}
      {{ routes | to_json }}

- name: Read transit kernel forwarding
  ansible.builtin.command:
    argv: [cat, "/proc/sys/net/{{ item }}/conf/{{ mwan_internal_iface }}/forwarding"]
  loop: [ipv4, ipv6]
  register: mwan_role_observed_forwarding
  changed_when: false

- name: Resolve the actual management resolver link
  ansible.builtin.command:
    argv:
      - busctl
      - --json=short
      - call
      - org.freedesktop.resolve1
      - /org/freedesktop/resolve1
      - org.freedesktop.resolve1.Manager
      - GetLink
      - i
      - "{{ (mwan_role_observed_networkd.results[0].stdout | from_json).Index }}"
  register: mwan_role_resolved_link
  changed_when: false

- name: Read the actual management DNS and search domains
  ansible.builtin.command:
    argv:
      - busctl
      - --json=short
      - get-property
      - org.freedesktop.resolve1
      - "{{ (mwan_role_resolved_link.stdout | from_json).data[0] }}"
      - org.freedesktop.resolve1.Link
      - "{{ item }}"
  loop: [DNSEx, Domains]
  register: mwan_role_observed_resolver
  changed_when: false
