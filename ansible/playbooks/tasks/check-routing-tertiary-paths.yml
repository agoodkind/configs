---
- name: Make both tier 0 simulator uplinks unavailable
  ansible.builtin.command:
    argv: [pct, exec, "{{ item.vmid }}", --, ip, link, set, dev, eth0, down]
  loop: "{{ tertiary_initial_links }}"
  changed_when: true

- name: Wait for tertiary fallback selection
  delegate_to: "{{ tertiary_primary_host }}"
  ansible.builtin.command:
    argv: [cat, "{{ hostvars[tertiary_primary_host].mwan_ifmgr_wan_health_state_file }}"]
  register: tertiary_fallback_health
  changed_when: false
  until:
    - "'att:unhealthy' in tertiary_fallback_health.stdout_lines"
    - "'webpass:unhealthy' in tertiary_fallback_health.stdout_lines"
    - "'tertiary:healthy' in tertiary_fallback_health.stdout_lines"
  retries: "{{ testbed_routing_checks.tertiary_health_retries }}"
  delay: "{{ testbed_routing_checks.tertiary_health_delay_seconds }}"

- name: Read the primary fallback addresses
  ansible.builtin.include_tasks: check-routing-tertiary-source.yml
  vars:
    tertiary_speaker:
      id: primary
      host: "{{ tertiary_primary_host }}"
      iface: "{{ tertiary_primary_iface }}"

- name: Require primary fallback packet translation
  ansible.builtin.include_tasks: check-routing-tertiary-packets.yml

- name: Restart the primary guest and require a new boot
  delegate_to: "{{ tertiary_primary_host }}"
  ansible.builtin.reboot:
    reboot_timeout: "{{ testbed_routing_checks.tertiary_boot_timeout_seconds }}"

- name: Read the primary addresses after its reboot
  ansible.builtin.include_tasks: check-routing-tertiary-source.yml
  vars:
    tertiary_speaker:
      id: primary
      host: "{{ tertiary_primary_host }}"
      iface: "{{ tertiary_primary_iface }}"

- name: Require primary packet translation after its reboot
  ansible.builtin.include_tasks: check-routing-tertiary-packets.yml

- name: Test the failover speaker while the primary agent stops announcing
  block:
    - name: Stop the primary BGP agent
      delegate_to: "{{ tertiary_primary_host }}"
      ansible.builtin.systemd:
        name: mwan-agent
        state: stopped

    - name: Allow the configured BGP hold timer to expire
      ansible.builtin.pause:
        seconds: >-
          {{ hostvars[tertiary_primary_host].bgp_hold_seconds
          + hostvars[tertiary_primary_host].bgp_keepalive_seconds }}

    - name: Read the failover speaker addresses
      ansible.builtin.include_tasks: check-routing-tertiary-source.yml
      vars:
        tertiary_speaker:
          id: failover
          host: "{{ tertiary_failover_host }}"
          iface: eth0

    - name: Require failover packet translation
      ansible.builtin.include_tasks: check-routing-tertiary-packets.yml

    - name: Restart the failover guest and require a new boot
      delegate_to: "{{ tertiary_failover_host }}"
      ansible.builtin.reboot:
        reboot_timeout: "{{ testbed_routing_checks.tertiary_boot_timeout_seconds }}"

    - name: Read the failover addresses after its reboot
      ansible.builtin.include_tasks: check-routing-tertiary-source.yml
      vars:
        tertiary_speaker:
          id: failover
          host: "{{ tertiary_failover_host }}"
          iface: eth0

    - name: Allow the backup BGP session to reconnect
      ansible.builtin.pause:
        seconds: >-
          {{ hostvars[tertiary_primary_host].bgp_hold_seconds
          + hostvars[tertiary_primary_host].bgp_keepalive_seconds }}

    - name: Require failover packet translation after its reboot
      ansible.builtin.include_tasks: check-routing-tertiary-packets.yml
  always:
    - name: Restore the primary BGP agent
      delegate_to: "{{ tertiary_primary_host }}"
      ansible.builtin.systemd:
        name: mwan-agent
        state: started

- name: Restore the tier 0 simulator uplinks
  ansible.builtin.include_tasks: check-routing-tertiary-links-restore.yml

- name: Wait for the original preferred providers to recover
  delegate_to: "{{ tertiary_primary_host }}"
  ansible.builtin.command:
    argv: [cat, "{{ hostvars[tertiary_primary_host].mwan_ifmgr_wan_health_state_file }}"]
  register: tertiary_recovery_health
  changed_when: false
  until: >-
    tertiary_recovery_health.stdout_lines
    | intersect(tertiary_initial_preferred_health) | length
    == tertiary_initial_preferred_health | length
  retries: "{{ testbed_routing_checks.tertiary_health_retries }}"
  delay: "{{ testbed_routing_checks.tertiary_health_delay_seconds }}"

- name: Require fresh connections through a preferred provider
  ansible.builtin.include_tasks: check-routing-tertiary-preferred.yml

- name: Record both speaker paths for this acquisition phase
  ansible.builtin.set_fact:
    routing_check_report: >-
      {{ routing_check_report + [{
      'scenario': 'tertiary', 'phase': tertiary_phase,
      'checks': ['primary fallback NAT44 and NAT66',
      'primary guest restart', 'BGP failover NAT44 and NAT66',
      'failover guest restart', 'preferred provider recovery']}] }}
