---
- name: Delete the stamp table on the downstream client
  ansible.builtin.import_tasks: run-routing-restore-commands.yml
  vars:
    routing_restore_commands:
      - >-
        pct exec {{ service_mapping[testbed_routing_checks.downstream_client].vmid }}
        -- nft destroy table {{ routing_stamp_family }} {{ testbed_routing_stamp_table }}
