---
# Confirms the mwan binary just installed on a Linux target is the one the
# play pulled: it must report the commit the release tag points at.
#
# The release pull at the top of the play (github-release.yml) downloaded the
# pinned release, verified its GitHub attestations, unpacked it, and set
# mwan_release_commit from the tag. The caller sets mwan_installed_binary to
# the path it just copied to.
#
# Not used inside the OPNsense guest: there the binary is installed under a
# mwan-opnsense name, and that name fast-paths straight into the daemon serve
# loop, so its identity is read through the daemon's Version RPC instead.

- name: Read installed mwan build identity
  ansible.builtin.command:
    cmd: "{{ mwan_installed_binary }} version"
  register: mwan_installed_version
  changed_when: false

# In check mode the copy above did not happen and the command did not run, so
# there is nothing to assert; the real run is where the identity is checked.
# `mwan version` prints exactly one line:
#   version=<commit>[-dirty]+<binhash> commit=<commit> dirty=<clean|dirty|unknown>
#   binhash=<binhash> libsysrepo=<major.minor.micro>
# The reported commit must be a real short SHA (seven hex digits or more) and a
# prefix of the release commit; a binary reporting "unknown" or a truncated
# value fails. The Linux release links libsysrepo, so its version is required.
- name: Fail unless the installed mwan reports the released commit
  when: not ansible_check_mode
  vars:
    mwan_version_line_pattern: >-
      {{ '^version=[0-9a-f]{7,40}(?:-dirty)?[+](?:[0-9a-f]{12}|unknown)'
      ~ ' commit=([0-9a-f]{7,40}) dirty=(?:clean|dirty|unknown)'
      ~ ' binhash=(?:[0-9a-f]{12}|unknown) libsysrepo=[0-9]+[.][0-9]+[.][0-9]+$' }}
    # Output of any other shape, including a second line, does not match and
    # yields an empty string, which the hex pattern below rejects, so no
    # separate shape check is needed. regex_findall returns the capture group
    # itself, so no backreference escape passes through Jinja string parsing.
    mwan_reported_commit: >-
      {{ mwan_installed_version.stdout | regex_findall(mwan_version_line_pattern) | first | default('') }}
  ansible.builtin.assert:
    that:
      - mwan_reported_commit is match('^[0-9a-f]{7,40}$')
      - mwan_release_commit.startswith(mwan_reported_commit)
    fail_msg: >-
      {{ mwan_installed_binary }} reports "{{ mwan_installed_version.stdout }}"
      but release {{ mwan_release_tag }} is commit {{ mwan_release_commit }}.
    success_msg: >-
      {{ mwan_installed_binary }} is release {{ mwan_release_tag }}
      ({{ mwan_release_commit[:8] }}).
