---
- name: Collect the connections that the checks stamp
  ansible.builtin.import_tasks: check-routing-connection-selection.yml

- name: Check faults and recovery with stamped client packets
  block:
    - name: Stamp the downstream client's packets for the scenario
      ansible.builtin.import_tasks: check-routing-client-stamp.yml
      vars:
        routing_stamp_connection: "{{ routing_connection_selection.checked[0] }}"
        routing_stamp_destinations: "{{ testbed_routing_scenarios[routing_scenario_name].remote_prefixes }}"

    - name: Collect the fault inputs
      ansible.builtin.import_tasks: check-routing-recovery-inputs.yml

    - name: Check link loss and recovery
      ansible.builtin.import_tasks: check-routing-recovery-link.yml

    - name: Check upstream loss and recovery
      ansible.builtin.import_tasks: check-routing-recovery-upstream.yml
      vars:
        routing_upstream_clock_format: "%Y-%m-%dT%H:%M:%SZ"

    - name: Check the undeclared prefix
      ansible.builtin.import_tasks: check-routing-recovery-undeclared.yml

    - name: Check the home route tracker
      ansible.builtin.import_tasks: check-routing-recovery-tracker.yml

    - name: Check the loss of each tunnel while another tunnel remains
      ansible.builtin.include_tasks:
        file: check-routing-recovery-tunnel.yml
      loop: "{{ routing_recovery_tunnel_losses }}"
      loop_control:
        loop_var: routing_tunnel_loss
        label: "{{ routing_tunnel_loss[0] }}"

    - name: Check each connection while its sibling on the same simulator fails
      ansible.builtin.include_tasks:
        file: check-routing-recovery-sibling.yml
      loop: "{{ routing_recovery_sibling_losses }}"
      loop_control:
        loop_var: routing_sibling_loss
        label: "{{ routing_sibling_loss[0] }} keeps {{ routing_sibling_loss[1] }}"

    - name: Check the restart of each tunnel endpoint simulator
      ansible.builtin.include_tasks:
        file: check-routing-recovery-restart.yml
      loop: "{{ routing_recovery_restarts }}"
      loop_control:
        loop_var: routing_restart
        label: "{{ routing_restart[0] }}"
  always:
    - name: Remove the client stamp
      ansible.builtin.import_tasks: check-routing-client-unstamp.yml
  vars:
    routing_stamp_family: ip6

- name: Require every required fault check
  ansible.builtin.assert:
    that:
      - routing_recovery_expected | difference(routing_recovery_results | map(attribute='fault') | list) == []
    fail_msg: >-
      Routing scenario {{ routing_recovery.name }} skipped fault checks:
      {{ routing_recovery_expected | difference(routing_recovery_results | map(attribute='fault') | list) }}
  vars:
    routing_recovery_expected: >-
      {{ ['link loss']
      + ((routing_recovery.upstream_nodes != []) | ternary(['upstream loss', 'undeclared prefix'], []))
      + ((routing_recovery.scenario.kind == 'tunnel_configured_home')
      | ternary(['tracker probe loss', 'tracker unit stop'], []))
      + (routing_recovery_tunnel_losses | map('first') | map('regex_replace', '^', 'tunnel loss ') | list)
      + (routing_recovery_sibling_losses | map('first') | map('regex_replace', '^', 'sibling link loss ') | list)
      + (routing_recovery_restarts | map('first') | map('regex_replace', '^', 'simulator restart ') | list) }}

- name: Record the fault report
  ansible.builtin.set_fact:
    routing_check_report: >-
      {{ routing_check_report + [{
        'scenario': routing_recovery.name,
        'mode': 'fault and recovery',
        'checks': routing_recovery_results
      }] }}
