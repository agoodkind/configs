---
# In-guest install of the opnsensectl daemon under its mwan-opnsense name, then
# a restart onto the installed binary that the hypervisor verifies.
#
# Target: an OPNsense host reached as `agoodkind` with sudo. The
# hypervisor-side virtio-serial-pci args field must already be wired, and the
# hypervisor must run the host bridge and carry /usr/local/bin/opnsensectl,
# because the daemon's identity is read through them.
#
# Required vars (typically from group_vars or playbook):
#   mwan_opnsense_binary_local       controller path of the pulled freebsd opnsensectl binary
#   mwan_proxmox_delegate            inventory host of the hypervisor running this router
#   opnsensectl_release_tag          release tag the environment pins
#   opnsensectl_release_commit       commit that tag points at
#
# Optional rc.conf.d overrides after install. Defaults come from the sample
# copied below.
#   mwan_opnsense_listen_serial      default "/dev/ttyV0.1"
#   mwan_opnsense_baud               default "115200"
#   mwan_opnsense_config_xml         default "/conf/config.xml"
#   mwan_opnsense_backup_dir         default "/conf/backup"
#   mwan_opnsense_logfile            default "/var/log/mwan-opnsense.log"
#   mwan_opnsense_state_dir          default "/var/lib/mwan/transfers"
#   mwan_opnsense_stop_timeout       default "10"

# The whole deploy reads the router daemon through the hypervisor's opnsensectl,
# so a hypervisor without it fails every read below. Without this guard the play
# installs the new binary and restarts the daemon onto it first, and only then
# fails for three minutes on a version it cannot read, with no pending-verify
# marker to revert. Checking the hypervisor first keeps that failure ahead of
# any change to the guest.
- name: Fail before touching the guest unless the hypervisor runs the released opnsensectl
  ansible.builtin.import_tasks: verify-opnsensectl-release.yml
  vars:
    opnsensectl_installed_binary: /usr/local/bin/opnsensectl
  delegate_to: "{{ mwan_proxmox_delegate }}"
  become: true

- name: Install mwan-opnsense binary as .current
  ansible.builtin.copy:
    src: "{{ mwan_opnsense_binary_local }}"
    dest: /usr/local/sbin/mwan-opnsense.current
    owner: root
    group: wheel
    mode: "0755"
  register: mwan_opnsense_binary_install
  become: true

# /usr/local/sbin/mwan-opnsense always points at the active binary.
# Self-deploy RPC swaps .current atomically; the symlink stays put.
- name: Symlink mwan-opnsense to .current
  ansible.builtin.file:
    src: mwan-opnsense.current
    dest: /usr/local/sbin/mwan-opnsense
    state: link
    owner: root
    group: wheel
  become: true

- name: Install rc.d script
  ansible.builtin.copy:
    src: >-
      {{ playbook_dir }}/../../mwan/go/cmd/mwan/opnsense-src/etc/rc.d/mwan_opnsense
    dest: /usr/local/etc/rc.d/mwan_opnsense
    owner: root
    group: wheel
    mode: "0755"
  become: true

# The supervised entry point for daemon(8) -r. rc.d launches this shim, which
# runs the deploy preflight (revert a bad self-deploy to .previous) before
# exec'ing the daemon on every (re)spawn.
- name: Install mwan-opnsense-run preflight shim
  ansible.builtin.copy:
    src: >-
      {{ playbook_dir }}/../../mwan/go/cmd/mwan/opnsense-src/usr/local/libexec/mwan-opnsense-run
    dest: /usr/local/libexec/mwan-opnsense-run
    owner: root
    group: wheel
    mode: "0755"
  become: true

- name: Install rc.conf.d settings
  ansible.builtin.copy:
    src: >-
      {{ playbook_dir }}/../../mwan/go/cmd/mwan/opnsense-src/etc/rc.conf.d/mwan_opnsense.sample
    dest: /etc/rc.conf.d/mwan_opnsense
    owner: root
    group: wheel
    mode: "0644"
  become: true

- name: Install loader.conf.d entry (virtio_console autoload)
  ansible.builtin.copy:
    src: >-
      {{ playbook_dir }}/../../mwan/go/cmd/mwan/opnsense-src/boot/loader.conf.d/mwan_opnsense.conf
    dest: /boot/loader.conf.d/mwan_opnsense.conf
    owner: root
    group: wheel
    mode: "0644"
  become: true

- name: Enable mwan_opnsense in rc.conf
  ansible.builtin.lineinfile:
    path: /etc/rc.conf
    regexp: '^mwan_opnsense_enable='
    line: 'mwan_opnsense_enable="YES"'
    create: false
  become: true

# The rc.d status and start read only the supervisor pidfile, so an instance
# the pidfile does not name is invisible to them, and a start then adds a
# second reader on the serial port. The instance script finds instances by
# command line instead.
- name: Check that exactly one mwan-opnsense instance runs and the pidfile names it
  ansible.builtin.script:
    cmd: >-
      {{ playbook_dir }}/files/mwan-opnsense-instances.sh check-one
      /usr/local/libexec/mwan-opnsense-run /usr/local/sbin/mwan-opnsense
      /var/run/mwan_opnsense.pid
    executable: /bin/sh
  register: mwan_opnsense_instances_before
  changed_when: false
  failed_when: mwan_opnsense_instances_before.rc not in [0, 1]
  when: not ansible_check_mode
  become: true

# The daemon's identity is read from the hypervisor through the host bridge,
# because any binary named mwan-opnsense* on the guest enters serve instead of
# answering a verb. `opnsensectl daemon version` prints exactly one line, whose
# version field is itself the daemon's build summary:
#   version=commit=<commit> dirty=<clean|dirty|unknown> binhash=<binhash>
#   commit=<commit> dirty=<true|false> binhash=<binhash>
# Output of any other shape yields an empty capture, which the hex pattern of
# every commit check below rejects.
- name: Set the pattern of the daemon version line
  ansible.builtin.set_fact:
    mwan_opnsense_version_line_pattern: >-
      {{ '^version=commit=[0-9a-f]{7,40} dirty=(?:clean|dirty|unknown) binhash=(?:[0-9a-f]{12}|unknown)'
      ~ ' commit=([0-9a-f]{7,40}) dirty=(?:true|false) binhash=(?:[0-9a-f]{12}|unknown)$' }}

# A copy that reports ok says nothing about the running process: an earlier
# install can have replaced the file under a daemon that was never restarted.
# One read decides; a read that fails yields no commit.
- name: Read the commit the running daemon reports
  ansible.builtin.command:
    argv:
      - /usr/local/bin/opnsensectl
      - daemon
      - version
  register: mwan_opnsense_version_before
  changed_when: false
  failed_when: false
  when: not ansible_check_mode
  delegate_to: "{{ mwan_proxmox_delegate }}"
  become: true

# The daemon restarts when the installed binary changed, when anything other
# than exactly one instance named by the pidfile runs, or when the running
# daemon does not report the release commit by the same rule the assert below
# applies, including when its version cannot be read.
- name: Decide whether the daemon restarts onto the installed binary
  vars:
    mwan_opnsense_running_commit: >-
      {{ mwan_opnsense_version_before.stdout | regex_findall(mwan_opnsense_version_line_pattern) | first | default('') }}
  ansible.builtin.set_fact:
    mwan_opnsense_restart_required: >-
      {{ mwan_opnsense_binary_install is changed
      or mwan_opnsense_instances_before.rc != 0
      or mwan_opnsense_version_before.rc != 0
      or mwan_opnsense_running_commit is not match('^[0-9a-f]{7,40}$')
      or not opnsensectl_release_commit.startswith(mwan_opnsense_running_commit) }}
  when: not ansible_check_mode

# The restart never uses the daemon's RestartDaemon RPC. That call re-executes
# the daemon in place, and on the testbed router the re-executed daemon then
# answered no RPC for seven minutes until an rc.d restart.
- name: Restart the daemon onto the installed binary
  when:
    - not ansible_check_mode
    - mwan_opnsense_restart_required
  become: true
  block:
    # The wait of 10 seconds per escalation step matches the rc.d stop timeout.
    - name: Stop every running mwan-opnsense instance
      ansible.builtin.script:
        cmd: >-
          {{ playbook_dir }}/files/mwan-opnsense-instances.sh stop
          /usr/local/etc/rc.d/mwan_opnsense /usr/local/libexec/mwan-opnsense-run
          /usr/local/sbin/mwan-opnsense 10
        executable: /bin/sh
      changed_when: true

    - name: Start one mwan-opnsense instance through rc.d
      ansible.builtin.command:
        argv:
          - /usr/local/etc/rc.d/mwan_opnsense
          - start
      changed_when: true

# A failure here fails the deploy with the new binary still running: this
# install writes no pending-verify marker and no .previous slot, so the run shim
# has nothing to revert.
- name: Verify the restarted daemon from the hypervisor
  when: not ansible_check_mode
  delegate_to: "{{ mwan_proxmox_delegate }}"
  become: true
  block:
    # The bridge rebuilds its session after the guest restart, so the first
    # reads can time out. 36 reads 5 seconds apart bound the wait to 3 minutes.
    - name: Wait for the daemon to report the released commit
      ansible.builtin.command:
        argv:
          - /usr/local/bin/opnsensectl
          - daemon
          - version
      register: mwan_opnsense_daemon_version
      changed_when: false
      failed_when: false
      retries: 36
      delay: 5
      until: >-
        (mwan_opnsense_daemon_version.stdout
        | regex_findall(mwan_opnsense_version_line_pattern) | first | default(''))
        is match('^[0-9a-f]{7,40}$')
        and opnsensectl_release_commit.startswith(mwan_opnsense_daemon_version.stdout
        | regex_findall(mwan_opnsense_version_line_pattern) | first | default(''))

    # The reported commit must be a real short SHA (seven hex digits or more)
    # and a prefix of the release commit; a daemon reporting "unknown" or a
    # truncated value fails.
    - name: Fail unless the daemon reports the released commit
      vars:
        mwan_opnsense_reported_commit: >-
          {{ mwan_opnsense_daemon_version.stdout | regex_findall(mwan_opnsense_version_line_pattern) | first | default('') }}
      ansible.builtin.assert:
        that:
          - mwan_opnsense_reported_commit is match('^[0-9a-f]{7,40}$')
          - opnsensectl_release_commit.startswith(mwan_opnsense_reported_commit)
        fail_msg: >-
          The router daemon reports "{{ mwan_opnsense_daemon_version.stdout }}"
          ({{ mwan_opnsense_daemon_version.stderr | trim }}) but opnsensectl release
          {{ opnsensectl_release_tag }} is commit {{ opnsensectl_release_commit }}.
        success_msg: >-
          The router daemon is opnsensectl release {{ opnsensectl_release_tag }}
          ({{ opnsensectl_release_commit[:8] }}).

    # The exec verb exits 0 whatever the guest command returned, so the guest
    # result is read from the first output line.
    - name: Run hostname on the router through the daemon
      ansible.builtin.command:
        argv:
          - /usr/local/bin/opnsensectl
          - exec
          - /bin/hostname
      register: mwan_opnsense_exec_round_trip
      changed_when: false
      failed_when: >-
        mwan_opnsense_exec_round_trip.rc != 0
        or (mwan_opnsense_exec_round_trip.stdout_lines | first | default(''))
        is not match('^exit_code=0 duration_ms=[0-9]+ timed_out=false$')

- name: Fail unless exactly one mwan-opnsense instance runs after the restart
  ansible.builtin.script:
    cmd: >-
      {{ playbook_dir }}/files/mwan-opnsense-instances.sh check-one
      /usr/local/libexec/mwan-opnsense-run /usr/local/sbin/mwan-opnsense
      /var/run/mwan_opnsense.pid
    executable: /bin/sh
  changed_when: false
  when: not ansible_check_mode
  become: true

- name: Mark the running daemon binary healthy
  ansible.builtin.command:
    argv:
      - /usr/local/bin/opnsensectl
      - daemon
      - mark-healthy
  register: mwan_opnsense_mark_healthy
  changed_when: mwan_opnsense_restart_required
  failed_when: >-
    mwan_opnsense_mark_healthy.rc != 0
    or ' health=ok ' not in mwan_opnsense_mark_healthy.stdout
  when: not ansible_check_mode
  delegate_to: "{{ mwan_proxmox_delegate }}"
  become: true
