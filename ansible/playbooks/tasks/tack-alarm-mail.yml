---
# The mail handler every tack backup alarm unit names in its OnFailure=.
# It lives in its own file so each unit's task file states the dependency by
# including it, rather than inheriting it from whichever include happened to
# run first: a unit whose OnFailure= names a handler absent from the guest
# fails its dependency job silently and mails nothing, which is the one
# outcome an alarm may never have. Including this twice on a guest is a no-op
# the second time.

- name: Deploy tack-alarm-mail script
  ansible.builtin.copy:
    src: "{{ repo_root }}/common/scripts/tack-alarm-mail.sh"
    dest: /usr/local/sbin/tack-alarm-mail.sh
    owner: root
    group: root
    mode: "0755"
  register: tack_alarm_mail_script

- name: Deploy tack-alarm-mail handler template
  ansible.builtin.template:
    src: "{{ repo_root }}/common/services/tack-alarm-mail@.service.j2"
    dest: /etc/systemd/system/tack-alarm-mail@.service
    owner: root
    group: root
    mode: "0644"
  register: tack_alarm_mail_service

- name: Reload systemd for the tack-alarm-mail handler
  ansible.builtin.systemd:
    daemon_reload: true
  when: tack_alarm_mail_script.changed or tack_alarm_mail_service.changed
