---
- name: Install the credential generation tools on the environment owner
  ansible.builtin.apt:
    name: [openssl, apache2-utils, util-linux]
    state: present
  delegate_to: "{{ tack_service_secret_source }}"
  throttle: 1

- name: Create the protected credential source directory
  ansible.builtin.file:
    path: "{{ tack_secrets_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  delegate_to: "{{ tack_service_secret_source }}"

- name: Check whether this environment already has deployed credentials
  ansible.builtin.stat:
    path: "{{ tack_install_dir }}/.env"
  delegate_to: "{{ tack_service_secret_source }}"
  register: tack_previous_service_environment

- name: Check whether the superuser credential already uses a file
  ansible.builtin.stat:
    path: "{{ tack_secrets_dir }}/YUGABYTE_PASSWORD"
  delegate_to: "{{ tack_service_secret_source }}"
  register: tack_previous_superuser_file

- name: Preserve the existing superuser credential during file conversion
  ansible.builtin.copy:
    content: "{{ hostvars[tack_service_secret_source].tack_yugabyte_password }}\n"
    dest: "{{ tack_secrets_dir }}/YUGABYTE_PASSWORD"
    owner: root
    group: root
    mode: "0600"
    force: false
  delegate_to: "{{ tack_service_secret_source }}"
  when:
    - tack_previous_service_environment.stat.exists
    - not tack_previous_superuser_file.stat.exists
  no_log: true

- name: Generate and preserve the environment service credentials
  ansible.builtin.script:
    cmd: >-
      {{ repo_root }}/tack/provision-secrets.sh
      {{ tack_secrets_dir | quote }} {{ tack_install_dir ~ '/.env' | quote }}
      {{ tack_app_password_path | quote }}
    executable: /bin/bash
  delegate_to: "{{ tack_service_secret_source }}"
  throttle: 1
  register: tack_generated_credentials
  changed_when: tack_generated_credentials.stdout | trim == 'changed'
  no_log: true
