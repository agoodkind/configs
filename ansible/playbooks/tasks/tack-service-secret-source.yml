---
- name: Create the protected credential source directory
  ansible.builtin.file:
    path: "{{ tack_secrets_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  delegate_to: "{{ tack_service_secret_source }}"

- name: Check whether this environment already has deployed credentials
  ansible.builtin.stat:
    path: "{{ tack_install_dir }}/.env"
  delegate_to: "{{ tack_service_secret_source }}"
  register: tack_previous_service_environment

- name: Check whether the superuser credential already uses a file
  ansible.builtin.stat:
    path: "{{ tack_secrets_dir }}/YUGABYTE_PASSWORD"
  delegate_to: "{{ tack_service_secret_source }}"
  register: tack_previous_superuser_file

- name: Preserve the existing superuser credential during file conversion
  ansible.builtin.copy:
    content: "{{ hostvars[tack_service_secret_source].tack_yugabyte_password }}\n"
    dest: "{{ tack_secrets_dir }}/YUGABYTE_PASSWORD"
    owner: root
    group: root
    mode: "0600"
    force: false
  delegate_to: "{{ tack_service_secret_source }}"
  throttle: 1
  when:
    - tack_previous_service_environment.stat.exists
    - not tack_previous_superuser_file.stat.exists
  no_log: true

- name: Read the previous environment file for existing credentials
  ansible.builtin.slurp:
    src: "{{ tack_install_dir }}/.env"
  delegate_to: "{{ tack_service_secret_source }}"
  register: tack_previous_environment_file
  when: tack_previous_service_environment.stat.exists
  no_log: true

- name: Check whether the previous application password file exists
  ansible.builtin.stat:
    path: "{{ tack_app_password_path }}"
  delegate_to: "{{ tack_service_secret_source }}"
  register: tack_previous_app_password_file

- name: Read the previous application password file
  ansible.builtin.slurp:
    src: "{{ tack_app_password_path }}"
  delegate_to: "{{ tack_service_secret_source }}"
  register: tack_previous_app_password
  when: tack_previous_app_password_file.stat.exists
  no_log: true

- name: Create each missing environment credential file
  ansible.builtin.copy:
    content: "{{ tack_credential_value }}\n"
    dest: "{{ tack_secrets_dir }}/{{ item.name }}"
    owner: root
    group: root
    mode: "0600"
    force: false
  delegate_to: "{{ tack_service_secret_source }}"
  throttle: 1
  loop: "{{ tack_environment_credentials }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true
  vars:
    tack_previous_environment_text: >-
      {{ tack_previous_environment_file.content | b64decode
         if tack_previous_service_environment.stat.exists else '' }}
    tack_previous_credentials: >-
      {{ dict(tack_previous_environment_text | regex_findall('(?m)^([A-Z0-9_]+)=(.+)$')) }}
    tack_credential_value: >-
      {{ tack_previous_app_password.content | b64decode | regex_replace('\n\Z', '')
         if item.name == 'TACK_APP_PASSWORD' and tack_previous_app_password_file.stat.exists
         else tack_previous_credentials[item.name]
         if item.adopt and item.name in tack_previous_credentials
         else lookup('ansible.builtin.password', '/dev/null', chars=['digits', 'abcdef'], length=64)
         if item.encoding == 'hex'
         else lookup('ansible.builtin.password', '/dev/null', chars=['ascii_letters', 'digits', '+/'], length=42)
              ~ lookup('ansible.builtin.password', '/dev/null', chars=['AEIMQUYcgkosw048'], length=1) ~ '=' }}

- name: Set root ownership and mode 0600 on each environment credential file
  ansible.builtin.file:
    path: "{{ tack_secrets_dir }}/{{ item }}"
    state: file
    owner: root
    group: root
    mode: "0600"
  delegate_to: "{{ tack_service_secret_source }}"
  throttle: 1
  loop: "{{ tack_environment_credentials | map(attribute='name') | list }}"

- name: Read the size of each environment credential file
  ansible.builtin.stat:
    path: "{{ tack_secrets_dir }}/{{ item }}"
  delegate_to: "{{ tack_service_secret_source }}"
  loop: "{{ tack_environment_credentials | map(attribute='name') | list }}"
  register: tack_environment_credential_stats

- name: Refuse an empty environment credential file
  ansible.builtin.assert:
    that:
      - tack_environment_credential_stats.results | rejectattr('stat.size', 'gt', 0) | list == []
    fail_msg: >-
      Credential files
      {{ tack_environment_credential_stats.results | rejectattr('stat.size', 'gt', 0)
         | map(attribute='item') | list }}
      in {{ tack_secrets_dir }} on {{ tack_service_secret_source }} are empty.
      Restore their previous values before retrying.
    quiet: true

- name: Read the OpenSearch passwords for hash verification
  ansible.builtin.slurp:
    src: "{{ tack_secrets_dir }}/{{ item }}"
  delegate_to: "{{ tack_service_secret_source }}"
  loop: "{{ tack_search_password_names }}"
  register: tack_search_password_reads
  no_log: true

- name: Check which OpenSearch hash files exist
  ansible.builtin.stat:
    path: "{{ tack_secrets_dir }}/{{ item }}.hash"
  delegate_to: "{{ tack_service_secret_source }}"
  loop: "{{ tack_search_password_names }}"
  register: tack_search_hash_stats

- name: Read the existing OpenSearch hash files
  ansible.builtin.slurp:
    src: "{{ tack_secrets_dir }}/{{ item.item }}.hash"
  delegate_to: "{{ tack_service_secret_source }}"
  loop: "{{ tack_search_hash_stats.results }}"
  loop_control:
    label: "{{ item.item }}"
  register: tack_search_hash_reads
  when: item.stat.exists
  no_log: true

- name: Write each OpenSearch hash that does not match its password
  ansible.builtin.copy:
    content: "{{ item }}:{{ tack_search_password | password_hash('bcrypt', rounds=12, ident='2y') }}\n"
    dest: "{{ tack_secrets_dir }}/{{ item }}.hash"
    owner: root
    group: root
    mode: "0600"
  delegate_to: "{{ tack_service_secret_source }}"
  throttle: 1
  loop: "{{ tack_search_password_names }}"
  loop_control:
    index_var: tack_search_password_index
  when: >-
    tack_search_current_hash is not match('\$2y\$12\$[./A-Za-z0-9]{53}\Z')
    or tack_search_password | password_hash('bcrypt', salt=tack_search_current_hash[7:29], rounds=12, ident='2y')
       != tack_search_current_hash
  no_log: true
  vars:
    tack_search_password: >-
      {{ (tack_search_password_reads.results[tack_search_password_index].content | b64decode).splitlines()[0] }}
    tack_search_current_hash: >-
      {{ (tack_search_hash_reads.results[tack_search_password_index].content | b64decode | trim).split(':', 1) | last
         if tack_search_hash_stats.results[tack_search_password_index].stat.exists else '' }}
