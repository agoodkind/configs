---
# Each routing_fault_links entry has a simulator node and an interface name.
- name: Set each fault link up
  ansible.builtin.import_tasks: run-routing-restore-commands.yml
  vars:
    routing_restore_commands: "{{ routing_link_restore_lines.split(';') }}"
    routing_link_restore_lines: >-
      {%- set commands = [] -%}
      {%- for link in routing_fault_links -%}
      {%- set _ = commands.append('pct exec ' ~ routing_node_vmids[link.node] ~ " -- sh -c 'ip link set dev "
      ~ link.interface ~ ' up && networkctl reconfigure ' ~ link.interface ~ "'") -%}
      {%- endfor -%}
      {{ commands | join(';') }}
