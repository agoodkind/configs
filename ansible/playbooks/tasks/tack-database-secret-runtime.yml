---
- name: Fetch the database secret readers from the reviewed Tack revision
  ansible.builtin.get_url:
    url: "https://api.github.com/repos/agoodkind/tack/contents/yugabyte-overlay/{{ item.file }}?ref={{ tack_commit }}"
    dest: "{{ tack_install_dir }}/yugabyte-overlay/{{ item.file }}"
    headers:
      Authorization: "Bearer {{ tack_repo_read_token }}"
      Accept: application/vnd.github.raw
    owner: root
    group: root
    mode: "{{ item.mode }}"
    force: true
  loop:
    - {file: entrypoint.sh, mode: '0755'}
    - {file: healthcheck.sh, mode: '0755'}
    - {file: secret.sh, mode: '0755'}
    - {file: healthcheck.sql, mode: '0644'}
  no_log: true
  notify: "{{ tack_database_secret_restart_handler }}"
