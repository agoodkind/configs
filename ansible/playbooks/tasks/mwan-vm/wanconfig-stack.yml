---
# Install the wanconfig management stack on the MWAN gateway (MWAN-434).
# The stack arrives as Debian packages built, proven, and attested by the
# mwan release: the play pulls the bundle beside the binaries, and
# these tasks copy the packages to the gateway and install them with apt.
# No gateway runs a compiler, a clone, or cmake. rousette serves RESTCONF on
# ::1 behind an nghttpx front end bound to the management address only.
# Read-only: NACM denies every write and grants anonymous read per
# rousette's contract.
#
# The gateway model, its IETF imports, the NACM policy, and the rousette and
# nghttpx units are embedded in the mwan binary, and `mwan install --role
# wan --apply` in deploy-mwan.yml writes them, installs the models into
# sysrepo, imports the policy, and enables the units. These tasks install
# the packages that sysrepo and rousette come from, the models rousette's
# own package ships, and the nghttpx configuration rendered from inventory.
#
# Imported by deploy-mwan.yml before the gateway configuration is written.
# The importing play sets the variables these tasks read and runs them as
# root.
- name: Install the front-end proxy
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    name:
      - nghttp2-proxy
    state: present

- name: Create stack directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ wanconfig_deb_dir }}"
    - /etc/nghttpx

- name: Create the anonymous-access system user
  ansible.builtin.user:
    name: yangnobody
    system: true
    shell: /usr/sbin/nologin
    create_home: false

# The package list is read from the pulled release on the controller, not
# from the gateway after the copy, because check mode does not copy and a
# gateway-side listing would then find nothing and fail the run.
- name: List the pulled stack packages
  ansible.builtin.find:
    paths: "{{ wanconfig_stack_dir }}/debs"
    patterns: "*.deb"
  delegate_to: localhost
  become: false
  register: wanconfig_debs

- name: Refuse a stage with no packages
  ansible.builtin.assert:
    that:
      - wanconfig_debs.files | length > 0
    fail_msg: "no .deb files under {{ wanconfig_stack_dir }}/debs; the pulled release holds no packages"

- name: Copy the staged stack packages
  ansible.builtin.copy:
    src: "{{ wanconfig_stack_dir }}/debs/"
    dest: "{{ wanconfig_deb_dir }}/"
    owner: root
    group: root
    mode: "0644"

# apt resolves the packages' interdependencies in one transaction. A
# same-version reinstall is a no-op, which apt reports as 0 upgraded
# and 0 newly installed.
- name: Install the stack packages with apt
  ansible.builtin.command:
    argv: >-
      {{
        ['apt-get', 'install', '--yes', '--no-install-recommends']
        + (wanconfig_debs.files | map(attribute='path') | map('basename')
           | map('regex_replace', '^', wanconfig_deb_dir ~ '/') | sort)
      }}
  register: wanconfig_apt_install
  changed_when: "'0 upgraded, 0 newly installed' not in wanconfig_apt_install.stdout"

# sysrepo-tools ships a sysrepo-plugind unit that debhelper enables and
# starts on install. Nothing on the gateway uses plugins; the daemon
# would only hold the shared memory open across deploys.
- name: Mask the sysrepo plugin daemon
  ansible.builtin.systemd:
    name: sysrepo-plugind.service
    state: stopped
    enabled: false
    masked: true

# The listing runs under check mode too, because it only reads and the
# install task below decides from its output.
- name: List installed sysrepo modules
  ansible.builtin.command:
    argv:
      - /usr/bin/sysrepoctl
      - --list
  register: wanconfig_sysrepo_modules
  changed_when: false
  check_mode: false

- name: Install rousette's required models into sysrepo
  ansible.builtin.command:
    argv:
      - /usr/bin/sysrepoctl
      - --install
      - "{{ wanconfig_rousette_yang_dir }}/{{ item }}.yang"
      - --search-dirs
      - "{{ wanconfig_rousette_yang_dir }}"
  loop:
    - ietf-restconf@2017-01-26
    - ietf-restconf-monitoring@2017-01-26
    - ietf-yang-patch@2017-02-22
    - ietf-subscribed-notifications@2019-09-09
    - ietf-restconf-subscribed-notifications@2019-11-17
    - iana-if-type@2014-05-08
  when: item.split('@')[0] not in wanconfig_sysrepo_modules.stdout
  changed_when: true

- name: Render the nghttpx front-end configuration
  ansible.builtin.template:
    src: "{{ repo_root }}/mwan/wanconfig/nghttpx-wanconfig.conf.j2"
    dest: /etc/nghttpx/wanconfig.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart nghttpx-wanconfig
