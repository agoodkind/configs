- name: Install the front-end proxy
  ansible.builtin.apt:
    policy_rc_d: 101
    update_cache: true
    cache_valid_time: 3600
    name:
      - nghttp2-proxy
    state: present

- name: Create stack directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ wanconfig_deb_dir }}"
    - /etc/nghttpx

- name: Create the anonymous-access system user
  ansible.builtin.user:
    name: yangnobody
    system: true
    shell: /usr/sbin/nologin
    create_home: false

# The package list is read from the pulled release on the controller, not
# from the gateway after the copy, because check mode does not copy and a
# gateway-side listing would then find nothing and fail the run.
- name: List the pulled stack packages
  ansible.builtin.find:
    paths: "{{ wanconfig_stack_dir }}/debs"
    patterns: "*.deb"
  delegate_to: localhost
  become: false
  register: wanconfig_debs

- name: Refuse a stage with no packages
  ansible.builtin.assert:
    that:
      - wanconfig_debs.files | length > 0
    fail_msg: "no .deb files under {{ wanconfig_stack_dir }}/debs; the pulled release contains no packages"

- name: Copy the staged stack packages
  ansible.builtin.copy:
    src: "{{ wanconfig_stack_dir }}/debs/"
    dest: "{{ wanconfig_deb_dir }}/"
    owner: root
    group: root
    mode: "0644"

# apt resolves the packages' interdependencies in one transaction. A
# same-version reinstall is a no-op, which apt reports as 0 upgraded
# and 0 newly installed.
- name: Install the stack packages with apt
  ansible.builtin.command:
    argv: >-
      {{
        ['apt-get', 'install', '--yes', '--no-install-recommends']
        + (wanconfig_debs.files | map(attribute='path') | map('basename')
           | map('regex_replace', '^', wanconfig_deb_dir ~ '/') | sort)
      }}
  environment:
    NEEDRESTART_MODE: l
  register: wanconfig_apt_install
  changed_when: "'0 upgraded, 0 newly installed' not in wanconfig_apt_install.stdout"

# sysrepo-tools ships a sysrepo-plugind unit that debhelper enables and
# starts on install. The gateway uses no plugins. The plugin daemon would
# keep the shared memory open across deploys.
- name: Mask the sysrepo plugin daemon
  ansible.builtin.systemd:
    name: sysrepo-plugind.service
    state: stopped
    enabled: false
    masked: true
