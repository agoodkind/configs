---
# deploy-tack.yml includes this file on the owner guest of an environment with
# tack_queue_external_listener_enabled true (TACK-544). The deploy runs it
# before it starts the audit broker. The broker's external port opens only
# after the tack_queue table accepts it from tack_queue_external_clients alone.

- name: Install nftables for the audit broker firewall
  ansible.builtin.apt:
    name: nftables
    state: present
    update_cache: true
    cache_valid_time: 3600

# nft -c parses the rendered table without loading it. A malformed file fails
# this task and leaves the loaded table unchanged.
- name: Render the audit broker firewall table
  ansible.builtin.template:
    src: "{{ repo_root }}/tack/tack-queue-firewall.nft.j2"
    dest: "{{ tack_queue_firewall_path }}"
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/nft -c -f %s
  register: tack_queue_firewall_table

- name: Install the audit broker firewall unit
  ansible.builtin.template:
    src: "{{ repo_root }}/tack/tack-queue-firewall.service.j2"
    dest: /etc/systemd/system/tack-queue-firewall.service
    owner: root
    group: root
    mode: "0644"
  register: tack_queue_firewall_unit

- name: Enable the audit broker firewall unit
  ansible.builtin.systemd:
    name: tack-queue-firewall.service
    enabled: true
    state: started
    daemon_reload: "{{ tack_queue_firewall_unit is changed }}"

# A started oneshot unit runs only once per boot. A restart loads a changed
# table or unit.
- name: Load a changed audit broker firewall table
  ansible.builtin.systemd:
    name: tack-queue-firewall.service
    state: restarted
  when: tack_queue_firewall_table is changed or tack_queue_firewall_unit is changed
