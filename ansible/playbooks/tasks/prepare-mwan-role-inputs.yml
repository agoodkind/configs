- name: Read the prior runtime configuration pair
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: [/etc/mwan/config.toml, /etc/mwan/network.json]
  register: mwan_role_runtime_pair

- name: Reject a partial runtime configuration pair
  ansible.builtin.assert:
    that:
      - mwan_role_runtime_pair.results[0].stat.exists == mwan_role_runtime_pair.results[1].stat.exists
    fail_msg: Both runtime configuration files must exist or both must be absent before staging.

- name: Validate the prior network document before staging
  ansible.builtin.command:
    argv:
      - /usr/local/bin/mwan
      - deploy-gate
      - check-network
      - /etc/mwan/network.json
      - /usr/local/share/wanconfig/yang
  changed_when: false
  when: mwan_role_runtime_pair.results[0].stat.exists

- name: Set the first-install recovery contract
  ansible.builtin.set_fact:
    mwan_role_first_install: "{{ not mwan_role_runtime_pair.results[0].stat.exists }}"
    mwan_role_snapshot_ready: false

- name: Establish the legacy role configuration for a first install
  when: mwan_role_first_install | bool
  vars:
    management_intent: >-
      {{ (mwan_non_provider_connections | selectattr('name', 'equalto', mwan_mgmt_iface) | list)[0] }}
    vm_mgmt_iface: "{{ mwan_mgmt_iface }}"
    vm_mgmt_ipv6: "{{ management_intent.ipv6.address.split('/')[0] }}"
    vm_mgmt_ipv6_prefix: "{{ management_intent.ipv6.address.split('/')[1] }}"
    vm_mgmt_dns_servers: "{{ mwan_dns_servers }}"
    vm_mgmt_dns_domain: "{{ mwan_dns_domain }}"
  block:
    - name: Create the networkd directory for initial role units
      ansible.builtin.file:
        path: /etc/systemd/network
        state: directory
        mode: "0755"

    - name: Install the original management units for first-install access
      ansible.builtin.template:
        src: "{{ repo_root }}/ansible/templates/vm/{{ item }}.j2"
        dest: "/etc/systemd/network/{{ item }}"
        mode: "0644"
      loop: [10-mgmt.link, 10-mgmt.network]

    - name: Install the original transit units for first-install access
      ansible.builtin.template:
        src: "{{ repo_root }}/mwan/networkd/{{ item }}.j2"
        dest: "/etc/systemd/network/{{ item }}"
        mode: "0644"
      loop: [40-mwanbr.link, 40-mwanbr.network]

    - name: Reload role naming rules
      ansible.builtin.command:
        argv: [udevadm, control, --reload]
      changed_when: false

    - name: Apply role naming without waiting on SSH
      ansible.builtin.command:
        argv: [udevadm, trigger, --action=add, --subsystem-match=net]
      async: "{{ mwan_role_job_timeout_seconds }}"
      poll: 0
      register: mwan_role_naming_job
      changed_when: true

    - name: Reconnect after initial role naming
      ansible.builtin.wait_for_connection:
        connect_timeout: 5
        delay: "{{ mwan_role_job_timeout_seconds }}"
        sleep: 5
        timeout: 300

    - name: Verify initial role naming completed
      ansible.builtin.async_status:
        jid: "{{ mwan_role_naming_job.ansible_job_id }}"
      register: mwan_role_naming_result
      until: mwan_role_naming_result is finished
      retries: 24
      delay: 5

    - name: Wait for the initial network device events
      ansible.builtin.command:
        argv: [udevadm, settle, --timeout=30]
      changed_when: false

    - name: Apply the initial legacy network units
      ansible.builtin.include_tasks: reload-mwan-networkd.yml

    - name: Require configured legacy role units before the first install
      ansible.builtin.command:
        argv: [networkctl, status, "{{ item.interface }}", --json=short]
      loop:
        - {interface: "{{ mwan_mgmt_iface }}", unit: /etc/systemd/network/10-mgmt.network}
        - {interface: "{{ mwan_internal_iface }}", unit: /etc/systemd/network/40-mwanbr.network}
      register: mwan_role_initial_state
      until: >-
        (mwan_role_initial_state.stdout | from_json).NetworkFile == item.unit and
        (mwan_role_initial_state.stdout | from_json).AdministrativeState == 'configured'
      retries: 30
      delay: 1
      changed_when: false
