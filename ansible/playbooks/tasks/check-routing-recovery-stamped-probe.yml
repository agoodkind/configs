---
# routing_probe_connection is a checked tunnel of the scenario. The outer
# fault block removes the stamp table. The gateway sends echo requests on that
# tunnel. When routing_probe_return_rule is "kept tunnel", the gateway must
# receive the replies on that tunnel. When it is "any tunnel to the endpoint",
# the tunnel endpoint can send the replies on any of its tunnels to the gateway.
- name: Require a known reply rule for the stamped probe
  ansible.builtin.assert:
    that:
      - routing_probe_return_rule in ['kept tunnel', 'any tunnel to the endpoint']
    fail_msg: "The stamped probe does not accept the reply rule {{ routing_probe_return_rule }}."

- name: Collect the stamped probe inputs
  ansible.builtin.set_fact:
    routing_stamped_probe_path:
      captures: >-
        {%- set tunnels = routing_recovery.scenario.tunnels -%}
        {%- set kept = (tunnels | selectattr('id', 'equalto', routing_probe_connection) | list)[0] -%}
        {%- set outbound = 'icmp6 and ip6[40] == 128 and src host ' ~ routing_recovery.downstream.ipv6
        ~ ' and dst host ' ~ routing_recovery.remote_client_address -%}
        {%- set inbound = 'icmp6 and ip6[40] == 129 and src host ' ~ routing_recovery.remote_client_address
        ~ ' and dst host ' ~ routing_recovery.downstream.ipv6 -%}
        {%- set captures = [{'direction': 'outbound', 'interface': kept.local.interface, 'filter': outbound}] -%}
        {%- if routing_probe_return_rule == 'kept tunnel' -%}
        {%- set _ = captures.append({'direction': 'inbound', 'interface': kept.local.interface, 'filter': inbound}) -%}
        {%- elif routing_probe_return_rule == 'any tunnel to the endpoint' -%}
        {%- for tunnel in tunnels | selectattr('remote.node', 'equalto', kept.remote.node) -%}
        {%- set _ = captures.append({'direction': 'inbound', 'interface': tunnel.local.interface,
        'filter': inbound}) -%}
        {%- endfor -%}
        {%- endif -%}
        {{ captures }}
      # qm guest exec waits for the capture, which ends at its own timeout.
      guest_exec_timeout: "{{ testbed_routing_checks.capture_timeout_seconds * 2 }}"
      ping_argv:
        - pct
        - exec
        - "{{ routing_recovery.downstream.vmid }}"
        - --
        - ping
        - "-6"
        - -c
        - "{{ testbed_routing_checks.ping_count }}"
        - -W
        - "{{ testbed_routing_checks.ping_timeout_seconds }}"
        - -I
        - "{{ routing_recovery.downstream.ipv6 }}"
        - "{{ routing_recovery.remote_client_address }}"

- name: Stamp the downstream client's packets for {{ routing_probe_connection }}
  ansible.builtin.import_tasks: check-routing-client-stamp.yml
  vars:
    routing_stamp_family: ip6
    routing_stamp_connection: "{{ routing_probe_connection }}"
    routing_stamp_destinations: "{{ routing_recovery.scenario.remote_prefixes }}"

- name: Wait until IPv6 packets and replies pass with the stamp for {{ routing_probe_connection }}
  ansible.builtin.command:
    argv: "{{ routing_stamped_probe_path.ping_argv }}"
  register: routing_stamped_probe
  changed_when: false
  until: routing_stamped_probe.rc == 0
  retries: "{{ routing_recovery.wait_retries }}"
  delay: "{{ testbed_routing_checks.retry_delay_seconds }}"

- name: Start the bounded packet captures on the gateway tunnel interfaces
  ansible.builtin.command:
    argv:
      - qm
      - guest
      - exec
      - "{{ routing_recovery.gateway_vmid }}"
      - --timeout
      - "{{ routing_stamped_probe_path.guest_exec_timeout }}"
      - --
      - timeout
      - "{{ testbed_routing_checks.capture_timeout_seconds }}"
      - tcpdump
      - -n
      - -i
      - "{{ item.interface }}"
      - -c
      - "1"
      - "{{ item.filter }}"
  loop: "{{ routing_stamped_probe_path.captures }}"
  loop_control:
    label: >-
      {{ routing_probe_connection }} {{ item.direction }} on {{ item.interface }}
      (replies on {{ routing_probe_return_rule }})
  async: "{{ routing_stamped_probe_path.guest_exec_timeout }}"
  poll: 0
  register: routing_stamped_capture_jobs
  changed_when: false

- name: Wait for the captures to open the gateway tunnel interfaces
  ansible.builtin.pause:
    seconds: "{{ testbed_routing_checks.ping_timeout_seconds }}"

- name: Send stamped IPv6 packets during the captures
  ansible.builtin.command:
    argv: "{{ routing_stamped_probe_path.ping_argv }}"
  changed_when: false

- name: Wait for each gateway tunnel capture
  ansible.builtin.async_status:
    jid: "{{ item.ansible_job_id }}"
  loop: "{{ routing_stamped_capture_jobs.results }}"
  loop_control:
    label: "{{ routing_probe_connection }} {{ item.item.direction }} on {{ item.item.interface }}"
  register: routing_stamped_captures
  until: routing_stamped_captures.finished
  retries: "{{ testbed_routing_checks.capture_timeout_seconds }}"
  delay: 2

# qm guest exec exits 0 when the guest command fails. The guest command
# status is the exitcode field of its JSON output.
- name: Require the requests on the kept tunnel and the replies by the reply rule
  ansible.builtin.assert:
    that:
      - routing_stamped_seen | selectattr('direction', 'equalto', 'outbound') | list != []
      - routing_stamped_seen | selectattr('direction', 'equalto', 'inbound') | list != []
    fail_msg: >-
      Routing scenario {{ routing_recovery.name }} connection {{ routing_probe_connection }}
      with replies on {{ routing_probe_return_rule }}: the gateway captures show only
      {{ routing_stamped_seen }} of {{ routing_stamped_probe_path.captures }}.
  vars:
    routing_stamped_seen: >-
      {{ routing_stamped_captures.results | map(attribute='item.item')
      | zip(routing_stamped_captures.results | map(attribute='stdout') | map('from_json')
      | map(attribute='exitcode', default='missing'))
      | selectattr('1', 'equalto', 0) | map(attribute='0') | list }}
