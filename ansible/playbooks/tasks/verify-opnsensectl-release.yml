---
# Confirms the opnsensectl binary just installed on a Proxmox host is the one the
# play pulled: it must report the commit the release tag points at.
#
# The release pull at the top of the play (github-release.yml) downloaded the
# pinned release, verified its GitHub attestations, unpacked it, and set
# opnsensectl_release_commit from the tag. The caller sets
# opnsensectl_installed_binary to the path it just copied to.
#
# Not used inside the OPNsense guest: there the binary is installed under a
# mwan-opnsense name, and that name fast-paths straight into the daemon serve
# loop, so its identity is read through the daemon's Version RPC instead.

- name: Read installed opnsensectl build identity
  ansible.builtin.command:
    argv:
      - "{{ opnsensectl_installed_binary }}"
      - version
  register: opnsensectl_installed_version
  changed_when: false

# In check mode the copy above did not happen and the command did not run, so
# there is nothing to assert; the real run is where the identity is checked.
# `opnsensectl version` prints exactly one line:
#   commit=<commit> dirty=<clean|dirty|unknown> binhash=<binhash>
# The reported commit must be a real short SHA (seven hex digits or more) and a
# prefix of the release commit; a binary reporting "unknown" or a truncated
# value fails.
- name: Fail unless the installed opnsensectl reports the released commit
  when: not ansible_check_mode
  vars:
    opnsensectl_version_line_pattern: >-
      {{ '^commit=([0-9a-f]{7,40}) dirty=(?:clean|dirty|unknown)'
      ~ ' binhash=(?:[0-9a-f]{12}|unknown)$' }}
    # Output of any other shape, including a second line, does not match and
    # yields an empty string, which the hex pattern below rejects, so no
    # separate shape check is needed. regex_findall returns the capture group
    # itself, so no backreference escape passes through Jinja string parsing.
    opnsensectl_reported_commit: >-
      {{ opnsensectl_installed_version.stdout | regex_findall(opnsensectl_version_line_pattern) | first | default('') }}
  ansible.builtin.assert:
    that:
      - opnsensectl_reported_commit is match('^[0-9a-f]{7,40}$')
      - opnsensectl_release_commit.startswith(opnsensectl_reported_commit)
    fail_msg: >-
      {{ opnsensectl_installed_binary }} reports "{{ opnsensectl_installed_version.stdout }}"
      but opnsensectl release {{ opnsensectl_release_tag }} is commit
      {{ opnsensectl_release_commit }}.
    success_msg: >-
      {{ opnsensectl_installed_binary }} is opnsensectl release
      {{ opnsensectl_release_tag }} ({{ opnsensectl_release_commit[:8] }}).
