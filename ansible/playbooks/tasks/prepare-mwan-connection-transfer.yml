- name: Compare installed and requested connection owners
  when: not (mwan_role_first_install | bool)
  block:
    - name: Read the installed network document
      ansible.builtin.slurp:
        src: /etc/mwan/network.json
      register: mwan_transfer_installed
      no_log: true

    - name: Decode the installed and requested network documents
      ansible.builtin.set_fact:
        mwan_transfer_prior_document: "{{ mwan_transfer_installed.content | b64decode | from_json }}"
        mwan_transfer_target_document: "{{ lookup('file', mwan_network_json_local) | from_json }}"

    - name: Identify changed connection owners
      ansible.builtin.set_fact:
        mwan_transfer_changes_json: >-
          {% set changes = [] %}
          {% for target in mwan_transfer_target_document['ietf-interfaces:interfaces']['interface'] %}
          {% for prior in mwan_transfer_prior_document['ietf-interfaces:interfaces']['interface'] %}
          {% if prior['goodkind-mwan-steering:connection-id'] == target['goodkind-mwan-steering:connection-id']
                and prior['goodkind-mwan-steering:owner'] != target['goodkind-mwan-steering:owner'] %}
          {% set _ = changes.append({'prior': prior, 'target': target}) %}
          {% endif %}
          {% endfor %}
          {% endfor %}
          {{ changes | to_json }}

    - name: Decode the exact changed connection set
      ansible.builtin.set_fact:
        mwan_transfer_changes: "{{ mwan_transfer_changes_json | from_json }}"

    - name: Require one complete connection per ownership transfer
      ansible.builtin.assert:
        that: mwan_transfer_changes | length <= 1
        fail_msg: Transfer one connection per deployment phase.

    - name: Set the connection transfer operation
      ansible.builtin.set_fact:
        mwan_transfer_active: "{{ mwan_transfer_changes | length == 1 }}"

- name: Prepare the selected connection documents
  when: mwan_transfer_active | bool
  block:
    - name: Record the selected source and replacement
      ansible.builtin.set_fact:
        mwan_transfer_previous: "{{ mwan_transfer_changes[0].prior }}"
        mwan_transfer_replacement: "{{ mwan_transfer_changes[0].target }}"
        mwan_transfer_connection_id: "{{ mwan_transfer_changes[0].prior['goodkind-mwan-steering:connection-id'] }}"

    - name: Require the settled transfer and packet contract
      vars:
        prior_interfaces: "{{ mwan_transfer_prior_document['ietf-interfaces:interfaces']['interface'] }}"
        target_interfaces: "{{ mwan_transfer_target_document['ietf-interfaces:interfaces']['interface'] }}"
      ansible.builtin.assert:
        that:
          - mwan_transfer_previous['goodkind-mwan-steering:owner'] in ['networkd', 'mwan']
          - mwan_transfer_replacement['goodkind-mwan-steering:owner'] in ['networkd', 'mwan']
          - mwan_transfer_previous.name == mwan_transfer_replacement.name
          - >-
            (prior_interfaces | rejectattr('goodkind-mwan-steering:connection-id',
             'equalto', mwan_transfer_connection_id) | list) ==
            (target_interfaces | rejectattr('goodkind-mwan-steering:connection-id',
             'equalto', mwan_transfer_connection_id) | list)
          - >-
            (mwan_transfer_prior_document['ietf-interfaces:interfaces'] | dict2items
             | rejectattr('key', 'equalto', 'interface') | list) ==
            (mwan_transfer_target_document['ietf-interfaces:interfaces'] | dict2items
             | rejectattr('key', 'equalto', 'interface') | list)
        fail_msg: >-
          A transfer requires one unchanged connection identity, unchanged unrelated
          configuration, and explicit downstream packet checks.

    - name: Require every transfer packet phase
      vars:
        required_phases: ['acquired', 'excluded', 'recovered', 'selected']
        supplied_phases: "{{ mwan_transfer_packet_checks | map(attribute='phase') | unique | list }}"
      ansible.builtin.assert:
        that: supplied_phases | sort == required_phases
        fail_msg: >-
          The active ownership transfer is missing packet phases:
          {{ required_phases | difference(supplied_phases) | join(', ') }}.
          Unexpected phases: {{ supplied_phases | difference(required_phases) | join(', ') }}.

    - name: Validate each explicit packet operation
      ansible.builtin.assert:
        that:
          - item is mapping
          - item.phase in ['excluded', 'acquired', 'recovered', 'selected']
          - item.family in ['ipv4', 'ipv6']
          - item.coverage in ['selected', 'unaffected']
          - item.host is string and item.host in hostvars
          - item.description is string and item.description | trim | length > 0
          - item.argv is sequence and item.argv is not string and item.argv | length > 0
          - item.argv | reject('string') | list | length == 0
          - item.argv[0] | trim | length > 0
          - >-
            (item.coverage == 'selected' and item.connection_id == mwan_transfer_connection_id)
            or (item.coverage == 'unaffected' and item.connection_id != mwan_transfer_connection_id
                and item.connection_id in
                (mwan_transfer_prior_document['ietf-interfaces:interfaces']['interface']
                 | map(attribute='goodkind-mwan-steering:connection-id') | list))
        fail_msg: A packet check requires an inventory host, argv, description, family, coverage, and connection identity.
      loop: "{{ mwan_transfer_packet_checks }}"
      loop_control:
        label: "{{ item.description | default('invalid packet operation') }}"

    - name: Validate requested runtime IPv6 translation edges before staging
      ansible.builtin.include_tasks: validate-mwan-transfer-packet-edges.yml

    - name: Require packet coverage for each configured acquired family
      vars:
        connection: >-
          {{ mwan_transfer_previous if item.0 in ['excluded', 'recovered'] else mwan_transfer_replacement }}
        acquires: >-
          {% set result = [] %}
          {% for key, family in connection.items() %}
          {% if key == 'ietf-ip:' ~ item.1 %}
          {% set _ = result.append(('address' in family and family.address != [])
             or ('goodkind-mwan-steering:dhcp' in family and family['goodkind-mwan-steering:dhcp'])
             or ('goodkind-mwan-steering:accept-ra' in family and family['goodkind-mwan-steering:accept-ra'])
             or (item.1 == 'ipv6' and connection['goodkind-mwan-steering:owner'] == 'networkd'
                 and 'goodkind-mwan-steering:accept-ra' not in family
                 and not ('forwarding' in family and family.forwarding))
             or 'goodkind-mwan-steering:delegation' in family) %}
          {% endif %}
          {% endfor %}
          {{ true in result }}
        checks: >-
          {{ mwan_transfer_packet_checks | selectattr('phase', 'equalto', item.0)
             | selectattr('family', 'equalto', item.1) | list }}
      ansible.builtin.assert:
        that:
          - checks | selectattr('coverage', 'equalto', 'unaffected') | list != []
          - item.0 == 'excluded' or checks | selectattr('coverage', 'equalto', 'selected') | list != []
        fail_msg: The phase requires actual selected-provider and unaffected-provider packets for every acquired family.
      loop: "{{ ['excluded', 'acquired', 'recovered', 'selected'] | product(['ipv4', 'ipv6']) | list }}"
      when: acquires | bool

    - name: Create a controller directory for validated transfer documents
      ansible.builtin.tempfile:
        state: directory
        prefix: mwan-transfer-
      delegate_to: localhost
      become: false
      vars:
        ansible_connection: local
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
      register: mwan_transfer_controller_directory

    - name: Record the controller transfer directory
      ansible.builtin.set_fact:
        mwan_transfer_controller_created: true

    - name: Render source exclusion, external ownership, and excluded replacement
      ansible.builtin.template:
        src: "{{ repo_root }}/mwan/config/transfer-network.json.j2"
        dest: "{{ mwan_transfer_controller_directory.path }}/{{ item.phase }}.json"
        mode: "0600"
      delegate_to: localhost
      become: false
      vars:
        ansible_connection: local
        ansible_python_interpreter: "{{ ansible_playbook_python }}"
        mwan_transfer_document: "{{ item.document }}"
        mwan_transfer_owner: "{{ item.owner }}"
        mwan_transfer_excluded: true
      loop:
        - phase: source
          document: "{{ mwan_transfer_prior_document }}"
          owner: "{{ mwan_transfer_previous['goodkind-mwan-steering:owner'] }}"
        - phase: external
          document: "{{ mwan_transfer_prior_document }}"
          owner: external
        - phase: replacement
          document: "{{ mwan_transfer_target_document }}"
          owner: "{{ mwan_transfer_replacement['goodkind-mwan-steering:owner'] }}"
      loop_control:
        label: "{{ item.phase }}"

    - name: Stage source exclusion before changing owners
      ansible.builtin.set_fact:
        mwan_role_install_network: "{{ mwan_transfer_controller_directory.path }}/source.json"

    - name: Read the selected connection's prior networkd input
      ansible.builtin.command:
        argv: [networkctl, status, "{{ mwan_transfer_previous.name }}", --json=short]
      register: mwan_transfer_prior_networkd
      changed_when: false

    - name: Capture the selected legacy input and exclusion sentinel
      ansible.builtin.set_fact:
        mwan_transfer_capture_paths: >-
          {{ ['/etc/systemd/network/00-mwan-release-' ~ mwan_transfer_connection_id ~ '.network']
             + ([(mwan_transfer_prior_networkd.stdout | from_json).NetworkFile]
                if mwan_transfer_previous['goodkind-mwan-steering:owner'] == 'networkd' else []) }}
