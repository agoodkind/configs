- name: Authorize the next gateway mutation
  ansible.builtin.include_tasks: mwan-operation-checkpoint.yml
  vars:
    mwan_operation_phase: "{{ 'connection-handover-' ~ mwan_transfer_connection_id if mwan_transfer_lease_active | bool else 'networkd-reload' }}"
    mwan_operation_reuse_lease: "{{ mwan_transfer_lease_active }}"
    mwan_operation_budget_seconds: >-
      {{ mwan_operation_metadata_timeout_seconds | int + mwan_role_job_timeout_seconds | int
         + mwan_operation_reconnect_timeout_seconds | int + 5
         + mwan_operation_checkpoint_timeout_seconds | int * 3 + 5
         if mwan_transfer_lease_active | bool
         else mwan_role_job_timeout_seconds | int * 2 + 300 + 120 + 30 }}

- name: Complete the bounded networkd reload
  when: not ansible_check_mode
  block:
    - name: Record the pending transfer networkd reload
      ansible.builtin.set_fact:
        mwan_transfer_mutation_pending: true
        mwan_networkd_reload_result: {}
      when: mwan_transfer_lease_active | bool

    - name: Reload networkd without waiting on SSH
      timeout: "{{ mwan_operation_metadata_timeout_seconds if mwan_transfer_lease_active | bool else mwan_operation_task_timeout_seconds }}"
      ansible.builtin.command:
        argv: [networkctl, reload]
      async: "{{ mwan_role_job_timeout_seconds }}"
      poll: 0
      register: mwan_networkd_reload_job
      changed_when: true

    - name: Reconnect after the networkd reload deadline
      timeout: >-
        {{ mwan_role_job_timeout_seconds | int
           + (mwan_operation_reconnect_timeout_seconds | int if mwan_transfer_lease_active | bool else 300) + 5 }}
      ansible.builtin.wait_for_connection:
        connect_timeout: 5
        delay: "{{ mwan_role_job_timeout_seconds }}"
        sleep: 5
        timeout: "{{ mwan_operation_reconnect_timeout_seconds if mwan_transfer_lease_active | bool else 300 }}"

    - name: Authorize reading the issued transfer reload completion
      ansible.builtin.include_tasks: mwan-operation-checkpoint.yml
      vars:
        mwan_operation_phase: "connection-handover-{{ mwan_transfer_connection_id }}"
        mwan_operation_acquire: false
        mwan_operation_reuse_lease: true
        mwan_operation_completion_only: true
      when: mwan_transfer_lease_active | bool

    - name: Verify the networkd reload completed
      timeout: "{{ mwan_operation_checkpoint_timeout_seconds }}"
      ansible.builtin.async_status:
        jid: "{{ mwan_networkd_reload_job.ansible_job_id }}"
      register: mwan_networkd_reload_result
      until: mwan_networkd_reload_result is finished
      retries: "{{ 1 if mwan_transfer_lease_active | bool else 24 }}"
      delay: 5

  always:
    - name: Record proved transfer networkd reload completion
      ansible.builtin.set_fact:
        mwan_transfer_mutation_pending: false
      when:
        - mwan_transfer_lease_active | bool
        - mwan_networkd_reload_result is finished
        - "'rc' in mwan_networkd_reload_result"
