---
# These tasks set the OpenSearch memory-map prerequisite on the hypervisor for
# its search guests. The hypervisor kernel has one vm.max_map_count value for
# every container, and an unprivileged LXC cannot write it. Each search guest
# reads the value before it starts OpenSearch. deploy-proxmox.yml imports this
# file when tack_search_proxy_enabled is true.

- name: Configure the OpenSearch memory-map limit
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-tack-search.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (deploy-proxmox.yml)
      vm.max_map_count = {{ tack_search_memory_map_count }}
  notify: Apply the OpenSearch memory-map limit
