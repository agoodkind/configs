---
# The hypervisor sets vm.max_map_count for its OpenSearch guests because an
# unprivileged LXC cannot write it. The hypervisor kernel applies one value to
# every container. Each search guest checks the value before it starts
# OpenSearch.

- name: Configure the OpenSearch memory-map limit
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-tack-search.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (deploy-proxmox.yml)
      vm.max_map_count = {{ tack_search_memory_map_count }}
  notify: Apply the OpenSearch memory-map limit
