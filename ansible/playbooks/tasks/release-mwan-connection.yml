- name: Capture actual networkd assignments before releasing its authority
  ansible.builtin.command:
    argv: [networkctl, status, "{{ mwan_transfer_previous.name }}", --json=short]
  register: mwan_transfer_networkd_source
  changed_when: false
  when: mwan_transfer_release_owner == 'networkd'

- name: Read the daemon PID before releasing the selected connection
  ansible.builtin.command:
    argv: [systemctl, show, mwan-ifmgr@wan, --property=MainPID, --value]
  register: mwan_transfer_previous_pid
  changed_when: false

- name: Authorize the next gateway mutation
  ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/mwan-operation-checkpoint.yml"
  vars:
    mwan_operation_phase: gateway-preparation

- name: Install the selected networkd exclusion sentinel
  timeout: "{{ mwan_operation_task_timeout_seconds }}"
  ansible.builtin.copy:
    dest: "/etc/systemd/network/00-mwan-release-{{ mwan_transfer_connection_id }}.network"
    mode: "0644"
    content: |
      # Managed by the MWAN connection transfer procedure.
      [Match]
      Name={{ mwan_transfer_previous.name }}
      [Link]
      Unmanaged=yes

- name: Authorize the next gateway mutation
  ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/mwan-operation-checkpoint.yml"
  vars:
    mwan_operation_phase: gateway-preparation

- name: Install validated external ownership before releasing the previous owner
  timeout: "{{ mwan_operation_task_timeout_seconds }}"
  ansible.builtin.copy:
    remote_src: true
    src: "{{ mwan_role_backup.path }}/transfer-external.json"
    dest: /etc/mwan/network.json
    mode: "0600"

- name: Restart the daemon with external ownership
  ansible.builtin.include_tasks: restart-mwan-ifmgr.yml
  vars:
    mwan_ifmgr_restart_timeout_seconds: "{{ mwan_role_job_timeout_seconds }}"

- name: Apply the selected networkd exclusion
  ansible.builtin.include_tasks: reload-mwan-networkd.yml

- name: Authorize the next gateway mutation
  ansible.builtin.include_tasks: "{{ playbook_dir }}/tasks/mwan-operation-checkpoint.yml"
  vars:
    mwan_operation_phase: gateway-preparation

- name: Reconfigure the selected networkd link without waiting on SSH
  timeout: "{{ mwan_operation_task_timeout_seconds }}"
  ansible.builtin.command:
    argv: [networkctl, reconfigure, "{{ mwan_transfer_previous.name }}"]
  async: "{{ mwan_role_job_timeout_seconds }}"
  poll: 0
  register: mwan_transfer_reconfigure_job
  when: mwan_transfer_release_owner == 'networkd'
  changed_when: true

- name: Reconnect after the selected networkd reconfiguration deadline
  ansible.builtin.wait_for_connection:
    connect_timeout: 5
    delay: "{{ mwan_role_job_timeout_seconds }}"
    sleep: 5
    timeout: 300
  when: mwan_transfer_release_owner == 'networkd'

- name: Verify selected networkd reconfiguration completed
  ansible.builtin.async_status:
    jid: "{{ mwan_transfer_reconfigure_job.ansible_job_id }}"
  register: mwan_transfer_reconfigure_result
  until: mwan_transfer_reconfigure_result is finished
  retries: 24
  delay: 5
  when: mwan_transfer_release_owner == 'networkd'

- name: Read the external daemon PID
  ansible.builtin.command:
    argv: [systemctl, show, mwan-ifmgr@wan, --property=MainPID, --value]
  register: mwan_transfer_external_pid
  changed_when: false

- name: Observe termination of the previous embedded acquisition clients
  ansible.builtin.stat:
    path: "/proc/{{ mwan_transfer_previous_pid.stdout | trim }}"
  register: mwan_transfer_previous_process

- name: Require the external daemon and previous process termination
  ansible.builtin.assert:
    that:
      - mwan_transfer_external_pid.stdout | int > 0
      - mwan_transfer_external_pid.stdout != mwan_transfer_previous_pid.stdout
      - not mwan_transfer_previous_process.stat.exists
    fail_msg: The previous daemon process has not terminated or external startup has no active process.

- name: Verify loaded external ownership and source exclusion
  ansible.builtin.include_tasks: read-mwan-transfer-state.yml
  vars:
    mwan_transfer_expected_owner: external
    mwan_transfer_excluded: true

- name: Verify actual release of the previous connection owner
  ansible.builtin.command:
    argv:
      - /usr/local/bin/mwan
      - deploy-gate
      - check-release
      - "{{ mwan_transfer_connection_id }}"
      - "{{ mwan_transfer_release_owner }}"
      - --config
      - /etc/mwan/config.toml
  register: mwan_transfer_released
  until: mwan_transfer_released.rc == 0
  retries: 30
  delay: 1
  changed_when: false

- name: Require recorded networkd assignments and routes to finish removal
  vars:
    networkd_sources: [static, DHCPv4, DHCPv6, DHCP-PD, NDisc]
    source: "{{ mwan_transfer_networkd_source.stdout | from_json }}"
    released: "{{ mwan_transfer_networkd_released.stdout | from_json }}"
    release_complete_json: >-
      {% set retained = [] %}
      {% for address in source.Addresses | selectattr('ConfigSource', 'in', networkd_sources) %}
      {% for current in released.Addresses %}
      {% set _ = retained.append(address.Family == current.Family
         and address.Address == current.Address and address.PrefixLength == current.PrefixLength) %}
      {% endfor %}
      {% endfor %}
      {% for route in source.Routes | selectattr('ConfigSource', 'in', networkd_sources) %}
      {% for current in released.Routes %}
      {% set identity = namespace(matches=true) %}
      {% for key in ['Family', 'Destination', 'DestinationPrefixLength', 'Gateway', 'Table', 'Priority', 'Protocol'] %}
      {% if (key in route) != (key in current) or (key in route and route[key] != current[key]) %}
      {% set identity.matches = false %}
      {% endif %}
      {% endfor %}
      {% set _ = retained.append(identity.matches) %}
      {% endfor %}
      {% endfor %}
      {{ retained | to_json }}
  ansible.builtin.command:
    argv: [networkctl, status, "{{ mwan_transfer_previous.name }}", --json=short]
  register: mwan_transfer_networkd_released
  until: true not in (release_complete_json | from_json)
  retries: 30
  delay: 1
  changed_when: false
  when: mwan_transfer_release_owner == 'networkd'
