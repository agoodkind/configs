---
- name: Prepare GitHub runner guest
  ansible.builtin.import_playbook: prep-guests.yml
  vars:
    target_hosts: tack_gh_runner_suburban_servers

- name: Provision Tack repository-scoped GitHub Actions runners
  hosts: tack_gh_runner_suburban_servers
  become: true
  environment:
    DEBIAN_FRONTEND: noninteractive
  vars:
    repo_root: "{{ playbook_dir | dirname | dirname }}"

  tasks:
    - name: Install K3s and Helm prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - tar
        state: present
        update_cache: true

    - name: Read installed K3s version
      ansible.builtin.command: k3s --version
      register: k3s_installed_version
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Determine whether the installed K3s release matches
      ansible.builtin.set_fact:
        k3s_installed_release_matches: >-
          {{
            (
              k3s_installed_version.stdout
              | regex_findall('(?m)^k3s version (\S+)')
            )
            == [k3s_version]
          }}
      changed_when: false

    - name: Download pinned K3s installer
      ansible.builtin.get_url:
        url: "{{ k3s_installer_url }}"
        dest: /tmp/k3s-install.sh
        checksum: "{{ k3s_installer_checksum }}"
        owner: root
        group: root
        mode: "0755"
      when:
        - not ansible_check_mode
        - not k3s_installed_release_matches

    - name: Install pinned K3s release without starting it
      ansible.builtin.command: /tmp/k3s-install.sh
      environment:
        INSTALL_K3S_VERSION: "{{ k3s_version }}"
        INSTALL_K3S_EXEC: server
        INSTALL_K3S_SKIP_START: "true"
      changed_when: true
      notify: Restart K3s
      when:
        - not ansible_check_mode
        - not k3s_installed_release_matches

    - name: Read K3s configuration directory
      ansible.builtin.stat:
        path: "{{ k3s_config_dir }}"
      register: k3s_config_directory
      check_mode: false

    - name: Create K3s and ARC configuration directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0750"
      loop:
        - "{{ k3s_config_dir }}"
        - "{{ arc_values_dir }}"

    - name: Configure K3s
      ansible.builtin.template:
        src: "{{ repo_root }}/github-runner/k3s-config.yaml.j2"
        dest: "{{ k3s_config_dir }}/config.yaml"
        owner: root
        group: root
        mode: "0600"
      notify: Restart K3s
      when:
        - not ansible_check_mode or k3s_config_directory.stat.exists

    - name: Enable and start K3s
      ansible.builtin.systemd:
        name: k3s
        enabled: true
        state: started
        daemon_reload: true
      when: not ansible_check_mode

    - name: Apply K3s changes before validation
      ansible.builtin.meta: flush_handlers
      when: not ansible_check_mode

    - name: Validate K3s host configuration
      ansible.builtin.command: k3s check-config
      changed_when: false
      when: not ansible_check_mode

    - name: Wait for the K3s node to report Ready
      ansible.builtin.command:
        argv:
          - k3s
          - kubectl
          - get
          - nodes
          - -o
          - >-
            jsonpath={.items[0].status.conditions[?(@.type=="Ready")].status}
      register: k3s_node_ready
      changed_when: false
      retries: 30
      delay: 5
      until: k3s_node_ready.stdout == "True"
      when: not ansible_check_mode

    - name: Read installed Helm version
      ansible.builtin.command: helm version --short
      register: helm_installed_version
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Install pinned Helm release
      when:
        - not ansible_check_mode
        - >-
          (helm_installed_version.stdout | regex_replace('\\+.*$', ''))
          != helm_version
      block:
        - name: Download pinned Helm archive
          ansible.builtin.get_url:
            url: "{{ helm_archive_url }}"
            dest: /tmp/helm-linux-amd64.tar.gz
            checksum: "{{ helm_archive_checksum }}"
            owner: root
            group: root
            mode: "0644"

        - name: Extract pinned Helm archive
          ansible.builtin.unarchive:
            src: /tmp/helm-linux-amd64.tar.gz
            dest: /tmp
            remote_src: true

        - name: Install Helm binary
          ansible.builtin.copy:
            src: /tmp/linux-amd64/helm
            dest: /usr/local/bin/helm
            owner: root
            group: root
            mode: "0755"
            remote_src: true

    - name: Install prerequisites for Docker repository
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
        state: present
        update_cache: true

    - name: Add Docker apt repository
      ansible.builtin.deb822_repository:
        name: docker
        types: deb
        uris: https://download.docker.com/linux/debian
        suites: trixie
        components: stable
        architectures: amd64
        signed_by: https://download.docker.com/linux/debian/gpg
        state: present

    - name: Install Docker Engine
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Configure Docker log rotation
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        owner: root
        group: root
        mode: "0644"
        content: |
          {
            "log-driver": "json-file",
            "log-opts": {
              "max-file": "3",
              "max-size": "25m"
            }
          }
      notify: Restart Docker

    - name: Enable and start Docker
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started

    - name: Apply Docker configuration before starting runners
      ansible.builtin.meta: flush_handlers

    - name: Create GitHub runner base directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0750"
      loop:
        - "{{ github_runner_install_dir }}"
        - "{{ github_runner_install_dir }}/work"
        - "{{ github_runner_install_dir }}/config"

    - name: Create GitHub runner work directories
      ansible.builtin.file:
        path: "{{ github_runner_install_dir }}/work/{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0750"
      loop: "{{ github_runner_names }}"

    - name: Create GitHub runner configuration directories
      ansible.builtin.file:
        path: "{{ github_runner_install_dir }}/config/{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0750"
      loop: "{{ github_runner_names }}"

    - name: Deploy GitHub runner Compose file
      ansible.builtin.template:
        src: "{{ repo_root }}/github-runner/docker-compose.yml.j2"
        dest: "{{ github_runner_install_dir }}/docker-compose.yml"
        owner: root
        group: root
        mode: "0644"

    - name: Read persistent GitHub runner configurations
      ansible.builtin.stat:
        path: "{{ github_runner_install_dir }}/config/{{ item }}/.runner"
      loop: "{{ github_runner_names }}"
      register: github_runner_config_files

    - name: Determine whether GitHub runners need registration
      ansible.builtin.set_fact:
        github_runner_bootstrap_required: >-
          {{
            not (
              github_runner_config_files.results
              | map(attribute='stat.exists')
              | min
            )
          }}

    - name: Bootstrap GitHub runners
      when:
        - github_runner_enabled | bool
        - github_runner_bootstrap_required | bool
      block:
        - name: Create short-lived GitHub runner registration token
          ansible.builtin.uri:
            url: "{{ github_runner_registration_url }}"
            method: POST
            headers:
              Accept: application/vnd.github+json
              Authorization: "Bearer {{ vault_github_runner_access_token }}"
              X-GitHub-Api-Version: "2022-11-28"
            status_code: 201
            return_content: true
          register: github_runner_registration_response
          changed_when: true
          no_log: true

        - name: Deploy short-lived GitHub runner registration token
          ansible.builtin.copy:
            dest: "{{ github_runner_install_dir }}/.env"
            owner: root
            group: root
            mode: "0600"
            content: >-
              RUNNER_TOKEN={{ github_runner_registration_response.json.token }}

          no_log: true

        - name: Pull GitHub runner image for bootstrap
          ansible.builtin.command:
            cmd: docker compose pull
            chdir: "{{ github_runner_install_dir }}"
          changed_when: true

        - name: Register GitHub runners
          ansible.builtin.command:
            cmd: docker compose up -d --remove-orphans
            chdir: "{{ github_runner_install_dir }}"
          changed_when: true

        - name: Wait for persistent GitHub runner configurations
          ansible.builtin.wait_for:
            path: "{{ github_runner_install_dir }}/config/{{ item }}/.runner"
            state: present
            timeout: 120
          loop: "{{ github_runner_names }}"

      always:
        - name: Remove short-lived GitHub runner registration token
          ansible.builtin.file:
            path: "{{ github_runner_install_dir }}/.env"
            state: absent

    - name: Pull GitHub runner image for existing registrations
      ansible.builtin.command:
        cmd: docker compose pull
        chdir: "{{ github_runner_install_dir }}"
      changed_when: true
      when:
        - github_runner_enabled | bool
        - not (github_runner_bootstrap_required | bool)

    - name: Restart registered GitHub runners without token
      ansible.builtin.command:
        cmd: docker compose up -d --remove-orphans --force-recreate
        chdir: "{{ github_runner_install_dir }}"
      changed_when: true
      when:
        - github_runner_enabled | bool
        - github_runner_bootstrap_required | bool

    - name: Start existing GitHub runners
      ansible.builtin.command:
        cmd: docker compose up -d --remove-orphans
        chdir: "{{ github_runner_install_dir }}"
      changed_when: true
      when:
        - github_runner_enabled | bool
        - not (github_runner_bootstrap_required | bool)

    - name: Read running GitHub runner services
      ansible.builtin.command:
        cmd: docker compose ps --services --status running
        chdir: "{{ github_runner_install_dir }}"
      register: github_runner_running_services
      changed_when: false
      failed_when: >-
        (github_runner_running_services.stdout_lines | sort)
        != (github_runner_names | sort)
      when: github_runner_enabled | bool

  handlers:
    - name: Restart K3s
      ansible.builtin.systemd:
        name: k3s
        state: restarted
        daemon_reload: true
      when: not ansible_check_mode

    - name: Restart Docker
      ansible.builtin.systemd:
        name: docker
        state: restarted
