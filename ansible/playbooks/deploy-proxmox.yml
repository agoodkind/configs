---
# Configure both Proxmox hypervisors (vault and suburban).
#
# Targets the static `proxmox_servers` group from inventory/hosts, which
# contains vault_servers and suburban_servers as children. Per-host vars
# live in inventory/group_vars/vault_servers.yml and suburban_servers.yml,
# auto-loaded by group_vars. Shared defaults live in proxmox_servers.yml.
#
# All task gating happens inside tasks/proxmox-host.yml via group_vars
# feature flags (cloudflared_oob_enabled, mwan_ifmgr_enabled,
# mwan_watchdog_enabled, proxmox_mwan_host_role_enabled) so this play body
# stays branchless and depends only on group membership.
#
# Run examples:
#   ./configsctl deploy deploy-proxmox --limit vault
#   ./configsctl deploy deploy-proxmox --limit suburban
#
# The mwan and opnsensectl binaries come from the releases the environment pins
# in group_vars; the play pulls and verifies both before touching the host.

- name: Configure Proxmox hypervisor
  hosts: proxmox_servers
  gather_facts: false
  force_handlers: true
  environment:
    DEBIAN_FRONTEND: noninteractive
  vars:
    repo_root: "{{ playbook_dir | dirname | dirname }}"
    # mwan-opnsense-host-deploy.yml clears this between renaming a new
    # opnsensectl into place and installing its units. A forced handler that
    # restarted the drainer or bridge in that window would start the new binary
    # from the old unit, which exits without --config until systemd gives up.
    opnsensectl_host_restart_safe: true

  pre_tasks:
    - name: Require a merged controller checkout
      ansible.builtin.import_tasks: tasks/require-merged-checkout.yml

  tasks:
    # Both pulls run per host, because each hypervisor's environment pins its
    # own release.
    - name: Pull the pinned mwan release
      ansible.builtin.import_tasks: tasks/github-release.yml
      vars:
        release_repo: "{{ mwan_release_repo }}"
        release_tag: "{{ mwan_release_tag }}"
        release_assets: "{{ mwan_release_assets }}"
        release_required_assets:
          - mwan_linux_amd64.tar.gz
        release_var_prefix: mwan

    - name: Pull the pinned opnsensectl release
      ansible.builtin.import_tasks: tasks/github-release.yml
      vars:
        release_repo: "{{ opnsensectl_release_repo }}"
        release_tag: "{{ opnsensectl_release_tag }}"
        release_assets: "{{ opnsensectl_release_assets }}"
        release_required_assets:
          - opnsensectl_linux_amd64.tar.gz
        release_var_prefix: opnsensectl

    - name: Configure Proxmox host services
      ansible.builtin.import_tasks: tasks/proxmox-host.yml

  handlers:
    - name: Restart cloudflared-oob
      ansible.builtin.systemd:
        name: cloudflared-oob
        enabled: true
        state: restarted
        daemon_reload: true
      when: cloudflared_oob_enabled | bool

    - name: Restart mwan-ifmgr
      ansible.builtin.systemd:
        name: mwan-ifmgr
        enabled: true
        state: restarted
        daemon_reload: true
      when: mwan_ifmgr_enabled | bool

    - name: Restart mwan-watchdog
      ansible.builtin.systemd:
        name: "{{ mwan_watchdog_service_name }}"
        enabled: true
        state: restarted
        daemon_reload: true
      when: mwan_watchdog_enabled | bool

    - name: Restart mwan-opnsense-drain
      ansible.builtin.systemd:
        name: mwan-opnsense-drain
        enabled: true
        state: restarted
        daemon_reload: true
      when: opnsensectl_host_restart_safe | bool

    - name: Restart mwan-opnsense-host
      ansible.builtin.systemd:
        name: mwan-opnsense-host
        enabled: true
        state: restarted
        daemon_reload: true
      when: opnsensectl_host_restart_safe | bool
