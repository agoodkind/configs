---
# Configure the MWAN failover LXC.
#
# Targets either mwan_failover_servers (prod LXC-116 on vault) or
# mwan_failover_suburban_servers (testbed LXC-216 on suburban). Per-target
# vars in inventory/group_vars/mwan_failover_servers.yml and
# inventory/group_vars/mwan_failover_suburban_servers.yml carry every value
# that differs between environments, so this play body is branchless on
# inventory_hostname.
#
# Run examples:
#   ./configsctl deploy deploy-mwan-failover \
#     --limit mwan_failover_servers
#   ./configsctl deploy deploy-mwan-failover \
#     --limit mwan_failover_suburban_servers

# The release this playbook installs is pinned in the environment's group_vars.
# This play pulls it onto the controller before the LXC is touched, so a bad
# pin fails first. It opens no connection.
- name: Pull the pinned mwan release onto the controller
  hosts: mwan_failover_servers:mwan_failover_suburban_servers
  gather_facts: false
  become: false
  pre_tasks:
    - name: Require a merged controller checkout
      ansible.builtin.import_tasks: tasks/require-merged-checkout.yml
  tasks:
    - name: Pull the pinned mwan release
      ansible.builtin.import_tasks: tasks/github-release.yml
      vars:
        release_repo: "{{ mwan_release_repo }}"
        release_tag: "{{ mwan_release_tag }}"
        release_assets: "{{ mwan_release_assets }}"
        release_required_assets:
          - mwan_linux_amd64.tar.gz
        release_var_prefix: mwan

- name: Configure MWAN failover LXC
  hosts: mwan_failover_servers:mwan_failover_suburban_servers
  become: false
  environment:
    DEBIAN_FRONTEND: noninteractive
  vars:
    repo_root: "{{ playbook_dir | dirname | dirname }}"

  tasks:
    - name: Ensure /etc/mwan exists
      ansible.builtin.file:
        path: /etc/mwan
        state: directory
        mode: "0755"

    - name: Ensure persistent mwan state directory exists
      ansible.builtin.file:
        path: /var/lib/mwan
        state: directory
        owner: root
        group: root
        mode: "0755"

    # The failover config sets deploy_expected = true, which makes the agent
    # emit a deploy-file-missing warning when /var/lib/mwan/last-deploy is
    # absent. Write it here (as the primary deploy does) so the gate is
    # satisfied and the failover does not alert on a file it never receives.
    - name: Write deploy timestamp to failover LXC
      ansible.builtin.copy:
        content: "{{ ansible_date_time.epoch }}"
        dest: /var/lib/mwan/last-deploy
        owner: root
        group: root
        mode: "0644"

    - name: Install nftables
      ansible.builtin.apt:
        name: nftables
        state: present

    - name: Deploy MWAN secrets environment file
      # The failover LXC config.toml has an [email] block but no
      # smtp2go_api_key. The mwan binary reads SMTP2GO_API_KEY from this
      # file at unit start via the systemd EnvironmentFile= directive.
      ansible.builtin.copy:
        dest: /etc/mwan/secrets.env
        content: |
          SMTP2GO_API_KEY={{ vault_smtp2go_api_key }}
        owner: root
        group: root
        mode: "0640"
      no_log: true
      notify:
        - Restart mwan-agent
        - Restart mwan-ifmgr

    - name: Deploy mwan unified binary
      ansible.builtin.copy:
        src: "{{ mwan_release_dir }}/linux_amd64/mwan"
        dest: /usr/local/bin/mwan
        mode: "0755"
      notify:
        - Restart mwan-agent
        - Restart mwan-ifmgr

    - name: Verify the failover binary is the released commit
      ansible.builtin.import_tasks: tasks/verify-mwan-release.yml
      vars:
        mwan_installed_binary: /usr/local/bin/mwan

    - name: Deploy /etc/mwan/config.toml
      ansible.builtin.template:
        src: "{{ repo_root }}/mwan-failover/config.toml.j2"
        dest: /etc/mwan/config.toml
        mode: "0640"
      notify:
        - Restart mwan-agent
        - Restart mwan-ifmgr

    - name: Deploy failover sysctl config
      ansible.builtin.copy:
        src: "{{ repo_root }}/mwan-failover/sysctl.conf"
        dest: /etc/sysctl.d/99-mwan-failover.conf
        mode: "0644"
      notify:
        - Reload sysctl

    - name: Deploy /etc/network/interfaces
      # No auto-restart of networking. Operator must reload manually to
      # control timing; a `systemctl restart networking` here bounces eth0
      # and eth1 which interrupts BGP and the ifmgr-managed iface.
      ansible.builtin.template:
        src: "{{ repo_root }}/mwan-failover/interfaces.j2"
        dest: /etc/network/interfaces
        mode: "0644"

    - name: Deploy nftables ruleset
      ansible.builtin.copy:
        src: "{{ repo_root }}/mwan-failover/nftables.conf"
        dest: /etc/nftables.conf
        mode: "0644"
        validate: /usr/sbin/nft -c -f %s
      notify:
        - Reload nftables

    # The released binary writes the agent unit, the shared ifmgr unit, and
    # the drop-in that relaxes the ifmgr sandbox for slaac_health, then
    # enables both units. It reloads systemd only when a file changed and
    # restarts nothing, so the handlers keep the restart decision. It prints
    # one line per change, each starting with one of the prefixes below, and
    # prints "no change" when it wrote no file.
    - name: Install the units the mwan binary embeds
      ansible.builtin.command:
        argv:
          - /usr/local/bin/mwan
          - install
          - --role
          - failover
          - --apply
      register: mwan_install
      changed_when: >-
        mwan_install.stdout_lines
        | select('match', '^(wrote|installed module|updated module|imported the) ')
        | list | length > 0
      notify:
        - Restart mwan-agent
        - Restart mwan-ifmgr

    - name: Enable nftables
      ansible.builtin.systemd:
        name: nftables
        enabled: true
        daemon_reload: true

  handlers:
    - name: Reload nftables
      ansible.builtin.systemd:
        name: nftables
        state: reloaded

    - name: Reload sysctl
      # `sysctl --system` exits non-zero in the LXC because it hits
      # host-protected keys a container cannot set, which aborts the deploy.
      # The failover file holds only writable net keys, so apply just it.
      ansible.builtin.command: sysctl -p /etc/sysctl.d/99-mwan-failover.conf
      changed_when: false

    - name: Restart mwan-agent
      ansible.builtin.systemd:
        name: mwan-agent
        state: restarted
        daemon_reload: true

    - name: Restart mwan-ifmgr
      ansible.builtin.systemd:
        name: mwan-ifmgr
        state: restarted
        daemon_reload: true
