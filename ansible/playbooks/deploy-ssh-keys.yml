---
- name: Gather container/VM information
  hosts: "{{ target_hosts }}"
  gather_facts: false
  tasks:
    # host is the inventory host every later pct and qm command delegates to,
    # resolved from the PVE node name. Using ansible_proxmox_host directly sends
    # suburban's guests to vault, because that node is named "hypervisor", DNS
    # answers for it, and both hypervisors carry the same VMIDs.
    - name: Store container/VM info on each host
      ansible.builtin.set_fact:
        guest_info:
          vmid: "{{ ansible_proxmox_vmid }}"
          host: "{{ proxmox_node_delegates[ansible_proxmox_host] }}"
          name: "{{ inventory_hostname }}"
          type: "{{ proxmox_vmtype }}"

# This play targets the guests, not localhost, and runs each task once. A
# deploy narrowed with --limit to a guest group leaves localhost out of the
# limit, so a localhost play matched no hosts, never wrote the key file, and
# prep-guests then pointed sshd at a file that did not exist (MWAN-477). Every
# task that runs a module delegates to the controller or a hypervisor, so no
# task connects to a guest over SSH and the play still reaches a locked-out
# guest.
- name: Deploy SSH keys to containers/VMs via Proxmox
  hosts: "{{ target_hosts }}"
  gather_facts: false
  run_once: true
  vars:
    work_tmp_dir: "{{ playbook_dir }}/../.tmp"
    # Build the guest list from whichever hosts the gather play set guest_info
    # on, so it is correct whether target_hosts is a group, a group-union
    # pattern (a:b), or a single host. Ansible already resolved target_hosts to
    # those hosts in the gather play above.
    guests: >-
      {{
        groups['all']
        | map('extract', hostvars, 'guest_info')
        | select('defined')
        | list
      }}
  tasks:
    - name: Create work tmp directory
      ansible.builtin.file:
        path: "{{ work_tmp_dir }}"
        state: directory
        mode: "0755"
      delegate_to: localhost
      check_mode: false

    - name: Use guest list with proxmox type
      ansible.builtin.set_fact:
        guests_with_type: "{{ guests }}"

    - name: Get proxy host and sshpiper upstream key from inventory
      ansible.builtin.set_fact:
        proxy_host: "{{ groups.proxy_servers | first }}"
        sshpiper_upstream_pubkey: >-
          {{ hostvars[(groups.proxy_servers | first)].sshpiper_upstream_pubkey | trim }}

    - name: Get proxy IPv6 from service_mapping inventory
      ansible.builtin.set_fact:
        proxy_ipv6: "{{ hostvars[proxy_host].service_ipv6 }}"

    - name: Show sshpiper upstream key status
      ansible.builtin.debug:
        msg: >-
          {{ 'Using sshpiper upstream key: ' + (sshpiper_upstream_pubkey | truncate(60)) }}

    - name: Write sshpiper upstream public key to work dir
      ansible.builtin.copy:
        content: "{{ sshpiper_upstream_pubkey }}\n"
        dest: "{{ work_tmp_dir }}/sshpiper_upstream_id_ed25519.pub"
        mode: "0644"
      delegate_to: localhost
      check_mode: false

    - name: Build proxy IPv6 allowlist from service_mapping
      ansible.builtin.set_fact:
        proxy_allowed_ipv6_list: ["{{ proxy_ipv6 }}/128"]

    - name: Write sshd authorized_keys with 'from' restriction
      ansible.builtin.copy:
        content: |
          # Managed by Ansible - Restricted by SSHPiper
          from="{{ proxy_allowed_ipv6_list | join(',') }}" {{ sshpiper_upstream_pubkey }}
        dest: "{{ work_tmp_dir }}/sshpiper_restricted_key.pub"
        mode: "0644"
      delegate_to: localhost
      check_mode: false

    # The tasks below build both bundles on the controller from the GitHub keys
    # of github_ssh_keys_user. A bundle holds the trimmed, non-empty lines of
    # its sources, deduplicated and sorted byte-wise, one per line. The second
    # bundle adds the lines of the restricted key file written above, so its
    # comment line sorts in with the keys.
    - name: Fetch the GitHub SSH keys
      ansible.builtin.uri:
        url: "https://github.com/{{ github_ssh_keys_user }}.keys"
        return_content: true
        headers:
          Accept: text/plain
      register: github_ssh_keys_response
      delegate_to: localhost
      check_mode: false

    # The lines are split with a regex because the regex engine reads '\n' as
    # a newline, while the split filter would read it as a backslash and an n.
    # unique and sort fold case unless told otherwise, and key bodies are
    # mixed-case base64.
    - name: Sort and deduplicate the GitHub SSH keys
      ansible.builtin.set_fact:
        github_authorized_keys_lines: >-
          {{ github_ssh_keys_response.content
             | regex_replace('\r', '')
             | regex_findall('[^\n]+')
             | map('trim')
             | reject('equalto', '')
             | unique(case_sensitive=true)
             | sort(case_sensitive=true) }}

    - name: Refuse to build a bundle without GitHub SSH keys
      ansible.builtin.assert:
        that:
          - github_authorized_keys_lines | length > 0
        fail_msg: "GitHub returned no SSH keys for {{ github_ssh_keys_user }}"
        quiet: true

    - name: Sort and deduplicate the GitHub SSH keys with the restricted key
      ansible.builtin.set_fact:
        authorized_keys_lines: >-
          {{ (github_authorized_keys_lines + sshpiper_restricted_key_lines)
             | map('trim')
             | reject('equalto', '')
             | unique(case_sensitive=true)
             | sort(case_sensitive=true) }}
      vars:
        sshpiper_restricted_key_lines: >-
          {{ lookup('ansible.builtin.file', work_tmp_dir ~ '/sshpiper_restricted_key.pub')
             | regex_replace('\r', '')
             | regex_findall('[^\n]+') }}

    - name: Write the GitHub authorized_keys bundle
      ansible.builtin.copy:
        content: "{{ github_authorized_keys_lines | join('\n') }}\n"
        dest: "{{ work_tmp_dir }}/github_authorized_keys.bundle"
        mode: "0644"
      delegate_to: localhost
      check_mode: false

    - name: Write the authorized_keys bundle with the restricted key
      ansible.builtin.copy:
        content: "{{ authorized_keys_lines | join('\n') }}\n"
        dest: "{{ work_tmp_dir }}/authorized_keys.bundle"
        mode: "0644"
      delegate_to: localhost
      check_mode: false

    - name: Copy bundle to Proxmox hosts
      ansible.builtin.copy:
        src: "{{ work_tmp_dir }}/authorized_keys.bundle"
        dest: "/tmp/authorized_keys_deploy.bundle"
        mode: "0644"
      delegate_to: "{{ item }}"
      loop: >-
        {{ guests_with_type
           | map(attribute='host') | unique | list }}

    - name: Copy GitHub SSH bundle to Proxmox hosts
      ansible.builtin.copy:
        src: "{{ work_tmp_dir }}/github_authorized_keys.bundle"
        dest: /tmp/github_authorized_keys_deploy.bundle
        mode: "0644"
      delegate_to: "{{ item }}"
      loop: >-
        {{ guests_with_type
           | map(attribute='host') | unique | list }}

    - name: Write sshd disable password auth snippet to Proxmox hosts
      ansible.builtin.copy:
        dest: /tmp/sshd-disable-password-auth.conf
        mode: "0644"
        content: |
          # Managed by Ansible
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          ChallengeResponseAuthentication no
      delegate_to: "{{ item }}"
      loop: >-
        {{ guests_with_type
           | map(attribute='host') | unique | list }}

    - name: Write sshd global authorized keys snippet to Proxmox hosts
      ansible.builtin.copy:
        dest: /tmp/sshd-global-authorized-keys.conf
        mode: "0644"
        content: |
          # Managed by Ansible
          AuthorizedKeysFile /etc/ssh/authorized_keys.d/authorized_keys
      delegate_to: "{{ item }}"
      loop: >-
        {{ guests_with_type
           | map(attribute='host') | unique | list }}

    - name: Write sshd tmpfiles snippet to Proxmox hosts
      ansible.builtin.copy:
        dest: /tmp/sshd-tmpfiles.conf
        mode: "0644"
        content: |
          # Managed by Ansible
          d /run/sshd 0755 root root -
      delegate_to: "{{ item }}"
      loop: >-
        {{ guests_with_type
           | map(attribute='host') | unique | list }}

    - name: Ensure LXC guests are running
      ansible.builtin.shell: |
        set -o pipefail
        pct status {{ item.vmid }} | grep -q running || pct start {{ item.vmid }}
      args:
        executable: /bin/bash
      delegate_to: "{{ item.host }}"
      loop: "{{ guests_with_type }}"
      loop_control:
        label: "{{ item.name }} (VMID: {{ item.vmid }})"
      when: item.type == 'lxc'
      changed_when: false
      failed_when: false

    - name: Ensure QEMU guests are running
      ansible.builtin.shell: |
        set -o pipefail
        qm status {{ item.vmid }} | grep -q running || qm start {{ item.vmid }}
      args:
        executable: /bin/bash
      delegate_to: "{{ item.host }}"
      loop: "{{ guests_with_type }}"
      loop_control:
        label: "{{ item.name }} (VMID: {{ item.vmid }})"
      when: item.type == 'qemu'
      changed_when: false
      failed_when: false

    - name: Deploy keys and sshd config to LXC guests
      ansible.builtin.shell: |
        set -e
        pct push {{ item.vmid }} /tmp/authorized_keys_deploy.bundle \
          /tmp/new_keys.pub
        {% if item.name in groups['proxy_servers'] %}
        pct push {{ item.vmid }} /tmp/github_authorized_keys_deploy.bundle \
          /tmp/new_sshpiper_keys.pub
        {% endif %}
        pct push {{ item.vmid }} /tmp/sshd-disable-password-auth.conf \
          /tmp/sshd-disable-password-auth.conf
        pct push {{ item.vmid }} /tmp/sshd-global-authorized-keys.conf \
          /tmp/sshd-global-authorized-keys.conf
        pct push {{ item.vmid }} /tmp/sshd-tmpfiles.conf \
          /tmp/sshd-tmpfiles.conf

        pct exec {{ item.vmid }} -- sh -c '
          set -e
          mkdir -p /etc/ssh/sshd_config.d /etc/ssh/authorized_keys.d /etc/tmpfiles.d
          test -s /tmp/new_keys.pub
          cat /tmp/new_keys.pub > /etc/ssh/authorized_keys.d/authorized_keys
          chmod 0644 /etc/ssh/authorized_keys.d/authorized_keys
          chown root:root /etc/ssh/authorized_keys.d/authorized_keys
          test -s /etc/ssh/authorized_keys.d/authorized_keys
          mv /tmp/sshd-disable-password-auth.conf \
            /etc/ssh/sshd_config.d/99-ansible-disable-password-auth.conf
          mv /tmp/sshd-global-authorized-keys.conf \
            /etc/ssh/sshd_config.d/99-sshpiper-global-authorized-keys.conf
          mv /tmp/sshd-tmpfiles.conf /etc/tmpfiles.d/sshd.conf
          chmod 0644 /etc/ssh/sshd_config.d/*.conf /etc/tmpfiles.d/sshd.conf
          if command -v systemd-tmpfiles >/dev/null 2>&1; then
            systemd-tmpfiles --create /etc/tmpfiles.d/sshd.conf || true
          fi
          mkdir -p /run/sshd
          chmod 0755 /run/sshd
          {% if item.name in groups['proxy_servers'] %}
          mkdir -p /etc/sshpiper
          cat /tmp/new_sshpiper_keys.pub > /etc/sshpiper/authorized_keys
          chmod 0600 /etc/sshpiper/authorized_keys
          if id sshpiper >/dev/null 2>&1; then
            chown sshpiper:sshpiper /etc/sshpiper/authorized_keys
          fi
          rm -f /tmp/new_sshpiper_keys.pub
          {% endif %}
          sshd -t
          systemctl reset-failed ssh || true
          systemctl restart ssh || true
          rm -f /tmp/new_keys.pub
        '
      args:
        executable: /bin/bash
      delegate_to: "{{ item.host }}"
      loop: "{{ guests_with_type }}"
      loop_control:
        label: "{{ item.name }} (VMID: {{ item.vmid }})"
      when: item.type == 'lxc'
      changed_when: true

    - name: Deploy keys and sshd config to QEMU guests
      ansible.builtin.shell: |
        set -eo pipefail
        qm status {{ item.vmid }} | grep -q running || qm start {{ item.vmid }}

        KEY_B64="$(base64 -w0 /tmp/authorized_keys_deploy.bundle)"
        DISABLE_B64="$(base64 -w0 /tmp/sshd-disable-password-auth.conf)"
        GLOBAL_B64="$(base64 -w0 /tmp/sshd-global-authorized-keys.conf)"
        TMPFILES_B64="$(base64 -w0 /tmp/sshd-tmpfiles.conf)"

        qm guest exec {{ item.vmid }} -- sh -c "
          set -e
          mkdir -p /etc/ssh/sshd_config.d /etc/ssh/authorized_keys.d /etc/tmpfiles.d
          echo '$KEY_B64' | base64 -d \
            > /etc/ssh/authorized_keys.d/authorized_keys
          chmod 0644 /etc/ssh/authorized_keys.d/authorized_keys
          chown root:root /etc/ssh/authorized_keys.d/authorized_keys
          test -s /etc/ssh/authorized_keys.d/authorized_keys
          echo '$DISABLE_B64' | base64 -d \
            > /etc/ssh/sshd_config.d/99-ansible-disable-password-auth.conf
          echo '$GLOBAL_B64' | base64 -d \
            > /etc/ssh/sshd_config.d/99-sshpiper-global-authorized-keys.conf
          echo '$TMPFILES_B64' | base64 -d > /etc/tmpfiles.d/sshd.conf
          chmod 0644 /etc/ssh/sshd_config.d/*.conf /etc/tmpfiles.d/sshd.conf
          if command -v systemd-tmpfiles >/dev/null 2>&1; then
            systemd-tmpfiles --create /etc/tmpfiles.d/sshd.conf || true
          fi
          mkdir -p /run/sshd
          chmod 0755 /run/sshd
          sshd -t
          systemctl reset-failed ssh || true
          systemctl restart ssh || true
        " | jq -r '.["out-data"]'
      args:
        executable: /bin/bash
      delegate_to: "{{ item.host }}"
      loop: "{{ guests_with_type }}"
      loop_control:
        label: "{{ item.name }} (VMID: {{ item.vmid }})"
      when: item.type == 'qemu'
      changed_when: true

    - name: Summary
      ansible.builtin.debug:
        msg: "✅ SSH keys deployed to {{ guests_with_type | length }} guest(s)"
