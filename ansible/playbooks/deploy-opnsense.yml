---
# Configure the mwan-opnsense daemon on an OPNsense host.
#
# Targets opnsense_servers (prod, router.home.goodkind.io reached via
# 3d06:bad:b01::1 as agoodkind) or opnsense_suburban_servers (testbed,
# router.suburban.goodkind.io reached directly over routed IPv6).
# All connection differences live in opnsense_servers.yml and
# opnsense_suburban_servers.yml, so this play body is branchless on
# inventory_hostname.
#
# Run examples:
#   ./configsctl deploy deploy-opnsense --limit opnsense_servers
#   ./configsctl deploy deploy-opnsense --limit opnsense_suburban_servers
#
# The binary comes from the release the environment pins in group_vars; the
# play pulls and verifies it before touching the host. The deploy reads the
# daemon's identity through /usr/local/bin/opnsensectl on the router's
# hypervisor, so deploy-proxmox with the same opnsensectl release runs on that
# hypervisor first.

- name: Deploy mwan-opnsense daemon
  hosts: opnsense_servers:opnsense_suburban_servers
  gather_facts: false
  vars:
    repo_root: "{{ playbook_dir | dirname | dirname }}"
    mwan_opnsense_binary_local: "{{ opnsensectl_release_dir }}/freebsd_amd64/opnsensectl"
  pre_tasks:
    - name: Require a merged controller checkout
      ansible.builtin.import_tasks: tasks/require-merged-checkout.yml
  tasks:
    - name: Pull the pinned opnsensectl release
      ansible.builtin.import_tasks: tasks/github-release.yml
      vars:
        release_repo: "{{ opnsensectl_release_repo }}"
        release_tag: "{{ opnsensectl_release_tag }}"
        release_assets: "{{ opnsensectl_release_assets }}"
        release_required_assets:
          - opnsensectl_freebsd_amd64.tar.gz
        release_var_prefix: opnsensectl

    - name: Run in-guest install task
      ansible.builtin.include_tasks: tasks/mwan-opnsense-deploy.yml

    # Restart Tayga so NAT64 comes up with fresh routes, gateway monitor, and
    # firewall state. A WAN outage or config import can leave Tayga running with
    # stale routes while the daemon and tun stay up, silently breaking NAT64 for
    # hours. The sub-second blip from a deliberate deploy-time restart is far
    # cheaper than that, so this runs on prod and testbed alike. See
    # docs/ops/opnsense/testbed/dns.md.
    - name: Restart Tayga to re-install NAT64 routes and firewall state
      ansible.builtin.command:
        cmd: configctl tayga restart
      changed_when: true
      when: not ansible_check_mode
      become: true

    # Regenerate the Unbound DNSBL python module before restarting Unbound.
    # OPNsense core always renders `python-script: unbound-dnsbl/dnsbl_module.py`
    # into unbound.conf even with DNSBL disabled (confirmed on 26.1 and 26.7),
    # so a freshly imported box crashes Unbound at startup until the module file
    # exists. Regenerating it makes the file present; on an existing box this is
    # a no-op. See docs/ops/opnsense/testbed/dns.md.
    - name: Regenerate Unbound DNSBL module so a fresh import has the python file
      ansible.builtin.command:
        cmd: configctl unbound dnsbl
      changed_when: true
      when: not ansible_check_mode
      become: true

    - name: Restart Unbound so it loads cleanly with the DNSBL module present
      ansible.builtin.command:
        cmd: configctl unbound restart
      changed_when: true
      when: not ansible_check_mode
      become: true
