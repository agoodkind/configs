---
# This playbook runs one reviewed Tack ops command on one Tack guest with the
# operator identity flags that deploy-tack renders (tack_ops_identity_flags).
# On a QA guest, the playbook accepts every reviewed command. On production,
# the playbook accepts only the owner guest, the one member of the inventory
# group tack_servers. On that guest, the playbook accepts only ops deploy
# verify, ops backfill once-search-projections, ops search provision, ops
# search reindex, and ops search verify. The QA reset runs its hand-run ops
# commands only through this playbook. Each row that those commands record
# includes the agent service, session, accountable operator, and deploy
# commit.
#
# Usage, with every value explicit:
#   ./configsctl deploy tack-ops --limit <one allowed Tack guest> \
#     --extra-var tack_commit=<40-character Tack commit the guest runs> \
#     --extra-var 'tack_ops_command="ops search verify"' \
#     --extra-var '{"tack_ops_args": ["--mode=full"]}' \
#     --extra-var tack_ops_execute=true \
#     --extra-var tack_ops_agent_service=<agent> \
#     --extra-var tack_ops_agent_session=<session> \
#     --extra-var tack_ops_accountable_email=<accountable operator email> \
#     --extra-var tack_server_digest=<CI index digest of tack-server> \
#     --extra-var tack_audit_consumer_digest=<CI index digest of tack-audit-consumer>
#
# The playbook runs ops deploy verify before the requested command.
# Verification rejects image digests that differ from the supplied values.
# In check mode, the playbook runs verification and the command dry run.
#
# Extra vars override every play and group variable. The allowed commands,
# the service of each command, and the command lines are literals in the
# tasks below for that reason.

- name: Check the Tack ops request
  hosts: tack_all
  gather_facts: false
  tasks:
    - name: Check the operator identity
      ansible.builtin.import_tasks: tasks/tack-ops-identity-guard.yml

    # The command runs through the command module, not a shell. Each extra
    # argument is one --flag or --flag=value token from a closed character
    # set, which leaves no room for a second command, a quoted SQL string, or
    # a shell operator. The play adds --execute and the identity flags itself,
    # and an argument may not set them.
    - name: Refuse a Tack ops request outside the reviewed commands, guests, or arguments
      ansible.builtin.assert:
        that:
          - tack_commit is match('[0-9a-f]{40}\Z')
          - tack_server_digest is match('sha256:[0-9a-f]{64}\Z')
          - tack_audit_consumer_digest is match('sha256:[0-9a-f]{64}\Z')
          - >-
            tack_ops_command in ['ops deploy verify', 'ops audit prove-schema-guard',
            'audit signers', 'audit query',
            'ops audit dlq inspect', 'ops audit dlq replay', 'ops audit consumer-offsets',
            'ops qa datagen seed', 'ops qa datagen search', 'ops qa datagen soak',
            'ops qa datagen search-load', 'ops qa datagen search-mixed',
            'ops backfill once-search-projections', 'ops backfill once-drop-killtest-schema',
            'ops search provision', 'ops search reindex', 'ops search verify']
          - tack_ops_args is sequence and tack_ops_args is not string and tack_ops_args is not mapping
          - tack_ops_command != 'ops backfill once-drop-killtest-schema' or tack_ops_args == []
          - >-
            tack_ops_command != 'ops backfill once-search-projections'
            or tack_ops_args == ['--manifest=/etc/tack/search-projections.json']
          - tack_ops_args | reject('match', '--[a-z][a-z0-9-]*(=[A-Za-z0-9._/:@,\[\]-]+)?\Z') | list == []
          - tack_ops_args | select('match', '--(execute|operator-|deploy-commit)') | list == []
          - >-
            ansible_play_hosts_all | difference(groups['tack_qa_all']) | list == []
            or ansible_play_hosts_all | difference(groups['tack_prod_all']) | list == []
          - >-
            ansible_play_hosts_all | intersect(groups['tack_prod_all']) | list == []
            or (ansible_play_hosts_all | difference(groups['tack_servers']) | list == []
                and tack_ops_command in ['ops deploy verify',
                                         'ops backfill once-search-projections',
                                         'ops search provision', 'ops search reindex',
                                         'ops search verify'])
          - ansible_play_hosts_all | unique | list | count == 1
        fail_msg: >-
          tack-ops runs one reviewed Tack ops command on exactly one guest. On
          a QA guest, the command is any reviewed command. On production, the
          guest is the owner guest in the inventory group tack_servers, and the
          command is ops deploy verify, ops backfill once-search-projections,
          ops search provision, ops search reindex, or ops search verify. One
          run never includes both a QA guest and a production guest.
          tack_commit is the 40-character Tack commit the guest runs.
          tack_server_digest and tack_audit_consumer_digest are the CI index
          digests of the reviewed build; each is sha256: followed by 64
          lowercase hex characters. Each extra argument is one --flag or
          --flag=value token and never --execute, --operator-*, or
          --deploy-commit. ops backfill once-drop-killtest-schema accepts no
          extra argument. ops backfill once-search-projections accepts only
          the argument --manifest=/etc/tack/search-projections.json. Command
          "{{ tack_ops_command }}", arguments {{ tack_ops_args }}, commit
          "{{ tack_commit }}", tack-server digest "{{ tack_server_digest }}",
          tack-audit-consumer digest "{{ tack_audit_consumer_digest }}",
          guests {{ ansible_play_hosts_all }}.
        quiet: true
      any_errors_fatal: true

- name: Run the Tack ops command
  hosts: tack_all
  gather_facts: false
  become: true
  environment:
    TACK_IMAGE_TAG: "{{ tack_commit }}"
  tasks:
    - name: Verify that the guest runs the Tack images for tack_commit
      ansible.builtin.command:
        cmd: >-
          docker compose run --rm tack-ops ops deploy verify --execute
          --tag {{ tack_commit }}
          --tack-server-digest {{ tack_server_digest }}
          --tack-audit-consumer-digest {{ tack_audit_consumer_digest }}
          {{ tack_ops_identity_flags }}
        chdir: "{{ tack_install_dir }}"
      changed_when: false
      check_mode: false

    # ops search provision and ops search reindex read node types and
    # property definitions through the metadata name index (TACK-542). The
    # dry run of the backfill counts the records without an index entry and
    # writes nothing. The guard that follows refuses both commands unless the
    # dry run reports zero missing entries of both kinds. A Tack image without
    # the backfill fails this read and stops the run.
    - name: Read whether the metadata name index is complete
      ansible.builtin.command:
        cmd: >-
          docker compose run --rm -e LOG_DISABLE_STDOUT=true app
          ops backfill once-metadata-name-index --output json
          {{ tack_ops_identity_flags }}
        chdir: "{{ tack_install_dir }}"
      register: tack_metadata_name_index_read
      changed_when: false
      check_mode: false
      when: &tack_ops_index_build tack_ops_command in ['ops search provision', 'ops search reindex']

    - name: Record whether search may build an index on this guest
      ansible.builtin.set_fact:
        tack_metadata_name_index_ready: >-
          {{ counts.dry_run | bool
             and counts.result.node_types.missing == 0
             and counts.result.property_definitions.missing == 0 }}
      # A dry run prints two operator lines before the JSON envelope, and the
      # envelope spans several lines.
      vars:
        output: "{{ tack_metadata_name_index_read.stdout }}"
        counts: "{{ (output[output.index('{'):] | from_json).result }}"
      when: *tack_ops_index_build

    - name: Refuse a search index build without a complete metadata name index
      ansible.builtin.include_tasks: tasks/tack-search-metadata-name-index.yml
      when: *tack_ops_index_build

    # The projection command override mounts the reviewed manifest for
    # ops backfill once-search-projections at
    # /etc/tack/search-projections.json. Only production has a reviewed
    # manifest. The task also writes the file in check mode because the dry run
    # reads it.
    - name: Install the reviewed search projection manifest
      ansible.builtin.copy:
        src: "{{ playbook_dir | dirname | dirname }}/tack/search-projections/production.json"
        dest: /etc/tack/search-projections.json
        owner: root
        group: root
        mode: "0644"
      check_mode: false
      when:
        - tack_ops_command == 'ops backfill once-search-projections'
        - inventory_hostname in groups['tack_prod_all']

    - name: Install the reviewed projection command mounts
      ansible.builtin.get_url:
        url: "https://api.github.com/repos/agoodkind/tack/contents/docker-compose.search-projections.yml?ref={{ tack_commit }}"
        dest: "{{ tack_install_dir }}/docker-compose.search-projections.yml"
        headers:
          Authorization: "Bearer {{ tack_repo_read_token }}"
          Accept: application/vnd.github.raw
        owner: root
        group: root
        mode: "0644"
      check_mode: false
      when: tack_ops_command == 'ops backfill once-search-projections'
      no_log: true

    - name: Install the reviewed audit command mounts
      ansible.builtin.get_url:
        url: "https://api.github.com/repos/agoodkind/tack/contents/{{ item }}?ref={{ tack_commit }}"
        dest: "{{ tack_install_dir }}/{{ item }}"
        headers:
          Authorization: "Bearer {{ tack_repo_read_token }}"
          Accept: application/vnd.github.raw
        owner: root
        group: root
        mode: "0644"
      loop:
        - docker-compose.audit-reader.yml
        - docker-compose.audit-redactor.yml
      check_mode: false
      when: >-
        tack_ops_command in ['ops qa datagen seed', 'ops audit dlq inspect',
                             'ops audit dlq replay', 'ops audit consumer-offsets']
      no_log: true

    - name: Print the dry run of the Tack ops command
      ansible.builtin.command:
        cmd: >-
          docker compose
          {{ '-f docker-compose.yml -f docker-compose.override.yml -f docker-compose.search-projections.yml'
             if tack_ops_command == 'ops backfill once-search-projections'
             else '-f docker-compose.yml -f docker-compose.override.yml -f docker-compose.audit-reader.yml'
             if tack_ops_command in ['ops qa datagen seed', 'ops audit dlq inspect',
                                     'ops audit dlq replay', 'ops audit consumer-offsets'] else '' }}
          {{ '-f docker-compose.audit-redactor.yml'
             if tack_ops_command == 'ops qa datagen seed'
             and ('--redact-audit-pii' in tack_ops_args or '--redact-audit-pii=true' in tack_ops_args) else '' }}
          run --rm
          {{ '-e DATABASE_URL_FILE' if tack_ops_command == 'ops backfill once-drop-killtest-schema' else '' }}
          {{ 'tack-ops' if tack_ops_command in ['ops deploy verify', 'ops audit prove-schema-guard', 'audit query',
                                                'ops search provision', 'ops search reindex', 'ops search verify',
                                                'ops backfill once-drop-killtest-schema'] else 'app' }}
          {{ tack_ops_command }} {{ tack_ops_args | join(' ') }}
          {{ tack_ops_identity_flags }}
        chdir: "{{ tack_install_dir }}"
      # The command needs the engine superuser login to drop killtest.
      # Remove this entry and the spec constants and examples when removing
      # ops backfill once-drop-killtest-schema (TACK-560;
      # command removal day 2026-12-06).
      environment: &tack_ops_superuser_environment >-
        {{ {'DATABASE_URL_FILE': '/run/secrets/TACK_LEDGER_SUPERUSER_DATABASE_URL'}
           if tack_ops_command == 'ops backfill once-drop-killtest-schema' else {} }}
      register: tack_ops_dry_run
      changed_when: false
      check_mode: false

    - name: Show the output of the dry run
      ansible.builtin.debug:
        msg: "{{ tack_ops_dry_run.stdout_lines }}"

    - name: Run the Tack ops command with --execute
      ansible.builtin.command:
        cmd: >-
          docker compose
          {{ '-f docker-compose.yml -f docker-compose.override.yml -f docker-compose.search-projections.yml'
             if tack_ops_command == 'ops backfill once-search-projections'
             else '-f docker-compose.yml -f docker-compose.override.yml -f docker-compose.audit-reader.yml'
             if tack_ops_command in ['ops qa datagen seed', 'ops audit dlq inspect',
                                     'ops audit dlq replay', 'ops audit consumer-offsets'] else '' }}
          {{ '-f docker-compose.audit-redactor.yml'
             if tack_ops_command == 'ops qa datagen seed'
             and ('--redact-audit-pii' in tack_ops_args or '--redact-audit-pii=true' in tack_ops_args) else '' }}
          run --rm
          {{ '-e DATABASE_URL_FILE' if tack_ops_command == 'ops backfill once-drop-killtest-schema' else '' }}
          {{ 'tack-ops' if tack_ops_command in ['ops deploy verify', 'ops audit prove-schema-guard', 'audit query',
                                                'ops search provision', 'ops search reindex', 'ops search verify',
                                                'ops backfill once-drop-killtest-schema'] else 'app' }}
          {{ tack_ops_command }} {{ tack_ops_args | join(' ') }}
          {{ tack_ops_identity_flags }} --execute
        chdir: "{{ tack_install_dir }}"
      environment: *tack_ops_superuser_environment
      register: tack_ops_execute_run
      changed_when: true
      when: tack_ops_execute | bool

    - name: Show the output of the --execute run
      ansible.builtin.debug:
        msg: "{{ tack_ops_execute_run.stdout_lines }}"
      when: tack_ops_execute_run is not skipped
