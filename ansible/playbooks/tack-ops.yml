---
# This playbook runs one reviewed Tack ops command on one Tack guest with the
# operator identity flags that deploy-tack renders (tack_ops_identity_flags).
# On a QA guest, the playbook accepts every reviewed command. On production,
# the playbook accepts only the owner guest, the one member of the inventory
# group tack_servers. On that guest, the playbook accepts only ops deploy
# verify, audit query, audit last-change, ops backfill once-search-projections,
# ops backfill once-fixed-definitions, ops backfill once-node-integrity, ops search
# provision, ops search reindex, ops search verify, and ops verify
# strict-validation. The QA reset runs its hand-run ops commands only through
# this playbook. Each row that those
# commands record includes the agent service, session, accountable operator,
# and deploy commit.
#
# Usage, with every value explicit:
#   ./configsctl deploy tack-ops --limit <one allowed Tack guest> \
#     --extra-var tack_commit=<40-character Tack commit the guest runs> \
#     --extra-var 'tack_ops_command="ops search verify"' \
#     --extra-var '{"tack_ops_args": ["--mode=full"]}' \
#     --extra-var tack_ops_execute=true \
#     --extra-var tack_ops_agent_service=<agent> \
#     --extra-var tack_ops_agent_session=<session> \
#     --extra-var tack_ops_accountable_email=<accountable operator email> \
#     --extra-var tack_server_digest=<CI index digest of tack-server> \
#     --extra-var tack_audit_consumer_digest=<CI index digest of tack-audit-consumer>
#
# ops backfill once-node-integrity requires --output=json and exactly one
# --request=<path> or --manifest=<path> under /var/lib/tack/repair/. Filenames
# allow letters, digits, dots, underscores, and hyphens and cannot start with
# a dot. tack_node_integrity_input sets the operator machine input path.
# tack_node_integrity_output sets its dry run output path and must equal its
# resolved path. Before the dry run, the playbook creates the guest directory
# as root:root 0700 and copies input to the argument path as root:root 0600.
# Both tasks run in check mode; the copy hides arguments and diff. Both runs
# use LOG_DISABLE_STDOUT=true and no_log. The playbook writes dry run stdout to
# tack_node_integrity_output and execute stdout to that path plus .execute.
# Both files use 0600 on the operator machine, even in check mode; writes hide
# arguments and diff. Each run fails in its own task on nonzero status.
# The block's always section writes execute stdout before failure ends the run.
# no_log hides the failed result. The execute debug task skips this command.
# Capture prints file paths, byte counts, SHA-256 digests, and run exit status.
# The app service mounts /var/lib/tack/repair only in a release with Tack
# PR 391.
#
# The playbook runs ops deploy verify before the requested command.
# Verification rejects image digests that differ from the supplied values.
# In check mode, the playbook runs verification and the command dry run.
#
# ops verify strict-validation accepts at most one extra argument,
# --max-violations=<n> with n a positive whole number, and runs in the app
# service. The flag sets how many invalid records the report lists. Tack
# checks the range of n and refuses a value outside it before it scans.
# With --execute, the command activates strict validation for every
# organization in the FoundationDB cluster, and no command removes the
# activation. Its prerequisite is a passing ops deploy verify on every guest
# of the environment that runs the app service: the owner guest
# (tack_provision_owner) and each application-only guest (tack_app_guest).
# Before the dry run, the playbook runs ops deploy verify on each of those
# guests, with --service app on an application-only guest, and stops the run
# when any check fails. The dry run and the --execute run both follow a
# passing check. The run must lock every one of those guests. It targets the
# owner guest, and ./configsctl deploy also locks the guest in
# tack_ops_lock_app_guest.
#
# Extra vars override every play and group variable. The allowed commands,
# the service of each command, and the command lines are literals in the
# tasks below for that reason.

- name: Check the Tack ops request
  hosts: tack_all
  gather_facts: false
  # Empty tack_node_integrity_input and tack_node_integrity_output values make
  # the node integrity check reject runs that omit either path. Extra vars
  # replace these values, which both plays share through the YAML anchor.
  vars: &tack_node_integrity_paths
    tack_node_integrity_input: ""
    tack_node_integrity_output: ""
  tasks:
    - name: Check the operator identity
      ansible.builtin.import_tasks: tasks/tack-ops-identity-guard.yml

    # The command runs through the command module, not a shell. Each extra
    # argument is one --flag or --flag=value token from a closed character
    # set, which leaves no room for a second command, a quoted SQL string, or
    # a shell operator. The play adds --execute and the identity flags itself,
    # and an argument may not set them.
    - name: Refuse a Tack ops request outside the reviewed commands, guests, or arguments
      ansible.builtin.assert:
        that:
          - tack_commit is match('[0-9a-f]{40}\Z')
          - tack_server_digest is match('sha256:[0-9a-f]{64}\Z')
          - tack_audit_consumer_digest is match('sha256:[0-9a-f]{64}\Z')
          - >-
            tack_ops_command in ['ops deploy verify', 'ops audit prove-schema-guard',
            'audit signers', 'audit query', 'audit last-change',
            'ops audit dlq inspect', 'ops audit dlq replay', 'ops audit consumer-offsets',
            'ops qa datagen seed', 'ops qa datagen search', 'ops qa datagen soak',
            'ops qa datagen search-load', 'ops qa datagen search-mixed',
            'ops backfill once-search-projections', 'ops backfill once-drop-killtest-schema',
            'ops backfill once-fixed-definitions', 'ops backfill once-node-integrity',
            'ops qa datagen repair',
            'ops search provision', 'ops search reindex', 'ops search verify',
            'ops verify strict-validation']
          - tack_ops_args is sequence and tack_ops_args is not string and tack_ops_args is not mapping
          - tack_ops_command != 'ops backfill once-drop-killtest-schema' or tack_ops_args == []
          - >-
            tack_ops_command != 'ops verify strict-validation'
            or (tack_ops_args | join(' ')) is match('(--max-violations=[1-9][0-9]*)?\Z')
          - >-
            tack_ops_command != 'ops backfill once-search-projections'
            or tack_ops_args == ['--manifest=/etc/tack/search-projections.json']
          - >-
            tack_ops_args | reject('match',
              '--[a-z][a-z0-9-]*(=[A-Za-z0-9._/:@,\[\]~-]+)?\Z'
              if tack_ops_command == 'audit last-change'
              else '--[a-z][a-z0-9-]*(=[A-Za-z0-9._/:@,\[\]-]+)?\Z') | list == []
          - tack_ops_args | select('match', '--(execute|operator-|deploy-commit)') | list == []
          - >-
            ansible_play_hosts_all | difference(groups['tack_qa_all']) | list == []
            or ansible_play_hosts_all | difference(groups['tack_prod_all']) | list == []
          - >-
            ansible_play_hosts_all | intersect(groups['tack_prod_all']) | list == []
            or (ansible_play_hosts_all | difference(groups['tack_servers']) | list == []
                and tack_ops_command in ['ops deploy verify', 'audit query', 'audit last-change',
                                         'ops backfill once-search-projections',
                                         'ops backfill once-fixed-definitions',
                                         'ops backfill once-node-integrity',
                                         'ops search provision', 'ops search reindex',
                                         'ops search verify', 'ops verify strict-validation'])
          - ansible_play_hosts_all | unique | list | count == 1
        fail_msg: >-
          tack-ops runs one reviewed Tack ops command on exactly one guest. On
          a QA guest, the command is any reviewed command. On production, the
          guest is the owner guest in the inventory group tack_servers, and the
          command is ops deploy verify, audit query, audit last-change,
          ops backfill once-search-projections,
          ops backfill once-fixed-definitions, ops backfill once-node-integrity,
          ops search provision, ops search reindex, ops search verify, or
          ops verify strict-validation.
          ops qa datagen repair runs only on QA guests. One run never includes
          both a QA guest and a production guest.
          tack_commit is the 40-character Tack commit the guest runs.
          tack_server_digest and tack_audit_consumer_digest are the CI index
          digests of the reviewed build; each is sha256: followed by 64
          lowercase hex characters. Each extra argument is one --flag or
          --flag=value token and never --execute, --operator-*, or
          --deploy-commit. ops backfill once-drop-killtest-schema accepts no
          extra argument. ops verify strict-validation accepts no extra
          argument or only --max-violations=<n> with n a positive whole
          number; Tack checks the range of n.
          ops backfill once-search-projections accepts only the argument --manifest=/etc/tack/search-projections.json. Command
          "{{ tack_ops_command }}", arguments {{ tack_ops_args }}, commit
          "{{ tack_commit }}", tack-server digest "{{ tack_server_digest }}",
          tack-audit-consumer digest "{{ tack_audit_consumer_digest }}",
          guests {{ ansible_play_hosts_all }}.
        quiet: true
      any_errors_fatal: true

    # The guest runs the command in its app service. ./configsctl deploy locks
    # this guest and the guest in tack_ops_lock_app_guest. Every other guest of
    # the environment that runs the app service must be the guest in
    # tack_ops_lock_app_guest.
    - name: Refuse ops verify strict-validation unless the run locks every guest that runs the app service
      ansible.builtin.assert:
        that:
          - inventory_hostname in tack_ops_app_guests
          - tack_ops_app_guests | difference(ansible_play_hosts_all + [tack_ops_lock_app_guest]) | list == []
        fail_msg: >-
          ops verify strict-validation runs on the owner guest of its
          environment. The run locks that guest and the guest in
          tack_ops_lock_app_guest, and it checks the images on every guest of
          the environment that runs the app service. Guest
          {{ inventory_hostname }}, guests that run the app service
          {{ tack_ops_app_guests }}, tack_ops_lock_app_guest
          "{{ tack_ops_lock_app_guest }}".
        quiet: true
      any_errors_fatal: true
      when: tack_ops_command == 'ops verify strict-validation'

    - name: Validate the node integrity arguments and operator file paths
      ansible.builtin.include_tasks: tasks/tack-ops-node-integrity-check.yml
      when: &tack_ops_node_integrity tack_ops_command == 'ops backfill once-node-integrity'

- name: Run the Tack ops command
  hosts: tack_all
  gather_facts: false
  become: true
  environment:
    TACK_IMAGE_TAG: "{{ tack_commit }}"
  vars: *tack_node_integrity_paths
  tasks:
    - name: Verify that the guest runs the Tack images for tack_commit
      ansible.builtin.command:
        cmd: >-
          docker compose run --rm tack-ops ops deploy verify --execute
          --tag {{ tack_commit }}
          --tack-server-digest {{ tack_server_digest }}
          --tack-audit-consumer-digest {{ tack_audit_consumer_digest }}
          {{ tack_ops_identity_flags }}
        chdir: "{{ tack_install_dir }}"
      changed_when: false
      check_mode: false

    # The task above checks this guest. This task checks each other guest of
    # the environment that runs the app service before the dry run of ops
    # verify strict-validation. An application-only guest runs no
    # audit-consumer, and its check reads only the app service and the
    # tack-server digest.
    - name: Verify that each other app guest of this environment runs the Tack images for tack_commit
      ansible.builtin.command:
        cmd: >-
          docker compose run --rm tack-ops ops deploy verify --execute
          --tag {{ tack_commit }}
          --tack-server-digest {{ tack_server_digest }}
          {{ '--service app' if hostvars[item].tack_app_guest | bool
             else '--tack-audit-consumer-digest ' ~ tack_audit_consumer_digest }}
          {{ tack_ops_identity_flags }}
        chdir: "{{ tack_install_dir }}"
      delegate_to: "{{ item }}"
      loop: "{{ tack_ops_app_guests | difference([inventory_hostname]) }}"
      changed_when: false
      check_mode: false
      when: tack_ops_command == 'ops verify strict-validation'

    # ops search provision and ops search reindex read node types and
    # property definitions through the metadata name index (TACK-542). The
    # dry run of the backfill counts the records without an index entry and
    # writes nothing. The guard that follows refuses both commands unless the
    # dry run reports zero missing entries of both kinds. A Tack image without
    # the backfill fails this read and stops the run.
    - name: Read whether the metadata name index is complete
      ansible.builtin.command:
        cmd: >-
          docker compose run --rm -e LOG_DISABLE_STDOUT=true app
          ops backfill once-metadata-name-index --output json
          {{ tack_ops_identity_flags }}
        chdir: "{{ tack_install_dir }}"
      register: tack_metadata_name_index_read
      changed_when: false
      check_mode: false
      when: &tack_ops_index_build tack_ops_command in ['ops search provision', 'ops search reindex']

    - name: Record whether search may build an index on this guest
      ansible.builtin.set_fact:
        tack_metadata_name_index_ready: >-
          {{ counts.dry_run | bool
             and counts.result.node_types.missing == 0
             and counts.result.property_definitions.missing == 0 }}
      # A dry run prints two operator lines before the JSON envelope, and the
      # envelope spans several lines.
      vars:
        output: "{{ tack_metadata_name_index_read.stdout }}"
        counts: "{{ (output[output.index('{'):] | from_json).result }}"
      when: *tack_ops_index_build

    - name: Refuse a search index build without a complete metadata name index
      ansible.builtin.include_tasks: tasks/tack-search-metadata-name-index.yml
      when: *tack_ops_index_build

    # The projection command override mounts the reviewed manifest for
    # ops backfill once-search-projections at
    # /etc/tack/search-projections.json. Only production has a reviewed
    # manifest. The task also writes the file in check mode because the dry run
    # reads it.
    - name: Install the reviewed search projection manifest
      ansible.builtin.copy:
        src: "{{ playbook_dir | dirname | dirname }}/tack/search-projections/production.json"
        dest: /etc/tack/search-projections.json
        owner: root
        group: root
        mode: "0644"
      check_mode: false
      when:
        - tack_ops_command == 'ops backfill once-search-projections'
        - inventory_hostname in groups['tack_prod_all']

    - name: Install the reviewed projection command mounts
      ansible.builtin.get_url:
        url: "https://api.github.com/repos/agoodkind/tack/contents/docker-compose.search-projections.yml?ref={{ tack_commit }}"
        dest: "{{ tack_install_dir }}/docker-compose.search-projections.yml"
        headers:
          Authorization: "Bearer {{ tack_repo_read_token }}"
          Accept: application/vnd.github.raw
        owner: root
        group: root
        mode: "0644"
      check_mode: false
      when: tack_ops_command == 'ops backfill once-search-projections'
      no_log: true

    - name: Install the reviewed audit command mounts
      ansible.builtin.get_url:
        url: "https://api.github.com/repos/agoodkind/tack/contents/{{ item }}?ref={{ tack_commit }}"
        dest: "{{ tack_install_dir }}/{{ item }}"
        headers:
          Authorization: "Bearer {{ tack_repo_read_token }}"
          Accept: application/vnd.github.raw
        owner: root
        group: root
        mode: "0644"
      loop:
        - docker-compose.audit-reader.yml
        - docker-compose.audit-redactor.yml
      check_mode: false
      when: >-
        tack_ops_command in ['ops qa datagen seed', 'ops audit dlq inspect',
                             'ops audit dlq replay', 'ops audit consumer-offsets']
      no_log: true

    - name: Stage the node integrity input on the Tack guest
      ansible.builtin.include_tasks: tasks/tack-ops-node-integrity-stage.yml
      when: *tack_ops_node_integrity

    # The block runs the Tack ops dry run. Its always section writes node
    # integrity stdout and stderr to the operator output files before a failed
    # dry run ends the play.
    - name: Run the dry run of the Tack ops command and capture node integrity output
      block:
        - name: Print the dry run of the Tack ops command
          ansible.builtin.command:
            cmd: >-
              docker compose
              {{ '-f docker-compose.yml -f docker-compose.override.yml -f docker-compose.search-projections.yml'
                 if tack_ops_command == 'ops backfill once-search-projections'
                 else '-f docker-compose.yml -f docker-compose.override.yml -f docker-compose.audit-reader.yml'
                 if tack_ops_command in ['ops qa datagen seed', 'ops audit dlq inspect',
                                         'ops audit dlq replay', 'ops audit consumer-offsets'] else '' }}
              {{ '-f docker-compose.audit-redactor.yml'
                 if tack_ops_command == 'ops qa datagen seed'
                 and ('--redact-audit-pii' in tack_ops_args or '--redact-audit-pii=true' in tack_ops_args) else '' }}
              run --rm
              {{ '-e DATABASE_URL_FILE' if tack_ops_command == 'ops backfill once-drop-killtest-schema' else '' }}
              {{ '-e LOG_DISABLE_STDOUT=true' if tack_ops_command == 'ops backfill once-node-integrity' else '' }}
              {{ 'tack-ops' if tack_ops_command in ['ops deploy verify', 'ops audit prove-schema-guard',
                                                    'audit query', 'audit last-change',
                                                    'ops search provision', 'ops search reindex', 'ops search verify',
                                                    'ops backfill once-drop-killtest-schema'] else 'app' }}
              {{ tack_ops_command }} {{ tack_ops_args | join(' ') }}
              {{ tack_ops_identity_flags }}
            chdir: "{{ tack_install_dir }}"
            # This option keeps the trailing newline in node integrity stdout.
            # The execute task sets the same option.
            strip_empty_ends: "{{ tack_ops_command != 'ops backfill once-node-integrity' }}"
          # The node integrity dry run prints complete stored records. This task hides
          # that command's output. LOG_DISABLE_STDOUT=true keeps log lines out of the
          # captured output.
          no_log: "{{ tack_ops_command == 'ops backfill once-node-integrity' }}"
          # The command needs the engine superuser login to drop killtest.
          # Remove this entry and the spec constants and examples when removing
          # ops backfill once-drop-killtest-schema (TACK-560;
          # command removal day 2026-12-06).
          environment: &tack_ops_superuser_environment >-
            {{ {'DATABASE_URL_FILE': '/run/secrets/TACK_LEDGER_SUPERUSER_DATABASE_URL'}
               if tack_ops_command == 'ops backfill once-drop-killtest-schema' else {} }}
          register: tack_ops_dry_run
          changed_when: false
          check_mode: false
      always:
        - name: Capture the node integrity dry run output on the operator machine
          ansible.builtin.include_tasks: tasks/tack-ops-node-integrity-capture.yml
          vars:
            tack_node_integrity_capture_run: "{{ tack_ops_dry_run }}"
            tack_node_integrity_capture_path: "{{ tack_node_integrity_output }}"
          when: *tack_ops_node_integrity

    - name: Show the output of the dry run
      ansible.builtin.debug:
        msg: "{{ tack_ops_dry_run.stdout_lines }}"
      when: tack_ops_command != 'ops backfill once-node-integrity'

    # The always section writes stdout from a failed node integrity execute run
    # before the execute task's failure ends the run.
    - name: Run the Tack ops command with --execute and capture node integrity output
      block:
        - name: Run the Tack ops command with --execute
          ansible.builtin.command:
            cmd: >-
              docker compose
              {{ '-f docker-compose.yml -f docker-compose.override.yml -f docker-compose.search-projections.yml'
                 if tack_ops_command == 'ops backfill once-search-projections'
                 else '-f docker-compose.yml -f docker-compose.override.yml -f docker-compose.audit-reader.yml'
                 if tack_ops_command in ['ops qa datagen seed', 'ops audit dlq inspect',
                                         'ops audit dlq replay', 'ops audit consumer-offsets'] else '' }}
              {{ '-f docker-compose.audit-redactor.yml'
                 if tack_ops_command == 'ops qa datagen seed'
                 and ('--redact-audit-pii' in tack_ops_args or '--redact-audit-pii=true' in tack_ops_args) else '' }}
              run --rm
              {{ '-e DATABASE_URL_FILE' if tack_ops_command == 'ops backfill once-drop-killtest-schema' else '' }}
              {{ '-e LOG_DISABLE_STDOUT=true' if tack_ops_command == 'ops backfill once-node-integrity' else '' }}
              {{ 'tack-ops' if tack_ops_command in ['ops deploy verify', 'ops audit prove-schema-guard',
                                                    'audit query', 'audit last-change',
                                                    'ops search provision', 'ops search reindex', 'ops search verify',
                                                    'ops backfill once-drop-killtest-schema'] else 'app' }}
              {{ tack_ops_command }} {{ tack_ops_args | join(' ') }}
              {{ tack_ops_identity_flags }} --execute
            chdir: "{{ tack_install_dir }}"
            strip_empty_ends: "{{ tack_ops_command != 'ops backfill once-node-integrity' }}"
          environment: *tack_ops_superuser_environment
          no_log: "{{ tack_ops_command == 'ops backfill once-node-integrity' }}"
          register: tack_ops_execute_run
          changed_when: true
          when: tack_ops_execute | bool
      always:
        - name: Capture the node integrity execute stdout on the operator machine
          ansible.builtin.include_tasks: tasks/tack-ops-node-integrity-capture.yml
          vars:
            tack_node_integrity_capture_run: "{{ tack_ops_execute_run }}"
            tack_node_integrity_capture_path: "{{ tack_node_integrity_output }}.execute"
          when:
            - tack_ops_execute_run is not skipped
            - *tack_ops_node_integrity

    - name: Show the output of the --execute run
      ansible.builtin.debug:
        msg: "{{ tack_ops_execute_run.stdout_lines }}"
      when:
        - tack_ops_execute_run is not skipped
        - tack_ops_command != 'ops backfill once-node-integrity'
