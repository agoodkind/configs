---
# Install the wanconfig management stack on the MWAN gateway (MWAN-434).
# The stack arrives as Debian packages built, proven, and attested by the
# mwan release: the controller stages the bundle beside the binaries, and
# this play copies the packages to the gateway and installs them with apt.
# No gateway runs a compiler, a clone, or cmake. The vendored YANG model
# loads into the sysrepo datastore, and rousette serves RESTCONF on ::1
# behind an nghttpx front end bound to the management address only.
# Read-only: NACM denies every write and grants anonymous read per
# rousette's contract.
#
# Usage:
#   # Suburban testbed (first, always):
#   go run goodkind.io/configs/cmd/configs deploy deploy-wanconfig-stack --release <tag> --limit mwan_suburban_servers
#
#   # Production (only with explicit operator approval):
#   go run goodkind.io/configs/cmd/configs deploy deploy-wanconfig-stack --release <tag> --limit mwan_servers

- name: Install the wanconfig management stack
  hosts: mwan_servers:mwan_suburban_servers
  become: true
  environment:
    DEBIAN_FRONTEND: noninteractive
  vars:
    # The controller sets wanconfig_stack_dir and mwan_release_tag when
    # --release stages the bundle. Reading them bare makes a deploy without
    # --release fail at load rather than installing nothing.
    wanconfig_deb_dir: "/var/lib/mwan-wanconfig/debs/{{ mwan_release_tag }}"
    wanconfig_yang_dir: /usr/local/share/wanconfig/yang
    # The rousette package ships the models its RESTCONF contract needs.
    wanconfig_rousette_yang_dir: /opt/mwan-wanconfig/share/yang/modules/rousette
    # ietf-nat guards every enum value behind its nat-type features, so an
    # install with no features enabled leaves leaves with zero valid values
    # and libyang rejects the module. Enable exactly the translation types
    # the model uses.
    wanconfig_yang_modules:
      - name: ietf-interfaces@2018-02-20
        features: []
      - name: ietf-ip@2018-02-22
        features: []
      - name: ietf-routing@2018-03-13
        features: []
      - name: ietf-nat@2019-01-10
        features:
          - basic-nat44
          - napt44
          - dst-nat
          - nptv6
      - name: goodkind-mwan-steering@2026-08-20
        features: []
  tasks:
    - name: Install the front-end proxy
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
        name:
          - nghttp2-proxy
        state: present

    - name: Create stack directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - "{{ wanconfig_deb_dir }}"
        - "{{ wanconfig_yang_dir }}"
        - /etc/nghttpx

    - name: Create the anonymous-access system user
      ansible.builtin.user:
        name: yangnobody
        system: true
        shell: /usr/sbin/nologin
        create_home: false

    - name: Copy the staged stack packages
      ansible.builtin.copy:
        src: "{{ wanconfig_stack_dir }}/debs/"
        dest: "{{ wanconfig_deb_dir }}/"
        owner: root
        group: root
        mode: "0644"

    - name: List the copied packages
      ansible.builtin.find:
        paths: "{{ wanconfig_deb_dir }}"
        patterns: "*.deb"
      register: wanconfig_debs

    - name: Refuse a stage with no packages
      ansible.builtin.assert:
        that:
          - wanconfig_debs.files | length > 0
        fail_msg: "no .deb files under {{ wanconfig_deb_dir }}; stage the release with --release"

    # apt resolves the packages' interdependencies in one transaction. A
    # same-version reinstall is a no-op, which apt reports as 0 upgraded
    # and 0 newly installed.
    - name: Install the stack packages with apt
      ansible.builtin.command:
        argv: >-
          {{
            ['apt-get', 'install', '--yes', '--no-install-recommends']
            + (wanconfig_debs.files | map(attribute='path') | sort)
          }}
      register: wanconfig_apt_install
      changed_when: "'0 upgraded, 0 newly installed' not in wanconfig_apt_install.stdout"

    # sysrepo-tools ships a sysrepo-plugind unit that debhelper enables and
    # starts on install. Nothing on the gateway uses plugins; the daemon
    # would only hold the shared memory open across deploys.
    - name: Mask the sysrepo plugin daemon
      ansible.builtin.systemd:
        name: sysrepo-plugind.service
        state: stopped
        enabled: false
        masked: true

    - name: Copy the gateway model and its IETF imports
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ wanconfig_yang_dir }}/"
        owner: root
        group: root
        mode: "0644"
      loop:
        - "../../third_party/yang/standard/ietf/RFC/ietf-yang-types@2025-12-22.yang"
        - "../../third_party/yang/standard/ietf/RFC/ietf-inet-types@2025-12-22.yang"
        - "../../third_party/yang/standard/ietf/RFC/ietf-interfaces@2018-02-20.yang"
        - "../../third_party/yang/standard/ietf/RFC/ietf-ip@2018-02-22.yang"
        - "../../third_party/yang/standard/ietf/RFC/ietf-routing@2018-03-13.yang"
        - "../../third_party/yang/standard/ietf/RFC/ietf-nat@2019-01-10.yang"
        - "../../mwan/yang/goodkind-mwan-steering@2026-08-20.yang"

    - name: List installed sysrepo modules
      ansible.builtin.command:
        argv:
          - /usr/bin/sysrepoctl
          - --list
      register: wanconfig_sysrepo_modules
      changed_when: false

    - name: Install rousette's required models into sysrepo
      ansible.builtin.command:
        argv:
          - /usr/bin/sysrepoctl
          - --install
          - "{{ wanconfig_rousette_yang_dir }}/{{ item }}.yang"
          - --search-dirs
          - "{{ wanconfig_rousette_yang_dir }}"
      loop:
        - ietf-restconf@2017-01-26
        - ietf-restconf-monitoring@2017-01-26
        - ietf-yang-patch@2017-02-22
        - ietf-subscribed-notifications@2019-09-09
        - ietf-restconf-subscribed-notifications@2019-11-17
        - iana-if-type@2014-05-08
      when: item.split('@')[0] not in wanconfig_sysrepo_modules.stdout
      changed_when: true

    - name: Install the gateway model into sysrepo
      ansible.builtin.command:
        argv: >-
          {{
            ['/usr/bin/sysrepoctl', '--install',
             wanconfig_yang_dir ~ '/' ~ item.name ~ '.yang',
             '--search-dirs', wanconfig_yang_dir]
            + (item.features | map('regex_replace', '^', '--enable-feature=') | list)
          }}
      loop: "{{ wanconfig_yang_modules }}"
      loop_control:
        label: "{{ item.name }}"
      when: item.name.split('@')[0] not in wanconfig_sysrepo_modules.stdout
      changed_when: true

    # A module that is installed at an older revision is updated in place.
    # --update replaces the schema and keeps the stored data and enabled
    # features, which is what a revision that only adds nodes needs. The
    # revision check matches the module listing's "name | revision" row.
    - name: Update gateway models installed at an older revision
      ansible.builtin.command:
        argv: >-
          {{
            ['/usr/bin/sysrepoctl', '--update',
             wanconfig_yang_dir ~ '/' ~ item.name ~ '.yang',
             '--search-dirs', wanconfig_yang_dir]
          }}
      loop: "{{ wanconfig_yang_modules }}"
      loop_control:
        label: "{{ item.name }}"
      when: >-
        item.name.split('@')[0] in wanconfig_sysrepo_modules.stdout
        and wanconfig_sysrepo_modules.stdout is not
          regex(item.name.split('@')[0] ~ '\s*\|\s*' ~ item.name.split('@')[1])
      changed_when: true

    - name: Import the read-only NACM policy
      ansible.builtin.copy:
        src: ../../mwan/wanconfig/nacm-anonymous.xml
        dest: /etc/sysrepo-nacm-anonymous.xml
        owner: root
        group: root
        mode: "0644"
      register: wanconfig_nacm_file

    - name: Apply the NACM policy to the running and startup datastores
      ansible.builtin.command:
        argv:
          - /usr/bin/sysrepocfg
          - --import=/etc/sysrepo-nacm-anonymous.xml
          - --datastore
          - "{{ item }}"
          - --module
          - ietf-netconf-acm
      loop:
        - startup
        - running
      when: wanconfig_nacm_file.changed
      changed_when: true

    - name: Install the rousette unit
      ansible.builtin.copy:
        src: ../../mwan/wanconfig/rousette.service
        dest: /etc/systemd/system/rousette.service
        owner: root
        group: root
        mode: "0644"
      notify: Restart rousette

    - name: Render the nghttpx front-end configuration
      ansible.builtin.template:
        src: ../../mwan/wanconfig/nghttpx-wanconfig.conf.j2
        dest: /etc/nghttpx/wanconfig.conf
        owner: root
        group: root
        mode: "0644"
      notify: Restart nghttpx-wanconfig

    - name: Install the nghttpx front-end unit
      ansible.builtin.copy:
        src: ../../mwan/wanconfig/nghttpx-wanconfig.service
        dest: /etc/systemd/system/nghttpx-wanconfig.service
        owner: root
        group: root
        mode: "0644"
      notify: Restart nghttpx-wanconfig

    - name: Enable and start the stack services
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: started
        enabled: true
        daemon_reload: true
      loop:
        - rousette
        - nghttpx-wanconfig

  handlers:
    - name: Restart rousette
      ansible.builtin.systemd:
        name: rousette
        state: restarted
        daemon_reload: true

    - name: Restart nghttpx-wanconfig
      ansible.builtin.systemd:
        name: nghttpx-wanconfig
        state: restarted
        daemon_reload: true
