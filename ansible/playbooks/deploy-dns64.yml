---
# Configure BIND DNS64 on the Suburban testbed.
# Run ./configsctl deploy deploy-dns64 --limit dns64_suburban_servers.
# Deploy production with ./configsctl tofu vault/dns64 apply.

- name: Verify DNS64 guest preparation
  ansible.builtin.import_playbook: require-prepared-guests.yml
  vars:
    target_hosts: dns64_suburban_servers

- name: Configure DNS64 Service
  hosts: dns64_suburban_servers
  become: true
  environment:
    DEBIAN_FRONTEND: noninteractive
  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install Bind9
      ansible.builtin.apt:
        name:
          - bind9
          - bind9-utils
          - bind9-dnsutils
        state: present

    - name: Configure named.conf.options for DNS64
      ansible.builtin.template:
        src: ../../bind/named.conf.options.j2
        dest: /etc/bind/named.conf.options
        owner: root
        group: bind
        mode: "0644"
      notify: Restart Bind9

    - name: Ensure Bind9 is enabled and started
      ansible.builtin.systemd:
        name: named
        state: started
        enabled: true

  handlers:
    - name: Restart Bind9
      ansible.builtin.systemd:
        name: named
        state: restarted
