---
# Releases every production deploy installs. mwan_prod_all holds the
# production gateway, failover, router, and hypervisor groups, so one pin
# covers the environment. mwan_testbed_all.yml carries the testbed's. Each
# play pulls and verifies the release itself, so a deploy names no release on
# the command line.
#
# An mwan pin names the repository that publishes the release, because the
# mwan module is moving from agoodkind/configs to agoodkind/mwan and each
# environment moves when its pin does. A checksum is the sha256:<hex> line
# from the release's checksums.txt. To move a pin, pick the repository and the
# tag, download its checksums.txt, and copy both lines here.

mwan_release_repo: agoodkind/configs
mwan_release_tag: "202609190338-9f-0ce2fd73"
mwan_release_assets:
  - name: mwan_linux_amd64.tar.gz
    checksum: "sha256:1db5c88daab34b988fc179e6210d59f551a4c69a2b7b8fcdd703536d56d12d31"
  - name: wanconfig-stack_linux_amd64.tar.gz
    checksum: "sha256:e8342f1faf1dff3a2ea94298ab5470454037a2efd5ed55d6acffc3218f5e2e51"

opnsensectl_release_tag: "202609190337-7-7db20fb"
