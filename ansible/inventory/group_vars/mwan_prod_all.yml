---
# Releases every production deploy installs. mwan_prod_all holds the
# production gateway, failover, router, and hypervisor groups, so one pin
# covers the environment. mwan_testbed_all.yml carries the testbed's. Each
# play pulls and verifies the release itself, so a deploy names no release on
# the command line.
#
# An mwan pin names the repository that publishes the release. agoodkind/mwan
# is the only one that does: this repository published the mwan release until
# its Go module moved out, and it now builds nothing. A checksum is the
# sha256:<hex> line from the release's checksums.txt. To move a pin, pick the
# tag, download its checksums.txt, and copy both lines here.

mwan_release_repo: agoodkind/mwan
mwan_release_tag: "202609201600-e-16dd8f1"
mwan_release_assets:
  - name: mwan_linux_amd64.tar.gz
    checksum: "sha256:97c8879c1325bcbca38fedc46f0b8ba56b245d799e0de6ca6f2f6af29dd7c3a3"
  - name: wanconfig-stack_linux_amd64.tar.gz
    checksum: "sha256:500ec64547c91fa04100a7de67340084bf9fc965a9a753dec0a5ddde5984e3a8"

