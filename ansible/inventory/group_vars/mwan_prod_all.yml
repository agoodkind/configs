---
# Releases every production deploy installs. mwan_prod_all holds the
# production gateway, failover, router, and hypervisor groups, so one pin
# covers the environment. mwan_testbed_all.yml carries the testbed's. Each
# play pulls and verifies the release itself, so a deploy names no release on
# the command line.
#
# An mwan pin names the repository that publishes the release, because
# agoodkind/configs published the mwan release before agoodkind/mwan did. A
# checksum is the sha256:<hex> line from the release's checksums.txt. To move a pin, pick the repository and the
# tag, download its checksums.txt, and copy both lines here.

mwan_release_repo: agoodkind/mwan
mwan_release_tag: "202609190526-1-188a634"
mwan_release_assets:
  - name: mwan_linux_amd64.tar.gz
    checksum: "sha256:b5cd81107a4fa1f958f76a0ffd556a6341703079954da734d2fe9a8300d93003"
  - name: wanconfig-stack_linux_amd64.tar.gz
    checksum: "sha256:68f254994e2dda3cea9c4adc941cbb9ce12f5741df09ad7cd51ed0f95b475b43"

