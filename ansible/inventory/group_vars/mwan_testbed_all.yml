---
# Releases every testbed deploy installs. mwan_testbed_all holds the testbed
# gateway, failover, router, and hypervisor groups. mwan_prod_all.yml carries
# production's pins and explains the shape of a pin.

mwan_release_repo: agoodkind/mwan
mwan_ifmgr_lease_recovery_enabled: true
mwan_release_tag: "202610070008-c0-017079e"
mwan_release_assets:
  - name: mwan_linux_amd64.tar.gz
    checksum: "sha256:13d4c21fe22650ce025d0502e713515546c8e5b45c2eb175c1cab5227dfaac3f"
  - name: wanconfig-stack_linux_amd64.tar.gz
    checksum: "sha256:62a8918ae7dcebb4f89cfbd983e5dc9e317f2aecf7ed2c4197c48dd32af3a6bb"

opnsensectl_release_tag: "202609190337-7-7db20fb"
opnsensectl_release_assets:
  - name: opnsensectl_linux_amd64.tar.gz
    checksum: "sha256:29e65cb0cc7b7924478416ab98d7c22e8d3e1679e7cbcfdbff42323fde874399"
  - name: opnsensectl_freebsd_amd64.tar.gz
    checksum: "sha256:32547bb0ab5d3979d2aa19f4d6154895e2a23dbdd3013aea32c27742b2471a3d"

# The gateway forwards this prefix without translation. The routed simulator
# routes the same prefix on its own connection.
testbed_routing_home_prefix: "3d06:bad:b01:210::/60"

# Each simulator guest installs an unreachable route for every prefix in this
# list.
testbed_routing_management_unreachable_prefixes: >-
  {{ [testbed_routing_home_prefix, '2001:db8::/32']
  + (testbed_routing_networks | dict2items | rejectattr('key', 'equalto', 'management')
  | map(attribute='value.ipv4_net') | reject('equalto', '') | list) }}

testbed_routing_nodes:
  mwan:
    role: gateway
    service: mwan_suburban
    scenario: ""
    router_id: ""
  isp_astound:
    role: transport
    service: isp_astound_suburban
    scenario: ""
    router_id: ""
  isp_sonic:
    role: transport
    service: isp_sonic_suburban
    scenario: ""
    router_id: ""
  astound_static_endpoint:
    role: tunnel_endpoint
    service: routing_astound_static_endpoint_suburban
    scenario: astound_static
    router_id: ""
  astound_static_client:
    role: remote_client
    service: routing_astound_static_client_suburban
    scenario: astound_static
    router_id: ""
  etheric_native_router:
    role: provider_router
    service: routing_etheric_native_router_suburban
    scenario: etheric_native
    router_id: "192.0.2.9"
  etheric_native_upstream:
    role: upstream_router
    service: routing_etheric_native_upstream_suburban
    scenario: etheric_native
    router_id: "192.0.2.10"
  etheric_native_client:
    role: remote_client
    service: routing_etheric_native_client_suburban
    scenario: etheric_native
    router_id: ""
  tunnel_static_vps:
    role: vps
    service: routing_tunnel_static_vps_suburban
    scenario: tunnel_static
    router_id: "192.0.2.12"
  tunnel_static_upstream:
    role: upstream_router
    service: routing_tunnel_static_upstream_suburban
    scenario: tunnel_static
    router_id: "192.0.2.13"
  tunnel_static_client:
    role: remote_client
    service: routing_tunnel_static_client_suburban
    scenario: tunnel_static
    router_id: ""
  tunnel_upstream_vps:
    role: vps
    service: routing_tunnel_upstream_vps_suburban
    scenario: tunnel_upstream
    router_id: ""
  tunnel_upstream_upstream:
    role: upstream_router
    service: routing_tunnel_upstream_upstream_suburban
    scenario: tunnel_upstream
    router_id: "192.0.2.16"
  tunnel_upstream_client:
    role: remote_client
    service: routing_tunnel_upstream_client_suburban
    scenario: tunnel_upstream
    router_id: ""
  tunnel_vps_vps:
    role: vps
    service: routing_tunnel_vps_vps_suburban
    scenario: tunnel_vps
    router_id: "192.0.2.18"
  tunnel_vps_upstream:
    role: upstream_router
    service: routing_tunnel_vps_upstream_suburban
    scenario: tunnel_vps
    router_id: "192.0.2.19"
  tunnel_vps_client:
    role: remote_client
    service: routing_tunnel_vps_client_suburban
    scenario: tunnel_vps
    router_id: ""

testbed_routing_connections:
  astound:
    isp: astound
    simulator: isp_astound
    mwan_ipv4: "{{ service_mapping.mwan_suburban.ipv4_astound }}"
    simulator_link_ipv4: "{{ service_mapping.isp_astound_suburban.ipv4 }}"
    simulator_outer_ipv4: "{{ service_mapping.isp_astound_suburban.routing_interfaces.outer.ipv4 }}"
  sonic_1:
    isp: sonic
    simulator: isp_sonic
    mwan_ipv4: "{{ service_mapping.mwan_suburban.routing_interfaces.sonic_1.ipv4 }}"
    simulator_link_ipv4: "{{ service_mapping.isp_sonic_suburban.routing_interfaces.sonic_1.ipv4 }}"
    simulator_outer_ipv4: "{{ service_mapping.isp_sonic_suburban.routing_interfaces.outer.ipv4 }}"
  sonic_2:
    isp: sonic
    simulator: isp_sonic
    mwan_ipv4: "{{ service_mapping.mwan_suburban.routing_interfaces.sonic_2.ipv4 }}"
    simulator_link_ipv4: "{{ service_mapping.isp_sonic_suburban.routing_interfaces.sonic_2.ipv4 }}"
    simulator_outer_ipv4: "{{ service_mapping.isp_sonic_suburban.routing_interfaces.outer.ipv4 }}"
  etheric:
    isp: etheric
    simulator: etheric_native_router
    mwan_ipv4: "{{ service_mapping.mwan_suburban.routing_interfaces.etheric.ipv4 }}"
    simulator_link_ipv4: >-
      {{ service_mapping.routing_etheric_native_router_suburban.routing_interfaces.provider.ipv4 }}
    simulator_outer_ipv4: ""

# The local node of a session accepts import_prefixes and announces
# export_prefixes. The remote node accepts export_prefixes and announces
# import_prefixes. hops counts the links between the session addresses. A
# session on one link uses multihop_ttl = 0.
testbed_routing_scenarios:
  astound_static:
    kind: tunnel_static_routes
    connections: [astound]
    nodes: [astound_static_endpoint, astound_static_client]
    home_prefixes: ["{{ testbed_routing_home_prefix }}"]
    remote_prefixes: ["{{ testbed_routing_networks.astound_static_remote.ipv6_net }}"]
    tunnels:
      - id: astound_static_astound
        connection: astound
        protocol: sit
        mtu: 1480
        inner_prefix_length: 64
        local:
          node: mwan
          interface: sit-astound
          outer_ipv4: "{{ testbed_routing_connections.astound.mwan_ipv4 }}"
          inner_ipv6: "2001:db8:1ff:1::1"
        remote:
          node: astound_static_endpoint
          interface: sit-astound
          outer_ipv4: >-
            {{ service_mapping.routing_astound_static_endpoint_suburban.routing_interfaces.outer.ipv4 }}
          inner_ipv6: "2001:db8:1ff:1::2"
    routes:
      - node: mwan
        family: ipv4
        destination: >-
          {{ service_mapping.routing_astound_static_endpoint_suburban.routing_interfaces.outer.ipv4 }}/32
        gateway: "{{ testbed_routing_connections.astound.simulator_link_ipv4 }}"
      - node: astound_static_endpoint
        family: ipv4
        destination: "{{ testbed_routing_connections.astound.mwan_ipv4 }}/32"
        gateway: "{{ testbed_routing_connections.astound.simulator_outer_ipv4 }}"
      - node: mwan
        family: ipv6
        destination: "{{ testbed_routing_networks.astound_static_remote.ipv6_net }}"
        gateway: "2001:db8:1ff:1::2"
      - node: astound_static_endpoint
        family: ipv6
        destination: "{{ testbed_routing_home_prefix }}"
        gateway: "2001:db8:1ff:1::1"
      - node: astound_static_client
        family: ipv6
        destination: "{{ testbed_routing_home_prefix }}"
        gateway: >-
          {{ service_mapping.routing_astound_static_endpoint_suburban.routing_interfaces.remote.ipv6 }}
    sessions: []
    probe_targets:
      - id: tunnel_remote
        address: "2001:db8:1ff:1::2"
      - id: remote_client
        address: >-
          {{ service_mapping.routing_astound_static_client_suburban.routing_interfaces.remote.ipv6 }}

  etheric_native:
    kind: native_bgp
    connections: [etheric]
    nodes: [etheric_native_router, etheric_native_upstream, etheric_native_client]
    home_prefixes: ["{{ testbed_routing_home_prefix }}"]
    remote_prefixes: ["{{ testbed_routing_networks.etheric_native_remote.ipv6_net }}"]
    tunnels: []
    routes:
      - node: etheric_native_client
        family: ipv6
        destination: "{{ testbed_routing_home_prefix }}"
        gateway: >-
          {{ service_mapping.routing_etheric_native_upstream_suburban.routing_interfaces.remote.ipv6 }}
    sessions:
      - id: etheric_native_home
        address_family: ipv6_unicast
        hops: 1
        multihop_ttl: 0
        local:
          node: mwan
          asn: 64512
          address: "{{ service_mapping.mwan_suburban.routing_interfaces.etheric.ipv6 }}"
        remote:
          node: etheric_native_router
          asn: 64520
          address: >-
            {{ service_mapping.routing_etheric_native_router_suburban.routing_interfaces.provider.ipv6 }}
        policy:
          import_prefixes: ["{{ testbed_routing_networks.etheric_native_remote.ipv6_net }}"]
          export_prefixes: ["{{ testbed_routing_home_prefix }}"]
      - id: etheric_native_upstream
        address_family: ipv6_unicast
        hops: 1
        multihop_ttl: 0
        local:
          node: etheric_native_router
          asn: 64520
          address: >-
            {{ service_mapping.routing_etheric_native_router_suburban.routing_interfaces.transit.ipv6 }}
        remote:
          node: etheric_native_upstream
          asn: 64521
          address: >-
            {{ service_mapping.routing_etheric_native_upstream_suburban.routing_interfaces.transit.ipv6 }}
        policy:
          import_prefixes: ["{{ testbed_routing_networks.etheric_native_remote.ipv6_net }}"]
          export_prefixes: ["{{ testbed_routing_home_prefix }}"]
    probe_targets:
      - id: provider_router
        address: >-
          {{ service_mapping.routing_etheric_native_router_suburban.routing_interfaces.provider.ipv6 }}
      - id: remote_client
        address: >-
          {{ service_mapping.routing_etheric_native_client_suburban.routing_interfaces.remote.ipv6 }}

  tunnel_static:
    kind: tunnel_configured_home
    connections: [sonic_1]
    nodes: [tunnel_static_vps, tunnel_static_upstream, tunnel_static_client]
    home_prefixes: ["{{ testbed_routing_home_prefix }}"]
    remote_prefixes: ["{{ testbed_routing_networks.tunnel_static_remote.ipv6_net }}"]
    tunnels:
      - id: tunnel_static_sonic_1
        connection: sonic_1
        protocol: sit
        mtu: 1480
        inner_prefix_length: 64
        local:
          node: mwan
          interface: sit-static
          outer_ipv4: "{{ testbed_routing_connections.sonic_1.mwan_ipv4 }}"
          inner_ipv6: "2001:db8:3ff:1::1"
        remote:
          node: tunnel_static_vps
          interface: sit-sonic1
          outer_ipv4: >-
            {{ service_mapping.routing_tunnel_static_vps_suburban.routing_interfaces.outer.ipv4 }}
          inner_ipv6: "2001:db8:3ff:1::2"
    routes:
      - node: mwan
        family: ipv4
        destination: >-
          {{ service_mapping.routing_tunnel_static_vps_suburban.routing_interfaces.outer.ipv4 }}/32
        gateway: "{{ testbed_routing_connections.sonic_1.simulator_link_ipv4 }}"
      - node: tunnel_static_vps
        family: ipv4
        destination: "{{ testbed_routing_connections.sonic_1.mwan_ipv4 }}/32"
        gateway: "{{ testbed_routing_connections.sonic_1.simulator_outer_ipv4 }}"
      - node: mwan
        family: ipv6
        destination: "{{ testbed_routing_networks.tunnel_static_remote.ipv6_net }}"
        gateway: "2001:db8:3ff:1::2"
      - node: tunnel_static_vps
        family: ipv6
        destination: "{{ testbed_routing_home_prefix }}"
        gateway: "2001:db8:3ff:1::1"
      - node: tunnel_static_client
        family: ipv6
        destination: "{{ testbed_routing_home_prefix }}"
        gateway: >-
          {{ service_mapping.routing_tunnel_static_upstream_suburban.routing_interfaces.remote.ipv6 }}
    sessions:
      - id: tunnel_static_upstream
        address_family: ipv6_unicast
        hops: 1
        multihop_ttl: 0
        local:
          node: tunnel_static_vps
          asn: 64530
          address: >-
            {{ service_mapping.routing_tunnel_static_vps_suburban.routing_interfaces.transit.ipv6 }}
        remote:
          node: tunnel_static_upstream
          asn: 64531
          address: >-
            {{ service_mapping.routing_tunnel_static_upstream_suburban.routing_interfaces.transit.ipv6 }}
        policy:
          import_prefixes: ["{{ testbed_routing_networks.tunnel_static_remote.ipv6_net }}"]
          export_prefixes: ["{{ testbed_routing_home_prefix }}"]
    probe_targets:
      - id: tunnel_remote
        address: "2001:db8:3ff:1::2"
      - id: remote_client
        address: >-
          {{ service_mapping.routing_tunnel_static_client_suburban.routing_interfaces.remote.ipv6 }}

  tunnel_upstream:
    kind: tunnel_upstream_peer
    connections: [sonic_2]
    nodes: [tunnel_upstream_vps, tunnel_upstream_upstream, tunnel_upstream_client]
    home_prefixes: ["{{ testbed_routing_home_prefix }}"]
    remote_prefixes: ["{{ testbed_routing_networks.tunnel_upstream_remote.ipv6_net }}"]
    tunnels:
      - id: tunnel_upstream_sonic_2
        connection: sonic_2
        protocol: sit
        mtu: 1480
        inner_prefix_length: 64
        local:
          node: mwan
          interface: sit-upstream
          outer_ipv4: "{{ testbed_routing_connections.sonic_2.mwan_ipv4 }}"
          inner_ipv6: "2001:db8:4ff:1::1"
        remote:
          node: tunnel_upstream_vps
          interface: sit-sonic2
          outer_ipv4: >-
            {{ service_mapping.routing_tunnel_upstream_vps_suburban.routing_interfaces.outer.ipv4 }}
          inner_ipv6: "2001:db8:4ff:1::2"
    routes:
      - node: mwan
        family: ipv4
        destination: >-
          {{ service_mapping.routing_tunnel_upstream_vps_suburban.routing_interfaces.outer.ipv4 }}/32
        gateway: "{{ testbed_routing_connections.sonic_2.simulator_link_ipv4 }}"
      - node: tunnel_upstream_vps
        family: ipv4
        destination: "{{ testbed_routing_connections.sonic_2.mwan_ipv4 }}/32"
        gateway: "{{ testbed_routing_connections.sonic_2.simulator_outer_ipv4 }}"
      - node: mwan
        family: ipv6
        destination: "{{ testbed_routing_networks.tunnel_upstream_transit.ipv6_net }}"
        gateway: "2001:db8:4ff:1::2"
      - node: tunnel_upstream_vps
        family: ipv6
        destination: "{{ testbed_routing_home_prefix }}"
        gateway: "2001:db8:4ff:1::1"
      - node: tunnel_upstream_vps
        family: ipv6
        destination: "{{ testbed_routing_networks.tunnel_upstream_remote.ipv6_net }}"
        gateway: >-
          {{ service_mapping.routing_tunnel_upstream_upstream_suburban.routing_interfaces.transit.ipv6 }}
      - node: tunnel_upstream_upstream
        family: ipv6
        destination: "2001:db8:4ff:1::/64"
        gateway: >-
          {{ service_mapping.routing_tunnel_upstream_vps_suburban.routing_interfaces.transit.ipv6 }}
      - node: tunnel_upstream_client
        family: ipv6
        destination: "{{ testbed_routing_home_prefix }}"
        gateway: >-
          {{ service_mapping.routing_tunnel_upstream_upstream_suburban.routing_interfaces.remote.ipv6 }}
    sessions:
      - id: tunnel_upstream_home
        address_family: ipv6_unicast
        hops: 2
        multihop_ttl: 2
        local:
          node: mwan
          asn: 64512
          address: "2001:db8:4ff:1::1"
        remote:
          node: tunnel_upstream_upstream
          asn: 64541
          address: >-
            {{ service_mapping.routing_tunnel_upstream_upstream_suburban.routing_interfaces.transit.ipv6 }}
        policy:
          import_prefixes: ["{{ testbed_routing_networks.tunnel_upstream_remote.ipv6_net }}"]
          export_prefixes: ["{{ testbed_routing_home_prefix }}"]
    probe_targets:
      - id: tunnel_remote
        address: "2001:db8:4ff:1::2"
      - id: remote_client
        address: >-
          {{ service_mapping.routing_tunnel_upstream_client_suburban.routing_interfaces.remote.ipv6 }}

  tunnel_vps:
    kind: tunnel_vps_peer
    connections: [sonic_1, astound]
    nodes: [tunnel_vps_vps, tunnel_vps_upstream, tunnel_vps_client]
    home_prefixes: ["{{ testbed_routing_home_prefix }}"]
    remote_prefixes: ["{{ testbed_routing_networks.tunnel_vps_remote.ipv6_net }}"]
    tunnels:
      - id: tunnel_vps_sonic_1
        connection: sonic_1
        protocol: sit
        mtu: 1480
        inner_prefix_length: 64
        local:
          node: mwan
          interface: sit-vps-sonic
          outer_ipv4: "{{ testbed_routing_connections.sonic_1.mwan_ipv4 }}"
          inner_ipv6: "2001:db8:5ff:1::1"
        remote:
          node: tunnel_vps_vps
          interface: sit-sonic1
          outer_ipv4: >-
            {{ service_mapping.routing_tunnel_vps_vps_suburban.routing_interfaces.outer.ipv4 }}
          inner_ipv6: "2001:db8:5ff:1::2"
      - id: tunnel_vps_astound
        connection: astound
        protocol: sit
        mtu: 1480
        inner_prefix_length: 64
        local:
          node: mwan
          interface: sit-vps-astound
          outer_ipv4: "{{ testbed_routing_connections.astound.mwan_ipv4 }}"
          inner_ipv6: "2001:db8:5ff:2::1"
        remote:
          node: tunnel_vps_vps
          interface: sit-astound
          outer_ipv4: >-
            {{ service_mapping.routing_tunnel_vps_vps_suburban.routing_interfaces.outer.ipv4 }}
          inner_ipv6: "2001:db8:5ff:2::2"
    routes:
      - node: mwan
        family: ipv4
        destination: >-
          {{ service_mapping.routing_tunnel_vps_vps_suburban.routing_interfaces.outer.ipv4 }}/32
        gateway: "{{ testbed_routing_connections.sonic_1.simulator_link_ipv4 }}"
      - node: mwan
        family: ipv4
        destination: >-
          {{ service_mapping.routing_tunnel_vps_vps_suburban.routing_interfaces.outer.ipv4 }}/32
        gateway: "{{ testbed_routing_connections.astound.simulator_link_ipv4 }}"
      - node: tunnel_vps_vps
        family: ipv4
        destination: "{{ testbed_routing_connections.sonic_1.mwan_ipv4 }}/32"
        gateway: "{{ testbed_routing_connections.sonic_1.simulator_outer_ipv4 }}"
      - node: tunnel_vps_vps
        family: ipv4
        destination: "{{ testbed_routing_connections.astound.mwan_ipv4 }}/32"
        gateway: "{{ testbed_routing_connections.astound.simulator_outer_ipv4 }}"
      - node: tunnel_vps_client
        family: ipv6
        destination: "{{ testbed_routing_home_prefix }}"
        gateway: >-
          {{ service_mapping.routing_tunnel_vps_upstream_suburban.routing_interfaces.remote.ipv6 }}
    sessions:
      - id: tunnel_vps_home_sonic_1
        address_family: ipv6_unicast
        hops: 1
        multihop_ttl: 0
        local:
          node: mwan
          asn: 64512
          address: "2001:db8:5ff:1::1"
        remote:
          node: tunnel_vps_vps
          asn: 64550
          address: "2001:db8:5ff:1::2"
        policy:
          import_prefixes: ["{{ testbed_routing_networks.tunnel_vps_remote.ipv6_net }}"]
          export_prefixes: ["{{ testbed_routing_home_prefix }}"]
      - id: tunnel_vps_home_astound
        address_family: ipv6_unicast
        hops: 1
        multihop_ttl: 0
        local:
          node: mwan
          asn: 64512
          address: "2001:db8:5ff:2::1"
        remote:
          node: tunnel_vps_vps
          asn: 64550
          address: "2001:db8:5ff:2::2"
        policy:
          import_prefixes: ["{{ testbed_routing_networks.tunnel_vps_remote.ipv6_net }}"]
          export_prefixes: ["{{ testbed_routing_home_prefix }}"]
      - id: tunnel_vps_upstream
        address_family: ipv6_unicast
        hops: 1
        multihop_ttl: 0
        local:
          node: tunnel_vps_vps
          asn: 64550
          address: >-
            {{ service_mapping.routing_tunnel_vps_vps_suburban.routing_interfaces.transit.ipv6 }}
        remote:
          node: tunnel_vps_upstream
          asn: 64531
          address: >-
            {{ service_mapping.routing_tunnel_vps_upstream_suburban.routing_interfaces.transit.ipv6 }}
        policy:
          import_prefixes: ["{{ testbed_routing_networks.tunnel_vps_remote.ipv6_net }}"]
          export_prefixes: ["{{ testbed_routing_home_prefix }}"]
    probe_targets:
      - id: tunnel_remote_sonic_1
        address: "2001:db8:5ff:1::2"
      - id: tunnel_remote_astound
        address: "2001:db8:5ff:2::2"
      - id: remote_client
        address: >-
          {{ service_mapping.routing_tunnel_vps_client_suburban.routing_interfaces.remote.ipv6 }}
