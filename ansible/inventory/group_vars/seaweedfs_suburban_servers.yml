---
# Suburban testbed SeaweedFS object-store LXC (CT 118 on suburban).
# Lives on the opnsense-test VMNET segment (3d06:bad:b01:210::/64) beside
# tack-qa. Runs the weed binary under systemd (not Docker). Provides an S3
# endpoint for tack backups and audit archives. Container creation is handled
# by OpenTofu (opentofu/suburban/seaweedfs.tf); this group configures the
# deploy playbook (playbooks/deploy-seaweedfs.yml). Shared keys live in
# seaweedfs_all.yml.

# Reach this LXC on-link through the suburban hypervisor, which holds 210::5 on
# the same guest segment. A direct connection does not return: the testbed
# router sends anything outside 3d06:bad:b01:210::/60 out a simulated WAN, and
# the controller is on the prod side at 3d06:bad:b01:a::. Same jump as
# test_mwan_servers and opnsense_test_servers.
ansible_ssh_common_args: >-
  -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
  -o ProxyJump=root@[3d06:bad:b01:200::1]

service_hostname: "{{ service_mapping.seaweedfs_suburban.hostname }}"
service_ipv6_address: "{{ service_mapping.seaweedfs_suburban.ipv6 }}/64"
service_mac_address: "BC:24:11:04:10:00"

# Bind on the LXC's own IPv6 address. The S3 endpoint is internal only; it is
# never proxied or exposed off the suburban segment.
seaweedfs_bind_address: "{{ service_mapping.seaweedfs_suburban.ipv6 }}"
