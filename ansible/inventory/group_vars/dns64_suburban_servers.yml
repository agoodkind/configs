---
# Suburban testbed dns64 LXC (CT 464 on suburban).
# Shared keys live in dns64_all.yml.

service_hostname: "{{ service_mapping.dns64_suburban.hostname }}"
service_ipv6_address: "{{ service_mapping.dns64_suburban.ipv6 }}/64"
service_mac_address: "BC:24:11:04:64:00"

# Suburban DNS64 prefix matches the opnsense-test Tayga setup
# (3d06:bad:b01:264::ffff:1 tun endpoint, route in opnsense pf to nat64).
dns64_prefix: "3d06:bad:b01:2664::/96"

# Cloudflare 1.1.1.1 expressed in the NAT64 prefix, so this resolver's own
# recursion rides opnsense-test's Tayga translator and reaches an IPv4-only
# upstream. Tofu sets the same address as the LXC's bootstrap resolver in
# /etc/resolv.conf, so bind9 can resolve its own apt mirrors before the daemon
# comes up.
dns64_upstream_dns: "3d06:bad:b01:2664::101:101"

# Synthesis stays off for dual-stack names, matching production (the shared
# default in dns64_all.yml). Testbed LAN /64s sit inside the aggregate MWAN NPTs,
# so a native AAAA is reachable; only IPv4-only names need NAT64.
dns64_force_synth: false
