---
# Suburban testbed dns64 LXC (CT 203 on suburban).
# Shared keys live in dns64_all.yml.

service_hostname: "{{ service_mapping.dns64_suburban.hostname }}"
service_ipv6_address: "{{ service_mapping.dns64_suburban.ipv6 }}/64"
service_mac_address: "BC:24:11:04:64:00"

# Suburban DNS64 prefix matches the router.suburban.goodkind.io Tayga setup
# (3d06:bad:b01:264::ffff:1 tun endpoint, route in opnsense pf to nat64).
dns64_prefix: "3d06:bad:b01:2664::/96"

# DNS64 forwards to the router's Unbound over native IPv6, as in production.
# This connection does not depend on NAT64.
dns64_upstream_dns: "3d06:bad:b01:210::1"

# dns64_force_synth stays at the dns64_all.yml default of false. The override
# that forced synthesis for every name existed because the simulated ISPs
# carried no public IPv6 transit, so a native AAAA was unreachable. They do
# carry it now, and forcing synthesis would keep dual-stack names off the
# native path that MWAN-256 exists to prove.
