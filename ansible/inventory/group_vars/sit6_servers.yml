---
# sit6 LXC (lxc-124 on vault) target vars, the 6in4 tunnel endpoint for
# Berylax. Consumed by deploy-sit6.yml when targeting `sit6_servers`.

# IPv6 iBGP toward the MWAN VM on mwanbr. MWAN accepts the session through its
# dynamic transit neighbors and installs the announced prefix.
sit6_bgp_asn: 4200000001
sit6_bgp_router_id: "{{ service_mapping.sit6.ipv4 }}"
sit6_bgp_neighbor_v6: "3d06:bad:b01:fe::3"

# 6in4 tunnel. The kernel reserves sit0 as the fallback device in every network
# namespace, so the tunnel takes its own name. Berylax pings the fixed link
# address through the tunnel before it routes traffic over it.
sit6_uplink_iface: "eth0"
sit6_tunnel_iface: "sit6"
sit6_tunnel_local_v4: "{{ service_mapping.sit6.ipv4 }}"
# The tunnel remote is this name's A record, Berylax's Astound IPv4 address.
sit6_tunnel_remote_name: "berylax.goodkind.io"
sit6_tunnel_ttl: 64
sit6_tunnel_link_address_v6: "fe80::1/64"
sit6_tunnel_prefix_v6: "3d06:bad:b01:b::/64"
# MWAN sends a new flow from the internal link carrying this codepoint out
# AT&T, which keeps the tunnel on 104.57.226.196, the address Berylax targets.
sit6_tunnel_dscp: "cs1"
