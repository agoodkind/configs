---
tack_domain: "tack-qa"

# QA runs the production auth path first, so the token cutover is proven here
# before production flips (TACK-261). Clients need an API token, not a user id.
tack_env: production

tack_yugabyte_password: "{{ vault_tack_qa_yugabyte_password }}"
tack_audit_writer_password: "{{ vault_tack_qa_audit_writer_password }}"
tack_audit_reader_password: "{{ vault_tack_qa_audit_reader_password }}"
tack_audit_redactor_password: "{{ vault_tack_qa_audit_redactor_password }}"
tack_audit_operator_password: "{{ vault_tack_qa_audit_operator_password }}"
tack_migrator_password: "{{ vault_tack_qa_migrator_password }}"
tack_ops_migrator_login: true

# Phase C audit cutover (TACK-232). The cluster id pins Kafka's storage uuid so
# a recreate does not orphan the log.
tack_kafka_cluster_id: "qsUvMozrSTCj9bmZ4_VozA"

# Valid audit signer set (TACK-437): the identifiers of the signing keys this
# environment accepts. QA's owner guest key, measured on the guest on
# 2026-09-04 and carried by every one of its 35,737 notarizations. Adding a
# signing guest adds its identifier; revoking a leaked key removes it.
tack_audit_valid_signers:
  - "ed25519:12bdb0b77570f79e"

# Provision entrypoint (TACK-303). QA is disposable and recreated from empty, so
# provision may run the one-time `fdbcli configure new` on a fresh fdb volume.
tack_allow_fdb_init: true

# QA data generator (TACK-245/TACK-338). `ops qa datagen` writes only when this
# marker is exactly qa or local, so QA opts in here and production renders it
# empty. Run the generator through the app service, which reaches FoundationDB
# and holds the audit DSNs.
tack_datagen_allow_target: "qa"

# GHCR pull token. Classic PAT with read:packages scope.
ghcr_pull_token: "{{ vault_tack_qa_ghcr_pull_token }}"

# Repo read token. Fine-grained PAT with contents:read on agoodkind/tack, used
# by deploy-tack to fetch docker-compose.yml and the overlays from the SOT.
tack_repo_read_token: "{{ vault_tack_qa_repo_read_token }}"

tack_docker_v6_subnet: "{{ service_mapping[service_name].docker_v6_subnet }}"
tack_docker_v6_gateway: "{{ service_mapping[service_name].docker_v6_gateway }}"
tack_ndp_proxy_prefix: "{{ service_mapping[service_name].docker_v6_subnet }}"

# Backup object store: the SeaweedFS LXC on the same suburban 210:: segment.
# Same S3 identity the SeaweedFS s3.json grants (single source in vault).
tack_backup_enabled: true
tack_backup_s3_endpoint: "http://[{{ service_mapping.seaweedfs_suburban.ipv6 }}]:8333"
tack_backup_s3_host: "{{ service_mapping.seaweedfs_suburban.ipv6 }}"
tack_backup_s3_access_key: "{{ vault_seaweedfs_s3_access_key }}"
tack_backup_s3_secret_key: "{{ vault_seaweedfs_s3_secret_key }}"
tack_backup_s3_region: us-east-1
tack_backup_s3_bucket_main: tack-backups

# QA streams the FoundationDB continuous backup: provision starts the session
# idempotently, and the drill and staleness check exercise their FDB legs.
tack_backup_fdb_continuous: true

# The guest that serves the product store for this environment. Every guest
# reaches the store here rather than assuming it is local. The phase that
# moves the store onto the data tier changes this one line.
tack_store_host: "{{ service_mapping.tack_qa_suburban.ipv6 }}"

# QA retired the legacy ledger node on 2026-08-24: the ledger runs only on
# the three data guests, and the owner guest no longer deploys the service.
tack_ledger_legacy_node_present: false

# QA's app, audit consumer, and ops sidecar were repointed at the three
# data nodes on 2026-08-24, before the retirement above.
tack_ledger_consumers_repointed: true

# Ledger node identity. The engine stores whatever identity a node announces
# in its own catalog, so an announced address goes stale when the address
# moves and the engine can no longer assemble itself. Each node announces a
# permanent name instead, and every ledger container carries these entries in
# its own hosts file. A guest renumber changes the address here and nothing
# the engine stored.
tack_ledger_node_addresses:
  yb1: "{{ service_mapping.tack_data1_suburban.ipv6 }}"
  yb2: "{{ service_mapping.tack_data2_suburban.ipv6 }}"
  yb3: "{{ service_mapping.tack_data3_suburban.ipv6 }}"

# Ledger transport encryption (TACK-460). QA proves it first: the engine
# encrypts client and peer traffic and refuses an unencrypted connection,
# and every client dials verify-full against this environment's own
# authority. The owner guest issues and holds that authority.
tack_ledger_tls_enabled: true
tack_ledger_ca_host: "{{ service_mapping.tack_qa_suburban.hostname }}"

# Phase 4 QA migration (TACK-408). A data guest with no cluster file receives a
# copy of the live one during the deploy. The deploy reads that copy from the
# first guest of the run that runs a store process: the owner guest while its
# transitional process exists, and a data guest once that process retires.
tack_store_seed_cluster_file: true
tack_store_legacy_node_present: false
tack_store_redundancy_mode: double

# The application dials one HTTPS endpoint on the suburban trunk, and the
# proxy there selects the member. QA runs one member in single-node discovery
# mode because the suburban host has capacity for exactly one 8 GiB search
# guest.
tack_search_enabled: true
tack_search_members: "{{ tack_search_qa_members }}"
tack_search_endpoint: "https://[{{ service_mapping.vmbrtrunk_suburban.ipv6 }}]:{{ tack_search_port }}"
tack_search_single_node: true
tack_search_cluster_name: tack-search-qa
tack_search_bootstrap_cluster: false

tack_search_username: "{{ vault_tack_qa_search_username }}"
tack_search_password: "{{ vault_tack_qa_search_password }}"
tack_search_password_hash: "{{ vault_tack_qa_search_password_hash }}"
tack_search_ca: "{{ vault_tack_qa_search_ca }}"
tack_search_admin_certificate: "{{ vault_tack_qa_search_admin_certificate }}"
tack_search_admin_private_key: "{{ vault_tack_qa_search_admin_private_key }}"
# Tack signs search continuation cursors with this base64-encoded key. The
# env template renders it only while tack_search_public_enabled is true.
tack_search_cursor_key: "{{ vault_tack_qa_search_cursor_key }}"

# The `ops search provision` command applies this index topology. One member
# cannot place a replica. Tack requires the routing shard count to be a
# multiple of the primary shard count. A routing shard count of 8 allows later
# splits to 2, 4, and 8 primary shards.
tack_search_shards: 1
tack_search_routing_shards: 8
tack_search_replicas: 0
tack_search_public_enabled: true
tack_search_model_repair_enabled: true

# QA runs a second application process on tack_app2_suburban for the search
# two-process continuation check (TACK-544). That app publishes audit events
# to the owner guest's broker at this port on the owner's pinned address. The
# owner guest's firewall table accepts the port only from the guests listed
# here, by service mapping key.
tack_queue_external_listener_enabled: true
tack_queue_external_port: 9094
tack_queue_external_clients:
  - tack_app2_suburban
tack_queue_firewall_path: /etc/tack-queue-firewall.nft
