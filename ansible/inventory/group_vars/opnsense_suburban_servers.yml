---
# Testbed OPNsense target vars.
# Consumed by deploy-opnsense.yml when targeting `opnsense_suburban_servers`.
# The service_mapping plugin owns the SSH identity.
# SSH targets the WAN/internal address on vmbr2.

# OPNsense expects agoodkind for SSH, same as production; root logins are
# refused, so the default `ansible_user: root` in [all:vars] fails here.
ansible_user: agoodkind

# OPNsense identity for MWAN-side config rendering. Use IPv6 LAN address
# so testbed templates exercise the same URL-parsing path as production.
opnsense_addr: "3d06:bad:b01:211::1"
opnsense_gateway_names:
  - WAN_GW4
  - WAN_GW6

# OPNsense BGP (from OPNsense's perspective).
opnsense_bgp_router_id: "{{ service_mapping.opnsense_suburban.ipv4_transit }}"
opnsense_bgp_firewall_source_v4: "{{ service_mapping.opnsense_suburban.transit_v4_net }}"
opnsense_bgp_firewall_source_v6: "{{ service_mapping.opnsense_suburban.transit_v6_net }}"
opnsense_bgp_neighbors:
  - address: "{{ service_mapping.mwan_suburban.ipv4_transit }}"
    description: "mwan-IPv4"
    preference: "primary"
  - address: "{{ service_mapping.mwan_suburban.ipv6_transit }}"
    description: "mwan-IPv6"
    preference: "primary"
  - address: "{{ service_mapping.mwan_failover_suburban.ipv4_transit }}"
    description: "failover-IPv4"
    preference: "backup"
  - address: "{{ service_mapping.mwan_failover_suburban.ipv6_transit }}"
    description: "failover-IPv6"
    preference: "backup"
