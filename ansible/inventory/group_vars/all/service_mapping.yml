---
# Single source of truth for service hostnames, VMIDs, and IPv6 addresses
# Services use either the home.goodkind.io or suburban.goodkind.io domain.
#
# Usage:
#   - group_vars: service_ipv6_address: "{{ service_mapping.<service>.ipv6 }}/64"
#   - templates: {{ service_mapping.<service>.hostname }}
#   - OpenTofu: local.service_mapping.<service>.vmid, via yamldecode of this file
#   - SSHPiper: iterates over service_mapping for routing
#
# vmid is the Proxmox guest id, and it belongs here rather than in each consumer
# so a renumber changes one line. A testbed guest that mirrors a production
# service takes its counterpart's id plus 100, and the simulated ISPs, which have
# no production counterpart, sit in 9xx. No id is shared between the two
# hypervisors: they are independent installations, so a shared id is legal, but a
# command that lands on the wrong host would then find a guest there and succeed
# against it.

service_mapping:
  # LXC Containers
  debianct:
    hostname: debianct.home.goodkind.io
    vmid: 100
    ipv6: "3d06:bad:b01::100"
  unifi:
    hostname: unifi.home.goodkind.io
    vmid: 102
    ipv6: "3d06:bad:b01::102"
    ipv4: "10.250.0.102"
  dns64:
    hostname: dns64.home.goodkind.io
    vmid: 103
    ipv6: "3d06:bad:b01::64"
  freebsd_dev_home:
    hostname: freebsd-dev.home.goodkind.io
    vmid: 108
    ipv6: "3d06:bad:b01::108"
  mc:
    hostname: mc.home.goodkind.io
    vmid: 109
    ipv6: "3d06:bad:b01::109"
  proxy:
    hostname: proxy.home.goodkind.io
    vmid: 110
    ipv6: "3d06:bad:b01::110"
    ipv4: "10.250.0.110"
  adguard:
    hostname: adguard.home.goodkind.io
    vmid: 112
    ipv6: "3d06:bad:b01::53"
  mwan:
    hostname: mwan.home.goodkind.io
    vmid: 113
    ipv6: "3d06:bad:b01::113"
  mwan_failover:
    hostname: mwan-failover.home.goodkind.io
    vmid: 116
    # LXC BGP backup peer; eth1 on mwanbr (vault is on same bridge so
    # this address is the natural Ansible SSH target). eth0 lives on mbrains
    # for the upstream-ISP iface that mwan-ifmgr monitors.
    ipv6: "3d06:bad:b01:fe::4"
  tack:
    hostname: tack.home.goodkind.io
    vmid: 117
    ipv6: "3d06:bad:b01::117"
    mac_address: "BC:24:11:A3:52:17"
    # /96 carved from the on-link 3d06:bad:b01::/64, NDP-proxied via ndppd
    # so container GUAs appear on-link to the upstream router. The NDP prefix
    # must match the Docker subnet.
    docker_v6_subnet: "3d06:bad:b01:0:7ac::/96"
    docker_v6_gateway: "3d06:bad:b01:0:7ac::1"
  tack_data1:
    hostname: tack-data1.home.goodkind.io
    vmid: 120
    ipv6: "3d06:bad:b01::120"
    mac_address: "BC:24:11:A3:52:20"
    docker_v6_subnet: "3d06:bad:b01:0:7ad::/96"
    docker_v6_gateway: "3d06:bad:b01:0:7ad::1"
  tack_data2:
    hostname: tack-data2.home.goodkind.io
    vmid: 121
    ipv6: "3d06:bad:b01::121"
    mac_address: "BC:24:11:A3:52:21"
    docker_v6_subnet: "3d06:bad:b01:0:7ae::/96"
    docker_v6_gateway: "3d06:bad:b01:0:7ae::1"
  tack_data3:
    hostname: tack-data3.home.goodkind.io
    vmid: 122
    ipv6: "3d06:bad:b01::122"
    mac_address: "BC:24:11:A3:52:22"
    docker_v6_subnet: "3d06:bad:b01:0:7af::/96"
    docker_v6_gateway: "3d06:bad:b01:0:7af::1"
  tack_app2:
    hostname: tack-app2.home.goodkind.io
    vmid: 123
    ipv6: "3d06:bad:b01::123"
    mac_address: "BC:24:11:A3:52:23"
    docker_v6_subnet: "3d06:bad:b01:0:7b0::/96"
    docker_v6_gateway: "3d06:bad:b01:0:7b0::1"
  tack_qa_suburban:
    hostname: tack-qa.suburban.goodkind.io
    vmid: 217
    ipv6: "3d06:bad:b01:210::217"
    mac_address: "BC:24:11:04:00:00"
    # /96 carved from the suburban VMNET segment 3d06:bad:b01:210::/64
    # (opt6 on router.suburban.goodkind.io), mirroring prod's 0:7ac::/96
    # carved from its own VMNET /64. The NDP prefix must match the Docker subnet.
    docker_v6_subnet: "3d06:bad:b01:210:7ac::/96"
    docker_v6_gateway: "3d06:bad:b01:210:7ac::1"
  tack_data1_suburban:
    hostname: tack-data1.suburban.goodkind.io
    vmid: 220
    ipv6: "3d06:bad:b01:210::220"
    mac_address: "BC:24:11:04:01:20"
    docker_v6_subnet: "3d06:bad:b01:210:7ad::/96"
    docker_v6_gateway: "3d06:bad:b01:210:7ad::1"
  tack_data2_suburban:
    hostname: tack-data2.suburban.goodkind.io
    vmid: 221
    ipv6: "3d06:bad:b01:210::221"
    mac_address: "BC:24:11:04:01:21"
    docker_v6_subnet: "3d06:bad:b01:210:7ae::/96"
    docker_v6_gateway: "3d06:bad:b01:210:7ae::1"
  tack_data3_suburban:
    hostname: tack-data3.suburban.goodkind.io
    vmid: 222
    ipv6: "3d06:bad:b01:210::222"
    mac_address: "BC:24:11:04:01:22"
    docker_v6_subnet: "3d06:bad:b01:210:7af::/96"
    docker_v6_gateway: "3d06:bad:b01:210:7af::1"
  tack_app2_suburban:
    hostname: tack-app2.suburban.goodkind.io
    vmid: 223
    ipv6: "3d06:bad:b01:210::223"
    mac_address: "BC:24:11:04:01:23"
    docker_v6_subnet: "3d06:bad:b01:210:7b0::/96"
    docker_v6_gateway: "3d06:bad:b01:210:7b0::1"
  seaweedfs:
    hostname: seaweedfs.home.goodkind.io
    vmid: 118
    ipv6: "3d06:bad:b01::118"
  seaweedfs_suburban:
    hostname: seaweedfs.suburban.goodkind.io
    vmid: 218
    ipv6: "3d06:bad:b01:210::218"
  tack_gh_runner_suburban:
    hostname: tack-gh-runner.suburban.goodkind.io
    vmid: 219
    ipv6: "3d06:bad:b01:210::219"
    mac_address: "BC:24:11:04:20:00"
  dns64_suburban:
    hostname: dns64.suburban.goodkind.io
    vmid: 203
    # Keeps prod's ::64 service address rather than taking its VMID suffix,
    # because every guest points at this address as its resolver.
    ipv6: "3d06:bad:b01:210::64"

  # Static Hosts (different subnet or external)
  mini:
    hostname: mini.home.goodkind.io
    ipv6: "3d06:bad:b01:1::2"
  nas:
    hostname: nas.home.goodkind.io
    ipv6: "3d06:bad:b01:1::3"

  # Testbed guests on suburban. They share the VMNET segment on untagged
  # vtnet0 beside the testbed OPNsense VMNET interface (210::1), mirroring prod
  # where the guests sit on opt6 rather than on MANAGEMENT. Host suffixes match
  # each guest's VMID.
  mwan_suburban:
    hostname: mwan.suburban.goodkind.io
    vmid: 213
    ipv6: "3d06:bad:b01:210::213"
    # eth1 on the OPNsense transit link, where it peers BGP with the router.
    ipv4_transit: "10.240.240.3"
    ipv6_transit: "3d06:bad:b01:201::3"
  mwan_failover_suburban:
    hostname: mwan-failover.suburban.goodkind.io
    vmid: 216
    # eth1 on the OPNsense transit link; eth0 is DHCP on vmbr6. Host suffixes
    # mirror prod's rather than taking a VMID suffix, because these are BGP
    # peering addresses and that peering shape is what the testbed tests.
    ipv4_transit: "10.240.240.4"
    ipv6_transit: "3d06:bad:b01:201::4"
    # eth2 on the guest segment, carrying the VMID suffix like every other
    # guest there. Deploys reach this guest here rather than on the transit
    # link, because the transit addresses sit on a point-to-point BGP link
    # whose replies leave by the ISP-sim default route, so a bulk transfer
    # addressed to them stalls while small commands succeed.
    ipv4_vmnet: "10.240.4.216"
    ipv6_vmnet: &mwan_failover_suburban_vmnet_v6 "3d06:bad:b01:210::216"
    # The inventory plugin reads ipv6 as its default ansible_host, so it
    # aliases the guest-segment address rather than repeating it.
    ipv6: *mwan_failover_suburban_vmnet_v6
  # OPNsense (one logical machine per environment). The plugin uses ipv6 as
  # ansible_host by default, which is correct for prod. Testbed targets the
  # routed IPv6 address on the WAN/internal link.
  opnsense:
    hostname: router.home.goodkind.io
    vmid: 101
    ipv6: "3d06:bad:b01::1"
  opnsense_suburban:
    hostname: router.suburban.goodkind.io
    vmid: 201
    # The router's addresses on VMNET, the guest segment. Both families are
    # first-class; anything reaching a testbed guest routes via one of them.
    # Keeps prod's ::1 gateway suffix rather than taking its VMID suffix,
    # because every guest on the segment points at it as their default route.
    ipv4_vmnet: "10.240.4.1"
    ipv6_vmnet: &opnsense_suburban_vmnet_v6 "3d06:bad:b01:210::1"
    # The inventory plugin reads ipv6 as its default ansible_host, so it aliases
    # the VMNET address rather than repeating it.
    ipv6: *opnsense_suburban_vmnet_v6
    # The router's addresses on the transit link it shares with the MWAN VM and
    # the failover, and the networks those sit in. Every group that peers on
    # this link reads them from here, so a renumber changes one line. The
    # transit network is 10.240.240.0/29 rather than prod's 10.250.250.0/29, so
    # no address is shared between the two environments.
    ipv4_transit: "10.240.240.2"
    ipv6_transit: &opnsense_suburban_transit_v6 "3d06:bad:b01:201::2"
    transit_v4_net: "10.240.240.0/29"
    transit_v6_net: "3d06:bad:b01:201::/64"
    ansible_host: *opnsense_suburban_transit_v6

  # Suburban's own addresses on vmbr1, the uplink the ISP sims route through.
  # OpenTofu derives the vmbr1 bridge address from ipv4; the routable IPv6 is
  # deployed by deploy-testbed.yml as a sourced interfaces.d fragment.
  vmbr1_suburban:
    inventory: false
    ipv4: "10.240.200.1"
    ipv6: &suburban_hypervisor_ipv6 "3d06:bad:b01:200::1"

  # Vault's primary and out-of-band addresses for deploy-gate collection. The
  # Monkeybrains tunnel stays reachable while the household WAN reboots.
  vault_hypervisor:
    inventory: false
    ipv6: "3d06:bad:b01::254"
    ipv6_oob: "3d06:bad:b01:ff::1"

  # Suburban's primary address for deploy-gate collection.
  suburban_hypervisor:
    inventory: false
    ipv6: *suburban_hypervisor_ipv6

  # Suburban's own addresses on the VLAN-aware trunk, the guest segment every
  # testbed guest shares. OpenTofu derives the bridge addresses from here, and
  # the cloudflared ICMP proxy sources from them so proxied pings to guests
  # stay on-link.
  vmbrtrunk_suburban:
    inventory: false
    ipv4: "10.240.4.5"
    ipv6: "3d06:bad:b01:210::5"

  # Simulated ISPs, testbed only. Each one terminates a WAN link for the MWAN VM
  # and serves DHCPv6-PD and RA on it. They have no production counterpart, so
  # they sit in 9xx and their addresses are gateways on their own simulated
  # subnets that production never uses.
  #
  # The uplink addresses sit on vmbr1 behind suburban, which routes the sims'
  # internet traffic out to Comcast and returns tunnel and testbed traffic.
  # Uplink host suffixes are 90-92, below 100, so they can never read as VMIDs.
  #
  # inventory: false keeps them out of the SSH inventory. deploy-testbed.yml
  # configures them through pct from the hypervisor, so Ansible never connects
  # to one, but OpenTofu still needs their VMIDs from here.
  isp_webpass_suburban:
    hostname: isp-webpass.suburban.goodkind.io
    vmid: 900
    inventory: false
    ipv4: "10.240.204.1"
    ipv4_uplink: "10.240.200.90"
    ipv6_uplink: "3d06:bad:b01:200::90"
  isp_att_suburban:
    hostname: isp-att.suburban.goodkind.io
    vmid: 901
    inventory: false
    ipv4: "10.240.205.1"
    ipv4_uplink: "10.240.200.91"
    ipv6_uplink: "3d06:bad:b01:200::91"
  isp_mbrains_suburban:
    hostname: isp-mbrains.suburban.goodkind.io
    vmid: 902
    inventory: false
    ipv6: "3d06:bad:b01:250::1"
    ipv4: "10.240.206.1"
    ipv4_uplink: "10.240.200.92"
    ipv6_uplink: "3d06:bad:b01:200::92"

  # Second-router simulator, testbed only. An FRR speaker on the transit link
  # that peers with both MWAN speakers in the iBGP AS and announces the prefix
  # it owns, proving router N+1 onboarding needs no MWAN change. Like the ISP
  # sims it stays out of the SSH inventory; deploy-router2-sim.yml configures
  # it through pct from the hypervisor.
  router2_suburban:
    hostname: router2.suburban.goodkind.io
    vmid: 905
    inventory: false
    ipv4_transit: "10.240.240.5"
    ipv6_transit: "3d06:bad:b01:201::5"
    # The prefix the simulator announces over BGP and holds on its loopback.
    announced_prefix_v6: "3d06:bad:b01:230::/64"

group_children:
  tack_all:
    - tack_servers
    - tack_qa_suburban_servers
    - tack_data1_servers
    - tack_data2_servers
    - tack_data3_servers
    - tack_app2_servers
    - tack_data1_suburban_servers
    - tack_data2_suburban_servers
    - tack_data3_suburban_servers
    - tack_app2_suburban_servers
  tack_prod_all:
    - tack_servers
    - tack_app2_servers
    - tack_data1_servers
    - tack_data2_servers
    - tack_data3_servers
  tack_qa_all:
    - tack_qa_suburban_servers
    - tack_app2_suburban_servers
    - tack_data1_suburban_servers
    - tack_data2_suburban_servers
    - tack_data3_suburban_servers
  tack_data_servers:
    - tack_data1_servers
    - tack_data2_servers
    - tack_data3_servers
  tack_data_suburban_servers:
    - tack_data1_suburban_servers
    - tack_data2_suburban_servers
    - tack_data3_suburban_servers
  tack_app_servers:
    - tack_servers
    - tack_app2_servers
  tack_app_suburban_servers:
    - tack_qa_suburban_servers
    - tack_app2_suburban_servers
  mwan_all:
    - mwan_servers
    - mwan_suburban_servers
  mwan_failover_all:
    - mwan_failover_servers
    - mwan_failover_suburban_servers
  opnsense_all:
    - opnsense_servers
    - opnsense_suburban_servers
  dns64_all:
    - dns64_servers
    - dns64_suburban_servers
  seaweedfs_all:
    - seaweedfs_servers
    - seaweedfs_suburban_servers
