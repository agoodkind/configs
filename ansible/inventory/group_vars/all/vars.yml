---
# Shared non-secret variables only

# Proxmox API credentials (shared across all playbooks)
proxmox_api_host: 3d06:bad:b01::254
proxmox_api_user: ansible@pam
proxmox_token_id: ansible-token

# PVE node name to the inventory host that owns it. A play that runs pct or qm
# must delegate to the inventory host, never to ansible_proxmox_host: suburban's
# node is named "hypervisor", which resolves through DNS to vault instead, so the
# command runs on the wrong machine. No VMID is shared between the two
# hypervisors now, which turns that mistake into a clean failure rather than a
# write to the wrong guest, but the delegation still has to be right for a
# command to reach its target at all. mwan_proxmox_delegate is the per-group form
# of the same mapping. A node missing here fails the lookup rather than guessing.
proxmox_node_delegates:
  vault: vault
  hypervisor: suburban

# mwan-watchdog Proxmox API token (separate token on vault, root@pam!watchdog)
mwan_watchdog_pve_token_id: "root@pam!watchdog"

# ----------------------------------------------------------------------------
# SMTP (outbound) defaults for all CTs/VMs (via prep-guests)
# ----------------------------------------------------------------------------
smtp_enabled: "1"
smtp_from_domain: goodkind.io

# SMTP2GO per-host provisioning. prep-guests derives the SMTP user
# host-<hostname>, generates its password, provisions it through the SMTP2GO API
# with vault_smtp2go_api_key, and sets the From address to
# <hostname>@<smtp_from_domain>. Set smtp_enabled to "0" to skip.
smtp_host: mail.smtp2go.com
smtp_port: "587"

# ----------------------------------------------------------------------------
# SSH connection defaults
# ----------------------------------------------------------------------------
github_ssh_keys_user: agoodkind

# The single source of the SSH options used by every inventory host.
# ansible.cfg already sets host_key_checking = False repo-wide, so the strict
# check is not disabled here for the first time; UserKnownHostsFile keeps a
# rebuilt guest from failing on a changed key.
ssh_base_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"

# Applied to every host, so a play never has to invent connection options.
ansible_ssh_common_args: "{{ ssh_base_args }}"

# ----------------------------------------------------------------------------
# Guest prep defaults (prep-guests), shared by every service
# ----------------------------------------------------------------------------
# SSH port every guest listens on; proxy overrides this to 2222 in its group_vars.
service_ssh_port: 22
# Console auto-login for LXC guests.
console_autologin_enabled: true
# Default target group for a bare prep-guests run; every deploy overrides this at import.
target_hosts: proxmox_all_lxc
# Interactive login directory inside each guest; a service overrides it per group_vars.
login_dir: /root

# ----------------------------------------------------------------------------
# Cloudflare DNS (automatic DNS record updates)
# ----------------------------------------------------------------------------
cloudflare_dns_update_enabled: true

# ----------------------------------------------------------------------------
# mwan ifmgr
# ----------------------------------------------------------------------------
# Base off. Only the MWAN VM scopes (mwan_servers, mwan_suburban_servers) enable the
# wan role, which renders the shared [ifmgr] translation prefixes and the
# [ifmgr.wan.<name>] map. Every other ifmgr consumer (the hypervisor host oob
# role) leaves this false, so the common include skips the wan-only keys.
mwan_ifmgr_wan_enabled: false

# ----------------------------------------------------------------------------
# cloudflared (Cloudflare Tunnel) systemd service defaults
# ----------------------------------------------------------------------------
# Unit ordering for the cloudflared service; a service overrides these to add its
# own dependencies (e.g. mwan orders cloudflared after mwan-ifmgr@wan).
cloudflared_service_after: network-online.target
cloudflared_service_wants: network-online.target

# ----------------------------------------------------------------------------
# BGP session timers, shared by every speaker (primary and failover, prod and
# testbed) and by the OPNsense peer templates.
# ----------------------------------------------------------------------------
# Hold must outlast the watchdog snapshot freeze pause, which stalls the
# speaker long enough that a 9s hold dropped the session and blackholed
# traffic ~10s per occurrence (MWAN-303). A hard speaker crash keeps FRR
# forwarding to the dead peer for up to hold_seconds; the watchdog failover
# path is the primary crash responder.
bgp_keepalive_seconds: 10
bgp_hold_seconds: 30

# ----------------------------------------------------------------------------
# Wanconfig management stack (epic MWAN-338), source-built on the gateway at
# /usr/local by deploy-wanconfig-stack.yml. The stack is versioned here, not
# by the distribution; a version change rebuilds that component on the next
# deploy. nghttp2-asio has no release tags, so it pins a commit.
# ----------------------------------------------------------------------------
# libyang and sysrepo stay on the 3.x series: libyang-cpp v4 compiles
# against the libyang 3.x API only (5.x renamed print/parse symbols), and
# sysrepo v3.7.11 declares its libyang dependency as 3.13.x. The cpp
# bindings' ">=" bounds state a floor, not upper compatibility.
wanconfig_libyang_version: "v3.13.6"
wanconfig_sysrepo_version: "v3.7.11"
wanconfig_libyang_cpp_version: "v4"
wanconfig_sysrepo_cpp_version: "v6"
wanconfig_nghttp2_asio_version: "e877868abe"
wanconfig_rousette_version: "v2"
# Each version pin carries the full commit hash its tag pointed at when it
# was reviewed. The packaging build refuses a tag that resolves elsewhere,
# so a force-moved upstream tag cannot change what a release packages.
# A version bump updates both lines together.
wanconfig_libyang_commit: "c2ddd01b9b810a30d6a7d6749a3bc9adeb7b01fb"
wanconfig_sysrepo_commit: "1b720b196f630f348d9e0c131d326b3fb8c6aca7"
wanconfig_libyang_cpp_commit: "249da7280864fbda5fccb340b455b7000ebfe67d"
wanconfig_sysrepo_cpp_commit: "01bed8d91bfb746c20cc53ae4e8d64e2c78d2a9e"
wanconfig_nghttp2_asio_commit: "e877868abe06a83ed0a6ac6e245c07f6f20866b5"
wanconfig_rousette_commit: "4685b3379b259bc1b4aca79c92ca47d2b1e48e5e"
# The nghttpx front end exposes rousette on the management address at this
# port; rousette itself binds ::1:10080 only.
wanconfig_restconf_port: 10080
