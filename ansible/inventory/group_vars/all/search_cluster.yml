---
# The environment groups render each member list into node discovery
# settings. The hypervisor groups render each member list into proxy
# backends. OpenTofu reads the guest memory, cores, and disk size.

# Each list contains the service mapping keys of one environment's cluster
# members. A new entry adds that member's seed address to every node and
# adds its backend to the environment's proxy. OPENSEARCH_ENDPOINT does not
# change.
tack_search_production_members:
  - tack_search1
tack_search_qa_members:
  - tack_search1_suburban

# The proxy listens on this port, and every member serves HTTPS on it.
tack_search_port: 9200

# OpenSearch refuses to start in production mode when vm.max_map_count is
# below this value. The hypervisor kernel applies one vm.max_map_count value
# to every container on that hypervisor. The hypervisor sets the value, and
# each search guest checks it before OpenSearch starts.
tack_search_memory_map_count: 262144

# A member that runs every node role and the sparse model needs at least this
# much guest memory. The model workload opened the ML memory circuit breaker
# at 4 GiB and completed at 8 GiB.
tack_search_guest_memory_mib: 8192
tack_search_guest_cores: 2
tack_search_guest_disk_gib: 40
