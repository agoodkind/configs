---
# Shared defaults applied to all Proxmox hypervisors.
# Overridden per-host in vault_servers.yml and suburban_servers.yml.

# Feature flags that gate proxmox-host.yml task blocks. Explicit so the
# task file fails loudly if inventory stops defining a required value.
proxmox_mwan_host_role_enabled: true
mwan_ifmgr_enabled: true
# Whether this host owns an out-of-band tunnel. Only vault does. The flag
# gates the OOB interface block, the oobv6, oobv4, and ra_lost modules, and
# the OOB-source policy rule, so a host without a tunnel renders none of them
# and those modules self-disable at Init.
mwan_ifmgr_oob_enabled: false
# The daemon needs exactly one iface section naming the interface its kernel
# event monitor watches. These decide whether it also runs a DHCPv4 client and
# a router solicitor there.
mwan_ifmgr_iface_dhcp_v4: true
mwan_ifmgr_iface_ra_solicit: true
mwan_ifmgr_host_ipv6_policy_enabled: false
mwan_ifmgr_cloudflared_oob_user: ""
# Opt-in ifmgr modules under the unified `oob` role. Each absent flag
# leaves the matching [ifmgr.modules.X] section out of the rendered
# config; the module's Init then returns ifmgr.ErrModuleDisabled and
# the daemon drops it from its dispatch list.
mwan_ifmgr_cloudflared_tap_enabled: false
mwan_ifmgr_cloudflared_tap_unit: "cloudflared-oob"
mwan_ifmgr_cloudflared_tap_downgrade_patterns: []
mwan_ifmgr_wg_enabled: false
mwan_ifmgr_wg_ssh_host: ""
mwan_ifmgr_wg_identity_file: ""
mwan_ifmgr_wg_iface: "wg0"
mwan_ifmgr_wg_sudo: false
mwan_ifmgr_wg_warn_handshake_age: "180s"
mwan_ifmgr_wg_error_handshake_age: "300s"
mwan_ifmgr_wg_timeout: "10s"
mwan_ifmgr_wg_ignore_peers: []
mwan_watchdog_enabled: true
mwan_watchdog_service_name: "mwan-watchdog"
mwan_watchdog_unit_description: "MWAN Auto-Rollback Watchdog"
mwan_watchdog_wan_interfaces:
  - "enwebpass0"
  - "enmbrains0"

# Watchdog runtime tunables (seconds unless noted).
mwan_watchdog_deploy_window_minutes: 30
mwan_watchdog_connectivity_timeout: 60
mwan_watchdog_check_interval_healthy: 30
mwan_watchdog_check_interval_degraded: 10
mwan_watchdog_alert_cooldown: 300
mwan_watchdog_log_file: "/var/log/mwan-watchdog.log"
mwan_watchdog_json_log_file: "/var/log/mwan-watchdog.jsonl"
mwan_watchdog_state_file: "/run/mwan-rollback.state"
# Watchdog email detail: quiet | normal | verbose.
mwan_email_verbosity: "normal"
# Watchdog network probe targets and last-deploy marker.
mwan_watchdog_ping_target_ipv4: "1.1.1.1"
mwan_watchdog_ping_target_ipv6: "2606:4700:4700::1111"
mwan_watchdog_last_deploy_path: "/var/lib/mwan/last-deploy"

# The OPNsense guest's VMID on this hypervisor. Vault runs the production router
# as VM 101; suburban overrides this, because the testbed guests no longer share
# production's VMIDs. Both the drainer's chardev path and the upgrade command's
# target derive from it, so the two can never disagree.
mwan_opnsense_vmid: "{{ service_mapping.opnsense.vmid }}"

# The break-glass serial path into the OPNsense guest. The drainer holds the qemu
# virtio-serial chardev open and re-exposes it on a relay socket, so a bridge
# restart never disconnects the chardev and strands a guest write in the kernel.
# The bridge dials that relay and serves the probe socket the `mwan opnsense`
# verbs connect to. See docs/ops/opnsense/wedge.md.
mwan_opnsense_drain_chardev: "unix:///var/run/qemu-server/{{ mwan_opnsense_vmid }}.mwanrpc"
mwan_opnsense_drain_listen: /var/run/mwan-opnsense-drain.sock
mwan_opnsense_host_upstream: "unix://{{ mwan_opnsense_drain_listen }}"
mwan_opnsense_host_listen_path: /var/run/mwan-opnsense.sock
mwan_opnsense_host_reconnect: "2s"
mwan_opnsense_host_hb_interval: "30s"
mwan_opnsense_host_hb_timeout: "10s"
mwan_opnsense_host_binary_local: "{{ repo_root }}/mwan/go/bin/mwan-linux"

# Cloudflared OOB tunnel paths (non-secret). The enabled flag and per-host
# resolvers/credentials live in the per-hypervisor group_vars.
cloudflared_oob_enabled: false
cloudflared_oob_user: "cloudflared-oob"
cloudflared_oob_bin: "/usr/local/bin/cloudflared"
cloudflared_oob_config_dir: "/etc/cloudflared-oob"

# Packages both hypervisors carry. This is the superset of what vault and
# suburban had installed by hand, minus anything Proxmox or Debian owns
# through its own packaging. Declaring them here means a rebuilt or new
# hypervisor gets the same toolkit instead of whatever an operator
# remembered to install.
#
# netcat-openbsd is load bearing rather than a convenience:
# netcat-traditional cannot open an IPv6 socket at all, so a reachability
# probe run through it reports a healthy IPv6 host as closed.
proxmox_apt_packages:
  # Network diagnostics and IPv6-capable probes
  - bridge-utils
  - conntrack
  - ebtables
  - ethtool
  - fping
  - gping
  - ipcalc-ng
  - iproute2
  - ipset
  - iptables
  - ipv6calc
  - ndisc6
  - net-tools
  - netcat-openbsd
  - nmap
  - ripcalc
  - sipcalc
  - socat
  - speedtest-cli
  - sshuttle
  - tcpdump
  - tshark
  - wireguard

  # Storage and filesystems
  - btrfs-progs
  - cifs-utils
  - dosfstools
  - gdisk
  - lvm2
  - nfs-common
  - open-iscsi
  - parted
  - smartmontools
  - smbclient
  - xfsprogs
  - zfsutils-linux

  # Operator shell and file tools
  - bat
  - bc
  - btop
  - curl
  - dtach
  - eza
  - fd-find
  - fzf
  - hdparm
  - htop
  - jq
  - moreutils
  - most
  - neovim
  - pigz
  - psmisc
  - pv
  - ripgrep
  - rsync
  - screen
  - sqlite3
  - strace
  - tmux
  - tree
  - unzip
  - usbutils
  - vim
  - yq
  - zoxide
  - zsh
  - zstd

  # Source control and automation
  - ansible
  - ansible-lint
  - expect
  - gh
  - git
  - git-delta
  - git-lfs
  - lazygit
  - make
  - openssh-server
  - sshpass

  # Host services
  - bsd-mailx
  - chrony
  - fail2ban
  - ifupdown2
  - nut
  - postfix
