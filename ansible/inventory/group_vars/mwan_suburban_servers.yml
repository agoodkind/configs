---
# Testbed MWAN VM (VM 213 on suburban) target vars.
# Consumed by deploy-mwan.yml when targeting `mwan_suburban_servers`.
# Uses the same variable names as mwan_servers.yml so config-vm.toml.j2
# and other shared templates render correctly for both environments.

# ----------------------------------------------------------------------------
# Identity
# ----------------------------------------------------------------------------

mwan_environment: "testbed"
# Deliberately differs from prod's mwan VM id, so a command aimed at the wrong
# hypervisor finds no guest instead of the wrong one. Also the vsock CID the
# suburban watchdog dials, so a change here needs the guest's args updated too.
mwan_vmid: "{{ service_mapping.mwan_suburban.vmid }}"
mwan_proxmox_node: hypervisor
mwan_proxmox_delegate: suburban
# The deploy's verdict collector tries the testbed's single hypervisor path.
mwan_gate_collect_addresses:
  - "{{ service_mapping.suburban_hypervisor.ipv6 }}"

# prep-guests sets the guest hostname to the first label.
service_hostname: "{{ service_mapping.mwan_suburban.hostname }}"

mwan_dns_domain: "home.goodkind.io"
# VM 213 management is on the vmbrtrunk 210:: services LAN, so it resolves
# against the testbed OPNsense Unbound on that segment (VMNET iface 210::1),
# the prod-parity analog of prod mwan using the OPNsense LAN resolver ::1.
mwan_dns_servers: "3d06:bad:b01:210::1"

# ----------------------------------------------------------------------------
# Interfaces (testbed uses virtio, simpler than production passthrough)
# ----------------------------------------------------------------------------

mwan_mgmt_iface: "enmgmt0"
mwan_att_iface: "enatt0"
mwan_webpass_iface: "enwebpass0"
mwan_internal_iface: "enmwanbr0"
mwan_monkeybrains_iface: "enmbrains0"
mwan_astound_iface: "enastound0"

# systemd-networkd files deployed to the testbed gateway. Testbed AT&T is a
# direct link (no VLAN, no 802.1X) from mwan/networkd/testbed/; the internal
# mwanbr link reuses the shared prod template. The daemon writes every rendered
# provider's files from network.json, astound among them.
mwan_networkd_files:
  - testbed/20-att.link
  - testbed/20-att.network
  - 40-mwanbr.link
  - 40-mwanbr.network

# MAC addresses (from PVE config, used by .link files for stable naming)
mwan_mgmt_mac: "BC:24:11:B3:9E:46"
mwan_att_mac: "BC:24:11:C0:D7:60"
mwan_webpass_mac: "BC:24:11:BE:8E:B4"
mwan_mbrains_mac: "BC:24:11:3D:CE:CC"
mwan_astound_mac: "BC:24:11:A5:70:06"
mwan_net1_mac: "BC:24:11:49:5D:94"

# AT&T on the testbed is a simulated ISP LXC on a direct link: no 802.1X, no
# ONT, no VLAN. The prod wpa_supplicant/ONT/VLAN-bringup tasks are skipped.
mwan_att_8021x_enabled: false
mwan_att_vlan_id: ""

# systemd units enabled at the end of the deploy. No AT&T 802.1X units on the
# testbed (wpa_supplicant-mwan, wpa-cli-action, wpa-authenticated.path,
# bringup-att-vlan are prod-only). mwan install enables the units the mwan binary
# embeds, so none of them is listed here.
mwan_enabled_services:
  - mwan-update-att-pinned-dests.timer
  - systemd-networkd
  - networkd-dispatcher
  - nftables

# ----------------------------------------------------------------------------
# WAN addressing (static, ISP LXCs have no DHCPv4 server)
# ----------------------------------------------------------------------------

# The Webpass link sits inside the testbed Webpass static block, as production
# Webpass does, and the sim holds the block's gateway address.
mwan_webpass_ipv4: "10.241.204.2/{{ service_mapping.isp_webpass_suburban.ipv4_prefix }}"
mwan_webpass_ipv4_addr: "10.241.204.2"
mwan_webpass_gateway: "{{ service_mapping.isp_webpass_suburban.ipv4 }}"
mwan_att_ipv4: "10.240.205.2/24"
mwan_att_ipv4_addr: "10.240.205.2"
mwan_att_gateway: "10.240.205.1"
mwan_monkeybrains_ipv4: "10.240.206.2/24"
mwan_monkeybrains_gateway: "10.240.206.1"
mwan_astound_ipv4: "10.240.207.2/24"
mwan_astound_gateway: "10.240.207.1"

# DHCPv6 DUIDs (not needed for testbed, ISP LXCs don't check)
mwan_webpass_duid_raw_data: ""
mwan_monkeybrains_duid_raw_data: ""

# 1:1 NAT of services to each WAN's static block, mirroring prod (att
# 104.57.226.192/29, webpass 136.25.91.240/29). The att sim routes its /29 to
# the MWAN VM; the webpass link sits inside its /29, so that block is on-link.
# The five mapped transit hosts are the router, the MWAN VM, the failover, and
# two spares; .1 is the VRRP virtual address and is not mapped.
# Each provider entry maps them onto the matching host of its ISP block, so
# last octets line up.
mwan_static_internal_hosts:
  - "{{ service_mapping.opnsense_suburban.ipv4_transit }}"
  - "{{ service_mapping.mwan_suburban.ipv4_transit }}"
  - "{{ service_mapping.mwan_failover_suburban.ipv4_transit }}"
  - "{{ service_mapping.opnsense_suburban.transit_v4_net | ansible.utils.ipaddr('5') | ansible.utils.ipaddr('address') }}"
  - "{{ service_mapping.opnsense_suburban.transit_v4_net | ansible.utils.ipaddr('6') | ansible.utils.ipaddr('address') }}"

# ----------------------------------------------------------------------------
# Internal link (to OPNsense)
# ----------------------------------------------------------------------------

mwan_internal_ipv4: "{{ service_mapping.mwan_suburban.ipv4_transit }}/29"
mwan_internal_ipv6: "{{ service_mapping.mwan_suburban.ipv6_transit }}/64"
mwan_internal_net_v4: "{{ service_mapping.opnsense_suburban.transit_v4_net }}"
# The OPNsense end of that link. The nftables template pins the router's
# WireGuard control plane to one WAN by this source address.
mwan_opnsense_internal_v4: "{{ service_mapping.opnsense_suburban.ipv4_transit }}"
mwan_mwanbr_edge_ipv6: "{{ service_mapping.mwan_suburban.ipv6_transit }}"
mwan_internal_prefix: "3d06:bad:b01:210::/60"

# OPNsense addresses (testbed OPNsense).
mwan_opnsense_edge_ipv6: "{{ service_mapping.opnsense_suburban.ipv6_transit }}"
# OPNsense API URL target for the agent (config-vm.toml.j2). Prod uses the
# OPNsense address on the mwan-mgmt segment; the testbed analog is the router's
# VMNET address, which this VM is on-link with. MANAGEMENT has no testbed
# counterpart, because the config transform removes that interface.
opnsense_addr: "{{ service_mapping.opnsense_suburban.ipv6_vmnet }}"
# OPNsense BGP integration the agent renders into config.toml (config-vm.toml.j2
# [opnsense.bgp]). Testbed values mirror suburban_servers.yml's OPNsense view:
# the MWAN VM is the primary BGP peer and the failover the backup, over the
# transit link.
opnsense_gateway_names:
  - WAN_GW4
  - WAN_GW6
opnsense_bgp_router_id: "{{ service_mapping.opnsense_suburban.ipv4_transit }}"
opnsense_bgp_firewall_source_v4: "{{ service_mapping.opnsense_suburban.transit_v4_net }}"
opnsense_bgp_firewall_source_v6: "{{ service_mapping.opnsense_suburban.transit_v6_net }}"
opnsense_bgp_neighbors:
  - address: "{{ service_mapping.mwan_suburban.ipv4_transit }}"
    description: "mwan-IPv4"
    preference: "primary"
  - address: "{{ service_mapping.mwan_suburban.ipv6_transit }}"
    description: "mwan-IPv6"
    preference: "primary"
  - address: "{{ service_mapping.mwan_failover_suburban.ipv4_transit }}"
    description: "failover-IPv4"
    preference: "backup"
  - address: "{{ service_mapping.mwan_failover_suburban.ipv6_transit }}"
    description: "failover-IPv6"
    preference: "backup"
failover_lxc_id: "{{ service_mapping.mwan_failover_suburban.vmid }}"

# ----------------------------------------------------------------------------
# IPv6 prefixes (simulated ISPs on suburban)
# ----------------------------------------------------------------------------

# PD sizes match prod: webpass /56, att /60, monkeybrains /56. Sim delegation
# prefixes (the 22/23/24 /56-clean scheme) live in suburban_servers.yml
# testbed_isp_lxcs. Each provider's translation target is the first /60 of its
# delegation and is typed in that provider's entry below. Astound delegates no
# prefix, so it has no mwan_astound_pd_prefix here.
mwan_att_pd_prefix: "3d06:bad:b01:2300::/60"
mwan_webpass_pd_prefix: "3d06:bad:b01:2200::/56"
mwan_monkeybrains_pd_prefix: "3d06:bad:b01:2400::/56"

# ----------------------------------------------------------------------------
# Providers
# ----------------------------------------------------------------------------

# Mirrors mwan_servers.yml entry for entry, with the simulated ISPs' addresses.
# The routing numbers match production on purpose, so a testbed proof exercises
# the numbers the production gateway runs. link_files and the link and
# per-family blocks are described there; the testbed's links are virtio
# devices matched by the address Proxmox assigned, so no entry matches by
# driver or sets a hardware address.
mwan_providers:
  - name: att
    iface: "{{ mwan_att_iface }}"
    vlan_id: "{{ mwan_att_vlan_id }}"
    # Hand-authored as in production, so the testbed exercises the same
    # exemption; its two direct-link unit files stay under mwan/networkd/testbed/.
    link_files: hand-authored
    table: 100
    mark: 1
    mark_prio: 100
    from_prio: 55
    tier: 0
    weight: 1
    npt_prefix: "3d06:bad:b01:2300::/60"
    v4_source: ""
    static_mappings:
      - { internal: "{{ mwan_static_internal_hosts[0] }}", external: "10.241.205.2" }
      - { internal: "{{ mwan_static_internal_hosts[1] }}", external: "10.241.205.3" }
      - { internal: "{{ mwan_static_internal_hosts[2] }}", external: "10.241.205.4" }
      - { internal: "{{ mwan_static_internal_hosts[3] }}", external: "10.241.205.5" }
      - { internal: "{{ mwan_static_internal_hosts[4] }}", external: "10.241.205.6" }
    health:
      enabled: true
      ping_count: 3
      success_threshold: 2
      failure_threshold: 2
      recovery_threshold: 2
      check_interval: 10
      targets_v4: ["1.1.1.1", "8.8.8.8"]
      targets_v6: ["2606:4700:4700::1111", "2001:4860:4860::8888"]
      http_targets: ["https://ifconfig.co/ip"]

  - name: webpass
    iface: "{{ mwan_webpass_iface }}"
    vlan_id: ""
    link_files: rendered
    link:
      match: { hardware_address: "{{ mwan_webpass_mac | lower }}" }
    ipv4:
      forwarding: true
      dhcp: false
      address: "{{ mwan_webpass_ipv4 }}"
      gateway: "{{ mwan_webpass_gateway }}"
      route_metric: 10
    # The simulated ISP checks no DUID, so the delegation carries only the
    # hint; a DUID typed here renders only when the value is non-empty.
    ipv6:
      forwarding: true
      dhcp: true
      accept_ra: true
      delegation:
        hint: "::/56"
    table: 200
    mark: 2
    mark_prio: 200
    from_prio: 56
    tier: 0
    weight: 1
    npt_prefix: "3d06:bad:b01:2200::/60"
    static_mappings:
      - { internal: "{{ mwan_static_internal_hosts[0] }}", external: "10.241.204.2" }
      - { internal: "{{ mwan_static_internal_hosts[1] }}", external: "10.241.204.3" }
      - { internal: "{{ mwan_static_internal_hosts[2] }}", external: "10.241.204.4" }
      - { internal: "{{ mwan_static_internal_hosts[3] }}", external: "10.241.204.5" }
      - { internal: "{{ mwan_static_internal_hosts[4] }}", external: "10.241.204.6" }
    health:
      enabled: true
      ping_count: 3
      success_threshold: 2
      failure_threshold: 2
      recovery_threshold: 2
      check_interval: 10
      targets_v4: ["1.1.1.1", "8.8.8.8"]
      targets_v6: ["2606:4700:4700::1111", "2001:4860:4860::8888"]
      http_targets: ["https://ifconfig.co/ip"]

  - name: monkeybrains
    iface: "{{ mwan_monkeybrains_iface }}"
    vlan_id: ""
    link_files: rendered
    link:
      match: { hardware_address: "{{ mwan_mbrains_mac | lower }}" }
    ipv4:
      forwarding: true
      dhcp: true
      route_metric: 5000
    # mwan_monkeybrains_duid_raw_data is empty on the testbed. The daemon
    # renders DUIDType and omits the DUIDRawData line; networkd applies the
    # same default for an absent key and for an empty assignment.
    ipv6:
      forwarding: true
      dhcp: true
      accept_ra: true
      route_metric: 5000
      delegation:
        hint: "::/56"
        duid_type: link-layer-time
        duid: "{{ mwan_monkeybrains_duid_raw_data }}"
        use_delegated_prefix: true
        without_ra: solicit
        router_lifetime_seconds: 1800
    table: 300
    mark: 3
    mark_prio: 300
    from_prio: 57
    tier: 1
    weight: 1
    npt_prefix: "3d06:bad:b01:2400::/60"
    v4_source: ""
    static_mappings: []
    health:
      enabled: true
      ping_count: 5
      success_threshold: 1
      failure_threshold: 5
      recovery_threshold: 3
      check_interval: 30
      targets_v4: ["1.1.1.1", "8.8.8.8"]
      targets_v6: ["2606:4700:4700::1111", "2001:4860:4860::8888"]
      http_targets: ["https://ifconfig.co/ip"]

  # Astound has no production counterpart. It proves a provider can be added by
  # inventory alone with the binary unchanged, and it models the one shape the
  # other three do not: a dynamic IPv4-only link with no VLAN. A DHCPv4
  # reservation on the simulator pins its address to 10.240.207.2. This entry
  # declares no translation prefix, which excludes it from translation and from
  # the IPv6 source rules. Its IPv4 leg alone decides its health, because the
  # link runs no IPv6. Its IPv6 probe targets match the other providers, which a
  # probe cycle requires of every entry.
  - name: astound
    iface: "{{ mwan_astound_iface }}"
    vlan_id: ""
    link_files: rendered
    link:
      match: { hardware_address: "{{ mwan_astound_mac | lower }}" }
    ipv4:
      forwarding: true
      dhcp: true
      route_metric: 6000
    ipv6:
      accept_ra: false
    table: 600
    mark: 4
    mark_prio: 600
    from_prio: 58
    tier: 2
    weight: 1
    npt_prefix: ""
    v4_source: "10.240.207.2"
    static_mappings: []
    health:
      enabled: true
      ping_count: 3
      success_threshold: 2
      failure_threshold: 2
      recovery_threshold: 2
      check_interval: 10
      targets_v4: ["1.1.1.1", "8.8.8.8"]
      targets_v6: ["2606:4700:4700::1111", "2001:4860:4860::8888"]
      http_targets: ["https://ifconfig.co/ip"]

# How a new connection is assigned among the active tier's healthy providers.
mwan_hash_mode: random

# The provider the pinned-destination sets and the router's WireGuard control
# plane are pinned to. The testbed's pinned lists are empty, so this decides
# only the WireGuard pin there.
mwan_pin_provider: att

# ----------------------------------------------------------------------------
# Interface manager WAN route module
# ----------------------------------------------------------------------------

mwan_ifmgr_wan_enabled: true
mwan_ifmgr_wan_health_state_file: "/var/run/mwan-health.state"

# ----------------------------------------------------------------------------
# Notifications
# ----------------------------------------------------------------------------

mwan_email_enabled: true
mwan_email_recipient: "alex@goodkind.io"
mwan_email_from: "mwan-testbed@goodkind.io"
mwan_email_script: "/opt/scripts/send-email"
mwan_email_sender_name: "MWAN-TESTBED"
mwan_debug_logging: true

# Variables consumed by mwan/config/config-vm.toml.j2 [email] block.
mwan_email_min_level: "ERROR"
mwan_email_subject_prefix: "[MWAN-suburban]"
mwan_email_bind_iface: ""
mwan_email_cooldown: "5m"

# How long one health probe attempt may take before it counts as failed.
# Milliseconds, because a probe timeout is the one span here an operator tunes
# below a second. Rendered into network.json as steering-group/health/probe-timeout.
mwan_health_probe_timeout_ms: 2000

# Destination pinning is not exercised on the testbed, so every list is empty
# and the nft sets render with no elements.
mwan_pinned_v4_seed_cidrs: []
mwan_pinned_v4_fqdns: []
mwan_pinned_v6_seed_cidrs: []
mwan_pinned_v6_fqdns: []
mwan_zoom_ipranges_url: ""

# ----------------------------------------------------------------------------
# BGP (embedded GoBGP in agent)
# ----------------------------------------------------------------------------

bgp_asn: 4200000001
bgp_router_id: "{{ service_mapping.mwan_suburban.ipv4_transit }}"
bgp_next_hop_v6: "{{ service_mapping.mwan_suburban.ipv6_transit }}"
mwan_bgp_learned_route_iface: "{{ mwan_internal_iface }}"
# Session timers live in group_vars/all/vars.yml (MWAN-303 rationale there).
bgp_listen_port: 179
bgp_neighbors:
  - "{{ service_mapping.opnsense_suburban.ipv4_transit }}"
bgp_neighbors_v6:
  - "{{ service_mapping.opnsense_suburban.ipv6_transit }}"
bgp_announce_ipv4:
  - "0.0.0.0/0"
bgp_announce_ipv6:
  - "::/0"

# Transit networks the speaker accepts dynamic BGP sessions from, mirroring
# mwan_servers.yml with the testbed transit link.
mwan_bgp_dynamic_neighbors:
  - "{{ service_mapping.opnsense_suburban.transit_v4_net }}"
  - "{{ service_mapping.opnsense_suburban.transit_v6_net }}"

# BGP Graceful Restart (RFC 4724). Mirrors mwan_servers.yml.
mwan_bgp_graceful_restart_enabled: true
mwan_bgp_graceful_restart_time_seconds: 30
mwan_bgp_graceful_restart_notification_enabled: true

# Shared runtime config values consumed by mwan/config/config-vm.toml.j2.
mwan_config_hostname: "suburban-testbed"
mwan_config_mgmt_addr: "3d06:bad:b01:210::213"
mwan_watchdog_service_name: "mwan-watchdog-testbed"
mwan_watchdog_agent_tcp_addr: "[3d06:bad:b01:210::213]:50052"
mwan_watchdog_log_file: "/var/log/mwan-watchdog-testbed.log"
mwan_watchdog_json_log_file: "/var/log/mwan-watchdog-testbed.jsonl"
mwan_watchdog_state_file: "/run/mwan-rollback-testbed.state"
mwan_watchdog_lock_file: "/run/mwan-watchdog-testbed-rollback.lock"
# The testbed gateway carries the wanconfig stack (deploy-mwan installs
# it), so its ifmgr publishes the configuration it loaded into the
# sysrepo datastore at startup and the RESTCONF surface serves it on the
# management address.
mwan_wanconfig_publish: true
# The VM runs only the wan role, whose modules are health, wan.routes, and npt.
# There is no OOB tunnel on the testbed, so the VM declares no OOB interface or
# address and renders none of the OOB modules.
mwan_ifmgr_oob_enabled: false
mwan_ifmgr_iface_key: "enmbrains0"
mwan_ifmgr_iface_name: "enmbrains0"
mwan_ifmgr_iface_dhcp_v4: true
mwan_ifmgr_iface_ra_solicit: true
mwan_ifmgr_host_ipv6_policy_enabled: false

# Interface-manager cloudflared-tap module (off; downgrade automation).
mwan_ifmgr_cloudflared_tap_enabled: false
mwan_ifmgr_cloudflared_tap_unit: "cloudflared-oob"
mwan_ifmgr_cloudflared_tap_downgrade_patterns: []

# Interface-manager WireGuard health module (off).
mwan_ifmgr_wg_enabled: false
mwan_ifmgr_wg_ssh_host: ""
mwan_ifmgr_wg_identity_file: ""
mwan_ifmgr_wg_iface: "wg0"
mwan_ifmgr_wg_sudo: false
mwan_ifmgr_wg_warn_handshake_age: "180s"
mwan_ifmgr_wg_error_handshake_age: "300s"
mwan_ifmgr_wg_timeout: "10s"
mwan_ifmgr_wg_ignore_peers: []

# ----------------------------------------------------------------------------
# SMTP defaults (shared non-secret settings)
# ----------------------------------------------------------------------------

mwan_smtp_host: "{{ smtp_host }}"
mwan_smtp_port: "{{ smtp_port }}"
