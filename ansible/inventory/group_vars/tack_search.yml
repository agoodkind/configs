---
# These values apply to every OpenSearch guest. The environment groups set
# the member list, the endpoint, the credentials, and the discovery mode.
tack_cluster_role: search
tack_provision_owner: false

# A search guest runs no ledger node.
tack_ledger_node_name: ""

# Tack requires these OpenSearch container settings. The search guests have
# no IPv4 route. java.net.preferIPv6Addresses makes the JVM connect to the
# IPv6 address of a dual-stack host, such as the model artifact host
# artifacts.opensearch.org that ML Commons downloads the pinned model from.
#
# The ML Commons memory breaker rejects predictions when used heap is at or
# above 85 percent. G1PeriodicGCInterval=5000 enables periodic garbage
# collection.
tack_search_image: "opensearchproject/opensearch:3.8.0"
tack_search_java_opts: "-Xms3g -Xmx3g -XX:G1PeriodicGCInterval=5000 -Djava.net.preferIPv6Addresses=true"
tack_search_role_set: >-
  {{ ((tack_search_role_set_members | dict2items | selectattr('value', 'contains', service_name)
       | map(attribute='key') | list) + ['combined']) | first }}
tack_search_node_roles: "{{ tack_search_role_sets[tack_search_role_set] | join(',') }}"
tack_search_nofile_limit: 65536

# The node name is the first label of the guest's hostname. Production
# tack_search1 announces tack-search1.
tack_search_node_name: "{{ service_mapping[service_name].hostname.split('.') | first }}"

# The env template renders these discovery values as the TACK_SEARCH_*
# variables that the Tack compose file reads. An empty value leaves that
# OpenSearch setting unset. QA runs single-node discovery. Production seeds
# every member from the member list. The first production member sets itself
# as the initial cluster manager only while tack_search_bootstrap_cluster is
# true.
tack_search_discovery_type: "{{ 'single-node' if tack_search_single_node | bool else '' }}"
# Each seed is the member address in brackets. OpenSearch refuses a bare
# IPv6 address as a seed host.
tack_search_seed_hosts: >-
  {{ '' if tack_search_single_node | bool
     else tack_search_members | map('extract', service_mapping, 'ipv6')
          | map('regex_replace', '^(.*)$', '[\1]') | join(',') }}
tack_search_initial_cluster_manager_nodes: >-
  {{ tack_search_node_name
     if (not tack_search_single_node | bool
         and tack_search_bootstrap_cluster | bool
         and service_name == tack_search_members | first)
     else '' }}

# The node presents this certificate to the proxy and to its peers. The vault
# stores one certificate and private key per member under the member's
# service mapping key. Each certificate lists the guest's address as an IP
# subject alternative name because the proxy dials that address and verifies
# the certificate against it.
tack_search_node_dir: /etc/tack/search
tack_search_node_certificate: "{{ lookup('vars', 'vault_' ~ service_name ~ '_certificate') }}"
tack_search_node_private_key: "{{ lookup('vars', 'vault_' ~ service_name ~ '_private_key') }}"

# The OpenSearch image runs as this user ID. The deploy gives this user the
# node key and the security configuration files because the node reads them
# from bind mounts.
tack_search_container_uid: 1000

# The deploy host connects to a running member at this address to write
# changed security files. The member binds the address on the guest, and the
# member certificate lists it as an IP subject alternative name.
tack_search_member_url: "https://[{{ service_mapping[service_name].ipv6 }}]:{{ tack_search_port }}"

# The deploy host presents this self-signed certificate to the member as a
# super admin. The environment groups read the certificate and key from the
# vault. The certificate subject must equal this value, which the member lists
# in plugins.security.authcz.admin_dn. OpenSearch splits that setting at
# commas, and the subject has one attribute. Each environment has its own
# cluster name, certificate, and subject.
tack_search_admin_dn: "CN={{ tack_search_cluster_name }}-admin"

# The guest records the checksums of the security files it last wrote into
# the member in this file.
tack_search_security_record_path: "{{ tack_search_node_dir }}/security-applied"

# After a restart, the deploy waits up to 30 checks, 10 seconds apart, for
# the member to load its security index.
tack_search_security_ready_retries: 30
tack_search_security_ready_delay_seconds: 10
