---
# Settings for every OpenSearch guest. The environment groups provide the
# member list, the endpoint, the credentials, and the discovery mode.
tack_cluster_role: search
tack_provision_owner: false

# A search guest runs no ledger node.
tack_ledger_node_name: ""

# The container OpenSearch runs as, pinned to the Tack container contract.
tack_search_image: "opensearchproject/opensearch:3.8.0"
tack_search_java_opts: "-Xms2g -Xmx2g"
tack_search_node_roles: "cluster_manager,data,ingest,ml"
tack_search_nofile_limit: 65536

# The node name is the first label of the guest's hostname. Production
# tack_search1 announces tack-search1.
tack_search_node_name: "{{ service_mapping[service_name].hostname.split('.') | first }}"

# This node's certificate and key. The node presents them to the proxy and to
# its peers. Each member has its own pair in the vault, named for its service
# mapping key. The proxy dials the guest's address and verifies the
# certificate against it. Each certificate lists the guest's address as an IP
# subject alternative name.
tack_search_node_dir: /etc/tack/search
tack_search_node_certificate: "{{ lookup('vars', 'vault_' ~ service_name ~ '_certificate') }}"
tack_search_node_private_key: "{{ lookup('vars', 'vault_' ~ service_name ~ '_private_key') }}"

# The OpenSearch image runs as this user. The node reads its key and the user
# file through bind mounts, and both files belong to this user.
tack_search_container_uid: 1000
