---
# Testbed MWAN failover LXC (lxc-216 on suburban) target vars.
# Consumed by deploy-mwan-failover.yml when targeting `mwan_failover_suburban_servers`.

mwan_failover_hostname: "{{ service_mapping.mwan_failover_suburban.hostname.split('.')[0] }}"
mwan_failover_email_from: "mwan-testbed@goodkind.io"
mwan_failover_subject_prefix: "[MWAN-suburban-failover]"

mwan_failover_bgp_asn: 4200000001
mwan_failover_bgp_router_id: "{{ service_mapping.mwan_failover_suburban.ipv4_transit }}"
mwan_failover_bgp_next_hop_v6: "{{ service_mapping.mwan_failover_suburban.ipv6_transit }}"
mwan_bgp_learned_route_iface: "eth1"
mwan_failover_bgp_neighbors:
  - "{{ service_mapping.opnsense_suburban.ipv4_transit }}"
mwan_failover_bgp_neighbors_v6:
  - "{{ service_mapping.opnsense_suburban.ipv6_transit }}"
mwan_failover_ipv4_address: "{{ service_mapping.mwan_failover_suburban.ipv4_transit }}/29"
mwan_failover_ipv6_address: "{{ service_mapping.mwan_failover_suburban.ipv6_transit }}/64"
# Empty on the testbed: IPv4 replies to off-link sources leave by eth0 and
# drain through the ISP sim's vmbr1 uplink to suburban, which owns the return
# routing for the tunnel and testbed ranges. Production sets a real value
# because its ISPs cannot return private ranges. IPv6 return routes are
# BGP-learned on every speaker.
mwan_failover_ipv4_return_route: ""
# Source interface for outbound failover alert email (empty = default route).
mwan_failover_email_bind_iface: ""

# Session timers live in group_vars/all/vars.yml (MWAN-303 rationale there).
# TODO(MWAN-229 follow-up): promote bgp_listen_port and the announce lists to
# group_vars/all so every group inherits one definition.
bgp_listen_port: 179
bgp_announce_ipv4:
  - "0.0.0.0/0"
bgp_announce_ipv6:
  - "::/0"

# Transit networks the speaker accepts dynamic BGP sessions from, matching the
# testbed primary so both speakers serve every router during a failover.
mwan_bgp_dynamic_neighbors:
  - "{{ service_mapping.opnsense_suburban.transit_v4_net }}"
  - "{{ service_mapping.opnsense_suburban.transit_v6_net }}"

# BGP graceful restart (RFC 4724). Mirrors the primary so a failover agent
# restart holds routes in the helper instead of flapping the session.
mwan_bgp_graceful_restart_enabled: true
mwan_bgp_graceful_restart_time_seconds: 30
mwan_bgp_graceful_restart_notification_enabled: true

# Alert email routing. Recipient/level/cooldown mirror the other mwan groups;
# the failover keeps its own from-address and subject prefix above.
mwan_email_recipient: "alex@goodkind.io"
mwan_email_min_level: "ERROR"
mwan_email_cooldown: "5m"
