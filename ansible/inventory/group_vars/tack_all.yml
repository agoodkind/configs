---
service_ipv6_only: true

# Guest identity, derived from each guest's own inventory entry. The inventory
# plugin sets service_name on every host to that guest's mapping key, so one
# declaration here serves every tack guest and a renumber changes one line in
# the mapping.
service_hostname: "{{ service_mapping[service_name].hostname }}"
service_ipv6_address: "{{ service_mapping[service_name].ipv6 }}/64"
service_mac_address: "{{ service_mapping[service_name].mac_address }}"


# Container resources are reference values only; OpenTofu owns the live shape.
service_memory: 8192
service_cores: 2
service_disk_size: 40
container_features: "nesting=1"

tack_install_dir: /root/tack

# Engine packages the deploy holds against the weekly package updater
# (TACK-487): an unattended upgrade of any of these restarts the daemon and
# every container with it. docker-ce-rootless-extras arrives as a recommend
# of docker-ce and is held with it.
tack_docker_held_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin
  - docker-ce-rootless-extras

# The engine's superuser, used by the ops sidecar for migrations, role
# seeding, and backups, and by the engine's own first boot. The application
# no longer connects as it: its DATABASE_URL uses tack_app (TACK-180).
tack_yugabyte_user: yugabyte
tack_yugabyte_db: tack

# Each environment generates its own key at this path on first deploy. The
# path is shared; the key material is not.
tack_audit_signing_key_path: /etc/tack/audit-signing.pem

# The application's own database login password (TACK-180), generated once
# per host on first deploy the way the signing key is. The path is shared;
# the value is not, and it never enters the vault.
tack_app_password_path: /etc/tack/app-db.password

# Whether this environment's consumers (app, audit consumer, ops sidecar)
# have been repointed at the three ledger data nodes. QA repointed on
# 2026-08-24; production still runs everything against the legacy node on
# the app guest, whose data guests are not provisioned yet, so a deploy
# there must keep the legacy connection shape or the app dials three
# unreachable addresses. Environment groups set the current value; the
# production cutover flips it as its repoint step.
tack_ledger_consumers_repointed: false

# How long the driver spends on one ledger name before it moves to the next
# one in a multi-host connection string. Stopping a data guest black-holes
# its socket rather than refusing it, so with no bound the driver waits out
# the kernel's TCP retry on the first name and never reaches a surviving
# node; the app served 503 on /healthz for about thirty seconds after a
# guest was stopped, against a ten-second bound (TACK-464).
#
# The bound applies per name, so losing one of three costs one timeout and
# then a live connection. Whole seconds only: the driver reads this as an
# integer count of seconds, and it consumes the key itself rather than
# forwarding it to the server, which is what makes it safe against the
# ledger's PostgreSQL 11 wire compatibility. Two seconds sits far above a
# healthy same-network connect and far below the acceptance bound.
tack_database_connect_timeout_seconds: 2

# Ledger transport encryption (TACK-460). Repointing moved the ledger onto
# the three data guests, so application SQL and the engine's own replication
# now cross guest boundaries; with this false they cross in plaintext, which
# is where every environment started. With it true the deploy issues a
# private certificate authority and one server certificate per ledger node,
# the engine encrypts both client and node traffic and refuses an
# unencrypted connection, and every client dials sslmode=verify-full against
# that authority, so a client proves the node's identity rather than
# trusting whatever answers the address.
#
# Environment groups turn it on; it stays false here so a host nobody has
# issued certificates for keeps connecting.
tack_ledger_tls_enabled: false

# Where the issued material lives on each guest. /etc/tack is already the
# directory holding the audit signing key and the application login's
# password, and the app and audit consumer already mount it read-only, so
# the certificate authority reaches them at the same path it has on the
# host. The engine reads its own node certificate from the same directory,
# mounted into the ledger container.
tack_ledger_certs_dir: /etc/tack/ledger-certs
tack_ledger_ca_cert_path: "{{ tack_ledger_certs_dir }}/ca.crt"

# Which guest issues this environment's certificates and keeps the
# authority's private key. Environment groups name their own owner guest;
# the deploy reads the material from there and copies each node's share to
# the guest that announces that node.
tack_ledger_ca_host: ""

# The certificates to issue: every ledger node name mapped to the address
# its guest is pinned at, plus the legacy node while the environment still
# runs one. A node dialed by either its name or its address must present a
# certificate carrying both, so this map is what the names in each
# certificate come from.
tack_ledger_certificate_subjects: >-
  {{ tack_ledger_node_addresses
     | combine({'yugabyte': tack_store_host} if tack_ledger_legacy_node_present else {}) }}

# How long an issued certificate lasts. Ten years, because rotation here is
# a deploy that regenerates the material and restarts the nodes, and a
# shorter life would expire the ledger on a quiet weekend rather than at a
# moment anyone chose. Rotation before expiry is its own ticket.
tack_ledger_cert_days: 3650

# The connection parameters every ledger client carries, in the two forms
# the drivers accept: query parameters for a URL and keywords for the
# host-networked ops sidecar. verify-full checks the certificate's name
# against the name dialed, so the node certificates carry both the node name
# and the guest's pinned address; nothing here works without that pairing.
tack_ledger_ssl_query: >-
  {{ 'sslmode=verify-full&sslrootcert=' + tack_ledger_ca_cert_path
     if tack_ledger_tls_enabled else 'sslmode=disable' }}
tack_ledger_ssl_keywords: >-
  {{ 'sslmode=verify-full sslrootcert=' + tack_ledger_ca_cert_path
     if tack_ledger_tls_enabled else 'sslmode=disable' }}

# The ops sidecar runs on host networking, where the ledger node names do
# not resolve. Repointed environments list the three data guests' pinned
# addresses and the driver fails over across them, in keyword form because
# the URL form rejects a comma list of bracketed IPv6 hosts (invalid
# IP-literal). Legacy environments dial the guest that serves the store.
tack_ops_database_url: >-
  {{ ('host=' + tack_ledger_node_addresses.yb1 + ',' + tack_ledger_node_addresses.yb2 + ','
      + tack_ledger_node_addresses.yb3 + ' port=5433 user=' + tack_yugabyte_user
      + ' password=' + tack_yugabyte_password + ' dbname=' + tack_yugabyte_db
      + ' ' + tack_ledger_ssl_keywords + ' connect_timeout='
      + (tack_database_connect_timeout_seconds | string))
     if tack_ledger_consumers_repointed
     else ('postgres://' + tack_yugabyte_user + ':' + tack_yugabyte_password
           + '@[' + tack_store_host + ']:5433/' + tack_yugabyte_db
           + '?' + tack_ledger_ssl_query) }}

tack_log_level: debug
tack_log_max_backups: 0
tack_log_max_age_days: 0
tack_log_max_size_mb: 100
tack_fdb_version: "7.4.6"
tack_port: 8000

# ---------------------------------------------------------------------------
# Product store (FoundationDB), phase 4 (TACK-408)
# ---------------------------------------------------------------------------

# The port every store process listens on and announces.
tack_store_port: 4500

# Whether this guest runs a store process in the distributed shape: one per
# data guest, announcing that guest's pinned address. A guest that runs one
# uses host networking, because the process has to bind the address it
# announces and a container address is replaced on the next recreate.
#
# False here, so a deploy changes nothing until an environment turns it on at
# the migration step that starts the data guests' processes. The deploy starts
# a process only where this is true and tack_store_bootstrap_coordinators names
# the live coordinators, because a process with neither is its own coordinator
# and would create a second cluster beside the real one.
tack_store_node_present: false

# Whether the owner guest still runs the original store process, the one that
# announces its container address. It stays true until the environment has
# migrated and the process has been excluded; false retires the service and
# its backup agent on the owner. Environment groups set the current value, the
# same way tack_ledger_legacy_node_present does for the ledger.
tack_store_legacy_node_present: true

# The coordinator list a store process starts from the first time it runs on a
# guest. It must name the coordinators the cluster uses right now, not the ones
# the migration will end at: a process handed addresses that answer nothing
# creates a second cluster beside the real one instead of joining it. The
# migration updates this value at the step that moves the coordinators.
#
# An empty list leaves the guest with no seeded file, which is what a store
# that has never been configured needs: the first process is its own
# coordinator.
tack_store_bootstrap_coordinators: []

# The cluster's description and id. Both halves are identity, not settings:
# a process given different ones joins a different cluster. docker:docker is
# what the image's own entrypoint wrote when each environment's store was
# first configured, so every existing cluster file names it.
tack_store_cluster_id: "docker:docker"

# The seeded cluster file, assembled from the two values above. Each address is
# bracketed because a port follows it.
tack_store_cluster_file_contents: >-
  {{ tack_store_cluster_id }}@
  {%- for address in tack_store_bootstrap_coordinators -%}
  [{{ address }}]:{{ tack_store_port }}{{ ',' if not loop.last else '' }}
  {%- endfor %}

# How long one product-store transaction may run, its retries included. The
# client resets nothing on a retry at this API version, so the one value bounds
# the whole retry loop. Without it a transaction issued while the store elects
# a new leader retries without end. Five seconds sits above a healthy
# cross-guest commit and below the ten-second bound a guest loss is measured
# against.
tack_store_transaction_timeout: 5s

# How many copies of every key the store keeps. double survives the loss of one
# data guest; triple needs all three guests live, so on three guests it would
# turn one guest's loss into an outage. Only `ops provision` on a store that
# has never been configured and a deliberate `ops store set-redundancy` read
# this, so changing it here changes nothing on a configured cluster.
tack_store_redundancy_mode: single

# Container image tag. Production uses latest; QA overrides with a branch SHA
# passed at deploy time.
tack_image_tag: latest

# Auth mode rendered as ENV. development accepts a raw user UUID as the bearer
# with no token lookup; production requires an API token. Production keeps
# development until the token path is proven on QA and its clients hold real
# tokens, so a deploy there changes nothing (TACK-261). QA overrides this.
tack_env: development

# Whether the legacy ledger node (name yugabyte, on the guest that serves
# the app) still exists in this environment. While true, its name stays in
# the peer maps and joining nodes enroll at it; once the environment retires
# it, the owner guest stops deploying the service and fresh nodes enroll at
# a surviving data node instead. Environment groups set the current value.
tack_ledger_legacy_node_present: true

# Ledger node peer map, derived per guest: every ledger name except this
# guest's own, each mapped to the owning guest's pinned address. While the
# legacy node exists its name also maps to the guest serving it; the guest
# announcing that name skips the entry. Rendered into the compose
# override's extra_hosts.
tack_ledger_peers: >-
  {{ (tack_ledger_node_addresses | dict2items
      | rejectattr('key', 'eq', tack_ledger_node_name) | items2dict)
     | combine({} if (tack_ledger_node_name == 'yugabyte'
                     or not tack_ledger_legacy_node_present)
               else {'yugabyte': tack_store_host}) }}

# Data guests enroll into the cluster on first start: at the legacy node
# while it exists, at a surviving data node after it retires (yb1, except
# yb1 itself enrolls at yb2). Every other guest starts standalone.
#
# A from-empty environment rebuild has no node to enroll at, so it passes
# --extra-var tack_ledger_bootstrap=true, which lets yb1 create the
# universe. The flag is explicit and never defaults on, because a
# join-less node whose volume was wiped would create a second universe
# beside a surviving cluster instead of rejoining it.
# Snapshot-export paths for the backup commands. The rocksdb root is the
# path inside the ledger container where the per-tablet
# .snapshots/<snapshot id> directories live (verified live on the testbed
# data guests); the overlay path is where the deploy places the patched
# yugabyted the restore drill bind-mounts into its throwaway node.
tack_backup_yb_rocksdb_dir: /home/yugabyte/var/data/yb-data/tserver/data/rocksdb
tack_backup_yb_overlay_path: "{{ tack_install_dir }}/yugabyte-overlay/yugabyted"

# Host path of the patched fdb.bash the deploy fetches onto the owner guest.
# The FoundationDB restore drill bind-mounts it into its throwaway cluster so
# that cluster boots on the IPv6-only bridge, the same role the patched
# yugabyted plays for the ledger drill above.
tack_backup_fdb_overlay_path: "{{ tack_install_dir }}/fdb-overlay/fdb.bash"

# Master quorum addresses for the backup one-shot containers (snapshot
# create, metadata export, schema dump, staleness check). They run in the
# ops sidecar on host networking, so like every other ops link they dial
# the guests' pinned addresses on the published master port, bracketed
# because each carries a port; a node name there would leave for site
# DNS, where the wildcard record answers as the proxy. While the legacy
# node exists the guest serving the store leads the quorum and heads the
# list; the data guests follow and carry the list alone after retirement.
tack_backup_yb_master_addresses: >-
  {{ ('[' + tack_store_host + ']:7100,' if tack_ledger_legacy_node_present
      else '')
     + '[' + tack_ledger_node_addresses.yb1 + ']:7100,['
     + tack_ledger_node_addresses.yb2 + ']:7100,['
     + tack_ledger_node_addresses.yb3 + ']:7100' }}

# Scheduled ledger export cadence (TACK-356). The owner guest's orchestrator
# runs daily off-peak; each data guest's archiver polls and exits 0 quietly
# when no manifest is pending, so its interval is short. The unit templates
# render these values; the timers install only where the backup store exists
# (tack_backup_enabled) and the ledger topology is live
# (tack_ledger_consumers_repointed).
tack_ledger_export_oncalendar: "*-*-* 03:17:00 UTC"
tack_ledger_export_randomized_delay: 300
tack_ledger_archive_interval: 15min

# Backup staleness alarm cadence (TACK-363). The check dates every backup
# mechanism and exits nonzero once one is past its threshold. The acceptance
# bound is that an alarm fires within its threshold plus 15 minutes, and the
# worst-case detection lag is the interval plus the randomized delay plus the
# run itself, so the interval has to sit well inside 15 minutes. At 30 minutes
# the induced FoundationDB restorable-point staleness on QA alarmed 14m56s
# late (2026-09-02, crossing 05:49:06Z, first stale check 06:19:02Z). The check is
# four cheap probes with no data movement, so 10 minutes costs nothing. The
# randomized delay staggers the owner guest's copy against the data guest's
# copy so both alarms do not depend on the same instant of outbound mail.
tack_backup_staleness_interval: 10min
tack_backup_staleness_randomized_delay: 60

# Scheduled restore rehearsal cadence (TACK-363). The staleness check dates its
# rehearsal metric from a marker only a fully passing restore drill writes, so
# the drill has to be scheduled or that metric never becomes datable. Daily,
# because a drill takes a couple of minutes and the check's rehearsal threshold
# is eight days, so a daily run leaves days of margin over a missed window. The
# hour sits well clear of the 03:17 export above: the drill restores the newest
# complete export run, so it must not race the per-node archives finishing that
# night's run.
tack_backup_restore_drill_oncalendar: "*-*-* 05:40:00 UTC"
tack_backup_restore_drill_randomized_delay: 300

# Where a stale-backup report is mailed. The staleness check reads this as
# TACK_BACKUP_ALARM_EMAIL and mails its own report, sending from the guest's
# <hostname>-mailer@ address, the sender that demonstrably arrives. Same
# recipient the MWAN notifier uses; the two paths share nothing else.
tack_alarm_email_recipient: "alex@goodkind.io"

tack_ledger_bootstrap: false
tack_ledger_join_target: >-
  {{ ('' if (tack_ledger_bootstrap | bool and tack_ledger_node_name == 'yb1')
      else 'yugabyte' if tack_ledger_legacy_node_present
      else ('yb2' if tack_ledger_node_name == 'yb1' else 'yb1'))
     if tack_cluster_role == 'data' else '' }}
