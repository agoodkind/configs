---
# Production MWAN failover LXC (lxc-116 on vault) target vars.
# Consumed by deploy-mwan-failover.yml when targeting `mwan_failover_servers`.

mwan_failover_hostname: "mwan-failover"
mwan_failover_email_from: "mwan@goodkind.io"

# Subject prefix distinct from main-host so failover alerts are visually
# separable in the inbox.
mwan_failover_subject_prefix: "[MWAN-vault-failover]"

mwan_failover_bgp_asn: 4200000001
mwan_failover_bgp_router_id: "10.250.250.4"
mwan_failover_bgp_next_hop_v6: "3d06:bad:b01:fe::4"
mwan_bgp_learned_route_iface: "eth1"
mwan_failover_bgp_neighbors:
  - "10.250.250.2"
mwan_failover_bgp_neighbors_v6:
  - "3d06:bad:b01:fe::2"
mwan_failover_ipv4_address: "10.250.250.4/29"
mwan_failover_ipv6_address: "3d06:bad:b01:fe::4/64"
mwan_failover_ipv4_return_route: "10.250.0.0/16 via 10.250.250.2 dev eth1"
mwan_failover_ipv6_return_route: >-
  3d06:bad:b01::/56 via 3d06:bad:b01:fe::2 dev eth1
# Source interface for outbound failover alert email (empty = default route).
mwan_failover_email_bind_iface: ""

# Session timers live in group_vars/all/vars.yml (MWAN-303 rationale there).
# TODO(MWAN-229 follow-up): promote bgp_listen_port and the announce lists to
# group_vars/all so the primary and failover inherit one definition.
bgp_listen_port: 179
bgp_announce_ipv4:
  - "0.0.0.0/0"
bgp_announce_ipv6:
  - "::/0"

# Transit networks the speaker accepts dynamic BGP sessions from, matching the
# primary so both speakers serve every router during a failover.
mwan_bgp_dynamic_neighbors:
  - "10.250.250.0/29"
  - "3d06:bad:b01:fe::/64"

mwan_bgp_routes_shadow_mode: false

# BGP graceful restart (RFC 4724). Mirrors the primary so a failover agent
# restart holds routes in the OPNsense helper instead of flapping the session.
mwan_bgp_graceful_restart_enabled: true
mwan_bgp_graceful_restart_time_seconds: 30
mwan_bgp_graceful_restart_notification_enabled: true

# Alert email routing. Recipient/level/cooldown mirror the other mwan groups;
# the failover keeps its own from-address and subject prefix above.
mwan_email_recipient: "alex@goodkind.io"
mwan_email_min_level: "ERROR"
mwan_email_cooldown: "5m"
