tofu:
  # Path relative to the repository root. Each directory under this path with a
  # backend block is a workspace. `./configsctl tofu <workspace>` exports a vault
  # key as TF_VAR_<key> when a file in that workspace declares a variable with
  # the key name.
  workspaces_dir: opentofu
  # Path relative to this settings file. Every workspace uses this mirror.
  provider_mirror: opentofu/terraform.d/plugins
  # `./configsctl tofu` exports a vault key <env_key_prefix><NAME> as the
  # environment variable <NAME>.
  env_key_prefix: vault_tofu_env_
  credentials:
    opentofu/poweredge/firmware:
      lock_host: poweredge
      username_variable: poweredge_idrac_user
      password_variable: poweredge_idrac_password
      dell:
        endpoint: https://idrac.poweredge.management.collingwood.goodkind.io
        server_name: idrac.poweredge.management.collingwood.goodkind.io
        rotator_user: tofu-rotator
        rotator_password_key: vault_poweredge_idrac_rotator_password
        account_id: "3"
        username: tofu-firmware
        read_paths:
          - /redfish/v1/Systems/System.Embedded.1
          - /redfish/v1/Chassis/System.Embedded.1/NetworkAdapters/NIC.Embedded.1
          - /redfish/v1/Chassis/System.Embedded.1/NetworkAdapters/NIC.Embedded.1/NetworkDeviceFunctions/NIC.Embedded.1-1-1/Oem/Dell/DellNetworkAttributes/NIC.Embedded.1-1-1
          - /redfish/v1/Chassis/System.Embedded.1/NetworkAdapters/NIC.Embedded.1/NetworkDeviceFunctions/NIC.Embedded.2-1-1/Oem/Dell/DellNetworkAttributes/NIC.Embedded.2-1-1
          - /redfish/v1/Chassis/System.Embedded.1/NetworkAdapters/NIC.Embedded.1/NetworkDeviceFunctions/NIC.Embedded.3-1-1/Oem/Dell/DellNetworkAttributes/NIC.Embedded.3-1-1
          - /redfish/v1/Chassis/System.Embedded.1/NetworkAdapters/NIC.Embedded.1/NetworkDeviceFunctions/NIC.Embedded.4-1-1/Oem/Dell/DellNetworkAttributes/NIC.Embedded.4-1-1
  # Keys are workspace paths relative to the repository root.
  # Independent workspaces refuse changes without a declared owner.
  lock_targets:
    opentofu/poweredge/firmware:
      module_hosts:
        module.poweredge: poweredge
    opentofu/poweredge/host:
      module_hosts:
        module.overlay["poweredge"]: poweredge
        proxmox_acme_account.poweredge: poweredge
        proxmox_acme_certificate.poweredge: poweredge
        proxmox_acme_dns_plugin.poweredge: poweredge
        pveguest_host_kernel_modules.poweredge: poweredge
        remote_file.poweredge_cloudflared: poweredge
        terraform_data.poweredge_cloudflared: poweredge
        module.idrac_certificate: poweredge
      node_hosts:
        poweredge: poweredge
    opentofu/poweredge/routing:
      module_hosts:
        module.poweredge_failover_services: poweredge
        module.poweredge_lan_services: poweredge
        module.poweredge_lxc["failover"]: poweredge
        module.poweredge_lxc["gateway"]: poweredge
        module.poweredge_lxc["lan"]: poweredge
        module.poweredge_mwan["failover"]: poweredge
        module.poweredge_mwan["gateway"]: poweredge
      node_hosts:
        poweredge: poweredge
      lock_free_types:
        - mwan_network_config
        - terraform_data
    opentofu/shared/cloudflare-dns:
      lock_free_types:
        - cloudflare_dns_record
    opentofu/shared/cloudflare-load-balancing:
      lock_free_types:
        - cloudflare_load_balancer
        - cloudflare_load_balancer_monitor
        - cloudflare_load_balancer_pool
    opentofu/shared/cloudflare-zero-trust:
      lock_free_types:
        - cloudflare_zero_trust_device_custom_profile
        - cloudflare_zero_trust_device_managed_networks
        - cloudflare_zero_trust_tunnel_cloudflared
        - cloudflare_zero_trust_tunnel_cloudflared_route
        - cloudflare_zero_trust_tunnel_cloudflared_config
    opentofu/suburban/clyde:
      guest_hosts:
        suburban/224: clyde.suburban.goodkind.io
      module_hosts:
        module.suburban: suburban
      node_hosts:
        suburban: suburban
    opentofu/suburban/dns64:
      guest_hosts:
        suburban/203: dns64.suburban.goodkind.io
      module_hosts:
        module.suburban: suburban
      node_hosts:
        suburban: suburban
    opentofu/suburban/host:
