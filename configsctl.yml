# Settings that configsctl reads from this repository.
tofu:
  # OpenTofu root module, relative to the repository root. A vault key with the
  # same name as a variable declared there exports as that variable.
  module_dir: opentofu
  # A vault key named <env_key_prefix><NAME> exports to OpenTofu as the
  # environment variable <NAME>.
  env_key_prefix: vault_tofu_env_
