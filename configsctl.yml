tofu:
  # Path relative to the repository root. Each directory under this path with a
  # backend block is a workspace. `./configsctl tofu <workspace>` exports a vault
  # key as TF_VAR_<key> when a file in that workspace declares a variable with
  # the key name.
  workspaces_dir: opentofu
  # `./configsctl tofu` exports a vault key <env_key_prefix><NAME> as the
  # environment variable <NAME>.
  env_key_prefix: vault_tofu_env_
  # The deploy gate requires zero guest plan changes for hosts in `guest_hosts`.
  guest_module: module.base
  # Keys are workspace paths relative to the repository root.
  # An apply of a saved plan locks the hosts declared for its changes.
  # A change with no declaration locks every host in proxmox_servers and
  # tofu_lock_hosts.
  lock_targets:
    opentofu:
      lock_free_types:
        - cloudflare_zero_trust_device_custom_profile
        - cloudflare_zero_trust_tunnel_cloudflared_route
      module_hosts:
        module.vault: vault
        module.suburban: suburban
      module_key_hosts:
        module.overlay:
          suburban: suburban
          poweredge: poweredge
          vault: vault
    opentofu/guest:
      lock_free_types:
        - mwan_network_config
      # Keys are pveguest_* resource node values. The node is the second label
      # of the guest hostname, not a Proxmox node name.
      node_hosts:
        suburban: suburban
        poweredge: poweredge
      # Keys use "<node>/<vmid>". Each value is the guest's inventory host
      # from the service_mapping inventory.
      guest_hosts:
        suburban/224: clyde.suburban.goodkind.io
deploy:
  # For non-check deploys, `./configsctl deploy` reads each declared variable
  # on each play host and locks the named inventory host with the play hosts.
  lock_host_variables:
    deploy-mwan: [mwan_proxmox_delegate]
