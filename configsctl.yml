tofu:
  # Path relative to the repository root. Each directory under this path with a
  # backend block is a workspace. `./configsctl tofu <workspace>` exports a vault
  # key as TF_VAR_<key> when a file in that workspace declares a variable with
  # the key name.
  workspaces_dir: opentofu
  # `./configsctl tofu` exports a vault key <env_key_prefix><NAME> as the
  # environment variable <NAME>.
  env_key_prefix: vault_tofu_env_
  credentials:
    opentofu/firmware:
      lock_host: poweredge
      username_variable: poweredge_idrac_user
      password_variable: poweredge_idrac_password
      dell:
        endpoint: https://[3d06:bad:b01:300::efb]
        ca_file: opentofu/firmware/idrac-ca.pem
        server_name: idrac-J9P5L44
        rotator_user: tofu-rotator
        rotator_password_key: vault_poweredge_idrac_rotator_password
        account_id: "3"
        username: tofu-firmware
        read_paths:
          - /redfish/v1/Systems/System.Embedded.1
          - /redfish/v1/Chassis/System.Embedded.1/NetworkAdapters/NIC.Embedded.1
          - /redfish/v1/Chassis/System.Embedded.1/NetworkAdapters/NIC.Embedded.1/NetworkDeviceFunctions/NIC.Embedded.1-1-1/Oem/Dell/DellNetworkAttributes/NIC.Embedded.1-1-1
          - /redfish/v1/Chassis/System.Embedded.1/NetworkAdapters/NIC.Embedded.1/NetworkDeviceFunctions/NIC.Embedded.2-1-1/Oem/Dell/DellNetworkAttributes/NIC.Embedded.2-1-1
          - /redfish/v1/Chassis/System.Embedded.1/NetworkAdapters/NIC.Embedded.1/NetworkDeviceFunctions/NIC.Embedded.3-1-1/Oem/Dell/DellNetworkAttributes/NIC.Embedded.3-1-1
          - /redfish/v1/Chassis/System.Embedded.1/NetworkAdapters/NIC.Embedded.1/NetworkDeviceFunctions/NIC.Embedded.4-1-1/Oem/Dell/DellNetworkAttributes/NIC.Embedded.4-1-1
  # The deploy gate requires zero guest plan changes for hosts in `guest_hosts`.
  guest_module: module.base
  # Keys are workspace paths relative to the repository root.
  # An apply of a saved plan locks the hosts declared for its changes.
  # A change with no declaration locks every host in proxmox_servers and
  # tofu_lock_hosts.
  lock_targets:
    opentofu:
      lock_free_types:
        - cloudflare_zero_trust_device_custom_profile
        - cloudflare_zero_trust_tunnel_cloudflared
        - cloudflare_zero_trust_tunnel_cloudflared_route
      module_hosts:
        module.vault: vault
        module.suburban: suburban
      module_key_hosts:
        module.overlay:
          suburban: suburban
          poweredge: poweredge
          vault: vault
    opentofu/firmware:
      module_hosts:
        module.poweredge: poweredge
    opentofu/guest:
      lock_free_types:
        - mwan_network_config
      # Keys are pveguest_* resource node values. The node is the second label
      # of the guest hostname, not a Proxmox node name.
      node_hosts:
        suburban: suburban
        poweredge: poweredge
      # Keys use "<node>/<vmid>". Each value is the guest's inventory host
      # from the service_mapping inventory.
      guest_hosts:
        suburban/203: dns64.suburban.goodkind.io
        suburban/213: mwan.suburban.goodkind.io
        suburban/216: mwan-failover.suburban.goodkind.io
        suburban/217: tack-qa.suburban.goodkind.io
        suburban/218: seaweedfs.suburban.goodkind.io
        suburban/220: tack-data1.suburban.goodkind.io
        suburban/221: tack-data2.suburban.goodkind.io
        suburban/222: tack-data3.suburban.goodkind.io
        suburban/223: tack-app2.suburban.goodkind.io
        suburban/224: clyde.suburban.goodkind.io
        suburban/227: tack-search1.suburban.goodkind.io
deploy:
  # For non-check deploys, `./configsctl deploy` reads each declared variable
  # on each play host and locks the named inventory host with the play hosts.
  lock_host_variables:
    deploy-mwan: [mwan_proxmox_delegate]
  # Keys are the second label of a guest host name. Values are the Proxmox node
  # names in ansible_proxmox_host.
  absent_guest_nodes:
    home: vault
    suburban: hypervisor
